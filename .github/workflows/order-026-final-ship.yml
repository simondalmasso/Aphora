name: order-026-context-first-final-ship

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/order-026-final-ship.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: order-026-context-first-final-ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BRANCH: arq/visual-dashboard-v3
      PRODUCT_COMMIT: 2f0328b39c097d7c0c1e9e485133a60719b85fe6
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PROD_URL: https://sos-sf.simondalmasso44.workers.dev
      FIREBASE_ALIAS: https://sos-sf.web.app
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVIDENCE_DIR: artifacts/order-026-final
    steps:
      - name: Checkout fresh canonical branch
        uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Exact product and main gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git cat-file -e "$PRODUCT_COMMIT^{commit}"
          git diff --quiet "$PRODUCT_COMMIT" HEAD -- . ':(exclude).github/workflows/*'
          grep -Fq 'low: null,' src/worker/live-data.ts
          grep -Fq 'safeStationThresholds(system)' src/domain/hydro-priority.ts
          grep -Fq "lowWaterMetres: null" src/domain/hydrometric-context.ts
          grep -Fq 'context-first-026.css' src/client/App.tsx
          grep -Fq 'Consulta de la fuente ·' src/client/features/hydro/HydrometricMonitoring.tsx

      - name: Install dependencies
        run: npm ci

      - name: Exact candidate gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm run test:unit
          npm run test:contract
          npm run build
          npm run test:worker

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full browser regression and context-first gates
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test
          npx playwright test tests/e2e/context-first-026.spec.ts tests/e2e/owner-seriousness-024.spec.ts tests/e2e/dual-river-priority.spec.ts --project=desktop

      - name: Deploy authorized candidate exactly once
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          export WRANGLER_SEND_METRICS=false
          export WRANGLER_LOG_SANITIZE=true
          npx wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/order026-final-deploy.log
          version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/order026-final-deploy.log | tail -1 | awk '{print $4}')"
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo 'DEPLOY_COUNT=1'
          echo "CLOUDFLARE_VERSION=$version_id"

      - name: Verify exact production assets and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          expected_js="$(grep -Eo 'assets/index-[^"[:space:]]+\.js' dist/index.html | head -1)"
          expected_css="$(grep -Eo 'assets/index-[^"[:space:]]+\.css' dist/index.html | head -1)"
          test -n "$expected_js"
          test -n "$expected_css"
          matched=0
          for attempt in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/?order026=${GITHUB_RUN_ID}-${attempt}" > /tmp/order026-prod-index.html
            if grep -Fq "$expected_js" /tmp/order026-prod-index.html && grep -Fq "$expected_css" /tmp/order026-prod-index.html; then
              matched=1
              break
            fi
            sleep 3
          done
          test "$matched" = 1
          echo "PRODUCTION_JS=$expected_js"
          echo "PRODUCTION_CSS=$expected_css"

          for path in / /gestion-de-riesgo /gestion-de-riesgo/fenomeno-el-nino /lite /manifest.webmanifest /service-worker.js /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path?order026=${GITHUB_RUN_ID}")"
            test "$code" = '200'
          done

      - name: Verify production hydrologic truth and browser comprehension read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/api/snapshot?order026=${GITHUB_RUN_ID}" > /tmp/order026-snapshot.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const envelope = JSON.parse(readFileSync('/tmp/order026-snapshot.json', 'utf8'));
          const snapshot = envelope.data ?? envelope;
          const systems = snapshot.systems ?? [];
          const salado = systems.find((system) => system.id === 'salado-santo-tome');
          if (!salado) throw new Error('Salado system missing');
          const unsafeZeros = (salado.thresholds ?? []).filter((item) => (item.id === 'NORMAL' || item.id === 'EVACUACION') && Number(item.metres) === 0);
          if (unsafeZeros.length) throw new Error(`unsafe Salado zero references: ${JSON.stringify(unsafeZeros)}`);
          if (salado.available) {
            const alert = (salado.thresholds ?? []).find((item) => item.id === 'ALERTA');
            if (!alert || Math.abs(Number(alert.metres) - 4.7) > 0.001) throw new Error(`Salado alert reference invalid: ${JSON.stringify(salado.thresholds)}`);
          }
          console.log('UNKNOWN_THRESHOLD_AS_ZERO_COUNT=0');
          console.log('SALADO_ZERO_SEMANTICS_FIXED=PASS');
          NODE

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{ width: 390, height: 844 }, { width: 1440, height: 900 }]) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            const response = await page.goto(`${process.env.PROD_URL}/?order026-browser=${Date.now()}-${viewport.width}`, { waitUntil: 'networkidle', timeout: 30000 });
            if (!response || response.status() !== 200) throw new Error(`${viewport.width}: HTTP ${response?.status()}`);
            await page.getByRole('heading', { level: 1, name: 'Situación hidrométrica' }).waitFor({ state: 'visible', timeout: 20000 });
            const level = page.getByTestId('hydro-current-level');
            await level.waitFor({ state: 'visible' });
            const source = page.getByTestId('hydro-source-strip');
            await source.waitFor({ state: 'visible' });
            const sourceText = await source.innerText();
            if (!sourceText.includes('Medición ·') || !sourceText.includes('Consulta de la fuente ·')) throw new Error(`${viewport.width}: temporal semantics missing`);
            if (sourceText.includes('Recibidos ')) throw new Error(`${viewport.width}: stale receipt wording`);
            const levelText = (await level.innerText()).trim();
            if (levelText !== '—') {
              await page.getByTestId('hydro-meaning').waitFor({ state: 'visible' });
              await page.getByTestId('hydro-context-scale').waitFor({ state: 'visible' });
              const saladoTab = page.getByRole('tab', { name: 'Salado' });
              if (await saladoTab.count()) {
                await saladoTab.click();
                const scale = page.getByTestId('hydro-context-scale');
                await scale.waitFor({ state: 'visible' });
                if ((await scale.innerText()).includes('0,00 m')) throw new Error(`${viewport.width}: unsafe Salado zero visible`);
              }
            }
            const hydroText = (await page.getByTestId('hydrometric-situation').innerText()).toLowerCase();
            if (/\bseguro\b|\btranquilo\b|\bsin riesgo\b/.test(hydroText)) throw new Error(`${viewport.width}: false safety claim`);
            if (hydroText.includes('rango normal')) throw new Error(`${viewport.width}: false normality claim`);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            if (overflow > 1) throw new Error(`${viewport.width}: overflow ${overflow}`);
            if (errors.length) throw new Error(`${viewport.width}: ${errors.join(' | ')}`);
            await page.close();
          }
          await browser.close();
          console.log('THREE_SECOND_MEANING_TEST=PASS');
          console.log('CHART_CONTEXT=PASS');
          NODE

      - name: Verify Firebase alias and main immutability
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null "$FIREBASE_ALIAS/?order026=${GITHUB_RUN_ID}"
          status="$(awk 'NR==1 {print $2}' "$headers")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print $2}' "$headers" | tail -1)"
          case "$status" in 301|302|307|308) ;; *) echo "unexpected Firebase status $status"; exit 1;; esac
          printf '%s' "$location" | grep -Fq 'sos-sf.simondalmasso44.workers.dev'
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

      - name: Clean all temporary 026 workflows
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sos-sf-arq'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f \
            .github/workflows/order-026-ship.yml \
            .github/workflows/order-026-validation.yml \
            .github/workflows/order-026-validation-r2.yml \
            .github/workflows/order-026-validation-r3.yml \
            .github/workflows/order-026-validation-r4.yml \
            .github/workflows/order-026-final-ship.yml
          git commit -m 'chore(026): clean temporary ship mechanisms [skip ci]'
          final_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          echo "FINAL_BRANCH_HEAD=$final_head"

      - name: Terminal evidence
        shell: bash
        run: |
          echo 'SOS_SF_026_STATUS=SHIPPED'
          echo "PRODUCT_COMMIT=$PRODUCT_COMMIT"
          echo 'FINAL_BRANCH_HEAD=${{ steps.cleanup.outputs.final_head }}'
          echo 'PRODUCTION_URL=https://sos-sf.simondalmasso44.workers.dev/'
          echo 'FIREBASE_ALIAS=https://sos-sf.web.app'
          echo 'CLOUDFLARE_VERSION=${{ steps.deploy.outputs.version_id }}'
          echo 'CONTEXT_FIRST_HYDROMETRY=PASS'
          echo 'THREE_SECOND_MEANING_TEST=PASS'
          echo 'SALADO_ZERO_SEMANTICS_FIXED=PASS'
          echo 'CHART_CONTEXT=PASS'
          echo 'FUNCTIONAL_REGRESSIONS=0'
          echo 'MAIN_MUTATION=NO'
          echo 'LISTO_SIMON_MIRA_LA_WEB=https://sos-sf.web.app'
