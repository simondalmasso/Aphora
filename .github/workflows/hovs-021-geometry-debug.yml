name: SOS-SF HOVS 021 Geometry Debug
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/hovs-021-geometry-debug.yml]
permissions:
  contents: write
  actions: write
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: arq/visual-dashboard-v3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Inspect 320 geometry
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run preview >/tmp/preview.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:320,height:568}});
          await page.goto('http://127.0.0.1:8787/',{waitUntil:'networkidle'});
          const rows=await page.evaluate(()=>{
            const visible=(el)=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
            return [...document.querySelectorAll('button.button--secondary')].filter(visible).map((el,i)=>{const r=el.getBoundingClientRect();return {i,text:(el.textContent||'').trim().replace(/\s+/g,' '),parent:el.parentElement?.className||'',section:el.closest('section')?.className||'',rect:{left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height},position:getComputedStyle(el).position,z:getComputedStyle(el).zIndex}})
          });
          console.log('SECONDARY_GEOMETRY='+JSON.stringify(rows));
          await browser.close();
          NODE
      - name: Disarm
        if: always()
        run: |
          set +e
          gh workflow disable hovs-021-geometry-debug.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-021-geometry-debug.yml
          git commit -m "ci: disarm HOVS 021 geometry debug"
          git push origin HEAD:arq/visual-dashboard-v3
