name: order-026-context-first-validation-r3

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/order-026-validation-r3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      EVIDENCE_DIR: artifacts/order-026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Main and semantic source gate
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          grep -Fq 'low: null,' src/worker/live-data.ts
          grep -Fq 'safeStationThresholds(system)' src/domain/hydro-priority.ts
          grep -Fq 'context-first-026.css' src/client/App.tsx
      - run: npm ci
      - name: Static runtime and data gates
        run: |
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm run test:unit
          npm run test:contract
          npm run build
          npm run test:worker
      - run: npx playwright install --with-deps chromium
      - name: Full E2E
        run: |
          npx playwright test
          npx playwright test tests/e2e/context-first-026.spec.ts tests/e2e/owner-seriousness-024.spec.ts tests/e2e/dual-river-priority.spec.ts --project=desktop
      - name: Evidence
        run: |
          echo 'ORDER_026_PREDEPLOY_VALIDATION_R3=PASS'
          echo 'DEPLOY_COUNT=0'
