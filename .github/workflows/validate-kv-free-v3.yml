name: Validate KV Free V3

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/validate-kv-free-v3-trigger]

permissions:
  contents: read

concurrency:
  group: sos-sf-v3-kv-free-validation
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/v3-kv-free-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply exact effective source patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected_parts = [
              'b419d7560457640f637118680a38d4ffadc4788f0eadd328b560575be4781fa0',
              '2840b4dddf6674c1fd166da1cb26d7b614c7b6e09ba387206d920a5716decdba',
              '388d8b6ab894c8d4e3adffd18614866d6bf12b7cdb37d99d240969a93a20cb9a',
              'd776c0cbf06354d274c8392d927a3a7882f4f3beeef65b0a5ef5ccfac749ef91',
              '469b0461f75f597ed5d96f4cc0f0900ed34000b45be5f64ee2e99b4aa8e08cc7',
              '8cfdebc50bf5f72777065fcf23f7493b44993ab5ca830bd8f94e72599aca7450',
              '254e05a4b0205134e29e842505325e44703f85c341202c4be62f76248e9ecbe3',
              'a616c5134f6dc1924472bee8f7725396eb3c96b2ae4e5026cee5bc33544df894',
          ]
          chunks = []
          for index, expected in enumerate(expected_parts):
              data = Path(f'.github/v3-full-014-parts/part{index:02d}').read_text().strip()
              actual = hashlib.sha256(data.encode()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'PATCH_PART_HASH_MISMATCH:{index:02d}:{actual}')
              chunks.append(data)
          encoded = ''.join(chunks)
          if hashlib.sha256(encoded.encode()).hexdigest() != '32fe8c0f7741c3f996a5bb1dce5e4b22e5833a7d53b5ffc5611d83e7c6d436bd':
              raise SystemExit('PATCH_TRANSPORT_HASH_MISMATCH')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '4be4aaf954713be50e56eee4de6118ec767cf6b9b63b86189c3fc6a0b5f20400':
              raise SystemExit('PATCH_CONTENT_HASH_MISMATCH')
          Path('/tmp/v3-full-014.patch').write_bytes(patch)

          provision_encoded = Path('.github/v3-full-014-provision-fix.patch.b64').read_text().strip()
          if hashlib.sha256(provision_encoded.encode()).hexdigest() != 'bf4117c00120a1118737d8568d10202515610d1dc78b5384da8ce49e95e4bf98':
              raise SystemExit('PROVISION_FIX_TRANSPORT_HASH_MISMATCH')
          provision_patch = base64.b64decode(provision_encoded, validate=True)
          if hashlib.sha256(provision_patch).hexdigest() != 'e89bdaef77e5e8c9111a6bfc506e2fb63995869fa5d65d09819a92d41313ae4c':
              raise SystemExit('PROVISION_FIX_CONTENT_HASH_MISMATCH')
          Path('/tmp/v3-full-014-provision-fix.patch').write_bytes(provision_patch)

          kv_encoded = Path('.github/v3-full-014-kv-free.patch.gz.b64').read_text().strip()
          if hashlib.sha256(kv_encoded.encode()).hexdigest() != 'bce53f835ef4ce8770a1bd1464ebcc2d420ef18cd031a035fb8b7e30be023b89':
              raise SystemExit('KV_FREE_TRANSPORT_HASH_MISMATCH')
          kv_patch = gzip.decompress(base64.b64decode(kv_encoded, validate=True))
          if hashlib.sha256(kv_patch).hexdigest() != 'a3b10732ca4c6d4f4cd6649c162ae589c28641c74b050eb0acfa6cd8fd79d220':
              raise SystemExit('KV_FREE_CONTENT_HASH_MISMATCH')
          Path('/tmp/v3-full-014-kv-free.patch').write_bytes(kv_patch)
          Path('artifacts/v3-kv-free-validation/patch-hashes.txt').write_text(
              'kv_transport_sha256=bce53f835ef4ce8770a1bd1464ebcc2d420ef18cd031a035fb8b7e30be023b89\n'
              'kv_patch_sha256=a3b10732ca4c6d4f4cd6649c162ae589c28641c74b050eb0acfa6cd8fd79d220\n'
          )
          PY
          git apply --index /tmp/v3-full-014.patch
          git apply --index /tmp/v3-full-014-provision-fix.patch
          git apply --index /tmp/v3-full-014-kv-free.patch
          git diff --cached --check
          git diff --cached --stat | tee "$EVIDENCE_DIR/patch-stat.txt"

      - name: Assert zero-cost storage architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0005_report_photo_kv_storage.sql
          grep -q 'REPORTS_KV' src/worker/reports.ts
          grep -q 'expirationTtl' src/worker/reports.ts
          grep -q "'arrayBuffer'" src/worker/reports.ts
          grep -q 'WORKERS_KV_FREE' scripts/provision-cloudflare.mjs
          ! rg -n 'REPORTS_BUCKET|r2_buckets|/r2/' src scripts/provision-cloudflare.mjs wrangler.jsonc wrangler.test.jsonc
          printf 'D1_METADATA=PASS\nKV_BINARY=PASS\nR2_OPERATIONAL_DEPENDENCY=ABSENT\nBUDGET_POLICY=USD_0\n' > "$EVIDENCE_DIR/architecture.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint clean
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract

      - name: Build and budgets
        run: npm run build

      - name: Worker tests with local D1 and KV
        run: npm run test:worker

      - name: E2E desktop mobile offline privacy and quota fail-closed
        run: npm run test:e2e

      - name: Record success
        run: printf 'VALIDATION=PASS\nMUTATIONS=NONE\nDEPLOY=NONE\n' > "$EVIDENCE_DIR/result.txt"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-kv-free-validation-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
