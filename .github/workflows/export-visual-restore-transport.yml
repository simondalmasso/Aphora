name: Export Visual Restore Transport

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/export-visual-restore-transport-trigger]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record transport hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/transport
          cp -a .github/visual-product-restore-a-parts/. artifacts/transport/
          wc -c artifacts/transport/part* | tee artifacts/transport/sizes.txt
          sha256sum artifacts/transport/part* | tee artifacts/transport/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: visual-restore-transport-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/transport/
          if-no-files-found: error
          retention-days: 1
