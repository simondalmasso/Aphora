name: SOS-SF HOVS R2 Registry Cleanup
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
      - name: Disable stale registered verifier and self
        shell: bash
        run: |
          set -euo pipefail
          gh workflow disable 329366225
          gh workflow disable hovs-r2-registry-cleanup.yml
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" > /tmp/workflows.json
          node -e "const x=require('/tmp/workflows.json');const a=x.workflows.filter(w=>w.state==='active');if(a.length)throw Error(JSON.stringify(a.map(w=>({id:w.id,name:w.name,path:w.path}))))"
      - name: Remove cleanup file
        shell: bash
        run: |
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-registry-cleanup.yml
          git commit -m "ci: remove HOVS R2 registry cleanup"
          git push origin HEAD:arq/visual-dashboard-v3
