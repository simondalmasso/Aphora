name: NASA 013 Probe
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/nasa-013-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe official ArcGIS operations
        run: |
          mkdir -p evidence
          python <<'PY'
          import json, time, urllib.parse, urllib.request
          base='https://gis.earthdata.nasa.gov/image/rest/services/GESDISC/GPM_3IMERGHHE/ImageServer'
          geometry=json.dumps({'x':-60.7,'y':-31.63,'spatialReference':{'wkid':4326}},separators=(',',':'))
          tests={
            'metadata':('/?'+urllib.parse.urlencode({'f':'json'})),
            'identify_basic':('/identify?'+urllib.parse.urlencode({'geometry':geometry,'geometryType':'esriGeometryPoint','returnGeometry':'false','f':'json'})),
            'identify_catalog':('/identify?'+urllib.parse.urlencode({'geometry':geometry,'geometryType':'esriGeometryPoint','returnGeometry':'false','returnCatalogItems':'true','f':'json'})),
            'get_samples':('/getSamples?'+urllib.parse.urlencode({'geometry':geometry,'geometryType':'esriGeometryPoint','returnFirstValueOnly':'true','outFields':'OBJECTID,StdTime,StartTime,EndTime','f':'json'})),
            'query_latest':('/query?'+urllib.parse.urlencode({'where':'1=1','outFields':'OBJECTID,StdTime,StartTime,EndTime','orderByFields':'StdTime DESC','resultRecordCount':'1','returnGeometry':'false','f':'json'})),
          }
          out={}
          for name,path in tests.items():
            url=base+path;t=time.time()
            try:
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'SOS-SF/013'})
              with urllib.request.urlopen(req,timeout=90) as r:
                body=r.read(1000000).decode('utf-8','replace')
                out[name]={'status':r.status,'elapsed':round(time.time()-t,3),'contentType':r.headers.get('content-type'),'body':body[:20000],'url':url}
            except Exception as e: out[name]={'error':repr(e),'elapsed':round(time.time()-t,3),'url':url}
          open('evidence/nasa-probe.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nasa-013-probe-${{ github.run_id }}
          path: evidence
          retention-days: 30
