name: SOS-SF Owner Left Inset 002 Production

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/owner-left-inset-002-production.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: sos-sf-owner-left-inset-002-production
  cancel-in-progress: false

env:
  OUT: artifacts/owner-left-inset-002-production
  VERIFIED_SOURCE_HEAD: 9fe50234fa09ba5357ee9ac7bba2229904141d52
  PRODUCT_COMMIT: c930635823ef65848f2d9f8291326ac88e2985dc
  MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
  PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority and one-shot gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main arq/visual-dashboard-v3
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$VERIFIED_SOURCE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet "$VERIFIED_SOURCE_HEAD" HEAD -- wrangler.jsonc migrations src/worker src/client tests package.json package-lock.json
          test -f src/client/styles/owner-left-inset-002.css
          grep -q '021-HOVS-OWNER-LEFT-INSET-EDGE-COLLISION-002' src/client/styles/owner-left-inset-002.css
          grep -q 'owner-left-inset-002.css' src/client/App.tsx
          ! grep -q 'r2_buckets' wrangler.jsonc
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p "$OUT/logs" "$OUT/screenshots"
          printf '1\n' > "$OUT/deploy-command-budget.txt"
          printf '0\n' > "$OUT/deploy-command-count-before.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint -- --max-warnings=0 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=low 2>&1 | tee "$OUT/logs/npm-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          npm run deploy:dry 2>&1 | tee "$OUT/logs/deploy-dry.log"

      - name: Capture production deployment baseline
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --json > "$OUT/cloudflare-before.json"

      - name: Exactly one authorized production deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          printf '1\n' > "$OUT/deploy-command-count.txt"
          npx wrangler deploy 2>&1 | tee "$OUT/logs/wrangler-deploy.log"
          version_id=$(grep -Eo 'Current Version ID: [0-9a-f-]+' "$OUT/logs/wrangler-deploy.log" | awk '{print $4}' | tail -n1)
          test -n "$version_id"
          printf '%s\n' "$version_id" > "$OUT/deployment-version-id.txt"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare deployment provenance
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          npx wrangler deployments list --json > "$OUT/cloudflare-after.json"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const beforeRaw=JSON.parse(await readFile(process.env.OUT+'/cloudflare-before.json','utf8'));
          const afterRaw=JSON.parse(await readFile(process.env.OUT+'/cloudflare-after.json','utf8'));
          const rows=x=>Array.isArray(x)?x:(x.deployments||[]);
          const before=rows(beforeRaw), after=rows(afterRaw);
          const sorted=[...after].sort((a,b)=>Date.parse(a.created_on||a.createdAt||0)-Date.parse(b.created_on||b.createdAt||0));
          const latest=sorted.at(-1); if(!latest) throw new Error('no deployments');
          const versions=latest.versions||[];
          const version=versions.find(v=>(v.version_id||v.id)===process.env.VERSION_ID);
          const pct=Number(version?.percentage ?? version?.traffic_percentage ?? 0);
          const result={expectedVersion:process.env.VERSION_ID,beforeCount:before.length,afterCount:after.length,latestDeploymentId:latest.id||null,latestCreatedOn:latest.created_on||latest.createdAt||null,latestVersions:versions,percentage:pct,deployCommandCount:1,postdeployRedeployCount:0,pass:Boolean(version)&&pct===100};
          await writeFile(process.env.OUT+'/deployment-provenance.json',JSON.stringify(result,null,2)+'\n');
          if(!result.pass) throw new Error('deployment provenance mismatch '+JSON.stringify(result));
          NODE

      - name: Verify production byte identity, hydrometry and OWNER geometry
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import path from 'node:path';
          const base=process.env.PRODUCTION_URL.replace(/\/$/,'');
          const out=process.env.OUT;
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url){return fetch(url,{cache:'no-store',headers:{'cache-control':'no-cache','pragma':'no-cache'}})}
          async function json(route){const r=await get(`${base}${route}${route.includes('?')?'&':'?'}verify=${Date.now()}`);const text=await r.text();let j=null;try{j=JSON.parse(text)}catch{};return {route,status:r.status,json:j};}
          const api=[]; for(const route of ['/api/health','/api/snapshot','/api/sources']) api.push(await json(route));
          if(api.some(x=>x.status!==200)) throw new Error('production API status '+JSON.stringify(api.map(x=>[x.route,x.status])));
          const unwrap=x=>x?.json&&typeof x.json==='object'&&'data' in x.json?x.json.data:x?.json;
          const snapshot=unwrap(api.find(x=>x.route==='/api/snapshot'));
          const systems=snapshot?.systems||[];
          const parana=systems.find(x=>x.id==='parana-santa-fe');
          const salado=systems.find(x=>x.id==='salado-santo-tome');
          if(!parana?.available||!salado?.available||!Number.isFinite(parana.currentMetres)||!Number.isFinite(salado.currentMetres)) throw new Error('hydrometry unusable');
          const ina=(snapshot?.sources||[]).filter(x=>(x.organizationName||x.name||x.sourceName||'').toLowerCase().includes('instituto nacional del agua'));
          if(!ina.length) throw new Error('INA source missing');

          const localAssets=await readdir('dist/assets');
          const localJs=localAssets.find(x=>x.endsWith('.js')&&!x.endsWith('.js.map'));
          const localCss=localAssets.find(x=>x.endsWith('.css'));
          if(!localJs||!localCss) throw new Error('local build assets missing');
          let identity=null;
          for(let attempt=1;attempt<=12;attempt++){
            const remoteHtml=await (await get(`${base}/?asset_verify=${Date.now()}_${attempt}`)).text();
            const remotePaths=[...remoteHtml.matchAll(/(?:src|href)="(\/assets\/[^"]+\.(?:js|css))"/g)].map(m=>m[1]);
            const rows=[]; let pass=true;
            for(const localName of [localJs,localCss]){
              const remotePath=remotePaths.find(x=>x.endsWith(localName));
              if(!remotePath){pass=false;rows.push({localName,remotePath:null,pass:false});continue;}
              const lb=await readFile(path.join('dist/assets',localName));
              const rb=Buffer.from(await (await get(base+remotePath+'?b='+Date.now())).arrayBuffer());
              rows.push({path:remotePath,localSha256:sha(lb),remoteSha256:sha(rb),pass:sha(lb)===sha(rb)});
              if(!rows.at(-1).pass) pass=false;
            }
            identity={attempt,rows,pass};
            if(pass) break;
            await sleep(2500);
          }
          await writeFile(out+'/asset-byte-identity.json',JSON.stringify(identity,null,2)+'\n');
          if(!identity?.pass) throw new Error('production asset byte identity failed '+JSON.stringify(identity));

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({serviceWorkers:'block'});
          const page=await context.newPage();
          const selectors=[
            ['section-kicker','.hydrometric-hero__header .section-kicker'],['hero-title','#hydrometric-title'],['station-label','.station-identification > div > span'],['river-name','.station-identification > div > strong'],['signature-axis','.hydro-signature-axis'],['level-label','.hydro-level > span'],['level-value','[data-testid="hydro-current-level"]'],['observation-time','.hydro-level time'],['source-line','[data-testid="hydro-source-strip"] > span:first-child'],['chart','[data-testid="main-hydro-chart"]']
          ];
          const cases=[[320,568,'320x568',100],[360,800,'360x800',100],[390,844,'390x844',100],[430,932,'430x932',100],[195,422,'390x844@200%',200]];
          const rows=[]; const views=[]; const hashes={};
          let edgeCollisionCount=0,textBorderTouchCount=0,minContentInset=Infinity,minRuleGap=Infinity,minBorderGap=Infinity;
          for(const [width,height,viewport,zoom] of cases){
            await page.setViewportSize({width,height});
            await page.goto(`${base}/?prod_owner=${Date.now()}_${width}`,{waitUntil:'networkidle'});
            await page.getByTestId('hydrometric-situation').waitFor({state:'visible'});
            await page.getByTestId('main-hydro-chart').waitFor({state:'visible'});
            const level=parseFloat((await page.getByTestId('hydro-current-level').innerText()).replace(',','.'));
            if(Math.abs(level-parana.currentMetres)>.005) throw new Error(`API/UI Paraná mismatch ${level}/${parana.currentMetres}`);
            const source=(await page.getByTestId('hydro-source-strip').innerText()).toLowerCase();
            if(!source.includes('instituto nacional del agua')) throw new Error('source strip not INA');
            const m=await page.evaluate(({selectors,viewport,zoom})=>{
              const card=document.querySelector('.hydrometric-section'); const hero=document.querySelector('.muni-hydrometric-hero');
              if(!(card instanceof HTMLElement)||!(hero instanceof HTMLElement)) throw new Error('hydrometric geometry missing');
              const cr=card.getBoundingClientRect(),hr=hero.getBoundingClientRect(),pseudo=getComputedStyle(hero,'::after');
              const ruleLeft=hr.left+(Number.parseFloat(pseudo.left)||0),ruleWidth=Number.parseFloat(pseudo.width)||0,ruleRight=ruleLeft+ruleWidth;
              const pageGutter=cr.left,overflow=document.documentElement.scrollWidth-innerWidth;
              const elements=selectors.map(([element,selector])=>{const node=document.querySelector(selector);if(!(node instanceof HTMLElement||node instanceof SVGElement))throw new Error('missing '+selector);const r=node.getBoundingClientRect();return {element,selector,leftEdge:r.left,rightEdge:r.right,containerLeftEdge:cr.left,containerRightEdge:cr.right,decorativeRuleRightEdge:ruleRight,contentInset:r.left-cr.left,ruleToContentGap:r.left-ruleRight,rightBorderGap:cr.right-r.right};});
              return {viewport,zoom,pageGutter,ruleLeft,ruleWidth,ruleRight,overflow,elements};
            },{selectors,viewport,zoom});
            if(m.pageGutter<15.5||m.ruleWidth<3.5||m.overflow>1) throw new Error('viewport geometry shell '+JSON.stringify(m));
            for(const row of m.elements){
              minContentInset=Math.min(minContentInset,row.contentInset);minRuleGap=Math.min(minRuleGap,row.ruleToContentGap);minBorderGap=Math.min(minBorderGap,row.rightBorderGap);
              if(row.ruleToContentGap<15.5||row.contentInset<19.5)edgeCollisionCount++;
              if(row.contentInset<15.5||row.rightBorderGap<15.5)textBorderTouchCount++;
              const pass=row.contentInset>=19.5&&row.ruleToContentGap>=15.5&&row.rightBorderGap>=15.5;
              rows.push({viewport,zoom,...row,passFail:pass?'PASS':'FAIL'}); if(!pass) throw new Error(`OWNER geometry ${viewport} ${row.element} `+JSON.stringify(row));
            }
            const geo=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length}));
            if(geo.overflow>1||geo.quick!==6||geo.contacts!==5) throw new Error('production functional geometry '+JSON.stringify({viewport,geo}));
            views.push({viewport,width,height,zoom,level,...geo});
            if(viewport==='390x844'){
              const fp=out+'/screenshots/production-owner-left-inset-390.png';await page.locator('.hydrometric-section').screenshot({path:fp});hashes[viewport]=sha(await readFile(fp));
            }
          }
          if(edgeCollisionCount!==0||textBorderTouchCount!==0) throw new Error('collision counters nonzero');
          await page.setViewportSize({width:390,height:844});
          await page.goto(`${base}/?salado=${Date.now()}`,{waitUntil:'networkidle'});await page.getByRole('tab',{name:/Salado/i}).click();
          const saladoUi=parseFloat((await page.getByTestId('hydro-current-level').innerText()).replace(',','.'));if(Math.abs(saladoUi-salado.currentMetres)>.005)throw new Error(`API/UI Salado mismatch ${saladoUi}/${salado.currentMetres}`);
          await page.goto(`${base}/gestion-de-riesgo/fenomeno-el-nino?verify=${Date.now()}`,{waitUntil:'networkidle'});const el=await page.getByTestId('el-nino-landing').innerText();for(const s of ['Fenómeno El Niño','5,30 m','no es un umbral general de evacuación de SOS-SF'])if(!el.includes(s))throw new Error('El Niño preservation '+s);
          await browser.close();
          const geometry={amendment:'021-HOVS-OWNER-LEFT-INSET-EDGE-COLLISION-002',ownerCommentId:5219229883,heroInnerContentInsetMinimumPx:minContentInset,decorativeRuleToTextGapMinimumPx:minRuleGap,textToVisibleBorderGapMinimumPx:minBorderGap,edgeCollisionCount,textBorderTouchCount,leftInsetGate:'PASS',decorativeRuleGapGate:'PASS',zoom200LeftInset:'PASS',rows};
          await writeFile(out+'/production-mobile-left-inset-audit.json',JSON.stringify(geometry,null,2)+'\n');
          const truth={deploymentVersion:process.env.VERSION_ID,apiStatus:api.map(x=>({route:x.route,status:x.status})),parana:{currentMetres:parana.currentMetres,observedAt:parana.observedAt,freshness:parana.freshness},salado:{currentMetres:salado.currentMetres,observedAt:salado.observedAt,freshness:salado.freshness},inaSourceCount:ina.length,assetIdentity:identity,views,geometry,screenshotHashes:hashes,deployCommandCount:1,postdeployRedeployCount:0,result:'PASS'};
          await writeFile(out+'/production-terminal-truth.json',JSON.stringify(truth,null,2)+'\n');
          NODE

      - name: Terminal invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$OUT/deploy-command-count.txt")" = 1
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const truth=JSON.parse(await readFile(process.env.OUT+'/production-terminal-truth.json','utf8'));
          const provenance=JSON.parse(await readFile(process.env.OUT+'/deployment-provenance.json','utf8'));
          if(truth.result!=='PASS'||truth.geometry.edgeCollisionCount!==0||truth.geometry.textBorderTouchCount!==0||!truth.assetIdentity.pass||!provenance.pass) throw new Error('terminal truth failed');
          await writeFile(process.env.OUT+'/TERMINAL_CHECKPOINT.txt',[
            'AMENDMENT=021-HOVS-OWNER-LEFT-INSET-EDGE-COLLISION-002',
            'STATUS=POSTDEPLOY_TERMINAL_VERIFIED',
            `DEPLOYMENT_VERSION_ID=${truth.deploymentVersion}`,
            'DEPLOY_COMMAND_COUNT=1','POSTDEPLOY_REDEPLOY_COUNT=0',
            `HERO_INNER_CONTENT_INSET_MIN_PX=${truth.geometry.heroInnerContentInsetMinimumPx}`,
            `DECORATIVE_RULE_TO_TEXT_GAP_MIN_PX=${truth.geometry.decorativeRuleToTextGapMinimumPx}`,
            `TEXT_TO_VISIBLE_BORDER_GAP_MIN_PX=${truth.geometry.textToVisibleBorderGapMinimumPx}`,
            `EDGE_COLLISION_COUNT=${truth.geometry.edgeCollisionCount}`,
            `TEXT_BORDER_TOUCH_COUNT=${truth.geometry.textBorderTouchCount}`,
            'ZOOM_200_LEFT_INSET=PASS','PRODUCTION_ASSET_BYTE_IDENTITY=PASS','PRODUCTION_API_UI_CONSISTENCY=PASS','INA_PRIMARY_SOURCE=PASS','EL_NINO_PRESERVATION=PASS','MAIN_INTACT=PASS','D1_FREE=PRESERVED','KV_FREE=PRESERVED','R2=ABSENT','USD_BUDGET=0'
          ].join('\n')+'\n');
          NODE

      - name: Upload terminal production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-owner-left-inset-002-production-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90

      - name: Terminally disarm production workflow
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable owner-left-inset-002-production.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/owner-left-inset-002-production.yml
          git commit -m 'ci: terminally disarm owner left-inset production deploy'
          git push origin HEAD:arq/visual-dashboard-v3
