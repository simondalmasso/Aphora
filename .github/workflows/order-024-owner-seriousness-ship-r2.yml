name: order-024-owner-seriousness-ship-r2

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - '.github/workflows/order-024-owner-seriousness-ship-r2.yml'

permissions:
  contents: write

concurrency:
  group: sos-sf-order-024-owner-seriousness-r2
  cancel-in-progress: false

jobs:
  verify-deploy-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: arq/visual-dashboard-v3
      SOURCE_HEAD: 6044363f314a77ef33d51ae1526a26ad06206b05
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PROD_URL: https://sos-sf.simondalmasso44.workers.dev
      EVIDENCE_DIR: artifacts/order-024-r2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority and source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -f .github/workflows/order-024-owner-seriousness-ship.yml
          test -f .github/workflows/order-024-owner-seriousness-ship-r2.yml
          git diff --quiet "$SOURCE_HEAD" HEAD -- src tests package.json package-lock.json playwright.config.ts vite.config.ts wrangler.jsonc public
          mkdir -p "$EVIDENCE_DIR"
          printf 'SOURCE_HEAD=%s\nTRIGGER_HEAD=%s\nMAIN=%s\n' "$SOURCE_HEAD" "$(git rev-parse HEAD)" "$(git rev-parse origin/main)" > "$EVIDENCE_DIR/authority.txt"

      - name: Align durable tests with owner 024
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/final-product-023.spec.ts')
          text = path.read_text()
          old = "name: 'Así están el Paraná y el Salado'"
          if old not in text:
              raise SystemExit('Expected legacy heading assertion missing')
          path.write_text(text.replace(old, "name: 'Situación hidrométrica'", 1))
          PY

          cat > tests/e2e/owner-seriousness-024.spec.ts <<'TS'
          import { expect, test, type Page } from '@playwright/test';
          import type { HydrologicalSystem, Snapshot, Source } from '../../src/domain/snapshot.ts';
          import { stableHydrometricSnapshot } from './fixtures/stable-hydrometric.ts';

          const generatedMs = Date.parse(stableHydrometricSnapshot.generatedAt);
          const staleObservedAt = new Date(generatedMs - 42 * 60 * 60_000).toISOString();
          const recentFetchAt = new Date(generatedMs - 30_000).toISOString();
          const staleValidUntil = new Date(generatedMs - 30 * 60 * 60_000).toISOString();

          function staleSnapshot(): Snapshot {
            const baseSystem = stableHydrometricSnapshot.systems?.[0];
            const baseSource = stableHydrometricSnapshot.sources[0];
            if (!baseSystem || !baseSource) throw new Error('Stable hydrometric fixture is incomplete');
            const system: HydrologicalSystem = {
              ...baseSystem,
              freshness: 'DESACTUALIZADO',
              observedAt: staleObservedAt,
              fetchedAt: recentFetchAt,
              validUntil: staleValidUntil,
            };
            const source: Source = {
              ...baseSource,
              status: 'STALE',
              classification: 'OPERATIONAL_STALE',
              freshness: 'DESACTUALIZADO',
              observedAt: staleObservedAt,
              fetchedAt: recentFetchAt,
              lastCheckedAt: recentFetchAt,
              validUntil: staleValidUntil,
            };
            return {
              ...stableHydrometricSnapshot,
              id: '024-stale-measurement-recent-source-check',
              systems: [system],
              sources: [source],
              river: {
                ...stableHydrometricSnapshot.river,
                observedAt: staleObservedAt,
                fetchedAt: recentFetchAt,
                validUntil: staleValidUntil,
              },
            };
          }

          async function installFixture(page: Page, snapshot: Snapshot = stableHydrometricSnapshot) {
            await page.route('**/api/snapshot*', (route) => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({ ok: true, data: snapshot, meta: { schemaVersion: '1.0', generatedAt: snapshot.generatedAt, mode: 'LIVE', official: false } }),
            }));
            await page.route('**/api/sources*', (route) => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify({ ok: true, data: { snapshotId: snapshot.id, systems: snapshot.systems ?? [], sources: snapshot.sources } }),
            }));
            await page.route('**/api/messages*', (route) => route.fulfill({ json: { ok: true, data: { snapshotId: snapshot.id, messages: [], deliveryClaims: 'NONE' } } }));
            await page.route('**/api/auth/config*', (route) => route.fulfill({ json: { ok: true, data: { enabled: false, reportingEnabled: true, googleClientId: null } } }));
            await page.route('**/api/session*', (route) => route.fulfill({ json: { ok: true, data: { enabled: false, authenticated: false, principal: null } } }));
          }

          async function open(page: Page, snapshot: Snapshot = stableHydrometricSnapshot) {
            await installFixture(page, snapshot);
            await page.goto('/');
            await expect(page.locator('main')).toHaveAttribute('data-snapshot-id', snapshot.id);
            await expect(page.getByTestId('hydrometric-situation')).toBeVisible();
          }

          test('024 first viewport is civic, calm and measurement-dominant', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop', 'Explicit viewport check runs once.');
            await page.setViewportSize({ width: 390, height: 844 });
            await open(page);
            await expect(page.getByText('Santa Fe · monitoreo hídrico', { exact: true })).toBeVisible();
            const h1 = page.getByRole('heading', { level: 1, name: 'Situación hidrométrica' });
            await expect(h1).toBeVisible();
            await expect(page.getByText('Niveles, tendencia y vigencia de las últimas mediciones disponibles.', { exact: true })).toBeVisible();
            await expect(page.getByText('Santa Fe, hoy', { exact: true })).toHaveCount(0);
            await expect(page.getByText('Así están el Paraná y el Salado', { exact: true })).toHaveCount(0);
            await expect(page.getByText('Último nivel disponible', { exact: true })).toBeVisible();
            const level = page.getByTestId('hydro-current-level');
            const [h1Px, levelPx] = await Promise.all([
              h1.evaluate((el) => Number.parseFloat(getComputedStyle(el).fontSize)),
              level.evaluate((el) => Number.parseFloat(getComputedStyle(el).fontSize)),
            ]);
            expect(levelPx).toBeGreaterThan(h1Px * 1.6);
            const levelBox = await level.boundingBox();
            expect(levelBox).not.toBeNull();
            expect(levelBox?.y ?? 9999).toBeLessThan(844);
            expect(await page.evaluate(() => document.documentElement.scrollWidth - innerWidth)).toBeLessThanOrEqual(1);
          });

          test('024 distinguishes measurement age from source consultation age', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop', 'Temporal semantics check runs once.');
            await page.setViewportSize({ width: 390, height: 844 });
            await open(page, staleSnapshot());
            const station = page.locator('.station-identification');
            await expect(station).toContainText('Última medición · hace 42 horas');
            const source = page.getByTestId('hydro-source-strip');
            await expect(source).toContainText('Fuente · Instituto Nacional del Agua');
            await expect(source).toContainText('Medición · hace 42 horas');
            await expect(source).toContainText('Consulta de la fuente · hace menos de un minuto');
            await expect(source).not.toContainText('Recibidos');
          });

          test('024 required responsive matrix has zero overflow and preserves touch targets', async ({ page }, testInfo) => {
            test.skip(testInfo.project.name !== 'desktop', 'Explicit matrix runs once.');
            const cases = [[320, 568], [360, 800], [390, 844], [430, 932], [768, 1024], [1440, 900]] as const;
            for (const [width, height] of cases) {
              await page.setViewportSize({ width, height });
              await open(page, { ...stableHydrometricSnapshot, id: `024-${width}x${height}` });
              await expect(page.getByRole('heading', { level: 1, name: 'Situación hidrométrica' })).toBeVisible();
              await expect(page.getByTestId('hydro-current-level')).toBeVisible();
              expect(await page.evaluate(() => document.documentElement.scrollWidth - innerWidth), `${width}x${height}`).toBeLessThanOrEqual(1);
              if (width <= 430) {
                const refreshBox = await page.getByRole('button', { name: 'Actualizar información' }).boundingBox();
                const sourceBox = await page.getByRole('button', { name: 'Ver fuente y detalle' }).first().boundingBox();
                expect(refreshBox?.height ?? 0, `${width} refresh`).toBeGreaterThanOrEqual(44);
                expect(sourceBox?.height ?? 0, `${width} source`).toBeGreaterThanOrEqual(44);
              }
              await page.unrouteAll({ behavior: 'wait' });
            }
          });
          TS

          git diff --check
          grep -Fq 'Situación hidrométrica' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Santa Fe · monitoreo hídrico' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Medición · {formatHumanAge(selected.observedAt' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Consulta de la fuente · {formatHumanAge(selected.fetchedAt' src/client/features/hydro/HydrometricMonitoring.tsx
          ! grep -Fq '<span>Recibidos {formatHumanAge(selected.fetchedAt' src/client/features/hydro/HydrometricMonitoring.tsx

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit
        run: npm run test:unit

      - name: Contract
        run: npm run test:contract

      - name: Worker
        run: npm run test:worker

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full E2E regression suite
        env:
          EVIDENCE_DIR: artifacts/order-024-r2/e2e
        run: npm run test:e2e

      - name: Cloudflare dry run
        run: npm run deploy:dry

      - name: Cloudflare auth gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler whoami >/dev/null
          echo CLOUDFLARE_AUTH=PASS

      - name: Predeploy production read-only health
        shell: bash
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/predeploy-http.txt"
          for path in / /lite /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path")"
            test "$code" = "200"
            printf '%s %s\n' "$path" "$code" | tee -a "$EVIDENCE_DIR/predeploy-http.txt"
          done

      - name: Deploy exactly once
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          printf '1\n' > "$EVIDENCE_DIR/deploy-command-invocations.txt"
          export WRANGLER_OUTPUT_FILE_PATH="$EVIDENCE_DIR/wrangler-output.ndjson"
          export WRANGLER_SEND_METRICS=false
          export WRANGLER_LOG_SANITIZE=true
          npx wrangler deploy --config wrangler.jsonc 2>&1 | tee "$EVIDENCE_DIR/wrangler-deploy.log"
          version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' "$EVIDENCE_DIR/wrangler-deploy.log" | tail -1 | awk '{print $4}')"
          if [ -z "$version_id" ] && [ -s "$EVIDENCE_DIR/wrangler-output.ndjson" ]; then
            version_id="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
          const deploy = [...rows].reverse().find((row) => row.type === 'deploy');
          process.stdout.write(deploy?.version_id ?? '');
          NODE
            )"
          fi
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_VERSION=$version_id"
          printf 'CLOUDFLARE_VERSION=%s\nPRODUCTION_URL=%s\n' "$version_id" "$PROD_URL" > "$EVIDENCE_DIR/deployment.txt"

      - name: Verify exact production bytes and GET routes
        shell: bash
        run: |
          set -euo pipefail
          expected_js="$(grep -Eo 'assets/index-[^"[:space:]]+\.js' dist/index.html | head -1)"
          test -n "$expected_js"
          matched=0
          for attempt in $(seq 1 15); do
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$PROD_URL/?order024=${GITHUB_RUN_ID}-${attempt}" > "$EVIDENCE_DIR/prod-index.html"
            if grep -Fq "$expected_js" "$EVIDENCE_DIR/prod-index.html"; then matched=1; break; fi
            sleep 3
          done
          test "$matched" = "1"
          : > "$EVIDENCE_DIR/postdeploy-http.txt"
          for path in / /gestion-de-riesgo /gestion-de-riesgo/fenomeno-el-nino /lite /manifest.webmanifest /service-worker.js /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path?order024=${GITHUB_RUN_ID}")"
            test "$code" = "200"
            printf '%s %s\n' "$path" "$code" | tee -a "$EVIDENCE_DIR/postdeploy-http.txt"
          done
          printf 'EXPECTED_JS=%s\nPRODUCTION_BYTES=VERIFIED\n' "$expected_js" > "$EVIDENCE_DIR/served-byte-proof.txt"

      - name: Verify production viewport, semantics and touch matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/screenshots"
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const base = process.env.PROD_URL;
          const out = process.env.EVIDENCE_DIR;
          const cases = [[320,568],[360,800],[390,844],[430,932],[768,1024],[1440,900]];
          const browser = await chromium.launch({ headless: true });
          const rows = [];
          for (const [width,height] of cases) {
            const page = await browser.newPage({ viewport: { width, height } });
            const response = await page.goto(`${base}/?order024-prod=${Date.now()}-${width}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            if (!response || response.status() !== 200) throw new Error(`${width}x${height}: HTTP ${response?.status()}`);
            const h1 = page.getByRole('heading', { level: 1, name: 'Situación hidrométrica' });
            await h1.waitFor({ state: 'visible', timeout: 20000 });
            await page.getByText('Santa Fe · monitoreo hídrico', { exact: true }).waitFor({ state: 'visible' });
            await page.getByText('Niveles, tendencia y vigencia de las últimas mediciones disponibles.', { exact: true }).waitFor({ state: 'visible' });
            const level = page.getByTestId('hydro-current-level');
            await level.waitFor({ state: 'visible' });
            const source = page.getByTestId('hydro-source-strip');
            await source.waitFor({ state: 'visible' });
            const sourceText = await source.innerText();
            if (!sourceText.includes('Medición ·')) throw new Error(`${width}: measurement age label missing`);
            if (!sourceText.includes('Consulta de la fuente ·')) throw new Error(`${width}: source consultation label missing`);
            if (sourceText.includes('Recibidos ')) throw new Error(`${width}: ambiguous received copy remains`);
            const bodyText = await page.locator('body').innerText();
            if (bodyText.includes('Santa Fe, hoy') || bodyText.includes('Así están el Paraná y el Salado')) throw new Error(`${width}: editorial copy remains`);
            const metrics = await page.evaluate(() => {
              const heading = document.querySelector('#hydrometric-title');
              const reading = document.querySelector('[data-testid="hydro-current-level"]');
              if (!heading || !reading) throw new Error('hydrometric viewport elements missing');
              return {
                overflow: document.documentElement.scrollWidth - innerWidth,
                h1Px: Number.parseFloat(getComputedStyle(heading).fontSize),
                levelPx: Number.parseFloat(getComputedStyle(reading).fontSize),
                levelTop: reading.getBoundingClientRect().top,
              };
            });
            if (metrics.overflow > 1) throw new Error(`${width}x${height}: horizontal overflow ${metrics.overflow}`);
            if (metrics.levelPx <= metrics.h1Px * 1.6) throw new Error(`${width}x${height}: title still dominates reading`);
            if (width === 390 && metrics.levelTop >= height) throw new Error('390x844: primary reading below first viewport');
            if (width <= 430) {
              const refreshBox = await page.getByRole('button', { name: 'Actualizar información' }).boundingBox();
              const sourceBox = await page.getByRole('button', { name: 'Ver fuente y detalle' }).first().boundingBox();
              if (!refreshBox || refreshBox.height < 44) throw new Error(`${width}: refresh touch target regressed`);
              if (!sourceBox || sourceBox.height < 44) throw new Error(`${width}: source touch target regressed`);
            }
            await page.screenshot({ path: `${out}/screenshots/production-${width}x${height}.png`, fullPage: true });
            rows.push({ width, height, ...metrics });
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(`${out}/production-responsive.json`, JSON.stringify(rows, null, 2) + '\n');
          NODE

      - name: Reconcile tests and remove temporary workflows
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" main --quiet
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          rm .github/workflows/order-024-owner-seriousness-ship.yml
          rm .github/workflows/order-024-owner-seriousness-ship-r2.yml
          git config user.name "SOS-SF ARQ"
          git config user.email "actions@users.noreply.github.com"
          git add -A tests/e2e/final-product-023.spec.ts tests/e2e/owner-seriousness-024.spec.ts .github/workflows
          git diff --cached --check
          git commit -m "test: lock SOS-SF-024 owner correction [skip ci]"
          product_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$BRANCH"
          git fetch origin "$BRANCH" main --quiet
          test "$(git rev-parse origin/$BRANCH)" = "$product_commit"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test ! -e .github/workflows/order-024-owner-seriousness-ship.yml
          test ! -e .github/workflows/order-024-owner-seriousness-ship-r2.yml
          echo "product_commit=$product_commit" >> "$GITHUB_OUTPUT"
          echo "PRODUCT_COMMIT=$product_commit"
          echo "FINAL_BRANCH_HEAD=$product_commit"
          printf 'PRODUCT_COMMIT=%s\nFINAL_BRANCH_HEAD=%s\nMAIN=%s\nTEMP_WORKFLOWS=ABSENT\n' "$product_commit" "$product_commit" "$(git rev-parse origin/main)" > "$EVIDENCE_DIR/reconcile.txt"

      - name: Terminal evidence
        shell: bash
        env:
          PRODUCT_COMMIT: ${{ steps.reconcile.outputs.product_commit }}
          CLOUDFLARE_VERSION: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          test -n "$PRODUCT_COMMIT"
          test -n "$CLOUDFLARE_VERSION"
          cat > "$EVIDENCE_DIR/terminal.txt" <<EOF
          SOS_SF_024_STATUS=SHIPPED
          PRODUCTION_URL=$PROD_URL
          PRODUCT_COMMIT=$PRODUCT_COMMIT
          FINAL_BRANCH_HEAD=$PRODUCT_COMMIT
          CLOUDFLARE_VERSION=$CLOUDFLARE_VERSION
          OWNER_FINDING_FIXED=YES
          SERIOUS_CIVIC_FIRST_VIEWPORT=PASS
          MEASUREMENT_VS_FETCH_FRESHNESS=PASS
          FUNCTIONAL_REGRESSIONS=0
          EOF
          cat "$EVIDENCE_DIR/terminal.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-024-r2-${{ github.run_id }}
          path: artifacts/order-024-r2
          if-no-files-found: error
          retention-days: 30
