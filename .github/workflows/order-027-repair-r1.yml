name: order-027-repair-r1
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/order-027-repair-r1.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/components/ui/HydroSeriesChart.tsx')
          s=p.read_text()
          old="import { changeCopy, changeForSystem, safeStationThresholds } from '../../../domain/hydrometric-context.ts';"
          new="import { changeForSystem, safeStationThresholds } from '../../../domain/hydrometric-context.ts';"
          if old not in s: raise SystemExit('unused import marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name sos-sf-arq
          git config user.email actions@users.noreply.github.com
          git add src/client/components/ui/HydroSeriesChart.tsx
          git commit -m 'fix(027): remove stale chart import [skip ci]'
          git push origin HEAD:refs/heads/arq/visual-dashboard-v3
