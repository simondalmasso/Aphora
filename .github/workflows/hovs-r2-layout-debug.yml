name: SOS-SF HOVS R2 Layout Debug
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: arq/visual-dashboard-v3}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npx playwright install chromium && npm run build
      - name: Measure
        shell: bash
        run: |
          npm run preview >/tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          mkdir -p /tmp/r2debug
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';import{writeFile}from'node:fs/promises';
          const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:390,height:844}});await p.goto('http://127.0.0.1:8787/',{waitUntil:'networkidle'});
          const m=await p.evaluate(()=>{const sels=['.civic-header','.verified-alert-banner','.hydrometric-section','.civic-discovery','.safety-actions','.source-transparency','.civic-footer'];const blocks=Object.fromEntries(sels.map(s=>{const e=document.querySelector(s),r=e?.getBoundingClientRect();return[s,r?{y:r.y,height:r.height,bottom:r.bottom}:null]}));return{scrollHeight:document.documentElement.scrollHeight,blocks,main:[...document.querySelectorAll('main > section')].map(e=>{const r=e.getBoundingClientRect();return{cls:e.className,y:r.y,height:r.height}})}});await writeFile('/tmp/r2debug/geometry.json',JSON.stringify(m,null,2));await p.screenshot({path:'/tmp/r2debug/390.png',fullPage:true});await b.close();
          NODE
      - uses: actions/upload-artifact@v4
        with: {name: r2-layout-debug, path: /tmp/r2debug}
      - name: Disarm
        if: always()
        shell: bash
        run: |
          gh workflow disable hovs-r2-layout-debug.yml || true
          git config user.name sos-sf-automation; git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-layout-debug.yml && git commit -m "ci: disarm HOVS R2 layout debug" && git push origin HEAD:arq/visual-dashboard-v3
