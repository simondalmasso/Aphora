name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run project gate
        run: npm run gate
      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Start exact built artifact preview
        shell: bash
        run: |
          node scripts/static-qa-server.mjs > /tmp/aphora-static-preview.log 2>&1 &
          echo $! > /tmp/aphora-static-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8790/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aphora-static-preview.log
          exit 1
      - name: Run responsive, accessibility and offline browser gate
        run: node scripts/order032-visual.mjs
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aphora-browser-acceptance
          path: evidence/order032-visual-final/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: aphora-dist-manifest
          path: dist/manifest.json
          if-no-files-found: error
          retention-days: 14
