name: Disarm Visual Restore Deploy

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/disarm-visual-restore-deploy-trigger]

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: sos-sf-016-a-deploy-disarm
  cancel-in-progress: false

env:
  ORDER_ID: SOS-SF-OWNER-DEPLOY-WORKFLOW-DISARM-016-A
  EXPECTED_HEAD: afe3d231423a748e39f87812f62dc316a8733dcd
  SYNCHRONIZED_PRODUCT_SHA: af295d2707ded620c2e19194bf7242270dfbc873
  EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
  TARGET_WORKFLOW_NAME: Deploy Visual Restore Continuation
  TARGET_WORKFLOW_ID: '327938145'
  TARGET_WORKFLOW_PATH: .github/workflows/deploy-visual-restore-continuation.yml
  TARGET_TRIGGER_PATH: .github/deploy-visual-restore-continuation-trigger
  DEPLOYMENT_VERSION_ID: 672106fb-575d-48d5-a9de-4a20e6d02f73
  PRODUCT_TREE_SHA256: 274e51ce655ebf4c82c894843a8549b249191c436d3736e356748d16183cf940
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  EVIDENCE_DIR: artifacts/deploy-workflow-disarm-016-a

jobs:
  disarm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact take point and immutable product boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$GITHUB_REF_NAME" = arq/visual-dashboard-v3
          git merge-base --is-ancestor "$EXPECTED_HEAD" HEAD
          git merge-base --is-ancestor "$SYNCHRONIZED_PRODUCT_SHA" HEAD
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          changed="$(git diff --name-only "$EXPECTED_HEAD"...HEAD)"
          if [ -n "$changed" ]; then
            while IFS= read -r path; do
              case "$path" in .github/*) ;; *) echo "PRODUCT_SOURCE_CHANGE_BEFORE_DISARM:$path"; exit 1;; esac
            done <<< "$changed"
          fi
          test -f "$TARGET_WORKFLOW_PATH"
          test -f "$TARGET_TRIGGER_PATH"
          test "$(sed -n 's/^MODE=//p' "$TARGET_TRIGGER_PATH" | head -n1)" = FINAL_VISUAL_RESTORE_CONTINUATION_01
          printf 'ORDER=%s\nREMOTE_HEAD_BEFORE=%s\nMAIN_SHA=%s\nPRODUCT_SOURCE_CHANGED=false\nDEPLOY_COMMAND_COUNT=0\nCLOUDFLARE_MUTATION_COUNT=0\n' "$ORDER_ID" "$EXPECTED_HEAD" "$EXPECTED_MAIN" > "$EVIDENCE_DIR/preconditions.txt"

      - name: Inventory registered workflows before disarm
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '.workflows[]' > "$EVIDENCE_DIR/workflows-before.ndjson"
          python - <<'PY'
          import json, os
          rows=[json.loads(line) for line in open(os.path.join(os.environ['EVIDENCE_DIR'],'workflows-before.ndjson')) if line.strip()]
          targets=[row for row in rows if row.get('name')==os.environ['TARGET_WORKFLOW_NAME'] or str(row.get('id'))==os.environ['TARGET_WORKFLOW_ID']]
          if len(targets)!=1: raise SystemExit(f'TARGET_WORKFLOW_RESOLUTION:{len(targets)}')
          target=targets[0]
          if str(target.get('id'))!=os.environ['TARGET_WORKFLOW_ID']: raise SystemExit(f'TARGET_WORKFLOW_ID_DRIFT:{target.get("id")}')
          if target.get('state')!='active': raise SystemExit(f'TARGET_WORKFLOW_NOT_ACTIVE_BEFORE:{target.get("state")}')
          open(os.path.join(os.environ['EVIDENCE_DIR'],'target-before.json'),'w').write(json.dumps(target,indent=2,sort_keys=True)+'\n')
          PY

      - name: Disable every active production mutation workflow reachable from this branch or rerun
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          branch='arq/visual-dashboard-v3'
          evidence=pathlib.Path(os.environ['EVIDENCE_DIR'])
          workflows=[json.loads(line) for line in (evidence/'workflows-before.ndjson').read_text().splitlines() if line.strip()]
          by_path={row.get('path'):row for row in workflows}
          matrix=[]
          disable=[]
          for path in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
            text=path.read_text()
            key=str(path)
            reg=by_path.get(key,{})
            wid=reg.get('id')
            state=reg.get('state','unregistered')
            events=[name for name in ['push','pull_request','pull_request_target','workflow_dispatch','workflow_run','repository_dispatch','schedule'] if re.search(rf'(?m)^\s{{0,4}}{re.escape(name)}\s*:',text)]
            has_runs=False
            if wid:
              result=subprocess.run(['gh','api',f'repos/{repo}/actions/workflows/{wid}/runs?per_page=1','--jq','.total_count'],capture_output=True,text=True,check=True)
              has_runs=int(result.stdout.strip() or '0')>0
            canonical_literal=branch in text
            any_push='push' in events and not re.search(r'(?m)^\s+branches(?:-ignore)?\s*:',text)
            manual='workflow_dispatch' in events
            rerun=has_runs
            cloudflare_secrets=bool(re.search(r'CLOUDFLARE_(?:API_TOKEN|ACCOUNT_ID)|secrets\.CLOUDFLARE',text,re.I))
            wrangler_deploy=bool(re.search(r'\bwrangler\s+deploy\b',text,re.I))
            remote_migrations=bool(re.search(r'\bd1\s+migrations\s+apply\b[^\n]*--remote|\bwrangler\s+d1\s+migrations\s+apply\b[^\n]*--remote',text,re.I))
            provisioning='provision-cloudflare.mjs' in text
            secret_write=bool(re.search(r'\bwrangler\s+secret\s+(?:put|delete|bulk)\b',text,re.I))
            dangerous=wrangler_deploy or remote_migrations or provisioning or secret_write
            reachable=canonical_literal or any_push or manual or rerun
            real=state=='active' and cloudflare_secrets and dangerous and reachable
            row={
              'workflow':reg.get('name') or path.name,
              'workflowId':wid,
              'path':key,
              'registeredStateBefore':state,
              'events':events,
              'canonicalBranchLiteral':canonical_literal,
              'anyPush':any_push,
              'manual':manual,
              'rerunPossible':rerun,
              'cloudflareSecrets':cloudflare_secrets,
              'wranglerDeploy':wrangler_deploy,
              'remoteMigrations':remote_migrations,
              'provisioning':provisioning,
              'secretWrite':secret_write,
              'realProductionMutationPathBefore':real,
            }
            matrix.append(row)
            if real:
              if not wid: raise SystemExit(f'ACTIVE_MUTATION_PATH_UNREGISTERED:{key}')
              disable.append(row)
          target=[row for row in matrix if str(row.get('workflowId'))==os.environ['TARGET_WORKFLOW_ID']]
          if len(target)!=1 or not target[0]['realProductionMutationPathBefore']:
            raise SystemExit('TARGET_NOT_IDENTIFIED_AS_REAL_MUTATION_PATH')
          (evidence/'workflow-matrix-before.json').write_text(json.dumps(matrix,indent=2,sort_keys=True)+'\n')
          (evidence/'workflows-to-disable.json').write_text(json.dumps(disable,indent=2,sort_keys=True)+'\n')
          for row in disable:
            subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/actions/workflows/{row["workflowId"]}/disable'],check=True)
          print(f'DISABLED_COUNT={len(disable)}')
          PY
          printf 'DEPLOY_COMMAND_COUNT=0\nCLOUDFLARE_MUTATION_COUNT=0\n' > "$EVIDENCE_DIR/no-cloudflare-execution.txt"

      - name: Verify target registered state disabled manually before file removal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW_ID" > "$EVIDENCE_DIR/target-disabled-before-delete.json"
          test "$(jq -r .state "$EVIDENCE_DIR/target-disabled-before-delete.json")" = disabled_manually
          test "$(jq -r .name "$EVIDENCE_DIR/target-disabled-before-delete.json")" = "$TARGET_WORKFLOW_NAME"

      - name: Remove executable deploy workflow and terminalize its trigger
        shell: bash
        run: |
          set -euo pipefail
          git rm "$TARGET_WORKFLOW_PATH"
          cat > "$TARGET_TRIGGER_PATH" <<'EOF'
          MODE=TERMINAL_VISUAL_RESTORE_CONTINUATION_01
          ORDER=SOS-SF-OWNER-DEPLOY-WORKFLOW-DISARM-016-A
          DEPLOY=PROHIBITED
          CLOUDFLARE_MUTATION=PROHIBITED
          RERUN=PROHIBITED
          COMPLETED_DEPLOYMENT_VERSION_ID=672106fb-575d-48d5-a9de-4a20e6d02f73
          EOF
          git rm .github/disarm-visual-restore-deploy-trigger
          git add "$TARGET_TRIGGER_PATH"
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          while IFS= read -r path; do
            case "$path" in .github/*) ;; *) echo "NON_CONTROL_CHANGE:$path"; exit 1;; esac
          done <<< "$changed"
          test ! -e "$TARGET_WORKFLOW_PATH"
          test "$(sed -n 's/^MODE=//p' "$TARGET_TRIGGER_PATH" | head -n1)" = TERMINAL_VISUAL_RESTORE_CONTINUATION_01
          grep -qx 'DEPLOY=PROHIBITED' "$TARGET_TRIGGER_PATH"
          grep -qx 'CLOUDFLARE_MUTATION=PROHIBITED' "$TARGET_TRIGGER_PATH"
          grep -qx 'RERUN=PROHIBITED' "$TARGET_TRIGGER_PATH"

      - name: Commit control-only disarm
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git commit -m 'ci: irreversibly disarm visual restore deployment path'
          git push origin HEAD:arq/visual-dashboard-v3
          disarm_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$disarm_sha" > "$EVIDENCE_DIR/disarm-commit-sha.txt"
          echo "DISARM_COMMIT_SHA=$disarm_sha" >> "$GITHUB_ENV"

      - name: Verify final workflow registry and zero active production mutation paths
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin arq/visual-dashboard-v3 main
          test "$(git rev-parse origin/arq/visual-dashboard-v3)" = "$DISARM_COMMIT_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$SYNCHRONIZED_PRODUCT_SHA" "$DISARM_COMMIT_SHA"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '.workflows[]' > "$EVIDENCE_DIR/workflows-after.ndjson"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW_ID" > "$EVIDENCE_DIR/target-after.json"
          test "$(jq -r .state "$EVIDENCE_DIR/target-after.json")" = disabled_manually
          test ! -e "$TARGET_WORKFLOW_PATH"
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; branch='arq/visual-dashboard-v3'; evidence=pathlib.Path(os.environ['EVIDENCE_DIR'])
          workflows=[json.loads(line) for line in (evidence/'workflows-after.ndjson').read_text().splitlines() if line.strip()]
          by_path={row.get('path'):row for row in workflows}
          matrix=[]
          for path in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
            text=path.read_text(); key=str(path); reg=by_path.get(key,{}); wid=reg.get('id'); state=reg.get('state','unregistered')
            events=[name for name in ['push','pull_request','pull_request_target','workflow_dispatch','workflow_run','repository_dispatch','schedule'] if re.search(rf'(?m)^\s{{0,4}}{re.escape(name)}\s*:',text)]
            has_runs=False
            if wid:
              result=subprocess.run(['gh','api',f'repos/{repo}/actions/workflows/{wid}/runs?per_page=1','--jq','.total_count'],capture_output=True,text=True,check=True)
              has_runs=int(result.stdout.strip() or '0')>0
            canonical_literal=branch in text
            any_push='push' in events and not re.search(r'(?m)^\s+branches(?:-ignore)?\s*:',text)
            manual='workflow_dispatch' in events
            cloudflare_secrets=bool(re.search(r'CLOUDFLARE_(?:API_TOKEN|ACCOUNT_ID)|secrets\.CLOUDFLARE',text,re.I))
            wrangler_deploy=bool(re.search(r'\bwrangler\s+deploy\b',text,re.I))
            remote_migrations=bool(re.search(r'\bd1\s+migrations\s+apply\b[^\n]*--remote|\bwrangler\s+d1\s+migrations\s+apply\b[^\n]*--remote',text,re.I))
            provisioning='provision-cloudflare.mjs' in text
            secret_write=bool(re.search(r'\bwrangler\s+secret\s+(?:put|delete|bulk)\b',text,re.I))
            dangerous=wrangler_deploy or remote_migrations or provisioning or secret_write
            reachable=canonical_literal or any_push or manual or has_runs
            real=state=='active' and cloudflare_secrets and dangerous and reachable
            matrix.append({
              'workflow':reg.get('name') or path.name,'workflowId':wid,'path':key,'registeredState':state,
              'events':events,'branchesReachable':['arq/visual-dashboard-v3'] if canonical_literal or any_push else [],
              'manual':manual,'rerunPossible':has_runs,'cloudflareSecrets':cloudflare_secrets,
              'wranglerDeploy':wrangler_deploy,'remoteMigrations':remote_migrations,'provisioning':provisioning,
              'secretWrite':secret_write,'realProductionMutationPath':real,
            })
          target=json.loads((evidence/'target-after.json').read_text())
          matrix.append({'workflow':target['name'],'workflowId':target['id'],'path':target['path'],'registeredState':target['state'],'events':[],'branchesReachable':[],'manual':False,'rerunPossible':False,'cloudflareSecrets':True,'wranglerDeploy':True,'remoteMigrations':True,'provisioning':True,'secretWrite':False,'realProductionMutationPath':False,'fileState':'ABSENT_FROM_CURRENT_HEAD'})
          active=[row for row in matrix if row.get('realProductionMutationPath')]
          (evidence/'workflow-matrix-final.json').write_text(json.dumps(matrix,indent=2,sort_keys=True)+'\n')
          lines=['| workflow | state | events | branches | wrangler deploy | remote migration | provisioning | secret write | production mutation path |','|---|---|---|---|---:|---:|---:|---:|---:|']
          for row in matrix:
            lines.append('| {workflow} | {registeredState} | {events} | {branches} | {wranglerDeploy} | {remoteMigrations} | {provisioning} | {secretWrite} | {realProductionMutationPath} |'.format(workflow=row['workflow'].replace('|','/'),registeredState=row['registeredState'],events=','.join(row.get('events',[])) or '-',branches=','.join(row.get('branchesReachable',[])) or '-',wranglerDeploy=str(row.get('wranglerDeploy',False)).lower(),remoteMigrations=str(row.get('remoteMigrations',False)).lower(),provisioning=str(row.get('provisioning',False)).lower(),secretWrite=str(row.get('secretWrite',False)).lower(),realProductionMutationPath=str(row.get('realProductionMutationPath',False)).lower()))
          (evidence/'workflow-matrix-final.md').write_text('\n'.join(lines)+'\n')
          if active: raise SystemExit('ACTIVE_PRODUCTION_MUTATION_PATHS:'+','.join(row['workflow'] for row in active))
          (evidence/'active-production-mutation-paths.txt').write_text('ACTIVE_PRODUCTION_MUTATION_PATHS=0\n')
          PY

      - name: Prove product tree and deployed identity unchanged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          excluded=('.github/','artifacts/','dist/'); marker='public/source-provenance.json'
          paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0'); digest=hashlib.sha256(); included=0
          for raw in sorted(path for path in paths if path):
            path=raw.decode()
            if path==marker or path.startswith(excluded): continue
            data=Path(path).read_bytes(); digest.update(path.encode()); digest.update(b'\0'); digest.update(len(data).to_bytes(8,'big')); digest.update(data); included+=1
          actual=digest.hexdigest(); local=json.loads(Path(marker).read_text())
          if actual!=os.environ['PRODUCT_TREE_SHA256'] or local.get('productTreeSha256')!=actual: raise SystemExit(f'PRODUCT_TREE_DRIFT:{actual}:{local.get("productTreeSha256")}')
          Path(os.environ['EVIDENCE_DIR'],'product-tree.txt').write_text(f'PRODUCT_SOURCE_CHANGED=false\nPRODUCT_TREE_SHA256={actual}\nINCLUDED_FILE_COUNT={included}\n')
          PY
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/api/health?disarm=$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/production-health.json"
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/source-provenance.json?disarm=$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/remote-source-provenance.json"
          node <<'NODE'
          const fs=require('node:fs'); const dir=process.env.EVIDENCE_DIR;
          const healthRaw=JSON.parse(fs.readFileSync(`${dir}/production-health.json`,'utf8')); const health=healthRaw.data||healthRaw;
          const local=JSON.parse(fs.readFileSync('public/source-provenance.json','utf8')); const remote=JSON.parse(fs.readFileSync(`${dir}/remote-source-provenance.json`,'utf8'));
          if(health.status!=='healthy') throw new Error(`HEALTH_NOT_HEALTHY:${health.status}`);
          for(const field of ['schemaVersion','orderId','productTreeSha256','includedFileCount','deploymentRunId']) if(String(local[field])!==String(remote[field])) throw new Error(`PROVENANCE_MISMATCH:${field}`);
          if(remote.productTreeSha256!==process.env.PRODUCT_TREE_SHA256) throw new Error('REMOTE_PRODUCT_TREE_DRIFT');
          fs.writeFileSync(`${dir}/production-result.txt`,[
            'PRODUCTION_GET_RESULT=HEALTHY',
            `DEPLOYMENT_VERSION_ID=${process.env.DEPLOYMENT_VERSION_ID}`,
            'CLOUDFLARE_GITHUB_DRIFT=false',
            'DEPLOY_COMMAND_COUNT=0',
            'CLOUDFLARE_MUTATION_COUNT=0',''].join('\n'));
          NODE

      - name: Verify issue remains open and write final result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_state="$(gh api "repos/$GITHUB_REPOSITORY/issues/8" --jq .state)"
          test "$issue_state" = open
          target_state="$(jq -r .state "$EVIDENCE_DIR/target-after.json")"
          cat > "$EVIDENCE_DIR/result.txt" <<EOF
          STATUS=VERIFIED_NOT_ACCEPTED
          ORDER=$ORDER_ID
          REMOTE_HEAD_BEFORE=$EXPECTED_HEAD
          REMOTE_HEAD_AFTER=$DISARM_COMMIT_SHA
          DISARM_COMMIT_SHA=$DISARM_COMMIT_SHA
          TARGET_WORKFLOW_ID=$TARGET_WORKFLOW_ID
          TARGET_WORKFLOW_REGISTERED_STATE=$target_state
          TARGET_WORKFLOW_FILE_STATE=ABSENT_FROM_CURRENT_HEAD
          TRIGGER_MODE=TERMINAL_VISUAL_RESTORE_CONTINUATION_01
          ACTIVE_PRODUCTION_MUTATION_PATHS=0
          DEPLOY_COMMAND_COUNT=0
          CLOUDFLARE_MUTATION_COUNT=0
          PRODUCT_SOURCE_CHANGED=false
          PRODUCT_TREE_SHA256=$PRODUCT_TREE_SHA256
          SYNCHRONIZED_PRODUCT_ANCESTRY=PASS
          DEPLOYMENT_VERSION_ID=$DEPLOYMENT_VERSION_ID
          PRODUCTION_GET_RESULT=HEALTHY
          CLOUDFLARE_GITHUB_DRIFT=false
          MAIN_SHA=$EXPECTED_MAIN
          ISSUE_8_STATE=OPEN
          AUD_HOLD=ACTIVE
          EOF

      - name: Upload disarm evidence
        uses: actions/upload-artifact@v4
        with:
          name: deploy-workflow-disarm-016-a-${{ env.DISARM_COMMIT_SHA }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
