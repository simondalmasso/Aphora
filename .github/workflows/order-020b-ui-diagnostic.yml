name: SOS-SF 020-B UI Diagnostic

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/order-020b-ui-diagnostic-trigger]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate current production snapshot with client validator
        run: npx vitest run .github/order020b/validation-diagnostic.test.ts --reporter=verbose
      - run: npx playwright install --with-deps chromium
      - run: node .github/order020b/ui-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sos-sf-order-020b-ui-diagnostic
          path: artifacts/order-020b-ui-diagnostic
          if-no-files-found: warn
