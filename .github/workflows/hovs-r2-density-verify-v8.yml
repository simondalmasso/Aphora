name: SOS-SF HOVS R2 Density Verify v8
on:
  push:
    branches:
      - arq/visual-dashboard-v3
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT: artifacts/hovs-r2-density-v8
      PRODUCT_COMMIT: 416e9b9856a91d07609f980b5743a38c14237aff
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          mkdir -p "$OUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Immutable E2E
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/e2e.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sos-sf-hovs-r2-density-v8-${{ github.run_id }}
          path: artifacts/hovs-r2-density-v8
          if-no-files-found: warn
      - name: Disarm
        if: always()
        run: |
          set +e
          gh workflow disable hovs-r2-density-verify-v8.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-density-verify-v8.yml
          git commit -m "ci: disarm HOVS R2 density verifier v8"
          git push origin HEAD:arq/visual-dashboard-v3
