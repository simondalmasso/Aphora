name: All Sources 013 Workers First

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/all-sources-013-workers-first.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: false

env:
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  EVIDENCE_DIR: artifacts/all-sources-013
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
  SOS_SF_OPERATOR_EMAILS: ${{ secrets.SOS_SF_OPERATOR_EMAILS }}

jobs:
  workers-first:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Initialize evidence
        run: rm -rf "$EVIDENCE_DIR" && mkdir -p "$EVIDENCE_DIR"
      - name: Apply all-sources runtime correction
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('src/worker/providers/core.ts'); s=p.read_text()
          s=s.replace("'NETWORK' | null;", "'NETWORK' | 'OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE' | 'CREDENTIAL_REQUIRED' | null;")
          s=s.replace("  if (message.includes('CIRCUIT_OPEN')) return 'CIRCUIT_OPEN';", "  if (message.includes('CIRCUIT_OPEN')) return 'CIRCUIT_OPEN';\n  if (message.includes('OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE')) return 'OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE';\n  if (message.includes('CREDENTIAL_REQUIRED')) return 'CREDENTIAL_REQUIRED';")
          needle="export function restoreProviderHealth(entries: readonly ProviderHealth[]): void {\n  for (const entry of entries) {\n    if (!entry || typeof entry.id !== 'string') continue;\n    health.set(entry.id, Object.freeze({ ...entry }));\n  }\n}\n"
          add=needle+"export function publishProviderBlock(id: string, errorClass: Extract<ProviderErrorClass, 'OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE' | 'CREDENTIAL_REQUIRED'>): void {\n  health.set(id, Object.freeze({ id, status: 'UNAVAILABLE', lastSuccessAt: null, lastObservedAt: null, errorClass, circuitOpenUntil: null }));\n}\n"
          assert s.count(needle)==1; s=s.replace(needle,add)
          old="const result: ProviderResult<T> = { value: cached.value, status: 'FRESH', fetchedAt: cached.fetchedAt, observedAt: cached.observedAt, errorClass: null, fromCache: true };"
          new="const observationStatus: ProviderStatus = now.getTime() - Date.parse(cached.observedAt) <= freshMs ? 'FRESH' : 'STALE';\n    const result: ProviderResult<T> = { value: cached.value, status: observationStatus, fetchedAt: cached.fetchedAt, observedAt: cached.observedAt, errorClass: null, fromCache: true };"
          assert s.count(old)==1; s=s.replace(old,new)
          old="const result: ProviderResult<T> = { value: stored.value, status: 'FRESH', fetchedAt, observedAt: stored.observedAt, errorClass: null, fromCache: false };"
          new="const observationStatus: ProviderStatus = now.getTime() - Date.parse(stored.observedAt) <= freshMs ? 'FRESH' : 'STALE';\n    const result: ProviderResult<T> = { value: stored.value, status: observationStatus, fetchedAt, observedAt: stored.observedAt, errorClass: null, fromCache: false };"
          assert s.count(old)==1; s=s.replace(old,new); p.write_text(s)
          PY
          cat > src/worker/providers/ina.ts <<'TS'
          import type { RiverPoint } from '../../domain/snapshot';
          import { fetchProvider, type ProviderPolicy, type ProviderResult } from './core';
          const A5: ProviderPolicy=Object.freeze({id:'ina-a5',hosts:Object.freeze(['alerta.ina.gob.ar']),paths:Object.freeze([/^\/a5\/getObservaciones$/]),contentTypes:Object.freeze(['application/json']),maxBytes:1_500_000,freshMs:36*60*60_000,staleMs:365*24*60*60_000});
          const WML: ProviderPolicy=Object.freeze({id:'ina-waterml',hosts:Object.freeze(['alerta.ina.gob.ar']),paths:Object.freeze([/^\/a5\/obs\/puntual\/series\/\d+$/]),contentTypes:Object.freeze(['application/xml','text/xml']),maxBytes:1_500_000,freshMs:36*60*60_000,staleMs:365*24*60*60_000});
          function record(v:unknown):v is Record<string,unknown>{return typeof v==='object'&&v!==null&&!Array.isArray(v)}
          function quality(r:Record<string,unknown>):RiverPoint['quality']{const x=String(r.quality??r.calidad??r.qualifier??'').toLowerCase();return x.includes('valid')||x==='1'||x==='approved'?'PROVIDER_VALIDATED':'PUBLISHED_OPERATIONAL'}
          function rest(body:string,id:string):readonly RiverPoint[]{const a=JSON.parse(body) as unknown;if(!Array.isArray(a))throw Error('INA_PARSE');const n=Number(id),o:RiverPoint[]=[];for(const x of a){if(!record(x)||x.tipo!=='puntual'||Number(x.series_id)!==n||typeof x.valor!=='number'||typeof x.timestart!=='string'||!Number.isFinite(Date.parse(x.timestart)))throw Error('INA_PARSE');o.push(Object.freeze({at:new Date(x.timestart).toISOString(),metres:x.valor,measured:true,quality:quality(x)}))}return Object.freeze([...new Map(o.map(x=>[x.at,x])).values()].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).slice(-512))}
          function waterml(body:string):readonly RiverPoint[]{const o:RiverPoint[]=[];for(const m of body.matchAll(/<(?:\w+:)?MeasurementTVP\b[^>]*>[\s\S]*?<(?:\w+:)?time>([^<]+)<\/(?:\w+:)?time>[\s\S]*?<(?:\w+:)?value>([-+]?\d+(?:[.,]\d+)?)<\/(?:\w+:)?value>[\s\S]*?<\/(?:\w+:)?MeasurementTVP>/gi)){const at=m[1]!,metres=Number(m[2]!.replace(',','.'));if(Number.isFinite(Date.parse(at))&&Number.isFinite(metres))o.push(Object.freeze({at:new Date(at).toISOString(),metres,measured:true,quality:'PUBLISHED_OPERATIONAL'}))}if(!o.length)throw Error('INA_WATERML_PARSE');return Object.freeze(o.sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)).slice(-512))}
          export function fetchInaSeries(url:string,providerId:string,id:string):Promise<ProviderResult<readonly RiverPoint[]>>{return fetchProvider(url,{...A5,id:providerId},body=>{const value=rest(body,id),observedAt=value.at(-1)?.at;if(!observedAt)throw Error('INA_EMPTY');return{value,observedAt}})}
          export function fetchInaWaterMl(url:string,providerId:string):Promise<ProviderResult<readonly RiverPoint[]>>{return fetchProvider(url,{...WML,id:providerId},body=>{const value=waterml(body),observedAt=value.at(-1)?.at;if(!observedAt)throw Error('INA_WATERML_EMPTY');return{value,observedAt}})}
          TS
          cat > src/worker/providers/smn.ts <<'TS'
          import { fetchProvider,type ProviderPolicy,type ProviderResult } from './core';
          export interface SmnObservationSummary{readonly observedAt:string;readonly station:string|null;readonly precipitationMm:number|null}
          export interface SmnAlertSummary{readonly issuedAt:string;readonly title:string;readonly severity:string|null}
          const CAP:ProviderPolicy=Object.freeze({id:'smn-alerts',hosts:Object.freeze(['ssl.smn.gob.ar']),paths:Object.freeze([/^\/feeds\/CAP\/rss_alertaCAP_nuevo_\d{4}\.xml$/]),contentTypes:Object.freeze(['application/xml','text/xml','application/rss+xml']),maxBytes:1_500_000,freshMs:6*60*60_000,staleMs:48*60*60_000});
          const decode=(s:string)=>s.replace(/<!\[CDATA\[|\]\]>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
          export function fetchSmnAlerts(url:string):Promise<ProviderResult<readonly SmnAlertSummary[]>>{return fetchProvider(url,CAP,body=>{if(!/<rss\b|<feed\b/i.test(body))throw Error('SMN_CAP_PARSE');const out:SmnAlertSummary[]=[];for(const m of body.matchAll(/<item\b[\s\S]*?<\/item>/gi)){const x=m[0],t=x.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1],d=x.match(/<pubDate[^>]*>([\s\S]*?)<\/pubDate>/i)?.[1];if(t&&d&&Number.isFinite(Date.parse(decode(d))))out.push(Object.freeze({issuedAt:new Date(decode(d)).toISOString(),title:decode(t).slice(0,240),severity:null}))}const channel=body.match(/<lastBuildDate[^>]*>([\s\S]*?)<\/lastBuildDate>/i)?.[1];const observedAt=out.map(x=>x.issuedAt).sort().at(-1)??(channel&&Number.isFinite(Date.parse(decode(channel)))?new Date(decode(channel)).toISOString():new Date().toISOString());return{value:Object.freeze(out.slice(0,100)),observedAt}})}
          export function fetchSmnObservations(_url:string):Promise<ProviderResult<SmnObservationSummary>>{throw Error('SMN_OBSERVATIONS_CREDENTIAL_REQUIRED')}
          TS
          cat > src/worker/providers/nasa.ts <<'TS'
          import { fetchProvider,type ProviderPolicy,type ProviderResult } from './core';
          export interface NasaGpmReading{readonly observedAt:string;readonly value:number|null;readonly latencyMinutes:number;readonly resolution:string;readonly uncertainty:string}
          const POLICY:ProviderPolicy=Object.freeze({id:'nasa-gpm-imerg-early',hosts:Object.freeze(['gis.earthdata.nasa.gov']),paths:Object.freeze([/^\/image\/rest\/services\/GESDISC\/GPM_3IMERGHHE\/ImageServer\/identify$/]),contentTypes:Object.freeze(['application/json']),maxBytes:750_000,freshMs:8*60*60_000,staleMs:24*60*60_000});
          function stamp(v:unknown):string|null{if(typeof v==='number'&&v>1e12&&v<1e14)return new Date(v).toISOString();if(typeof v==='string'&&Number.isFinite(Date.parse(v)))return new Date(v).toISOString();if(Array.isArray(v)){for(const x of v){const r=stamp(x);if(r)return r}}if(typeof v==='object'&&v){const r=v as Record<string,unknown>;for(const k of ['StdTime','EndTime','StartTime','acquisitionDate','timestamp','time','date'])if(k in r){const x=stamp(r[k]);if(x)return x}for(const x of Object.values(r)){const y=stamp(x);if(y)return y}}return null}
          function number(v:unknown):number|null{if(typeof v==='number'&&Number.isFinite(v))return v;if(typeof v==='string'){const n=Number(v.replace(',','.'));if(Number.isFinite(n))return n}return null}
          export function fetchNasaGpm(url:string):Promise<ProviderResult<NasaGpmReading>>{return fetchProvider(url,POLICY,body=>{const p=JSON.parse(body) as Record<string,unknown>;if(p.error)throw Error('NASA_PARSE');const observedAt=stamp(p.properties??p.catalogItems??p);if(!observedAt)throw Error('NASA_TIME_PARSE');const value=number(p.value)??number((p.properties as Record<string,unknown>|undefined)?.PrecipitationCal);return{value:Object.freeze({observedAt,value,latencyMinutes:240,resolution:'0,1° / 30 minutos',uncertainty:'IMERG Early V07, estimación satelital temprana sin calibración concluyente; no reemplaza pluviómetros.'}),observedAt}})}
          TS
          python <<'PY'
          from pathlib import Path
          p=Path('src/worker/live-data.ts');s=p.read_text()
          s=s.replace("providerHealth, restoreProviderHealth, type ProviderHealth", "providerHealth, publishProviderBlock, restoreProviderHealth, type ProviderHealth")
          s=s.replace("const LIVE_DATA_CACHE_VERSION = 'a5-live-v2';", "const LIVE_DATA_CACHE_VERSION = 'all-sources-013-v1';\nconst SMN_CAP_URL = 'https://ssl.smn.gob.ar/feeds/CAP/rss_alertaCAP_nuevo_2026.xml';\nconst NASA_GPM_URL = 'https://gis.earthdata.nasa.gov/image/rest/services/GESDISC/GPM_3IMERGHHE/ImageServer/identify';")
          s=s.replace("now.getTime() - 72 * 3_600_000", "now.getTime() - 180 * 24 * 3_600_000")
          s=s.replace("    official: true, connected: Boolean(result.value), qualityNote: 'Formato verificado; la calidad hidrológica depende de la marca explícita del proveedor.',", "    official: true, connected: result.value !== null, url, qualityNote: 'WaterML 2.0 interpretado; la calidad hidrológica depende de la marca explícita del proveedor.',")
          s=s.replace("  const query = new URL('https://maps.disasters.nasa.gov/ags03/rest/services/NRT_Latest/GPM_NRT_30min_Latest/ImageServer/identify');", "  const query = new URL(NASA_GPM_URL);")
          s=s.replace("  query.searchParams.set('returnGeometry', 'false');", "  query.searchParams.set('returnGeometry', 'false');\n  query.searchParams.set('returnCatalogItems', 'true');\n  query.searchParams.set('mosaicRule', JSON.stringify({ mosaicMethod: 'esriMosaicAttribute', sortField: 'StdTime', ascending: false }));")
          old="  const stationPromise = Promise.all(STATIONS.map((station) => stationSystem(station, now)));\n  const optionalPromise = Promise.all([\n    waterMlSource(env.INA_WATERML_PARANA_URL, 'ina-waterml-parana', 'INA WaterOneFlow · Paraná'),\n    waterMlSource(env.INA_WATERML_SALADO_URL, 'ina-waterml-salado', 'INA WaterOneFlow · Salado'),\n    portsSource(env.PORTS_HYDROMETER_JSON_URL),\n    smnObservationSource(env.SMN_OBSERVATIONS_JSON_URL),\n    smnAlertSource(env.SMN_ALERTS_JSON_URL),\n    nasaSource(),\n  ]);"
          new="  publishProviderBlock('ports-hydrometers', 'OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE');\n  publishProviderBlock('smn-observations', 'CREDENTIAL_REQUIRED');\n  const from = new Date(now.getTime() - 180 * 24 * 3_600_000).toISOString().slice(0, 10);\n  const to = new Date(now.getTime() + 24 * 3_600_000).toISOString().slice(0, 10);\n  const waterMlUrl = (series: string) => `https://alerta.ina.gob.ar/a5/obs/puntual/series/${series}?timestart=${from}&timeend=${to}&format=waterml2`;\n  const stationPromise = Promise.all(STATIONS.map((station) => stationSystem(station, now)));\n  const optionalPromise = Promise.all([\n    waterMlSource(waterMlUrl('30'), 'ina-waterml-parana', 'INA WaterML 2.0 · Paraná'),\n    waterMlSource(waterMlUrl('3044'), 'ina-waterml-salado', 'INA WaterML 2.0 · Salado'),\n    portsSource(undefined),\n    smnObservationSource(undefined),\n    smnAlertSource(SMN_CAP_URL),\n    nasaSource(),\n  ]);"
          assert s.count(old)==1;s=s.replace(old,new)
          s=s.replace("if (!url) return unavailableSource('ports-hydrometers', 'Agencia Nacional de Puertos y Navegación', 'OFFICIAL_OBSERVATION', 'No se encontró un endpoint machine-readable estable configurado.');", "if (!url) return Object.freeze({ ...unavailableSource('ports-hydrometers', 'Agencia Nacional de Puertos y Navegación', 'OFFICIAL_OBSERVATION', 'OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE: la página oficial sólo publica enlaces HTML/HTTP por estación y no un endpoint estable legible por máquina.'), url: 'https://www.argentina.gob.ar/economia/agencia-nacional-de-puertos-y-navegacion/navegacion/navegable-troncal/hidrometros' });")
          s=s.replace("if (!url) return unavailableSource('smn-observations', 'Servicio Meteorológico Nacional · observaciones', 'OFFICIAL_OBSERVATION', 'Endpoint de observaciones no configurado.');", "if (!url) return Object.freeze({ ...unavailableSource('smn-observations', 'Servicio Meteorológico Nacional · observaciones', 'OFFICIAL_OBSERVATION', 'CREDENTIAL_REQUIRED: la API oficial ws1 requiere JWT no provisto como endpoint público estable; no se extrae token desde HTML.'), url: 'https://ws2.smn.gob.ar/observaciones' });")
          s=s.replace("official: true, connected: Boolean(result.value),", "official: true, connected: result.value !== null, url,",1)
          p.write_text(s)
          PY
          git diff -- src/worker > "$EVIDENCE_DIR/runtime.patch"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run build
      - run: npm run test:worker
      - name: Prepare bounded Cloudflare configuration
        run: node scripts/provision-cloudflare.mjs
      - run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc 2>&1 | tee "$EVIDENCE_DIR/wrangler-dry-run.log"
      - name: Deploy Worker first
        run: npx wrangler deploy --config wrangler.generated.jsonc 2>&1 | tee "$EVIDENCE_DIR/wrangler-deploy.log"
      - name: Verify per-source production matrix twice
        run: |
          node <<'NODE'
          const fs=require('node:fs');const base=process.env.DEPLOYMENT_URL;
          async function read(path){const r=await fetch(`${base}${path}?all013=${Date.now()}-${Math.random()}`,{cache:'no-store',headers:{'Cache-Control':'no-store'},signal:AbortSignal.timeout(30000)});const text=await r.text();if(!r.ok)throw Error(`${path}:${r.status}`);return JSON.parse(text).data}
          (async()=>{const rounds=[];for(let i=0;i<2;i++){const health=await read('/api/health'),sources=await read('/api/sources'),snapshot=await read('/api/snapshot');rounds.push({health,sources,snapshot});await new Promise(r=>setTimeout(r,1500))}const h=rounds[1].health.providers,s=rounds[1].sources.sources;
          const connected=['ina-rest-30','ina-rest-3044','ina-waterml-parana','ina-waterml-salado','smn-alerts','nasa-gpm-imerg-early'];for(const id of connected){const hp=h.find(x=>x.id===id),sp=s.find(x=>x.id===(id==='ina-rest-30'?'ina:30':id==='ina-rest-3044'?'ina:3044':id));if(!hp||hp.errorClass!==null||hp.circuitOpenUntil!==null)throw Error(`health:${id}:${JSON.stringify(hp)}`);if(!sp||sp.connected!==true)throw Error(`source:${id}:${JSON.stringify(sp)}`)}
          for(const [id,error] of [['ports-hydrometers','OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE'],['smn-observations','CREDENTIAL_REQUIRED']]){const hp=h.find(x=>x.id===id),sp=s.find(x=>x.id===id);if(hp?.errorClass!==error||sp?.connected!==false)throw Error(`block:${id}`)}
          const systems=rounds[1].snapshot.systems;if(!systems.find(x=>x.id==='parana-santa-fe'&&x.available)||!systems.find(x=>x.id==='salado-santo-tome'&&x.available))throw Error('systems');fs.writeFileSync(`${process.env.EVIDENCE_DIR}/production-matrix.json`,JSON.stringify(rounds,null,2));console.log(JSON.stringify({status:'PASS',providers:h,sources:s.map(x=>({id:x.id,status:x.status,connected:x.connected,observedAt:x.observedAt,url:x.url,contribution:x.contribution}))},null,2))})().catch(e=>{console.error(e);process.exit(1)})
          NODE
      - name: Synchronize exact verified source to GitHub second
        run: |
          git config user.name 'SOS-SF ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worker/providers/core.ts src/worker/providers/ina.ts src/worker/providers/smn.ts src/worker/providers/nasa.ts src/worker/live-data.ts
          git commit -m 'feat: connect and classify all official source families 013'
          printf 'all-sources-013-terminal-%s\n' "$(date -u +%Y%m%dT%H%M%SZ)" > .github/arq-v3-deploy-trigger
          git add .github/arq-v3-deploy-trigger
          git commit -m 'ci: run terminal all-sources 013 pipeline'
          git push origin HEAD:arq/visual-dashboard-v3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-sources-013-workers-first-${{ github.run_id }}
          path: artifacts/all-sources-013
          if-no-files-found: warn
          retention-days: 30
