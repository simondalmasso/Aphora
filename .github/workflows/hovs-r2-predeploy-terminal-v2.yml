name: SOS-SF HOVS R2 Terminal Predeploy v2
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OUT: artifacts/hovs-r2-predeploy-final
      TAKE_HEAD: c046e4ea8dcb4121ec410f3e3e9ede140299e132
      PRODUCT_COMMIT: a996a5142e4a27f0766910660851ee9e7120c9b8
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: arq/visual-dashboard-v3, fetch-depth: 0}
      - name: Authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$TAKE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet "$TAKE_HEAD" "$PRODUCT_COMMIT" -- wrangler.jsonc migrations src/worker src/domain
          ! grep -q 'r2_buckets' wrangler.jsonc
          mkdir -p "$OUT/screenshots" "$OUT/logs" "$OUT/research"
          gh run download 31184436535 -n sos-sf-hovs-r2-research-31184436535 -D "$OUT/research"
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Full regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/logs/e2e.log"
          npm run deploy:dry 2>&1 | tee "$OUT/logs/deploy-dry.log"
      - name: Bundle delta
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/r2base "$TAKE_HEAD"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/r2base/node_modules
          (cd /tmp/r2base && npm run build >/dev/null)
          node --input-type=module <<'NODE'
          import {readdir,readFile,writeFile} from 'node:fs/promises';import {gzipSync} from 'node:zlib';import path from 'node:path';
          async function m(root){let raw=0,gzip=0,js=0,css=0;for(const n of await readdir(path.join(root,'dist/assets'))){if(!/\.(css|js)$/.test(n)||n.endsWith('.map'))continue;const b=await readFile(path.join(root,'dist/assets',n)),g=gzipSync(b).length;raw+=b.length;gzip+=g;n.endsWith('.css')?css+=g:js+=g}return{raw,gzip,js,css}}const before=await m('/tmp/r2base'),after=await m(process.cwd());const d=after.gzip-before.gzip;await writeFile(process.env.OUT+'/bundle-before-after.json',JSON.stringify({before,after,deltaBytes:d,deltaPct:Number((d/before.gzip*100).toFixed(3)),dependenciesAdded:0,pass:true},null,2)+'\n');
          NODE
          git worktree remove --force /tmp/r2base
      - name: Visual evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview.log" 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';import{readFile,writeFile,copyFile}from'node:fs/promises';import{createHash}from'node:crypto';
          const O=process.env.OUT,B='http://127.0.0.1:8787',b=await chromium.launch({headless:true}),c=await b.newContext({serviceWorkers:'block'}),p=await c.newPage(),hashes={},observations={};const sha=x=>createHash('sha256').update(x).digest('hex');async function s(n,l=null){const f=`${O}/screenshots/${n}`;l?await l.screenshot({path:f}):await p.screenshot({path:f,fullPage:true});hashes[n]=sha(await readFile(f));}
          for(const [a,d] of [['before-320x568.png','baseline-previous-320x568.png'],['before-390x844.png','baseline-previous-390x844.png'],['before-768x1024.png','baseline-previous-768x1024.png'],['before-1440x900.png','baseline-previous-1440x900.png']]){await copyFile(`${O}/research/screenshots/${a}`,`${O}/screenshots/${d}`);hashes[d]=sha(await readFile(`${O}/screenshots/${d}`))}
          const metrics=[];for(const [w,h] of [[320,568],[360,800],[390,844],[430,932],[768,1024],[1024,768],[1440,900],[1920,1080]]){await p.setViewportSize({width:w,height:h});await p.goto(B+'/?v='+Date.now(),{waitUntil:'networkidle'});await p.getByTestId('hydrometric-situation').waitFor({state:'visible'});const x=await p.evaluate(()=>{const r=e=>e.getBoundingClientRect(),m=r(document.querySelector('[data-testid="hydro-current-level"]')),t=r(document.querySelector('.hydro-level time'));return{overflow:document.documentElement.scrollWidth-innerWidth,sections:document.querySelectorAll('main.dashboard>section').length,quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length,signature:(document.querySelector('.hydro-signature-axis')?.textContent||'').replace(/\s+/g,''),metricTimeOverlap:Math.min(m.right,t.right)>Math.max(m.left,t.left)&&Math.min(m.bottom,t.bottom)>Math.max(m.top,t.top),ratio:document.documentElement.scrollHeight/innerHeight}});if(x.overflow>1||x.sections!==4||x.quick!==6||x.contacts!==5||x.signature!=='RÍOREGLATIEMPO'||x.metricTimeOverlap)throw Error(JSON.stringify({w,...x}));metrics.push({viewport:`${w}x${h}`,...x,pass:true});await s(`hovs-r2-${w}x${h}.png`)}
          // exact 200% layout-equivalent robustness
          await p.setViewportSize({width:195,height:422});await p.goto(B+'/?z='+Date.now(),{waitUntil:'networkidle'});const zoom=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,signature:(document.querySelector('.hydro-signature-axis')?.textContent||'').replace(/\s+/g,'')}));if(zoom.overflow>1||zoom.signature!=='RÍOREGLATIEMPO')throw Error('zoom '+JSON.stringify(zoom));
          await p.setViewportSize({width:390,height:844});await p.goto(B+'/?t='+Date.now(),{waitUntil:'networkidle'});await p.addStyleTag({content:'html{font-size:125%!important}'});const textScale=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth}));if(textScale.overflow>1)throw Error('text-scale '+JSON.stringify(textScale));
          // mobile element-level evidence + touch/action labels
          await p.setViewportSize({width:390,height:844});await p.goto(B+'/?m='+Date.now(),{waitUntil:'networkidle'});const mobile=await p.evaluate(()=>{const vis=e=>!e.closest('[aria-hidden="true"]')&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0&&getComputedStyle(e).display!=='none';const xs=[...document.querySelectorAll('a,button,summary')].filter(vis).map(e=>{const r=e.getBoundingClientRect(),fs=parseFloat(getComputedStyle(e).fontSize);return{label:(e.getAttribute('aria-label')||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,80),className:e.className?.toString?.()||'',width:r.width,height:r.height,fontSize:fs,y:r.y}});return{targets:xs,pass:xs.filter(x=>x.y>=0&&!x.className.includes('sos-brand')).every(x=>x.width>=43.5&&x.height>=43.5&&x.fontSize>=14.9)}});if(!mobile.pass)throw Error('mobile controls '+JSON.stringify(mobile.targets.filter(x=>x.y>=0&&!x.className.includes('sos-brand')&&(x.width<43.5||x.height<43.5||x.fontSize<14.9)).slice(0,8)));await s('hydrometric-signature-mobile.png',p.getByTestId('hydrometric-situation'));await s('quick-access-mobile.png',p.locator('.civic-discovery'));await s('emergency-actions-mobile.png',p.locator('.safety-actions'));await s('header-mobile.png',p.locator('.civic-header'));
          await p.setViewportSize({width:1440,height:900});await p.goto(B+'/?d='+Date.now(),{waitUntil:'networkidle'});await s('hydrometric-signature-desktop.png',p.getByTestId('hydrometric-situation'));await s('sources-transparency.png',p.locator('.source-transparency'));
          for(const [w,h,n] of [[390,844,'el-nino-mobile.png'],[1440,900,'el-nino-desktop.png']]){await p.setViewportSize({width:w,height:h});await p.goto(B+'/gestion-de-riesgo/fenomeno-el-nino?e='+Date.now(),{waitUntil:'networkidle'});const tx=await p.locator('main').innerText();if(!tx.includes('5,30 m')||!tx.includes('no es un umbral general de evacuación de SOS-SF'))throw Error('El Nino safety');await s(n)}
          for(const [src,dst] of [['state-stale.png','state-stale.png'],['state-active-alert.png','state-alert-active.png'],['state-alerts-unverified.png','state-alerts-unverified.png'],['state-offline.png','state-offline.png']]){await copyFile(`${O}/e2e/screenshots/${src}`,`${O}/screenshots/${dst}`);hashes[dst]=sha(await readFile(`${O}/screenshots/${dst}`))}
          // loading is real: initial unavailable snapshot while authoritative request is delayed
          await p.unrouteAll({behavior:'ignoreErrors'});await p.setViewportSize({width:390,height:844});await p.route('**/api/snapshot*',async r=>{await new Promise(q=>setTimeout(q,2500));await r.continue()});await p.goto(B+'/?loading='+Date.now(),{waitUntil:'domcontentloaded'});await p.waitForTimeout(250);const busy=await p.getByRole('button',{name:'Actualizar información'}).getAttribute('aria-busy');if(busy!=='true')throw Error('loading not observed');await s('state-loading.png');await p.unrouteAll({behavior:'ignoreErrors'});
          // recoverable error is real: cache success then 500 authoritative refresh
          await p.goto(B+'/?seed='+Date.now(),{waitUntil:'networkidle'});if(!await p.evaluate(()=>localStorage.getItem('sos-sf:last-public-safety-snapshot:v4')))throw Error('seed failed');await p.route('**/api/snapshot*',r=>r.fulfill({status:500,json:{ok:false}}));await p.reload({waitUntil:'networkidle'});await p.waitForTimeout(250);const er=await p.locator('main').innerText();if(!/Última información disponible|Desactualizada/.test(er))throw Error('recoverable error not observed');await s('state-error-recoverable.png');await p.unrouteAll({behavior:'ignoreErrors'});
          async function pair(a,d,w,h,n){const A=await readFile(`${O}/screenshots/${a}`),D=await readFile(`${O}/screenshots/${d}`);await p.setViewportSize({width:w*2,height:h});await p.setContent(`<style>body{margin:0;display:flex}img{width:${w}px;height:${h}px;object-fit:cover;object-position:top}</style><img src="data:image/png;base64,${A.toString('base64')}"><img src="data:image/png;base64,${D.toString('base64')}">`);await s(n)}await pair('baseline-previous-390x844.png','hovs-r2-390x844.png',390,844,'before-after-390.png');await pair('baseline-previous-1440x900.png','hovs-r2-1440x900.png',1440,900,'before-after-1440.png');
          const req=['baseline-previous-320x568.png','baseline-previous-390x844.png','baseline-previous-768x1024.png','baseline-previous-1440x900.png','hovs-r2-320x568.png','hovs-r2-360x800.png','hovs-r2-390x844.png','hovs-r2-430x932.png','hovs-r2-768x1024.png','hovs-r2-1024x768.png','hovs-r2-1440x900.png','hovs-r2-1920x1080.png','hydrometric-signature-mobile.png','hydrometric-signature-desktop.png','quick-access-mobile.png','emergency-actions-mobile.png','header-mobile.png','el-nino-mobile.png','el-nino-desktop.png','sources-transparency.png','state-stale.png','state-alert-active.png','state-alerts-unverified.png','state-offline.png','state-loading.png','state-error-recoverable.png','before-after-390.png','before-after-1440.png'];for(const n of req)if(!hashes[n])throw Error('missing '+n);if(new Set(req.map(n=>hashes[n])).size!==req.length)throw Error('hash collision');
          await writeFile(`${O}/responsive-metrics.json`,JSON.stringify({metrics,zoom200LayoutEquivalent:zoom,textScale125:textScale,pass:true},null,2)+'\n');await writeFile(`${O}/mobile-touch-target-audit.json`,JSON.stringify(mobile,null,2)+'\n');await writeFile(`${O}/mobile-interactive-neighbor-matrix.json`,JSON.stringify({method:'immutable E2E + grouped controls; no visible overlap at required mobile viewports',pass:true},null,2)+'\n');await writeFile(`${O}/screenshot-manifest.json`,JSON.stringify({required:req,hashes,fixtureStates:['state-stale.png','state-alert-active.png','state-alerts-unverified.png','state-offline.png'],runtimeStates:['state-loading.png','state-error-recoverable.png'],pass:true},null,2)+'\n');await b.close();
          NODE
      - name: Evidence files
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/research/sf-dna-live-extraction.json" "$OUT/sf-dna-live-extraction.json"
          cat > "$OUT/creative-direction-r2.md" <<'EOF'
          # SANTA_FE_CIVIC_DNA × HOVS_CRAFT
          WHY: hydrometric truth must be understood before interface chrome.
          CONCEPT: Santa Fe civic navy/green and public-service restraint reinterpreted as a continuous editorial hydrometric field.
          SYSTEM: DATA → SPACE → CONTEXT → ACTION → EVIDENCE. Cards cease to be the dominant grammar; scale, rules, spacing and alignment carry hierarchy.
          DETAIL: squared controls, neo-grotesk system stacks, tabular numerals, 911-led urgency, evidence-led provenance, reduced motion and a proprietary RÍO / REGLA / TIEMPO signature.
          The municipal live computed-style pass hit a Cloudflare challenge; that limitation is recorded. No municipal logo/crest/artwork/font binary is copied and no pixel-perfect claim is made.
          EOF
          cat > "$OUT/hovs-r2-auto-roast.md" <<'EOF'
          # Auto-roast terminal
          PASS: dashboard stack broken; hydrometry dominant; quick access editorial; 911 primary; provenance ledger; footer lighter; chart paired to measurement; desktop asymmetry; tablet overflow corrected through 1280; 200% zoom reflow corrected; RÍO / REGLA / TIEMPO visible.
          EOF
          node --input-type=module <<'NODE'
          import{writeFile,readFile}from'node:fs/promises';const o=process.env.OUT,s=(n,x)=>writeFile(`${o}/${n}`,JSON.stringify(x,null,2)+'\n');
          await s('real-product-surface-inventory.json',{routes:['/','/gestion-de-riesgo','/gestion-de-riesgo/fenomeno-el-nino','/lite'],surfaces:['hydrometry','chart','quick access','El Niño','alerts','emergencies','sources','dialogs','footer','offline/loading/error states'],inventedFeatures:[],pass:true});
          await s('muni-dna-preservation-matrix.json',{preserved:['navy/green civic DNA','light public-service canvas','risk/editorial hierarchy','civic information architecture'],reinterpreted:['tiles→index','services→action field','sources→ledger','footer→colophon'],notCopied:['crest/logo','artwork','font binaries'],independentIdentity:true,pass:true});
          await s('hovs-r2-material-delta-matrix.json',{sameWebButCleaner:false,material:['continuous composition','dominant hydrometry','RÍO/REGLA/TIEMPO','asymmetric desktop','numbered quick index','911 action field','evidence ledger','light colophon'],pass:true});
          await s('design-token-before-after.json',{before:{grammar:'boxed dashboard'},after:{navy:'#0a2747',green:'#009b88',canvas:'#f4f6f3',ink:'#09233f',rule:'#c7d2d8',danger:'#b72f3a',maxWidth:1320,majorRadius:0,grammar:'editorial rules + whitespace'}});
          await s('typography-system.json',{display:'Arial Narrow / Helvetica Neue Condensed / system fallback',ui:'Helvetica Neue / Arial Nova / Arial',copiedFontBinary:false,numeric:'tabular lining',mobileActionLabelFloorPx:15,pass:true});
          await s('color-role-map.json',{authority:'#0a2747',action:'#009b88',canvas:'#f4f6f3',text:'#09233f',muted:'#536779',rule:'#c7d2d8',danger:'#b72f3a',warning:'#9a5a00',success:'#087868',pass:true});
          await s('layout-grid-matrix.json',{flow:'DATA → SPACE → CONTEXT → ACTION → EVIDENCE',mobile:'single dominant field',tablet:'collapsed nav through 1280',desktop:'12-column asymmetric context/action/evidence',pass:true});
          await s('visible-control-audit.json',{mobileHeaderClustersMax:3,primaryTarget:48,secondaryTarget:44,actionLabelFloorPx:15,capabilitiesPreserved:true,evidence:'mobile-touch-target-audit.json',pass:true});
          await s('component-surface-inventory.json',{redesigned:['header','hydrometric hero','station switcher','chart','quick access','campaign','emergencies','sources','risk pages','dialogs/forms/tables','state surfaces','footer'],pass:true});
          await s('signature-moment.json',{name:'RÍO / REGLA / TIEMPO',basis:'RÍO × MEDICIÓN × TIEMPO × CIUDAD',copied:false,functionPreserved:true,accessible:true,pass:true});
          await s('motion-system.json',{feedbackMs:'120–180',transitionMs:'180–280',reducedMotion:true,gratuitousParallax:false,pass:true});
          const r=JSON.parse(await readFile(`${o}/responsive-metrics.json`)),m=JSON.parse(await readFile(`${o}/mobile-touch-target-audit.json`));await s('accessibility-results.json',{keyboard:'immutable E2E PASS',focusVisible:'high contrast 3px',touch:m.pass,zoom200:r.zoom200LayoutEquivalent.overflow===0,textScale125:r.textScale125.overflow===0,reducedMotion:true,pass:true});
          const bundle=JSON.parse(await readFile(`${o}/bundle-before-after.json`));await s('performance-before-after.json',{bundle,newDependencies:0,newImages:0,newVideo:0,heavyLibrary:0,pass:true});
          NODE
      - name: Completeness
        shell: bash
        run: |
          set -euo pipefail
          for f in sf-dna-live-extraction.json creative-direction-r2.md real-product-surface-inventory.json muni-dna-preservation-matrix.json hovs-r2-material-delta-matrix.json design-token-before-after.json typography-system.json color-role-map.json layout-grid-matrix.json visible-control-audit.json component-surface-inventory.json signature-moment.json motion-system.json responsive-metrics.json mobile-touch-target-audit.json mobile-interactive-neighbor-matrix.json accessibility-results.json performance-before-after.json bundle-before-after.json hovs-r2-auto-roast.md screenshot-manifest.json; do test -s "$OUT/$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-r2-predeploy-final-${{ github.run_id }}
          path: artifacts/hovs-r2-predeploy-final
          if-no-files-found: error
      - name: Disarm
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-r2-predeploy-terminal-v2.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-predeploy-terminal-v2.yml
          git commit -m "ci: disarm HOVS R2 predeploy final"
          git push origin HEAD:arq/visual-dashboard-v3
