name: SOS-SF Owner Final Corrective 003 Postdeploy Readonly

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/owner-final-corrective-003-postdeploy-readonly.yml]

permissions:
  contents: write
  actions: write

env:
  PRODUCT_COMMIT: a772393883460f64fd5ff7bdcf5d1bdcbf1639f2
  DEPLOY_RUN: '31218580363'
  DEPLOYMENT_VERSION_ID: a381ef25-7ae4-4913-80a5-87715661b040
  MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
  PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev
  OUT: artifacts/owner-final-corrective-003-readonly

jobs:
  postdeploy-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Read-only authority gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main arq/visual-dashboard-v3
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          test ! -e .github/workflows/owner-final-corrective-003-v6.yml
          mkdir -p "$OUT/logs" "$OUT/screenshots"
          printf '%s\n' '0' > "$OUT/new-deploy-command-count.txt"
          printf '%s\n' "$DEPLOY_RUN" > "$OUT/deploy-run.txt"
          printf '%s\n' "$DEPLOYMENT_VERSION_ID" > "$OUT/deployment-version-id.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build exact deployed source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build 2>&1 | tee "$OUT/logs/build.log"

      - name: Read-only production verification
        env:
          VERSION_ID: ${{ env.DEPLOYMENT_VERSION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-owner-final-corrective-003.mjs')
          s=p.read_text()
          old="if (await tab.count()) await tab.click();"
          new="if (await tab.count()) await tab.evaluate((element) => element.click());"
          if old not in s: raise SystemExit('verifier tab-click patch target missing')
          s=s.replace(old,new,1)
          old2="await verifyApiUi(label);"
          new2="const closeMenu = page.getByRole('button', { name: 'Cerrar menú' });\n  if (await closeMenu.count() && await closeMenu.isVisible()) await closeMenu.click();\n  await verifyApiUi(label);"
          if old2 not in s: raise SystemExit('verifier menu-close patch target missing')
          p.write_text(s.replace(old2,new2,1))
          PY
          PRODUCT_COMMIT="$PRODUCT_COMMIT" VERSION_ID="$DEPLOYMENT_VERSION_ID" OUT="$OUT" PRODUCTION_URL="$PRODUCTION_URL" node scripts/verify-owner-final-corrective-003.mjs 2>&1 | tee "$OUT/logs/postdeploy-readonly.log"

      - name: Assert terminal summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const p=process.env.OUT+'/terminal-summary.json';
          const x=JSON.parse(await readFile(p,'utf8'));
          const gates={
            messagingSurfaceRestored:x.messagingSurfaceRestored===true,
            publicCommunicationsMobile:x.publicCommunicationsMobile===true,
            publicCommunicationsDesktop:x.publicCommunicationsDesktop===true,
            privateMessagingContractPreserved:x.privateMessagingContractPreserved===true,
            h1:x.h1==='Pulso hídrico de Santa Fe',
            oldH1Absent:x.oldH1Absent===true,
            leftInset:x.leftInsetPass===true,
            edgeCollision:x.edgeCollisionCount===0,
            textBorderTouch:x.textBorderTouchCount===0,
            zoom200:x.zoom200H1===true,
            apiUiConsistency:x.apiUiConsistency===true,
            inaTruth:x.inaTruth===true,
            elNino:x.elNinoPreserved===true,
            horizontalOverflow:Number(x.horizontalOverflow)<=1,
            assetIdentity:Array.isArray(x.assetIdentity)&&x.assetIdentity.every(r=>r.pass===true),
          };
          const pass=Object.values(gates).every(Boolean);
          await writeFile(process.env.OUT+'/final-gates.json',JSON.stringify({pass,gates,deployRun:process.env.DEPLOY_RUN,deploymentVersionId:process.env.DEPLOYMENT_VERSION_ID,newDeployCommandCount:0},null,2)+'\n');
          if(!pass) throw new Error('terminal read-only gate failed '+JSON.stringify(gates));
          NODE

      - name: Confirm main remains immutable
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"

      - name: Upload terminal read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-owner-final-corrective-003-readonly-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90

      - name: Terminally disarm read-only verifier
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh workflow disable owner-final-corrective-003-postdeploy-readonly.yml
          git checkout -- scripts/verify-owner-final-corrective-003.mjs
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/owner-final-corrective-003-postdeploy-readonly.yml
          git commit -m "ci: terminally disarm owner corrective 003 readonly verifier"
          git push origin HEAD:arq/visual-dashboard-v3
