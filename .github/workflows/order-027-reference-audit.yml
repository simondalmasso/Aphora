name: order-027-reference-audit
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/order-027-reference-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect Bolt reference and production
        env:
          BOLT: https://sos-sf-river-intelli-pmf3.bolt.host/
          PROD: https://sos-sf.simondalmasso44.workers.dev/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          for (const [label, url] of [['BOLT', process.env.BOLT], ['PROD', process.env.PROD]]) {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
            console.log(`${label}_HTTP=${response?.status()}`);
            console.log(`${label}_TITLE=${await page.title()}`);
            const report = await page.evaluate(() => {
              const body = document.body;
              const text = (body.innerText || '').replace(/\s+/g, ' ').trim();
              const buttons = [...document.querySelectorAll('button')].slice(0,20).map(x => (x.textContent || x.getAttribute('aria-label') || '').trim()).filter(Boolean);
              const svgs = document.querySelectorAll('svg').length;
              const canvases = document.querySelectorAll('canvas').length;
              const fixed = [...document.querySelectorAll('*')].filter(el => getComputedStyle(el).position === 'fixed').length;
              const first = [...body.children].slice(0,8).map(el => ({ tag: el.tagName, cls: el.className, text: (el.textContent || '').replace(/\s+/g,' ').trim().slice(0,180) }));
              return { text: text.slice(0,1800), buttons, svgs, canvases, fixed, first, scrollHeight: document.documentElement.scrollHeight, overflow: document.documentElement.scrollWidth-innerWidth };
            });
            console.log(`${label}_REPORT=${JSON.stringify(report)}`);
            await page.close();
          }
          await browser.close();
          NODE