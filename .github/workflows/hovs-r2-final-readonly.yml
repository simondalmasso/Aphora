name: SOS-SF HOVS R2 Final Readonly Closure
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OUT: artifacts/hovs-r2-final
      PRODUCT_COMMIT: a996a5142e4a27f0766910660851ee9e7120c9b8
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      EXPECTED_VERSION: 5fcae842-fb00-4e52-9c12-7b573d3e28cd
      DEPLOY_RUN_ID: '31191133835'
      PREDEPLOY_RUN_ID: '31190652149'
      PREDEPLOY_ARTIFACT_ID: '8998748263'
      PREDEPLOY_ARTIFACT_SHA256: f83165caf1744dfcbf936704ef1c259d16cae5326e2ee9e1c295394ea3176391
      PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Read-only authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet c046e4ea8dcb4121ec410f3e3e9ede140299e132 "$PRODUCT_COMMIT" -- wrangler.jsonc migrations src/worker src/domain
          ! grep -q 'r2_buckets' wrangler.jsonc
          mkdir -p "$OUT/predeploy" "$OUT/screenshots" "$OUT/logs"
          gh run download "$PREDEPLOY_RUN_ID" -n "sos-sf-hovs-r2-predeploy-final-$PREDEPLOY_RUN_ID" -D "$OUT/predeploy"
          cp -a "$OUT/predeploy/." "$OUT/"
          rm -rf "$OUT/predeploy"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild immutable product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build 2>&1 | tee "$OUT/logs/final-build.log"
          npm run deploy:dry 2>&1 | tee "$OUT/logs/final-deploy-dry.log"
          sha256sum dist/assets/*.js dist/assets/*.css > "$OUT/local-assets-final-sha256.txt"
      - name: Read-only Cloudflare deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --json > "$OUT/cloudflare-deployments.json"
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const rows=JSON.parse(await readFile(process.env.OUT+'/cloudflare-deployments.json','utf8'));
          const latest=[...rows].sort((a,b)=>Date.parse(a.created_on??a.createdAt??0)-Date.parse(b.created_on??b.createdAt??0)).at(-1);
          const versions=latest?.versions??[];const hit=versions.find(v=>v.version_id===process.env.EXPECTED_VERSION);
          if(!hit||Number(hit.percentage)!==100)throw Error('deployed version not current '+JSON.stringify(latest));
          await writeFile(process.env.OUT+'/deployment-provenance.json',JSON.stringify({deployRunId:Number(process.env.DEPLOY_RUN_ID),expectedVersion:process.env.EXPECTED_VERSION,latestDeploymentId:latest.id??null,latestCreatedOn:latest.created_on??latest.createdAt??null,latestVersions:versions,deployCommandCount:1,postdeployRedeployCount:0,readOnlyVerification:true,pass:true},null,2)+'\n');
          NODE
      - name: Production black-box, API/UI parity, security and bytes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';import{readdir,readFile,writeFile}from'node:fs/promises';import{createHash}from'node:crypto';
          const O=process.env.OUT,B=process.env.PRODUCTION_URL,H=x=>createHash('sha256').update(x).digest('hex');
          const assetIdentity=[];for(const n of (await readdir('dist/assets')).filter(n=>/\.(js|css)$/.test(n)&&!n.endsWith('.map'))){const local=await readFile('dist/assets/'+n),r=await fetch(`${B}/assets/${n}?final=${Date.now()}`,{headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw Error(`asset ${n} ${r.status}`);const remote=Buffer.from(await r.arrayBuffer()),a=H(local),b=H(remote);if(a!==b)throw Error(`byte mismatch ${n}`);assetIdentity.push({path:'/assets/'+n,localSha256:a,remoteSha256:b,bytes:remote.length,pass:true})}
          async function j(path){const r=await fetch(B+path+(path.includes('?')?'&':'?')+'final='+Date.now(),{headers:{Accept:'application/json','Cache-Control':'no-cache'}});if(!r.ok)throw Error(path+' '+r.status);return r.json()}
          const health=await j('/api/health'),se=await j('/api/snapshot'),so=await j('/api/sources'),prov=await j('/source-provenance.json');const snapshot=se.data??se,sources=so.data?.sources??so.sources??snapshot.sources??[],systems=snapshot.systems??[];const parana=systems.find(x=>x.id==='parana-santa-fe'),salado=systems.find(x=>x.id==='salado-santo-tome');if(!parana?.available||!Number.isFinite(parana.currentMetres)||!salado?.available||!Number.isFinite(salado.currentMetres))throw Error('hydrometry unavailable');const ina=sources.some(x=>String(x.organizationName??x.name??'').includes('Instituto Nacional del Agua'));if(!ina)throw Error('INA absent');
          const homeRes=await fetch(B+'/?headers='+Date.now(),{headers:{'Cache-Control':'no-cache'}});const securityHeaders=Object.fromEntries(['content-security-policy','x-content-type-options','referrer-policy','permissions-policy','x-frame-options'].map(k=>[k,homeRes.headers.get(k)]));if(!securityHeaders['content-security-policy']||securityHeaders['x-content-type-options']!=='nosniff')throw Error('security headers missing '+JSON.stringify(securityHeaders));
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({serviceWorkers:'block'});const p=await ctx.newPage(),views=[];
          for(const [w,h] of [[320,568],[360,800],[390,844],[430,932],[768,1024],[1024,768],[1440,900],[1920,1080]]){await p.setViewportSize({width:w,height:h});await p.goto(`${B}/?final=${Date.now()}`,{waitUntil:'networkidle',timeout:60000});await p.getByTestId('hydrometric-situation').waitFor({state:'visible'});const x=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,sections:document.querySelectorAll('main.dashboard>section').length,signature:(document.querySelector('.hydro-signature-axis')?.textContent||'').replace(/\s+/g,''),quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length}));if(x.overflow>1||x.sections!==4||x.signature!=='RÍOREGLATIEMPO'||x.quick!==6||x.contacts!==5)throw Error(`production viewport ${w} ${JSON.stringify(x)}`);const f=`${O}/screenshots/production-home-${w}x${h}.png`;await p.screenshot({path:f,fullPage:true});views.push({viewport:`${w}x${h}`,sha256:H(await readFile(f)),...x})}
          await p.setViewportSize({width:390,height:844});await p.goto(`${B}/?parity=${Date.now()}`,{waitUntil:'networkidle'});const pText=await p.getByTestId('hydro-current-level').innerText();if(!pText.includes(parana.currentMetres.toFixed(2).replace('.',',')))throw Error('Parana parity');await p.getByRole('tab',{name:'Salado'}).click();const sText=await p.getByTestId('hydro-current-level').innerText();if(!sText.includes(salado.currentMetres.toFixed(2).replace('.',',')))throw Error('Salado parity');
          for(const [w,h,n] of [[390,844,'production-el-nino-390x844.png'],[1440,900,'production-el-nino-1440x900.png']]){await p.setViewportSize({width:w,height:h});await p.goto(`${B}/gestion-de-riesgo/fenomeno-el-nino?final=${Date.now()}`,{waitUntil:'networkidle'});const t=await p.locator('main').innerText();if(!t.includes('Fenómeno El Niño')||!t.includes('5,30 m')||!t.includes('no es un umbral general de evacuación de SOS-SF'))throw Error('El Nino safety');await p.screenshot({path:`${O}/screenshots/${n}`,fullPage:true})}
          await p.goto(`${B}/lite?final=${Date.now()}`,{waitUntil:'domcontentloaded'});if((await p.locator('body').innerText()).trim().length<40)throw Error('lite');await ctx.close();
          // Production offline truth on desktop where connection state is intentionally visible.
          const oc=await browser.newContext();const op=await oc.newPage();await op.setViewportSize({width:1440,height:900});await op.goto(`${B}/?offline-seed=${Date.now()}`,{waitUntil:'networkidle'});await op.evaluate(async()=>{if('serviceWorker'in navigator)await navigator.serviceWorker.ready});await op.reload({waitUntil:'networkidle'});await oc.setOffline(true);await op.reload({waitUntil:'domcontentloaded'}).catch(()=>{});await op.waitForTimeout(700);const chip=op.locator('.connection-chip');const chipText=(await chip.textContent().catch(()=>''))??'';const hydro=await op.getByTestId('hydrometric-situation').isVisible().catch(()=>false);if(!chipText.includes('Sin conexión')||!hydro)throw Error('offline state '+JSON.stringify({chipText,hydro}));await op.screenshot({path:`${O}/screenshots/production-offline-1440x900.png`,fullPage:true});await oc.close();await browser.close();
          const sourceTruth={generatedAt:snapshot.generatedAt??null,parana:{id:parana.id,currentMetres:parana.currentMetres,observedAt:parana.observedAt,freshness:parana.freshness,sourceId:parana.sourceId},salado:{id:salado.id,currentMetres:salado.currentMetres,observedAt:salado.observedAt,freshness:salado.freshness,sourceId:salado.sourceId},inaPresent:ina,sourceCount:sources.length,provenanceAvailable:Boolean(prov),pass:true};await writeFile(O+'/source-runtime-truth.json',JSON.stringify(sourceTruth,null,2)+'\n');
          await writeFile(O+'/production-black-box.json',JSON.stringify({deploymentVersionId:process.env.EXPECTED_VERSION,health,sourceTruth,apiUiParity:true,signature:'RÍO / REGLA / TIEMPO',viewports:views,elNinoSafety:true,lite:true,offline:true,securityHeaders,assetIdentity,deployCommandCount:1,postdeployRedeployCount:0,pass:true},null,2)+'\n');
          NODE
      - name: Final drift and cost evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import{readFile,writeFile}from'node:fs/promises';const O=process.env.OUT;const prod=JSON.parse(await readFile(O+'/production-black-box.json','utf8')),dep=JSON.parse(await readFile(O+'/deployment-provenance.json','utf8'));if(!prod.pass||!dep.pass||dep.expectedVersion!==prod.deploymentVersionId)throw Error('drift inputs');await writeFile(O+'/cloudflare-github-drift.json',JSON.stringify({productCommit:process.env.PRODUCT_COMMIT,deploymentVersionId:prod.deploymentVersionId,assetByteIdentity:prod.assetIdentity.every(x=>x.pass),deploymentRouted100Percent:true,cloudflareGithubDrift:false,pass:true},null,2)+'\n');await writeFile(O+'/cost-report.json',JSON.stringify({usdBudget:0,cloudflareMutationCommandsThisOrder:1,postdeployRedeployCount:0,r2:'ABSENT',d1Free:'PRESERVED_BY_UNCHANGED_INFRA_CONFIG',kvFree:'PRESERVED_BY_UNCHANGED_INFRA_CONFIG',billingApiQueried:false,newPaidDependency:false,pass:true},null,2)+'\n');
          NODE
      - name: Disable closure then record final workflow registry
        shell: bash
        run: |
          set -euo pipefail
          gh workflow disable hovs-r2-final-readonly.yml
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" > "$OUT/workflow-registry-final.json"
          node --input-type=module <<'NODE'
          import{readFile,writeFile}from'node:fs/promises';const O=process.env.OUT,x=JSON.parse(await readFile(O+'/workflow-registry-final.json','utf8'));const active=x.workflows.filter(w=>w.state==='active');if(active.length)throw Error('active workflows '+JSON.stringify(active.map(x=>x.name)));await writeFile(O+'/terminal-summary.json',JSON.stringify({order:'SOS-SF-AUD-SANTA-FE-HOVS-MATERIAL-REDESIGN-021-HOVS-R2',status:'VERIFIED_NOT_ACCEPTED',takeHead:'c046e4ea8dcb4121ec410f3e3e9ede140299e132',productCommit:process.env.PRODUCT_COMMIT,deployRunId:Number(process.env.DEPLOY_RUN_ID),deploymentVersionId:process.env.EXPECTED_VERSION,deployCommandCount:1,postdeployRedeployCount:0,predeployRunId:Number(process.env.PREDEPLOY_RUN_ID),predeployArtifactId:Number(process.env.PREDEPLOY_ARTIFACT_ID),predeployArtifactSha256:process.env.PREDEPLOY_ARTIFACT_SHA256,registeredWorkflows:x.total_count,activeWorkflows:0,ownerAcceptance:'PENDING',audHold:'ACTIVE',mainSha:process.env.MAIN_EXPECTED,pass:true},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-r2-final-${{ github.run_id }}
          path: artifacts/hovs-r2-final
          if-no-files-found: error
      - name: Remove versioned verifier
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-final-readonly.yml
          git commit -m "ci: terminally disarm HOVS R2 final closure"
          git push origin HEAD:arq/visual-dashboard-v3
