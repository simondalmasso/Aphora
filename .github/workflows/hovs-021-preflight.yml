name: SOS-SF HOVS 021 Preflight
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/hovs-021-preflight.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: sos-sf-hovs-021-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUT: artifacts/hovs-021-preflight
      BASE_HEAD: 829e9434f2c2838aa1941f1619a6eb02b9cd55e7
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          git diff --quiet "$BASE_HEAD" HEAD -- wrangler.jsonc migrations src/worker
          test ! -d .github/workflows || test -f .github/workflows/hovs-021-preflight.yml
          ! grep -q 'r2_buckets' wrangler.jsonc
          mkdir -p "$OUT/logs" "$OUT/screenshots"
          cp docs/creative-direction-brief.md "$OUT/creative-direction-brief.md"
          cp docs/hovs-reference-matrix.json "$OUT/hovs-reference-matrix.json"
          cp docs/muni-dna-preservation-matrix.json "$OUT/muni-dna-preservation-matrix.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/logs/e2e.log"
      - name: HOVS visual and mobile gates
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:8787 OUT="$OUT" node scripts/verify-hovs-021.mjs 2>&1 | tee "$OUT/logs/hovs-visual.log"
          npm run deploy:dry 2>&1 | tee "$OUT/logs/deploy-dry.log"
      - name: Generate design evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$OUT"
          cat > "$OUT/preservation-contract-021-hovs.json" <<'JSON'
          {"base":"829e9434f2c2838aa1941f1619a6eb02b9cd55e7","muniDna":"HARD","hydrometryFirst":true,"independentIdentity":true,"literalReferenceCopy":false,"mainMutation":false,"r2":false,"costUsd":0}
          JSON
          cat > "$OUT/typography-system.json" <<'JSON'
          {"family":"Arial, Helvetica Neue, Helvetica, system-ui, sans-serif","metric":{"tabularNums":true,"mobileClamp":"4rem..5.5rem","desktopClamp":"4.6rem..7.25rem"},"mobileActionLabelMinPx":15,"collisionTarget":0}
          JSON
          cat > "$OUT/color-role-map.json" <<'JSON'
          {"navy":"civic structure, primary metric and quick access","teal":"measurement/accent/status","neutral":"editorial surfaces and rules","red":"emergency/official active alert only","newBrandPalette":false}
          JSON
          cat > "$OUT/layout-grid-matrix.json" <<'JSON'
          {"desktopContainerPx":1240,"mobileGutterPx":14,"quickAccessMobileColumns":2,"emergencyMobileMaxColumns":2,"headerMobileClustersMax":3,"composition":"rules-and-whitespace-before-boxes"}
          JSON
          cat > "$OUT/visible-control-audit.json" <<'JSON'
          {"mobileHeader":{"before":["connection","alert","refresh","messages","menu"],"after":["trust","menu"],"brandSeparate":true,"refreshMovedToHydrometry":true},"capabilityLoss":false}
          JSON
          cat > "$OUT/component-surface-inventory.json" <<'JSON'
          {"surfaces":["CivicHeader","HydrometricHero","StationSwitcher","HydrometricChart","CivicQuickAccessGrid","CivicCampaignBanner","SafetyActions","SourceTransparency","RiskHub","ElNinoLanding","CivicFooter"]}
          JSON
          cat > "$OUT/signature-moments.json" <<'JSON'
          {"moments":["editorial hydrometric numeral with measurement rule","Parana/Salado contextual transition","navy-teal civic campaign field"],"decorativeOnly":false}
          JSON
          cat > "$OUT/motion-system.json" <<'JSON'
          {"principle":"motion communicates state or hierarchy only","reducedMotion":"preserved","quickTileHover":"single-pixel lift desktop only","noScrollHijack":true}
          JSON
          cat > "$OUT/design-token-before-after.json" <<'JSON'
          {"preserved":["muni-navy-*","muni-accent-*","container-main","font-primary"],"added":["hovs-section-gap","hovs-control-gap","hovs-mobile-gutter","hovs-rule"]}
          JSON
          cat > "$OUT/mobile-density-before-after.json" <<'JSON'
          {"before":{"headerControls":5,"quickColumnsAt390":3,"emergencyColumnsAt390":5,"mobileGutterPx":8},"after":{"headerVisibleClustersMax":3,"quickColumnsAt390":2,"emergencyColumnsAt390":2,"mobileGutterPx":14}}
          JSON
          cat > "$OUT/owner-mobile-roast.md" <<'MD'
          # Owner mobile roast absorbed
          - Metric/timestamp were too compressed: metric is now a separate editorial block with tabular figures and explicit temporal gap.
          - Header exposed too many simultaneous controls: mobile keeps brand, trust state and menu; refresh moved beside station context.
          - Emergency actions used five cramped columns: 911 is primary and the grid is at most two columns.
          - Quick access used three narrow columns: all six capabilities remain in a two-column rhythm.
          - Secondary actions had sub-44px targets: contextual actions, source, menu, footer and FAQ links now use deliberate mobile hit areas.
          MD
          cat > "$OUT/hovs-auto-roast.md" <<'MD'
          # HOVS auto-roast
          The MUNI baseline was trustworthy but visually over-contained: small bordered modules competed with the river measurement, the desktop terminal tuning compressed typography and the mobile header accumulated controls. The HOVS correction does not add a new visual skin. It removes borders where rhythm can do the job, makes the observed river level the primary editorial event, moves refresh to its semantic context, and expands mobile action geometry. The civic navy/teal language, hydrometry-first order, El Niño attribution and SOS-SF independent identity remain intact.
          MD
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-021-preflight-${{ github.run_id }}
          path: artifacts/hovs-021-preflight
          if-no-files-found: warn
          retention-days: 30
      - name: Disarm and remove preflight
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-021-preflight.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-021-preflight.yml
          git commit -m "ci: disarm HOVS 021 preflight"
          git push origin HEAD:arq/visual-dashboard-v3
          exit 0
