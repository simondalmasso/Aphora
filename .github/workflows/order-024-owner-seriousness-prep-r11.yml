name: order-024-owner-seriousness-prep-r11

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/order-024-owner-seriousness-prep-r11.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: arq/visual-dashboard-v3
      SOURCE_HEAD: e286e4d63fa24fa3598a311f922cdda9aa908f5f
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Retire superseded decorative-rule assertion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/owner-left-inset.spec.ts')
          text = p.read_text()
          old = "    expect(measurement.ruleWidth).toBeGreaterThanOrEqual(3.5);\n"
          if old not in text:
              raise SystemExit('superseded decorative-rule assertion not found')
          text = text.replace(old, '', 1)
          text = text.replace(
              "test('OWNER left inset, decorative gap and edge collision gates', async ({ page }, testInfo) => {",
              "test('OWNER left inset and edge collision gates', async ({ page }, testInfo) => {",
              1,
          )
          p.write_text(text)
          PY
          git diff --check
          git config user.name 'SOS-SF ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/owner-left-inset.spec.ts
          git commit -m 'test: retire superseded decorative rule gate for SOS-SF-024 [skip ci]'
          git push origin HEAD:$BRANCH
