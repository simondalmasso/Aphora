name: SOS-SF 020-B Production Truth

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/order-020b-truth-trigger]

permissions:
  contents: read

jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_DIR: artifacts/order-020b-predeploy-truth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: truth
        run: node .github/order020b/predeploy.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020b-predeploy-truth
          path: artifacts/order-020b-predeploy-truth
          if-no-files-found: error
