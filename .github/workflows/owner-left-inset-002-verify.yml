name: SOS-SF Owner Left Inset 002 Verify

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths:
      - '.github/workflows/owner-left-inset-002-verify.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: owner-left-inset-002-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_DIR: artifacts/owner-left-inset-002
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority and scope gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main arq/visual-dashboard-v3
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          test -f src/client/styles/owner-left-inset-002.css
          grep -q "021-HOVS-OWNER-LEFT-INSET-EDGE-COLLISION-002" src/client/styles/owner-left-inset-002.css
          grep -q "owner-left-inset-002.css" src/client/App.tsx
          ! grep -q "r2_buckets" wrangler.jsonc
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Full regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/typecheck.log"
          npm run lint -- --max-warnings=0 2>&1 | tee "$EVIDENCE_DIR/logs/lint.log"
          npm audit --audit-level=low 2>&1 | tee "$EVIDENCE_DIR/logs/npm-audit.log"
          npm run test:unit 2>&1 | tee "$EVIDENCE_DIR/logs/unit.log"
          npm run test:contract 2>&1 | tee "$EVIDENCE_DIR/logs/contract.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/logs/build.log"
          npm run test:worker 2>&1 | tee "$EVIDENCE_DIR/logs/worker.log"
          npm run test:e2e 2>&1 | tee "$EVIDENCE_DIR/logs/e2e.log"
          npm run deploy:dry 2>&1 | tee "$EVIDENCE_DIR/logs/deploy-dry.log"

      - name: Amendment geometry gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = process.env.EVIDENCE_DIR + '/mobile-left-inset-audit.json';
          const a = JSON.parse(await readFile(path, 'utf8'));
          const req = [
            ['heroInnerContentInsetMinimumPx', 19.5],
            ['decorativeRuleToTextGapMinimumPx', 15.5],
            ['textToVisibleBorderGapMinimumPx', 15.5],
          ];
          for (const [key, min] of req) if (!(Number(a[key]) >= min)) throw Error(`${key}=${a[key]}`);
          if (a.edgeCollisionCount !== 0 || a.textBorderTouchCount !== 0) throw Error('collision count nonzero');
          if (a.leftInsetGate !== 'PASS' || a.decorativeRuleGapGate !== 'PASS' || a.zoom200LeftInset !== 'PASS') throw Error('geometry gate not PASS');
          await writeFile(process.env.EVIDENCE_DIR + '/terminal-summary.json', JSON.stringify({
            amendment: '021-HOVS-OWNER-LEFT-INSET-EDGE-COLLISION-002',
            ownerCommentId: 5219229883,
            status: 'SOURCE_CORRECTED_PREDEPLOY_VERIFIED',
            heroInnerContentInsetMinimumPx: a.heroInnerContentInsetMinimumPx,
            decorativeRuleToTextGapMinimumPx: a.decorativeRuleToTextGapMinimumPx,
            textToVisibleBorderGapMinimumPx: a.textToVisibleBorderGapMinimumPx,
            edgeCollisionCount: a.edgeCollisionCount,
            textBorderTouchCount: a.textBorderTouchCount,
            zoom200LeftInset: a.zoom200LeftInset,
            productionMutation: false,
            deploymentCommandsThisAmendment: 0,
            mainSha: process.env.MAIN_EXPECTED,
            pass: true,
          }, null, 2) + '\n');
          NODE
          test -s "$EVIDENCE_DIR/screenshots/hovs-left-inset-detail-390.png"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-owner-left-inset-002-${{ github.run_id }}
          path: artifacts/owner-left-inset-002
          if-no-files-found: error
          retention-days: 90

      - name: Terminally disarm verifier
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh workflow disable owner-left-inset-002-verify.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/owner-left-inset-002-verify.yml
          git commit -m "ci: terminally disarm owner left-inset verifier"
          git push origin HEAD:arq/visual-dashboard-v3
