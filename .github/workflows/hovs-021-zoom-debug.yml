name: SOS-SF HOVS 021 Zoom Debug
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/hovs-021-zoom-debug.yml]
permissions:
  contents: write
  actions: write
jobs:
  zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: arq/visual-dashboard-v3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Trace overflow
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run preview >/tmp/preview.log 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:195,height:422}});
          await p.goto('http://127.0.0.1:8787/',{waitUntil:'networkidle'});
          const data=await p.evaluate(()=>{
            const offenders=[];
            for(const el of document.querySelectorAll('body *')){
              const s=getComputedStyle(el),r=el.getBoundingClientRect();
              if(s.display==='none'||s.visibility==='hidden'||r.width===0||r.height===0) continue;
              if(r.right>innerWidth+1||r.left<-1||r.width>innerWidth+1) offenders.push({tag:el.tagName.toLowerCase(),cls:typeof el.className==='string'?el.className:'',text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,70),left:r.left,right:r.right,width:r.width,position:s.position,minWidth:s.minWidth,grid:s.gridTemplateColumns,overflowX:s.overflowX});
            }
            return {innerWidth,scrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth,offenders:offenders.sort((a,b)=>b.right-a.right).slice(0,30)};
          });
          console.log('ZOOM_OVERFLOW_TRACE='+JSON.stringify(data));
          await b.close();
          NODE
      - name: Disarm
        if: always()
        run: |
          set +e
          gh workflow disable hovs-021-zoom-debug.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-021-zoom-debug.yml
          git commit -m "ci: disarm HOVS 021 zoom debug"
          git push origin HEAD:arq/visual-dashboard-v3
