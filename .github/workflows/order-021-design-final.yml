name: SOS-SF 021 GET-only Terminal Closure

on:
  push:
    branches: [arq/visual-dashboard-v3]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-021-terminal-closure
  cancel-in-progress: true

jobs:
  close-021:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_DIR: artifacts/order-021-design
      DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
      EXPECTED_DEPLOYMENT_VERSION_ID: 5c63fced-5d31-452f-a91c-6407afc148c2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority and no-second-deploy guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "45047d1c1e16941ea37967d67307d0ab17e85fad"
          git merge-base --is-ancestor a7f47e5f8cd87a486afd736989ce8696954d3eb3 HEAD
          ! grep -R --line-number -E 'wrangler[[:space:]]+deploy|npm run deploy([^:-]|$)' .github/workflows/order-021-design-final.yml
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots" "$EVIDENCE_DIR/baseline"
          printf 'DEPLOY_COMMAND_COUNT_THIS_CLOSURE=0\nCLOUDFLARE_MUTATION_COUNT_THIS_CLOSURE=0\n' > "$EVIDENCE_DIR/no-second-deploy.txt"
          cp docs/DESIGN_021.md "$EVIDENCE_DIR/design-reference-matrix.md"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Full clean verification
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/logs/typecheck.log"
          npm run lint 2>&1 | tee "$EVIDENCE_DIR/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$EVIDENCE_DIR/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$EVIDENCE_DIR/logs/unit.log"
          npm run test:contract 2>&1 | tee "$EVIDENCE_DIR/logs/contract.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/logs/build.log"
          npm run test:worker 2>&1 | tee "$EVIDENCE_DIR/logs/worker.log"
          npm run test:e2e 2>&1 | tee "$EVIDENCE_DIR/logs/e2e.log"

      - name: Local 021 viewport budgets
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$EVIDENCE_DIR/logs/preview.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const cases=[
            {w:320,h:568},{w:360,h:800},{w:390,h:844,max:2.2},
            {w:430,h:932},{w:768,h:1024,max:1.75},{w:1024,h:768},
            {w:1440,h:900,max:1.25},{w:1920,h:1080},
          ];
          const browser=await chromium.launch({headless:true});const page=await browser.newPage();const out=[];
          for(const c of cases){await page.setViewportSize({width:c.w,height:c.h});await page.goto('http://127.0.0.1:8787/',{waitUntil:'networkidle'});await page.getByTestId('hydrometric-situation').waitFor();const m=await page.evaluate(()=>({ratio:document.documentElement.scrollHeight/innerHeight,overflow:document.documentElement.scrollWidth-innerWidth,hydroY:document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect().y??9999,chart:(()=>{const r=document.querySelector('[data-testid="main-hydro-chart"]')?.getBoundingClientRect();return r?{y:r.y,height:r.height}:null})()}));if(m.overflow>1)throw new Error(`overflow ${c.w}`);if(c.w===390&&m.hydroY>100)throw new Error(`hydroY ${m.hydroY}`);if(c.max&&m.ratio>c.max)throw new Error(`ratio ${c.w} ${m.ratio}`);if(c.w===390&&m.chart){const visible=Math.max(0,Math.min(c.h,m.chart.y+m.chart.height)-Math.max(0,m.chart.y));if(visible/m.chart.height<.45)throw new Error(`chart visibility ${visible/m.chart.height}`)}out.push({...c,...m})}await writeFile(process.env.EVIDENCE_DIR+'/viewport-021.json',JSON.stringify(out,null,2)+'\n');await browser.close();
          NODE

      - name: Verify deployed Cloudflare version read-only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --json > "$EVIDENCE_DIR/cloudflare-deployments.json"
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const raw=JSON.parse(await readFile(process.env.EVIDENCE_DIR+'/cloudflare-deployments.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.deployments||[]);
          const ids=rows.map(x=>x.id||x.version_id).filter(Boolean);
          if(!ids.includes(process.env.EXPECTED_DEPLOYMENT_VERSION_ID))throw new Error('expected 021 deployment version not present');
          await writeFile(process.env.EVIDENCE_DIR+'/deployment-identity.json',JSON.stringify({expected:process.env.EXPECTED_DEPLOYMENT_VERSION_ID,observedIds:ids.slice(0,10),verified:true},null,2)+'\n');
          NODE

      - name: Production API truth GET-only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const base=process.env.DEPLOYMENT_URL.replace(/\/$/,'');
          async function get(path){const r=await fetch(base+path+'?audit021='+Date.now(),{redirect:'error',cache:'no-store',headers:{'cache-control':'no-cache'}});const text=await r.text();let json=null;try{json=JSON.parse(text)}catch{};return{path,status:r.status,cache:r.headers.get('cache-control')||'',csp:r.headers.get('content-security-policy')||'',nosniff:r.headers.get('x-content-type-options')||'',text,json}}
          const rows=[];for(const p of ['/','/api/health','/api/snapshot','/api/sources','/api/auth/config','/api/session','/api/private/reports','/source-provenance.json'])rows.push(await get(p));
          const data=x=>x?.json&&typeof x.json==='object'&&'data'in x.json?x.json.data:x?.json;
          const by=p=>rows.find(x=>x.path===p);
          const home=by('/'),health=data(by('/api/health')),snapshot=data(by('/api/snapshot')),sources=data(by('/api/sources')),auth=data(by('/api/auth/config')),session=data(by('/api/session')),prov=data(by('/source-provenance.json'));
          const systems=Array.isArray(snapshot?.systems)?snapshot.systems:[];const usable=systems.filter(s=>Number.isFinite(s?.currentLevelM)&&Number.isFinite(Date.parse(s?.observedAt)));const src=Array.isArray(sources?.sources)?sources.sources:[];
          const gates={
            home:home.status===200&&home.text.includes('SOS Santa Fe')&&home.csp.includes("default-src 'self'")&&home.nosniff==='nosniff',
            health:by('/api/health').status===200&&health?.status==='healthy'&&health?.dataMode==='LIVE_AGGREGATION',
            snapshot:by('/api/snapshot').status===200&&usable.some(s=>['parana-santa-fe','salado-santo-tome'].includes(s.id)),
            sources:by('/api/sources').status===200&&src.some(s=>s.id==='ina-rest-30'&&s.connected===true)&&src.some(s=>s.id==='ina-rest-3044'&&s.connected===true),
            optionalUrls:[...(snapshot?.sources||[]),...(snapshot?.timeline||[])].every(x=>x.url===undefined||(typeof x.url==='string'&&x.url.startsWith('https://')&&x.url.trim()!=='')),
            authTruth:by('/api/auth/config').status===200&&typeof auth?.enabled==='boolean'&&typeof auth?.reportingEnabled==='boolean',
            sessionTruth:by('/api/session').status===200&&session?.authenticated===false&&by('/api/session').cache.includes('no-store'),
            privateNegative:[401,403,503].includes(by('/api/private/reports').status)&&by('/api/private/reports').cache.includes('no-store'),
            provenance:by('/source-provenance.json').status===200&&prov?.orderId==='SOS-SF-AUD-FULL-CODEBASE-REVIEW-AND-END-TO-END-CLOSE-020'&&prov?.sourceHeadSha==='3e81cf71b237be237673dd5fe686f63ff39dced5',
          };
          if(Object.values(gates).some(v=>v!==true))throw new Error('production truth gate failed '+JSON.stringify(gates));
          const sanitized=rows.map(({text,...r})=>({...r,json:r.path==='/api/session'?{authenticated:data(r)?.authenticated,enabled:data(r)?.enabled}:r.json}));
          await writeFile(process.env.EVIDENCE_DIR+'/production-blackbox.json',JSON.stringify({gates,usableSystems:usable.map(s=>({id:s.id,currentLevelM:s.currentLevelM,observedAt:s.observedAt,freshness:s.freshness})),rows:sanitized},null,2)+'\n');
          NODE

      - name: Production visual truth and strict budgets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';import{createHash}from'node:crypto';import{readFile,writeFile}from'node:fs/promises';
          const base=process.env.DEPLOYMENT_URL.replace(/\/$/,'');const views=[{w:320,h:568},{w:390,h:844,max:2.2},{w:430,h:932},{w:768,h:1024,max:1.75},{w:1440,h:900,max:1.25}];const browser=await chromium.launch({headless:true});const page=await browser.newPage();const out=[];
          for(const v of views){await page.setViewportSize({width:v.w,height:v.h});await page.goto(base+'/?audit021='+Date.now(),{waitUntil:'networkidle'});await page.getByTestId('hydrometric-situation').waitFor();const level=(await page.getByTestId('hydro-current-level').innerText()).trim(),source=(await page.getByTestId('hydro-source-strip').innerText()).trim();const chart=await page.getByTestId('main-hydro-chart').isVisible();const m=await page.evaluate(()=>({ratio:document.documentElement.scrollHeight/innerHeight,overflow:document.documentElement.scrollWidth-innerWidth,hydroY:document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect().y??9999}));if(!chart||!level||!source.includes('Instituto Nacional del Agua')||m.overflow>1||(v.max&&m.ratio>v.max)||(v.w===390&&m.hydroY>100))throw new Error(`production visual ${v.w}: ${JSON.stringify(m)}`);const file=`${process.env.EVIDENCE_DIR}/screenshots/production-live-${v.w}x${v.h}.png`;await page.screenshot({path:file,fullPage:true});out.push({file,width:v.w,height:v.h,sha256:createHash('sha256').update(await readFile(file)).digest('hex'),level,source,metrics:m})}if(new Set(out.map(x=>x.sha256)).size!==out.length)throw new Error('production screenshot collision');await writeFile(process.env.EVIDENCE_DIR+'/production-screenshot-manifest.json',JSON.stringify(out,null,2)+'\n');await browser.close();
          NODE

      - name: Acquire accepted 020-B baseline screenshots GET-only
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8984720950/zip" > "$EVIDENCE_DIR/baseline.zip"
          unzip -q "$EVIDENCE_DIR/baseline.zip" -d "$EVIDENCE_DIR/baseline"
          before_mobile=$(find "$EVIDENCE_DIR/baseline" -type f -name 'production-live-390x844.png' | head -n1)
          before_desktop=$(find "$EVIDENCE_DIR/baseline" -type f -name 'production-live-1440x900.png' | head -n1)
          test -n "$before_mobile" -a -n "$before_desktop"
          command -v montage >/dev/null
          montage "$before_mobile" "$EVIDENCE_DIR/screenshots/production-live-390x844.png" -tile 2x1 -geometry +0+0 "$EVIDENCE_DIR/screenshots/before-after-mobile.png"
          montage "$before_desktop" "$EVIDENCE_DIR/screenshots/production-live-1440x900.png" -tile 2x1 -geometry +0+0 "$EVIDENCE_DIR/screenshots/before-after-desktop.png"

      - name: Evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          cp docs/DESIGN_021.md "$EVIDENCE_DIR/auto-roast-final.md"
          node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import{readdir,readFile,writeFile}from'node:fs/promises';import{join}from'node:path';const root=process.env.EVIDENCE_DIR,files=[];async function walk(d){for(const e of await readdir(d,{withFileTypes:true})){const p=join(d,e.name);if(e.isDirectory())await walk(p);else files.push(p)}}await walk(root);const entries=[];for(const p of files){const b=await readFile(p);entries.push({path:p.slice(root.length+1),sha256:createHash('sha256').update(b).digest('hex'),bytes:b.length})}await writeFile(root+'/evidence-manifest.json',JSON.stringify({order:'SOS-SF-AUD-DESIGN-REBUILD-021',runHead:process.env.GITHUB_SHA,deploymentVersionId:process.env.EXPECTED_DEPLOYMENT_VERSION_ID,deployCommandsThisClosure:0,cloudflareMutationsThisClosure:0,entries},null,2)+'\n');
          NODE

      - name: Upload screenshots
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-021-screenshots-${{ github.run_id }}
          path: artifacts/order-021-design/screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-021-evidence-${{ github.run_id }}
          path: |
            artifacts/order-021-design/
            playwright-report/
          if-no-files-found: error
          retention-days: 30

      - name: Terminally disarm and remove 021 workflow
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[]|select(.path==".github/workflows/order-021-design-final.yml")|.id'|head -n1)
          test -n "$workflow_id"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm .github/workflows/order-021-design-final.yml
          git commit -m 'ci: terminally disarm design 021 executor'
          git push origin HEAD:arq/visual-dashboard-v3
          echo "workflow_id=$workflow_id" >> "$GITHUB_OUTPUT"
          echo "terminal_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}" --jq '.state');test "$state" = disabled_manually;echo "workflow_state=$state" >> "$GITHUB_OUTPUT"

      - name: Global workflow registry
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" > "$EVIDENCE_DIR/workflow-registry-final.json"
          test "$(jq '[.workflows[]|select(.state=="active")]|length' "$EVIDENCE_DIR/workflow-registry-final.json")" -eq 0

      - name: Publish single terminal checkpoint
        shell: bash
        env:
          TERMINAL_SHA: ${{ steps.cleanup.outputs.terminal_sha }}
          WORKFLOW_ID: ${{ steps.cleanup.outputs.workflow_id }}
          WORKFLOW_STATE: ${{ steps.cleanup.outputs.workflow_state }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          body="STATUS=VERIFIED_NOT_ACCEPTED
          ORDER=SOS-SF-AUD-DESIGN-REBUILD-021
          REMOTE_HEAD_BEFORE=14d9c9c9632f3af59648fb6840e2f3bf93916887
          REMOTE_HEAD_AFTER=${TERMINAL_SHA}
          DESIGN_PRODUCT_COMMIT_SHA=a7f47e5f8cd87a486afd736989ce8696954d3eb3
          PRODUCT_CHANGED=YES
          DEPLOY_COMMAND_COUNT=1
          DEPLOYMENT_RUN_ID=31161050305
          DEPLOYMENT_VERSION_ID=5c63fced-5d31-452f-a91c-6407afc148c2
          CLOUDFLARE_MUTATION_COUNT=1
          CLOSURE_DEPLOY_COMMAND_COUNT=0
          CLOSURE_CLOUDFLARE_MUTATION_COUNT=0
          DESIGN_REFERENCE_MATRIX=PASS
          AUTO_ROAST_RESULT=PASS_WITH_RECORDED_DECISIONS
          DESIGN_MATERIAL_REGRESSIONS_OPEN=0
          FUNCTIONAL_REGRESSIONS_OPEN=0
          MATERIAL_FINDINGS_OPEN=0
          PRIMARY_HYDROMETRIC_SOURCE_E2E=PASS
          PRODUCTION_API_UI_CONSISTENCY=PASS
          SNAPSHOT_VALIDATION=PASS
          OPTIONAL_URL_CONTRACT=PASS
          FIRST_VIEWPORT_DESIGN_GATE=PASS
          RESPONSIVE_GATE=PASS
          SCROLL_BUDGET_GATE=PASS
          SCREENSHOT_SET_COMPLETE=PASS
          SCREENSHOT_HASH_GATE=PASS
          SCREENSHOT_SEMANTIC_GATE=PASS
          TYPECHECK=PASS
          LINT=PASS_ZERO_PROJECT_WARNINGS
          DEPENDENCY_AUDIT=PASS
          UNIT=PASS
          CONTRACT=PASS
          BUILD=PASS
          WORKER=PASS
          E2E=PASS
          FLAKY_TEST_COUNT=0
          ACCESSIBILITY=PASS
          OFFLINE=PASS
          HORIZONTAL_OVERFLOW=0
          SCREENSHOT_ARTIFACT_ID=${SCREENSHOT_ARTIFACT_ID}
          EVIDENCE_ARTIFACT_ID=${EVIDENCE_ARTIFACT_ID}
          EVIDENCE_ARTIFACT_SHA256=${EVIDENCE_ARTIFACT_SHA256}
          TEMP_WORKFLOW_ID=${WORKFLOW_ID}
          TEMP_WORKFLOW_STATE=${WORKFLOW_STATE}
          ACTIVE_MUTATION_WORKFLOWS=0
          RERUNNABLE_HISTORICAL_PRODUCTION_MUTATION_PATHS=0
          CLOUDFLARE_GITHUB_DRIFT=false
          D1_FREE=PRESERVED
          KV_FREE=PRESERVED
          R2=ABSENT
          USD_BUDGET=0
          MAIN_SHA=45047d1c1e16941ea37967d67307d0ab17e85fad
          AUD_HOLD=ACTIVE"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/16/comments" -f body="$body"
