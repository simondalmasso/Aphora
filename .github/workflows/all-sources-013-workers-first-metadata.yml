name: All Sources 013 Reconcile Deployed Runtime

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/all-sources-013-workers-first-metadata.yml]

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: false

env:
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  EVIDENCE_DIR: artifacts/all-sources-013-reconcile

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Restore exact deployed runtime patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$EVIDENCE_DIR" /tmp/as013
          mkdir -p "$EVIDENCE_DIR" /tmp/as013
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8914179956/zip \
            -o /tmp/as013.zip
          unzip -q /tmp/as013.zip -d /tmp/as013
          cp /tmp/as013/pre-correction-drift.json "$EVIDENCE_DIR/"
          cp /tmp/as013/wrangler-deploy.log "$EVIDENCE_DIR/deployed-runtime.log"
          git apply /tmp/as013/runtime.patch
          cat > "$EVIDENCE_DIR/reconciliation-context.json" <<'JSON'
          {
            "orderId": "ALL-SOURCES-013",
            "acceptance": "NOT_DECLARED",
            "audHold": "ACTIVE",
            "deployedWorkerVersion": "44dd8390-9f73-40c6-b487-8070445e6b9e",
            "deployRun": 30964449026,
            "deployArtifact": 8914179956,
            "deployArtifactDigest": "sha256:d972f5fe00512f3f72d20e10d1b00af8f20aabf7ce272f0191695ca72679bf36",
            "operation": "verify stabilized production and synchronize exact deployed patch without another deploy"
          }
          JSON

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run build
      - run: npm run test:worker

      - name: Verify stabilized production source matrix
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = process.env.DEPLOYMENT_URL;
          async function read(path, attempt) {
            const response = await fetch(`${base}${path}?all013_reconcile=${Date.now()}-${attempt}-${Math.random()}`, {
              cache: 'no-store',
              headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', Pragma: 'no-cache' },
              signal: AbortSignal.timeout(50_000),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path}:HTTP_${response.status}`);
            return JSON.parse(text).data;
          }
          function validate(round) {
            const providers = round.health.providers;
            const sources = round.sources.sources;
            const provider = (id) => providers.find((item) => item.id === id);
            const source = (id) => sources.find((item) => item.id === id);
            const primary = [
              ['ina-rest-30', 'ina:30'],
              ['ina-rest-3044', 'ina:3044'],
              ['ina-waterml-parana', 'ina-waterml-parana'],
              ['ina-waterml-salado', 'ina-waterml-salado'],
              ['smn-alerts', 'smn-alerts'],
            ];
            for (const [healthId, sourceId] of primary) {
              const health = provider(healthId);
              const item = source(sourceId);
              if (!health || !['FRESH', 'STALE'].includes(health.status) || health.errorClass !== null || health.circuitOpenUntil !== null || !Number.isFinite(Date.parse(health.lastSuccessAt)) || !Number.isFinite(Date.parse(health.lastObservedAt))) throw new Error(`primary-health:${healthId}:${JSON.stringify(health)}`);
              if (!item || item.connected !== true || !['FRESH', 'STALE'].includes(item.status) || !Number.isFinite(Date.parse(item.observedAt)) || typeof item.url !== 'string') throw new Error(`primary-source:${sourceId}:${JSON.stringify(item)}`);
            }
            for (const [id, errorClass] of [['ports-hydrometers', 'OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE'], ['smn-observations', 'CREDENTIAL_REQUIRED']]) {
              const health = provider(id);
              const item = source(id);
              if (health?.status !== 'UNAVAILABLE' || health?.errorClass !== errorClass || health?.circuitOpenUntil !== null || item?.connected !== false || item?.status !== 'UNAVAILABLE' || typeof item?.url !== 'string') throw new Error(`blocked:${id}:${JSON.stringify({ health, item })}`);
            }
            const nasaHealth = provider('nasa-gpm-imerg-early');
            const nasa = source('nasa-gpm-imerg-early');
            const forbiddenMetadata = String(nasa?.contribution ?? '').includes('Producto GPM IMERG Early V07 disponible con timestamp y resolución oficiales') || Number(nasa?.latencyMinutes) === 240 && !String(nasa?.contribution ?? '').match(/[-+]?\d+(?:[.,]\d+)? mm\/h/);
            if (forbiddenMetadata) throw new Error(`nasa-metadata-drift:${JSON.stringify({ nasaHealth, nasa })}`);
            if (nasa?.connected === true) {
              if (!['FRESH', 'STALE'].includes(nasaHealth?.status) || nasaHealth?.errorClass !== null || !Number.isFinite(Date.parse(nasaHealth?.lastSuccessAt)) || !Number.isFinite(Date.parse(nasaHealth?.lastObservedAt)) || !Number.isFinite(nasa.latencyMinutes) || nasa.latencyMinutes < 0 || !/[-+]?\d+(?:[.,]\d+)? mm\/h/.test(String(nasa.contribution)) || !String(nasa.url).includes('/getSamples?') || !String(nasa.url).includes('mosaicRule=')) throw new Error(`nasa-connected-invalid:${JSON.stringify({ nasaHealth, nasa })}`);
            } else if (nasa?.connected === false) {
              if (nasa.status !== 'UNAVAILABLE' || nasaHealth?.status !== 'UNAVAILABLE' || !['TIMEOUT', 'HTTP', 'PARSE', 'NETWORK', 'CONTENT_TYPE', 'BODY_TOO_LARGE', 'CIRCUIT_OPEN'].includes(nasaHealth?.errorClass) || !String(nasa.url).endsWith('/query')) throw new Error(`nasa-unavailable-invalid:${JSON.stringify({ nasaHealth, nasa })}`);
            } else throw new Error(`nasa-connected-flag-missing:${JSON.stringify(nasa)}`);
            const systems = round.snapshot.systems;
            if (!systems.find((item) => item.id === 'parana-santa-fe' && item.available) || !systems.find((item) => item.id === 'salado-santo-tome' && item.available)) throw new Error('primary-systems-unavailable');
          }
          (async () => {
            const rounds = [];
            let lastError;
            for (let attempt = 1; attempt <= 6 && rounds.length < 2; attempt += 1) {
              try {
                const round = { health: await read('/api/health', attempt), sources: await read('/api/sources', attempt), snapshot: await read('/api/snapshot', attempt) };
                validate(round);
                rounds.push(round);
              } catch (error) {
                lastError = error;
                console.error(`attempt ${attempt}:`, error);
              }
              if (rounds.length < 2) await new Promise((resolve) => setTimeout(resolve, 12_000));
            }
            if (rounds.length !== 2) throw lastError ?? new Error('matrix-not-stable');
            const matrix = { status: 'VERIFIED_NOT_ACCEPTED', workerVersion: '44dd8390-9f73-40c6-b487-8070445e6b9e', rounds };
            fs.writeFileSync(`${process.env.EVIDENCE_DIR}/production-matrix.json`, JSON.stringify(matrix, null, 2));
            console.log(JSON.stringify({ status: matrix.status, providers: rounds[1].health.providers, sources: rounds[1].sources.sources }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Synchronize exact deployed implementation and remove disposable workflows
        run: |
          git config user.name 'SOS-SF ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/worker/providers/core.ts \
            src/worker/providers/ina.ts \
            src/worker/providers/smn.ts \
            src/worker/providers/nasa.ts \
            src/worker/live-data.ts \
            scripts/verify-deployment.mjs \
            tests/unit/nasa-provider.test.ts
          git rm -f \
            .github/workflows/all-sources-013-discovery.yml \
            .github/workflows/all-sources-013-workers-first.yml \
            .github/workflows/all-sources-013-workers-first-rerun.yml \
            .github/workflows/all-sources-013-workers-first-final.yml \
            .github/workflows/all-sources-013-workers-first-metadata.yml \
            .github/workflows/nasa-013-probe.yml
          git commit -m 'fix: reconcile all sources and bound NASA raster sampling'
          git push origin HEAD:arq/visual-dashboard-v3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-sources-013-reconciliation-${{ github.run_id }}
          path: artifacts/all-sources-013-reconcile
          if-no-files-found: error
          retention-days: 30
