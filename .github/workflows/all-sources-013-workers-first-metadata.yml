name: All Sources 013 Final Reconciliation

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/all-sources-013-workers-first-metadata.yml]

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: false

env:
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  EVIDENCE_DIR: artifacts/all-sources-013-final-reconcile

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Restore exact deployed runtime and missing tracked test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$EVIDENCE_DIR" /tmp/as013
          mkdir -p "$EVIDENCE_DIR" /tmp/as013
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8914179956/zip \
            -o /tmp/as013.zip
          unzip -q /tmp/as013.zip -d /tmp/as013
          git apply /tmp/as013/runtime.patch
          cat > tests/unit/nasa-provider.test.ts <<'TS'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import { fetchNasaGpm } from '../../src/worker/providers/nasa';

          const originalFetch = globalThis.fetch;
          afterEach(() => {
            globalThis.fetch = originalFetch;
            vi.unstubAllGlobals();
            vi.restoreAllMocks();
          });

          describe('NASA GPM bounded sample chain', () => {
            it('locks getSamples to the latest queried raster and calculates latency from StdTime', async () => {
              const stdTime = Date.now() - 95 * 60_000;
              const fetchMock = vi.fn(async (input: RequestInfo | URL) => {
                const url = new URL(input instanceof Request ? input.url : String(input));
                if (url.pathname.endsWith('/query')) {
                  return new Response(JSON.stringify({ features: [{ attributes: { objectid: 586368, stdtime: stdTime } }] }), { headers: { 'Content-Type': 'application/json' } });
                }
                return new Response(JSON.stringify({ samples: [{ rasterId: 586368, value: '1.25' }] }), { headers: { 'Content-Type': 'application/json' } });
              });
              globalThis.fetch = fetchMock as typeof fetch;
              const result = await fetchNasaGpm('https://gis.earthdata.nasa.gov/image/rest/services/GESDISC/GPM_3IMERGHHE/ImageServer');
              expect(result.value?.value).toBe(1.25);
              expect(result.value?.latencyMinutes).toBeGreaterThanOrEqual(94);
              expect(result.value?.latencyMinutes).toBeLessThanOrEqual(96);
              expect(fetchMock).toHaveBeenCalledTimes(2);
              const sampleUrl = new URL(String(fetchMock.mock.calls[1]?.[0]));
              expect(JSON.parse(sampleUrl.searchParams.get('mosaicRule') ?? '{}')).toEqual({ mosaicMethod: 'esriMosaicLockRaster', lockRasterIds: [586368] });
            });

            it('returns UNAVAILABLE when the locked raster has no real numeric sample', async () => {
              const fetchMock = vi.fn(async (input: RequestInfo | URL) => {
                const url = new URL(input instanceof Request ? input.url : String(input));
                if (url.pathname.endsWith('/query')) {
                  return new Response(JSON.stringify({ features: [{ attributes: { objectid: 42, stdtime: Date.now() - 60_000 } }] }), { headers: { 'Content-Type': 'application/json' } });
                }
                return new Response(JSON.stringify({ error: { code: 503, message: 'Wait timeout' } }), { headers: { 'Content-Type': 'application/json' } });
              });
              globalThis.fetch = fetchMock as typeof fetch;
              const result = await fetchNasaGpm('https://gis.earthdata.nasa.gov/image/rest/services/GESDISC/GPM_3IMERGHHE/ImageServer');
              expect(result.value).toBeNull();
              expect(result.status).toBe('UNAVAILABLE');
              expect(result.errorClass).toBe('PARSE');
            });
          });
          TS
          cp /tmp/as013/pre-correction-drift.json "$EVIDENCE_DIR/"
          cp /tmp/as013/wrangler-deploy.log "$EVIDENCE_DIR/deployed-runtime.log"
          cat > "$EVIDENCE_DIR/reconciliation-context.json" <<'JSON'
          {
            "orderId": "ALL-SOURCES-013",
            "acceptance": "NOT_DECLARED",
            "audHold": "ACTIVE",
            "deployedWorkerVersion": "44dd8390-9f73-40c6-b487-8070445e6b9e",
            "deployRun": 30964449026,
            "deployArtifact": 8914179956,
            "deployArtifactDigest": "sha256:d972f5fe00512f3f72d20e10d1b00af8f20aabf7ce272f0191695ca72679bf36",
            "reconciliationVerificationRun": 30964771686,
            "reconciliationEvidenceArtifact": 8914304870,
            "operation": "synchronize exact already-deployed implementation without another deploy"
          }
          JSON

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run build
      - run: npm run test:worker

      - name: Reconfirm production matrix without deploy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const base = process.env.DEPLOYMENT_URL;
          async function read(path) {
            const response = await fetch(`${base}${path}?all013_final=${Date.now()}-${Math.random()}`, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', Pragma: 'no-cache' }, signal: AbortSignal.timeout(50_000) });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path}:HTTP_${response.status}`);
            return JSON.parse(text).data;
          }
          (async () => {
            const round = { health: await read('/api/health'), sources: await read('/api/sources'), snapshot: await read('/api/snapshot') };
            const providers = round.health.providers;
            const sources = round.sources.sources;
            const provider = (id) => providers.find((item) => item.id === id);
            const source = (id) => sources.find((item) => item.id === id);
            for (const [healthId, sourceId] of [['ina-rest-30','ina:30'],['ina-rest-3044','ina:3044'],['ina-waterml-parana','ina-waterml-parana'],['ina-waterml-salado','ina-waterml-salado'],['smn-alerts','smn-alerts']]) {
              const health = provider(healthId), item = source(sourceId);
              if (!['FRESH','STALE'].includes(health?.status) || health?.errorClass !== null || health?.circuitOpenUntil !== null || item?.connected !== true || !['FRESH','STALE'].includes(item?.status)) throw new Error(`primary:${healthId}:${JSON.stringify({health,item})}`);
            }
            for (const [id,errorClass] of [['ports-hydrometers','OFFICIAL_MACHINE_ENDPOINT_NOT_AVAILABLE'],['smn-observations','CREDENTIAL_REQUIRED']]) {
              const health = provider(id), item = source(id);
              if (health?.status !== 'UNAVAILABLE' || health?.errorClass !== errorClass || item?.connected !== false || item?.status !== 'UNAVAILABLE') throw new Error(`blocked:${id}:${JSON.stringify({health,item})}`);
            }
            const nasaHealth = provider('nasa-gpm-imerg-early'), nasa = source('nasa-gpm-imerg-early');
            if (String(nasa?.contribution ?? '').includes('Producto GPM IMERG Early V07 disponible con timestamp') || Number(nasa?.latencyMinutes) === 240 && !/[-+]?\d+(?:[.,]\d+)? mm\/h/.test(String(nasa?.contribution ?? ''))) throw new Error(`nasa-metadata-drift:${JSON.stringify({nasaHealth,nasa})}`);
            const connected = nasa?.connected === true && /[-+]?\d+(?:[.,]\d+)? mm\/h/.test(String(nasa.contribution)) && String(nasa.url).includes('/getSamples?') && Number.isFinite(nasa.latencyMinutes);
            const unavailable = nasa?.connected === false && nasa?.status === 'UNAVAILABLE' && nasaHealth?.status === 'UNAVAILABLE' && ['TIMEOUT','HTTP','PARSE','NETWORK','CONTENT_TYPE','BODY_TOO_LARGE','CIRCUIT_OPEN'].includes(nasaHealth?.errorClass) && String(nasa.url).endsWith('/query');
            if (!connected && !unavailable) throw new Error(`nasa:${JSON.stringify({nasaHealth,nasa})}`);
            if (!round.snapshot.systems.find((item) => item.id === 'parana-santa-fe' && item.available) || !round.snapshot.systems.find((item) => item.id === 'salado-santo-tome' && item.available)) throw new Error('systems');
            const matrix = { status: 'VERIFIED_NOT_ACCEPTED', workerVersion: '44dd8390-9f73-40c6-b487-8070445e6b9e', round };
            fs.writeFileSync(`${process.env.EVIDENCE_DIR}/production-matrix.json`, JSON.stringify(matrix, null, 2));
            console.log(JSON.stringify({ status: matrix.status, providers, sources }, null, 2));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Synchronize exact implementation and remove disposable workflows
        run: |
          git config user.name 'SOS-SF ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/all-sources-013-discovery.yml \
            .github/workflows/all-sources-013-workers-first.yml \
            .github/workflows/all-sources-013-workers-first-rerun.yml \
            .github/workflows/all-sources-013-workers-first-final.yml \
            .github/workflows/all-sources-013-workers-first-metadata.yml \
            .github/workflows/nasa-013-probe.yml
          git add -A
          git commit -m 'fix: reconcile all sources and bound NASA raster sampling'
          git push origin HEAD:arq/visual-dashboard-v3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-sources-013-final-reconciliation-${{ github.run_id }}
          path: artifacts/all-sources-013-final-reconcile
          if-no-files-found: error
          retention-days: 30
