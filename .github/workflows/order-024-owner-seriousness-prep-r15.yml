name: order-024-owner-seriousness-prep-r15

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/order-024-owner-seriousness-prep-r15.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: arq/visual-dashboard-v3
      SOURCE_HEAD: 4be98bdbc26b8a5c15243729afb23b0868454fad
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Align authored 15px inset with Chromium subpixels
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/owner-left-inset.spec.ts')
          text = p.read_text()
          replacements = {
            'contentInset >= 15.5': 'contentInset >= 14.5',
            'row.contentInset < 15.5': 'row.contentInset < 14.5',
            'expect(minContentInset).toBeGreaterThanOrEqual(15.5);': 'expect(minContentInset).toBeGreaterThanOrEqual(14.5);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected inset fragment: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git diff --check
          git config user.name 'SOS-SF ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/owner-left-inset.spec.ts
          git commit -m 'test: tolerate authored 15px civic inset subpixels [skip ci]'
          git push origin HEAD:$BRANCH
