name: SOS-SF Order 020 Review

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths:
      - .github/order-020-trigger

permissions:
  contents: write
  actions: read

concurrency:
  group: sos-sf-order-020-review
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/order-020-preliminary

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify corrected product take point
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = arq/visual-dashboard-v3
          git merge-base --is-ancestor ddcd813b3a4f074eb7a0ba4db720a304d352d5de HEAD
          test "$(git rev-parse origin/main)" = 45047d1c1e16941ea37967d67307d0ab17e85fad
          mkdir -p "$EVIDENCE_DIR"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final maintainability remediation
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set overrides.undici=7.29.0
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact wrangler@4.119.0 @cloudflare/workers-types@5.20260801.1
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          auth = Path('src/worker/auth.ts')
          auth_text = auth.read_text()
          auth_old = "if (controller.signal.aborted) throw new Error('GOOGLE_JWKS_TIMEOUT');"
          auth_new = "if (controller.signal.aborted) throw new Error('GOOGLE_JWKS_TIMEOUT', { cause: error });"
          if auth_old in auth_text:
              auth_text = auth_text.replace(auth_old, auth_new)
          elif auth_new not in auth_text:
              raise SystemExit('Google JWKS timeout remediation target is absent')
          auth.write_text(auth_text)

          test = Path('tests/unit/auth.test.ts')
          test_text = test.read_text()
          test_old = "    const verification = verifyGoogleIdToken(token, clientId, now);\n    await vi.advanceTimersByTimeAsync(5_001);\n    await expect(verification).rejects.toThrow('GOOGLE_JWKS_TIMEOUT');"
          test_new = "    const verification = verifyGoogleIdToken(token, clientId, now);\n    const expectedRejection = expect(verification).rejects.toThrow('GOOGLE_JWKS_TIMEOUT');\n    await vi.advanceTimersByTimeAsync(5_001);\n    await expectedRejection;"
          if test_old in test_text:
              test_text = test_text.replace(test_old, test_new)
          elif test_new not in test_text:
              raise SystemExit('Google JWKS timeout test remediation target is absent')
          test.write_text(test_text)

          files = []
          for root in [Path('src'), Path('tests')]:
              files.extend(path for path in root.rglob('*') if path.suffix in {'.ts', '.tsx'})
          files.extend([Path('vite.config.ts'), Path('playwright.config.ts')])
          pattern = re.compile(r"(?P<prefix>\b(?:from|import)\s*\(?\s*['\"])(?P<spec>\.{1,2}/[^'\"]+)(?P<suffix>['\"]\s*\)?)")
          unresolved = []
          changed = []
          known_extensions = {'.ts', '.tsx', '.js', '.jsx', '.json', '.css', '.svg', '.png'}
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text()
              def replace(match):
                  spec = match.group('spec')
                  if Path(spec).suffix in known_extensions:
                      return match.group(0)
                  base = path.parent / spec
                  candidates = [
                      (Path(str(base) + '.ts'), '.ts'),
                      (Path(str(base) + '.tsx'), '.tsx'),
                      (Path(str(base) + '.js'), '.js'),
                      (Path(str(base) + '.jsx'), '.jsx'),
                      (base / 'index.ts', '/index.ts'),
                      (base / 'index.tsx', '/index.tsx'),
                  ]
                  hits = [suffix for candidate, suffix in candidates if candidate.exists()]
                  if len(hits) != 1:
                      unresolved.append({'file': str(path), 'specifier': spec, 'hits': hits})
                      return match.group(0)
                  return match.group('prefix') + spec + hits[0] + match.group('suffix')
              updated = pattern.sub(replace, text)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if unresolved:
              raise SystemExit(f'Unresolved relative imports: {unresolved}')
          for config_path in [Path('tsconfig.app.json'), Path('tsconfig.node.json')]:
              config = json.loads(config_path.read_text())
              config.setdefault('compilerOptions', {})['allowImportingTsExtensions'] = True
              config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n')
          Path('artifacts/order-020-preliminary/import-extension-remediation.json').write_text(
              json.dumps({'changedFileCount': len(changed), 'changedFiles': changed}, indent=2) + '\n'
          )
          PY
          if grep -RInE "(from|import)[[:space:]]*\\(?[[:space:]]*['\"]\\.{1,2}/[^'\"]+['\"]" src tests vite.config.ts playwright.config.ts > "$EVIDENCE_DIR/extensionless-imports.txt"; then
            echo 'Extensionless relative imports remain.' >&2
            exit 1
          fi
          git add package.json package-lock.json src tests vite.config.ts playwright.config.ts tsconfig.app.json tsconfig.node.json "$EVIDENCE_DIR/import-extension-remediation.json"
          git reset "$EVIDENCE_DIR/import-extension-remediation.json"
          git diff --cached --check
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: make relative TypeScript imports loader-explicit'
            git push origin HEAD:arq/visual-dashboard-v3
          fi
          git rev-parse HEAD > "$EVIDENCE_DIR/review-commit.txt"

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Dependency security audit
        shell: bash
        run: |
          set -o pipefail
          npm audit --json | tee "$EVIDENCE_DIR/npm-audit.json"
          npm audit --audit-level=high

      - name: Full deterministic test matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"
          npm run lint 2>&1 | tee "$EVIDENCE_DIR/lint.log"
          npm run test:unit 2>&1 | tee "$EVIDENCE_DIR/unit.log"
          npm run test:contract 2>&1 | tee "$EVIDENCE_DIR/contract.log"
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
          npm run test:worker 2>&1 | tee "$EVIDENCE_DIR/worker.log"
          npm run test:e2e 2>&1 | tee "$EVIDENCE_DIR/e2e.log"

      - name: Revalidate public sources and repository safety surface
        shell: bash
        run: |
          set -euo pipefail
          node scripts/revalidate-public-sources.mjs 2>&1 | tee "$EVIDENCE_DIR/source-revalidation.log"
          grep -RInE 'dangerouslySetInnerHTML|eval\(|new Function\(|@ts-ignore|\bany\b' src tests scripts > "$EVIDENCE_DIR/static-risk-search.txt" || true
          find .github/workflows -maxdepth 1 -type f -print | sort > "$EVIDENCE_DIR/versioned-workflows.txt"
          sha256sum "$EVIDENCE_DIR"/screenshots/*.png > "$EVIDENCE_DIR/screenshot-sha256.txt"
          git ls-files | sort > "$EVIDENCE_DIR/repository-inventory.txt"
          git status --short > "$EVIDENCE_DIR/post-review-status.txt"
          tar -czf /tmp/sos-sf-order-020-preliminary.tar.gz "$EVIDENCE_DIR"
          sha256sum /tmp/sos-sf-order-020-preliminary.tar.gz > "$EVIDENCE_DIR/preliminary-archive-sha256.txt"

      - name: Upload preliminary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020-preliminary-${{ github.run_number }}
          path: artifacts/order-020-preliminary
          if-no-files-found: warn
          retention-days: 14
