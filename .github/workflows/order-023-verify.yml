name: order-023-verify

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'wrangler*.jsonc'
      - '.github/workflows/order-023-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDENCE_DIR: artifacts/order-023
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "arq/visual-dashboard-v3"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract

      - name: Build and budgets
        run: npm run build

      - name: Worker tests
        run: npm run test:worker

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Final product 023 E2E
        run: npx playwright test tests/e2e/final-product-023.spec.ts

      - name: Cloudflare dry run only
        run: npm run deploy:dry

      - name: Write verification context
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/verification-context.txt" <<EOF
          ORDER=SOS-SF-023-FINAL-PRODUCT-REDESIGN-SHIP
          HEAD=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/main 2>/dev/null || echo unknown)
          DEPLOY_EXECUTED=NO
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-023-verification-${{ github.run_id }}
          path: artifacts/order-023
          if-no-files-found: warn
          retention-days: 7
