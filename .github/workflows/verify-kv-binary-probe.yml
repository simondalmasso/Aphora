name: Verify KV Binary Probe

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/verify-kv-binary-probe-trigger]

permissions:
  contents: read

concurrency:
  group: sos-sf-kv-binary-probe
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/kv-binary-probe
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  OWNER_VISUAL_CONFIRMATION: WORKERS_FREE_CONFIRMED
  BUDGET_MAX_USD: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact KV source and verifier patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          expected_parts = [
              'b419d7560457640f637118680a38d4ffadc4788f0eadd328b560575be4781fa0',
              '2840b4dddf6674c1fd166da1cb26d7b614c7b6e09ba387206d920a5716decdba',
              '388d8b6ab894c8d4e3adffd18614866d6bf12b7cdb37d99d240969a93a20cb9a',
              'd776c0cbf06354d274c8392d927a3a7882f4f3beeef65b0a5ef5ccfac749ef91',
              '469b0461f75f597ed5d96f4cc0f0900ed34000b45be5f64ee2e99b4aa8e08cc7',
              '8cfdebc50bf5f72777065fcf23f7493b44993ab5ca830bd8f94e72599aca7450',
              '254e05a4b0205134e29e842505325e44703f85c341202c4be62f76248e9ecbe3',
              'a616c5134f6dc1924472bee8f7725396eb3c96b2ae4e5026cee5bc33544df894',
          ]
          chunks = []
          for index, expected in enumerate(expected_parts):
              data = Path(f'.github/v3-full-014-parts/part{index:02d}').read_text().strip()
              actual = hashlib.sha256(data.encode()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'PATCH_PART_HASH_MISMATCH:{index:02d}:{actual}')
              chunks.append(data)
          encoded = ''.join(chunks)
          if hashlib.sha256(encoded.encode()).hexdigest() != '32fe8c0f7741c3f996a5bb1dce5e4b22e5833a7d53b5ffc5611d83e7c6d436bd':
              raise SystemExit('PATCH_TRANSPORT_HASH_MISMATCH')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '4be4aaf954713be50e56eee4de6118ec767cf6b9b63b86189c3fc6a0b5f20400':
              raise SystemExit('PATCH_CONTENT_HASH_MISMATCH')
          Path('/tmp/base.patch').write_bytes(patch)

          entries = [
              ('.github/v3-full-014-provision-fix.patch.b64', False,
               'bf4117c00120a1118737d8568d10202515610d1dc78b5384da8ce49e95e4bf98',
               'e89bdaef77e5e8c9111a6bfc506e2fb63995869fa5d65d09819a92d41313ae4c', '/tmp/provision.patch'),
              ('.github/v3-full-014-kv-free.patch.gz.b64', True,
               'bce53f835ef4ce8770a1bd1464ebcc2d420ef18cd031a035fb8b7e30be023b89',
               'a3b10732ca4c6d4f4cd6649c162ae589c28641c74b050eb0acfa6cd8fd79d220', '/tmp/kv.patch'),
              ('.github/v3-full-014-owner-free.patch.gz.b64', True,
               'd73cf0eccb264c72fe7c5cab152de1863a342078db831955a7ca6d145fc30c4f',
               '038c7c2ce368a320029c76ecfaba3c532e325a3f6a91a63c3222ac2b3791c5e3', '/tmp/owner.patch'),
              ('.github/v3-full-014-kv-probe-fix.patch.gz.b64', True,
               '36cebd6148ba5b67b170d255253a66302f2f63c0a542b0f2f1fb5f0a0e4eb3d0',
               'c2fe2a1b4ad293c0a34d2c8ce323e6f40632f2efbb607f6b3f459bc6badd2715', '/tmp/probe.patch'),
          ]
          report = []
          for path, compressed, expected_transport, expected_content, output in entries:
              encoded = Path(path).read_text().strip()
              actual_transport = hashlib.sha256(encoded.encode()).hexdigest()
              if actual_transport != expected_transport:
                  raise SystemExit(f'TRANSPORT_HASH_MISMATCH:{path}:{actual_transport}')
              content = base64.b64decode(encoded, validate=True)
              if compressed:
                  content = gzip.decompress(content)
              actual_content = hashlib.sha256(content).hexdigest()
              if actual_content != expected_content:
                  raise SystemExit(f'CONTENT_HASH_MISMATCH:{path}:{actual_content}')
              Path(output).write_bytes(content)
              report.extend([f'{path}:transport={actual_transport}', f'{path}:content={actual_content}'])
          Path('artifacts/kv-binary-probe/patch-hashes.txt').write_text('\n'.join(report) + '\n')
          PY
          git apply --index /tmp/base.patch
          git apply --index /tmp/provision.patch
          git apply --index /tmp/kv.patch
          git apply --index /tmp/owner.patch
          git apply --index /tmp/probe.patch
          git diff --cached --check

      - name: Resolve existing private KV namespace with GET only
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_VISUAL_CONFIRMATION" = WORKERS_FREE_CONFIRMED
          test "$BUDGET_MAX_USD" = 0
          node <<'NODE'
          const fs = require('node:fs');
          const account = String(process.env.CLOUDFLARE_ACCOUNT_ID ?? '').trim();
          const token = String(process.env.CLOUDFLARE_API_TOKEN ?? '').trim();
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/storage/kv/namespaces?per_page=100`,
            { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } },
          );
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true) {
            throw new Error(`KV_NAMESPACE_LIST_FAILED:${response.status}`);
          }
          const namespace = (Array.isArray(payload.result) ? payload.result : [])
            .find((entry) => entry?.title === 'sos-sf-private-reports');
          if (!namespace?.id) throw new Error('KV_NAMESPACE_NOT_FOUND');
          fs.appendFileSync(process.env.GITHUB_ENV, `KV_NAMESPACE_ID=${namespace.id}\n`);
          fs.writeFileSync(
            `${process.env.EVIDENCE_DIR}/namespace-state.json`,
            `${JSON.stringify({ namespacePresent: true, title: 'sos-sf-private-reports', billingEndpointsQueried: 0, r2EndpointsQueried: 0 }, null, 2)}\n`,
          );
          NODE

      - name: Run bounded binary put get metadata delete probe
        run: node scripts/verify-kv-namespace.mjs

      - name: Require complete cleanup and semantic metadata round trip
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/kv-binary-object-test.json`, 'utf8'));
          if (result.result !== 'PASS') throw new Error('KV_BINARY_PROBE_NOT_PASS');
          if (result.metadataRoundTrip !== true) throw new Error('KV_METADATA_ROUND_TRIP_NOT_PASS');
          if (result.deleteState !== 'PASS') throw new Error('KV_PROBE_DELETE_NOT_PASS');
          NODE
          printf 'KV_BINARY_REMOTE_GATE=PASS\nMUTATION_SCOPE=ONE_TEMPORARY_PUT_GET_DELETE\nBILLING_ENDPOINTS=0\nR2_ENDPOINTS=0\nDEPLOY=0\n' \
            > "$EVIDENCE_DIR/result.txt"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kv-binary-probe-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
