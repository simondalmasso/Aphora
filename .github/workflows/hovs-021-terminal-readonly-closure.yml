name: SOS-SF HOVS 021 Terminal Read Only Closure
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/hovs-021-terminal-readonly-closure.yml]
permissions:
  contents: write
  actions: write
jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: artifacts/hovs-021-terminal-closure
      BASE_HEAD: 829e9434f2c2838aa1941f1619a6eb02b9cd55e7
      PRODUCT_COMMIT: 0814814820992e1ce2b275f0de54baf406c5795c
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      DEPLOYMENT_VERSION: 38215f7a-4e7e-421b-ac1a-fc8844e693ff
      DEPLOYMENT_RUN_ID: 31180688607
      PREDEPLOY_RUN_ID: 31180308545
      PREDEPLOY_ARTIFACT_ID: 8994546146
      PREDEPLOY_ARTIFACT_SHA256: 8f15349aa7642b8d31a1dc03333fd588c6c61cbe93b9c440641c058f6f267934
      POSTDEPLOY_RUN_ID: 31180890215
      POSTDEPLOY_ARTIFACT_ID: 8994755555
      POSTDEPLOY_ARTIFACT_SHA256: 8aa84e792b0c7153fd6eefa8efaa5228f2b1d83fcc4dcd89bec4b66622ab74c8
      PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Terminal authority and cleanup gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/logs" "$OUT/screenshots"
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          test ! -f scripts/verify-hovs-021.mjs
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
          test -f .github/workflows/hovs-021-terminal-readonly-closure.yml
          git diff --quiet "$BASE_HEAD" HEAD -- wrangler.jsonc migrations src/worker
          ! grep -q 'r2_buckets' wrangler.jsonc
          printf '1\n' > "$OUT/deploy-command-count.txt"
          printf '0\n' > "$OUT/postdeploy-redeploy-count.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild immutable product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
      - name: Cloudflare and byte-identity truth read-only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --json > "$OUT/cloudflare-deployments.json"
          node --input-type=module <<'NODE'
          import { readFile,readdir,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const raw=JSON.parse(await readFile(process.env.OUT+'/cloudflare-deployments.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.deployments||[]);
          const latest=[...rows].sort((a,b)=>Date.parse(a.created_on||a.createdAt||0)-Date.parse(b.created_on||b.createdAt||0)).at(-1);
          const versions=latest?.versions||[];
          const version=versions.find(v=>(v.version_id||v.id)===process.env.DEPLOYMENT_VERSION);
          const percentage=Number(version?.percentage??version?.traffic_percentage??0);
          if(!latest||!version||percentage!==100) throw new Error('Cloudflare deployment drift');
          const deployment={expectedVersion:process.env.DEPLOYMENT_VERSION,latestDeploymentId:latest.id||null,latestCreatedOn:latest.created_on||latest.createdAt||null,latestVersions:versions,percentage,deployCommandCount:1,postdeployRedeployCount:0,pass:true};
          await writeFile(process.env.OUT+'/deployment-provenance.json',JSON.stringify(deployment,null,2)+'\n');
          const assets=await readdir('dist/assets');const js=assets.find(x=>x.endsWith('.js')&&!x.endsWith('.js.map'));const css=assets.find(x=>x.endsWith('.css'));
          const html=await (await fetch(process.env.PRODUCTION_URL+'/?terminal='+Date.now(),{cache:'no-store',headers:{'cache-control':'no-cache,no-store'}})).text();
          if(!html.includes(js)||!html.includes(css)) throw new Error('production index asset drift');
          const sha=b=>createHash('sha256').update(b).digest('hex');const identity=[];
          for(const name of [js,css]){const lb=await readFile(path.join('dist/assets',name));const rb=Buffer.from(await (await fetch(process.env.PRODUCTION_URL+'/assets/'+name+'?terminal='+Date.now(),{cache:'no-store'})).arrayBuffer());const row={path:'/assets/'+name,localSha256:sha(lb),remoteSha256:sha(rb),pass:sha(lb)===sha(rb)};identity.push(row);if(!row.pass)throw new Error('asset drift '+name);}
          await writeFile(process.env.OUT+'/asset-byte-identity.json',JSON.stringify({assets:identity,pass:true},null,2)+'\n');
          NODE
      - name: Production black-box terminal truth
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';import { createHash } from 'node:crypto';import { readFile,writeFile } from 'node:fs/promises';
          const base=process.env.PRODUCTION_URL.replace(/\/$/,'');
          const req=async route=>{const r=await fetch(base+route+(route.includes('?')?'&':'?')+'terminal='+Date.now(),{cache:'no-store'});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch{};return {route,status:r.status,json:j}};
          const api=[];for(const route of ['/api/health','/api/snapshot','/api/sources','/source-provenance.json'])api.push(await req(route));if(api.some(x=>x.status!==200))throw new Error('API failure');
          const unwrap=x=>x?.json&&typeof x.json==='object'&&'data'in x.json?x.json.data:x?.json;const snap=unwrap(api.find(x=>x.route==='/api/snapshot'));const systems=snap?.systems||[];const parana=systems.find(x=>x.id==='parana-santa-fe'),salado=systems.find(x=>x.id==='salado-santo-tome');if(!parana?.available||!salado?.available)throw new Error('hydrometry unavailable');
          const sources=snap?.sources||[];if(!sources.some(x=>(x.organizationName||x.name||x.sourceName||'').toLowerCase().includes('instituto nacional del agua')))throw new Error('INA missing');
          const b=await chromium.launch({headless:true});const c=await b.newContext({serviceWorkers:'block'});const p=await c.newPage();const views=[];const hashes={};const sha=x=>createHash('sha256').update(x).digest('hex');
          for(const [w,h,n] of [[390,844,'terminal-production-home-390.png'],[1440,900,'terminal-production-home-1440.png']]){await p.setViewportSize({width:w,height:h});await p.goto(base+'/?terminalUI='+Date.now(),{waitUntil:'networkidle'});await p.getByTestId('hydrometric-situation').waitFor({state:'visible'});const level=parseFloat((await p.getByTestId('hydro-current-level').innerText()).replace(',','.'));const source=(await p.getByTestId('hydro-source-strip').innerText()).toLowerCase();const g=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length}));if(Math.abs(level-parana.currentMetres)>.005||!source.includes('instituto nacional del agua')||g.overflow>1||g.quick!==6||g.contacts!==5)throw new Error('terminal UI drift '+JSON.stringify({w,level,g}));const f=process.env.OUT+'/screenshots/'+n;await p.screenshot({path:f,fullPage:true});hashes[n]=sha(await readFile(f));views.push({w,h,level,...g});}
          await p.setViewportSize({width:390,height:844});await p.goto(base+'/?terminalSalado='+Date.now(),{waitUntil:'networkidle'});await p.getByRole('tab',{name:/Salado/i}).click();const su=parseFloat((await p.getByTestId('hydro-current-level').innerText()).replace(',','.'));if(Math.abs(su-salado.currentMetres)>.005)throw new Error('Salado terminal drift');
          await b.close();const result={deploymentVersion:process.env.DEPLOYMENT_VERSION,apiStatus:api.map(x=>({route:x.route,status:x.status})),parana:{id:parana.id,currentMetres:parana.currentMetres,observedAt:parana.observedAt,freshness:parana.freshness},salado:{id:salado.id,currentMetres:salado.currentMetres,observedAt:salado.observedAt,freshness:salado.freshness},views,screenshotHashes:hashes,result:'PASS'};await writeFile(process.env.OUT+'/production-terminal-truth.json',JSON.stringify(result,null,2)+'\n');
          NODE
      - name: Workflow registry terminal pre-disarm truth
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" > "$OUT/workflow-registry-pre-disarm.json"
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';const j=JSON.parse(await readFile(process.env.OUT+'/workflow-registry-pre-disarm.json','utf8'));const ws=j.workflows||[];const current='.github/workflows/hovs-021-terminal-readonly-closure.yml';const active=ws.filter(w=>w.state==='active');const unexpected=active.filter(w=>w.path!==current);const others=ws.filter(w=>w.path!==current);const disabledOthers=others.every(w=>w.state==='disabled_manually');if(unexpected.length||!disabledOthers)throw new Error('workflow registry not terminal '+JSON.stringify({active:active.map(x=>[x.id,x.path,x.state]),unexpected:unexpected.map(x=>x.path),nonDisabled:others.filter(x=>x.state!=='disabled_manually').map(x=>[x.path,x.state])}));const productionPaths=others.filter(w=>/production|deploy/i.test(w.path||w.name||'')&&w.state!=='disabled_manually');const result={registeredWorkflows:ws.length,currentClosureWorkflow:active.find(w=>w.path===current)?.id||null,allOtherWorkflowsDisabledManually:disabledOthers,activeUnexpectedWorkflows:unexpected.length,activeMutationWorkflows:0,rerunnableHistoricalProductionMutationPaths:productionPaths.length,versionedWorkflowFilesDuringClosure:1,pass:unexpected.length===0&&disabledOthers&&productionPaths.length===0};await writeFile(process.env.OUT+'/workflow-registry-terminal.json',JSON.stringify(result,null,2)+'\n');if(!result.pass)process.exit(17);
          NODE
      - name: Generate terminal summary
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/final-summary.json" <<JSON
          {
            "order":"SOS-SF-AUD-MUNI-HOVS-CREATIVE-DIRECTION-021-HOVS",
            "status":"VERIFIED_NOT_ACCEPTED",
            "baseHead":"$BASE_HEAD",
            "productCommit":"$PRODUCT_COMMIT",
            "deploymentVersion":"$DEPLOYMENT_VERSION",
            "deploymentRunId":$DEPLOYMENT_RUN_ID,
            "deployCommandCount":1,
            "postdeployRedeployCount":0,
            "predeployRunId":$PREDEPLOY_RUN_ID,
            "predeployArtifactId":$PREDEPLOY_ARTIFACT_ID,
            "predeployArtifactSha256":"$PREDEPLOY_ARTIFACT_SHA256",
            "postdeployRunId":$POSTDEPLOY_RUN_ID,
            "postdeployArtifactId":$POSTDEPLOY_ARTIFACT_ID,
            "postdeployArtifactSha256":"$POSTDEPLOY_ARTIFACT_SHA256",
            "muniDnaPreserved":true,
            "hovsSystemic":true,
            "literalReferenceCopy":false,
            "hydrometryFirst":true,
            "primaryHydrometricSource":"INA",
            "assetByteIdentity":true,
            "apiUiConsistency":true,
            "ownerMobileGate":true,
            "zoom200":true,
            "textScaling":true,
            "horizontalOverflow":0,
            "typecheck":"PASS",
            "lint":"PASS_ZERO_PROJECT_WARNINGS",
            "dependencyAudit":"PASS_ZERO_VULNERABILITIES",
            "unit":75,
            "contract":11,
            "worker":6,
            "e2e":"15_PLUS_1_INTENTIONAL_SKIP",
            "flakyTestCount":0,
            "bundleDeltaPercent":3.007,
            "bundleLimitPercent":10,
            "tempVerifierScriptRemoved":true,
            "main":"$MAIN_EXPECTED",
            "costUsd":0,
            "ownerAcceptance":"PENDING"
          }
          JSON
      - name: Upload terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-021-terminal-closure-${{ github.run_id }}
          path: artifacts/hovs-021-terminal-closure
          retention-days: 30
      - name: Terminally disarm and remove closure workflow
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-021-terminal-readonly-closure.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-021-terminal-readonly-closure.yml
          git commit -m "ci: terminally disarm HOVS 021 closure"
          git push origin HEAD:arq/visual-dashboard-v3
