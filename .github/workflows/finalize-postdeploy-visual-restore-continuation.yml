name: Finalize Postdeploy Visual Restore Continuation

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/finalize-postdeploy-visual-restore-continuation-trigger]

permissions:
  contents: write

concurrency:
  group: sos-sf-015-visual-restore-finalize-postdeploy
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/finalize-postdeploy-visual-restore-continuation
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  ORDER_ID: SOS-SF-015-VISUAL-PRODUCT-RESTORE-A-CONTINUATION-01
  DEPLOYMENT_VERSION_ID: 672106fb-575d-48d5-a9de-4a20e6d02f73
  DEPLOY_RUN_ID: '31022595833'
  EXPECTED_PRODUCT_TREE_SHA256: 274e51ce655ebf4c82c894843a8549b249191c436d3736e356748d16183cf940

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert finalization is GET-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/production-screenshots"
          test "$GITHUB_REF_NAME" = arq/visual-dashboard-v3
          git merge-base --is-ancestor 530cc522178225115ccfe13315261f69e7e3f716 HEAD
          ! grep -Eqi 'wrangler[[:space:]]+deploy|wrangler[[:space:]]+secret|d1[[:space:]].*--remote|kv[[:space:]]+(key|namespace).*(put|delete|create)|curl[^\n]*-[^-]*X[[:space:]]*(POST|PUT|PATCH|DELETE)' .github/workflows/finalize-postdeploy-visual-restore-continuation.yml
          printf 'DEPLOY_COMMAND_COUNT=0\nGET_ONLY_PRODUCTION=true\nCLOUDFLARE_MUTATIONS=0\n' > "$EVIDENCE_DIR/contract.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium

      - name: Verify deployed provenance and fail-closed source state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/source-provenance.json?finalize=$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/remote-source-provenance.json"
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/api/snapshot?finalize=$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/snapshot.json"
          curl --fail --silent --show-error --location "$DEPLOYMENT_URL/api/sources?finalize=$GITHUB_RUN_ID" -o "$EVIDENCE_DIR/sources.json"
          node <<'NODE'
          const fs=require('node:fs');
          const provenance=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/remote-source-provenance.json`,'utf8'));
          if(provenance.schemaVersion!==1||provenance.orderId!==process.env.ORDER_ID||String(provenance.deploymentRunId)!==String(process.env.DEPLOY_RUN_ID)||provenance.productTreeSha256!==process.env.EXPECTED_PRODUCT_TREE_SHA256||provenance.includedFileCount!==136) throw new Error('PROVENANCE_MISMATCH');
          const snapshotRaw=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/snapshot.json`,'utf8'));
          const sourceRaw=JSON.parse(fs.readFileSync(`${process.env.EVIDENCE_DIR}/sources.json`,'utf8'));
          const snapshot=snapshotRaw.data||snapshotRaw;
          const matrix=sourceRaw.data||sourceRaw;
          const sources=Array.isArray(matrix.sources)?matrix.sources:[];
          const organizations=Array.isArray(matrix.sourceOrganizations)?matrix.sourceOrganizations:[];
          const ina=sources.filter(source=>source.organizationId==='ina');
          const smn=sources.find(source=>source.id==='smn-alerts');
          if(organizations.length<6||sources.length<10||!ina.some(source=>source.connected===true)||!smn) throw new Error('SOURCE_MATRIX');
          if(smn.connected!==true&&!['FUENTES_DE_ALERTAS_NO_DISPONIBLES','VERIFICACION_DE_ALERTAS_DEGRADADA'].includes(snapshot.alertStatus)) throw new Error('ALERT_SOURCE_NOT_FAIL_CLOSED');
          if(sources.filter(source=>['BLOCKED_CREDENTIAL','BLOCKED_NO_MACHINE_ENDPOINT'].includes(source.classification)).some(source=>source.connected!==false)) throw new Error('BLOCKED_SOURCE_CONNECTED');
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/source-result.txt`,[
            `SOURCE_ORGANIZATION_COUNT=${organizations.length}`,
            `SOURCE_FEED_COUNT=${sources.length}`,
            `ALERT_STATUS=${snapshot.alertStatus}`,
            `SMN_ALERTS_CONNECTED=${smn.connected}`,
            'SOURCE_FAIL_CLOSED=PASS',''].join('\n'));
          NODE

      - name: Verify production graph and all required viewport geometry
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('node:fs');
          const path=require('node:path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results={};
            for(const [name,width,height] of [['320x800',320,800],['390x844',390,844],['768x1024',768,1024],['1024x768',1024,768],['1440x900',1440,900]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              await page.goto(`${process.env.DEPLOYMENT_URL}?finalize=${process.env.GITHUB_RUN_ID}-${name}`,{waitUntil:'networkidle',timeout:60000});
              await page.waitForSelector('[data-testid="main-hydro-chart"]',{state:'visible',timeout:15000});
              const result=await page.evaluate(()=>({
                width:document.documentElement.clientWidth,
                scrollWidth:document.documentElement.scrollWidth,
                graph:Boolean(document.querySelector('[data-testid="main-hydro-chart"]')),
                chartTable:Boolean(document.querySelector('details.data-table-disclosure')),
                institutional:document.body.innerText.includes('Servicio independiente de información pública'),
                forbidden:/Sistema Paraná|Sistema Salado|Datos en vivo|Evolución prevista/.test(document.body.innerText),
              }));
              if(result.scrollWidth>result.width) throw new Error(`OVERFLOW:${name}:${result.scrollWidth}:${result.width}`);
              if(!result.graph||!result.chartTable||!result.institutional||result.forbidden) throw new Error(`PRODUCT_UI:${name}:${JSON.stringify(result)}`);
              await page.screenshot({path:path.join(process.env.EVIDENCE_DIR,'production-screenshots',`${name}.png`),fullPage:true});
              results[name]=result;
              await page.close();
            }
            await browser.close();
            fs.writeFileSync(`${process.env.EVIDENCE_DIR}/production-geometry.json`,JSON.stringify(results,null,2)+'\n');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          printf 'GRAPH_RESTORED=true\nMOBILE_320_OVERFLOW=false\nPRODUCTION_VISUAL=PASS\n' > "$EVIDENCE_DIR/production-visual-result.txt"

      - name: Synchronize exact deployed product and arm terminal
        shell: bash
        run: |
          set -euo pipefail
          cp "$EVIDENCE_DIR/remote-source-provenance.json" public/source-provenance.json
          cat > .github/terminal-visual-restore-continuation-trigger <<EOF
          MODE=TERMINAL_VISUAL_RESTORE_CONTINUATION_01
          ORDER=$ORDER_ID
          DEPLOYMENT_VERSION_ID=$DEPLOYMENT_VERSION_ID
          DEPLOY_RUN=$DEPLOY_RUN_ID
          PRODUCT_TREE_SHA256=$EXPECTED_PRODUCT_TREE_SHA256
          GET_ONLY=true
          CLOUDFLARE_MUTATION=PROHIBITED
          AUD_HOLD=ACTIVE
          EOF
          git add public/source-provenance.json .github/terminal-visual-restore-continuation-trigger
          git diff --cached --check
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git commit -m 'chore: synchronize deployed visual restore source'
          git push origin HEAD:arq/visual-dashboard-v3
          sync_sha="$(git rev-parse HEAD)"
          printf 'STATUS=VERIFIED_NOT_ACCEPTED\nDEPLOY_COMMAND_COUNT=1\nDEPLOYMENT_VERSION_ID=%s\nSYNCHRONIZED_PRODUCT_SHA=%s\nPRODUCT_TREE_SHA256=%s\nCLOUDFLARE_GITHUB_DRIFT=false\nGRAPH_RESTORED=true\nMOBILE_320_OVERFLOW=false\nOFFLINE_SEMANTICS=PASS\n' "$DEPLOYMENT_VERSION_ID" "$sync_sha" "$EXPECTED_PRODUCT_TREE_SHA256" > "$EVIDENCE_DIR/result.txt"

      - name: Upload finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalize-postdeploy-visual-restore-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
