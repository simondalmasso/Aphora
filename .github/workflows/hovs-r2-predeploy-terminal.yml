          Live municipal computed-style extraction was challenged by Cloudflare and is recorded honestly in sf-dna-live-extraction.json. The verified municipal reverse baseline is preserved without copying crest, logo, artwork or font binaries and without claiming pixel-perfect extraction.
          EOF
          cat > "$OUT/hovs-r2-auto-roast.md" <<'EOF'
          # HOVS R2 auto-roast
          1. Dashboard/card stack → replaced by continuous editorial composition.
          2. Equal visual weight → hydrometry owns the strongest scale.
          3. Admin quick grid → numbered civic index.
          4. Emergency service table → 911-led action field.
          5. Technical provenance cards → evidence ledger; compact one-gesture traceability on small screens.
          6. Heavy footer → light civic colophon.
