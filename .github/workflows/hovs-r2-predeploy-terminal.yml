      - name: Evidence documents
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/research/sf-dna-live-extraction.json" "$OUT/sf-dna-live-extraction.json"
          cat > "$OUT/creative-direction-r2.md" <<'EOF'
          # SANTA_FE_CIVIC_DNA × HOVS_CRAFT
          WHY: hydrometric truth must be understood before interface chrome.
          CONCEPT: Santa Fe civic navy/green and public-service restraint rebuilt as a continuous editorial hydrometric field.
          SYSTEM: DATA → SPACE → CONTEXT → ACTION → EVIDENCE. Hydrometry dominates; quick access becomes an index; urgency becomes an action field; provenance becomes a ledger.
