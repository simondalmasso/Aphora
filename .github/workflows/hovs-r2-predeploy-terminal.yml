          await save('design-token-before-after.json',{before:{grammar:'boxed civic dashboard',container:'1240px',radius:'mixed'},after:{navy:'#0a2747',green:'#009b88',brightGreen:'#20b89f',canvas:'#f4f6f3',ink:'#09233f',muted:'#536779',rule:'#c7d2d8',danger:'#b72f3a',container:'1320px',majorRadius:'0',grammar:'editorial rules + whitespace'}});
          await save('typography-system.json',{display:'Arial Narrow / Helvetica Neue Condensed / compatible system sans fallback',ui:'Helvetica Neue / Arial Nova / Arial',copiedFontBinary:false,numeric:'tabular lining nums',mobileActionLabelFloorPx:15,pass:true});
          await save('color-role-map.json',{navy:{hex:'#0a2747',role:'authority/structure'},green:{hex:'#009b88',role:'action/Santa Fe'},canvas:'#f4f6f3',surface:'#ffffff',text:'#09233f',muted:'#536779',border:'#c7d2d8',danger:'#b72f3a',warning:'#9a5a00',success:'#087868',noSaasGradients:true,noAiPurple:true,pass:true});
          await save('layout-grid-matrix.json',{flow:'DATA → SPACE → CONTEXT → ACTION → EVIDENCE',mobile:{gutter:'12–20',composition:'single dominant hydrometric field'},tablet:{header:'collapsed through 1280 to prevent overflow'},desktop:{grid:12,lower:'context left / action+evidence right',maxWidth:1320},pass:true});
          await save('visible-control-audit.json',{mobileHeaderClustersMax:3,primaryTarget:'48x48',secondaryTarget:'44x44',globalMobileControlsReduced:['connection chip','global refresh','messages icon'],capabilitiesPreserved:true,evidence:'mobile-touch-target-audit.json',pass:true});
