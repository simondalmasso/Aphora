          const r=JSON.parse(await readFile(`${o}/responsive-metrics.json`,'utf8')),t=JSON.parse(await readFile(`${o}/mobile-touch-target-audit.json`,'utf8')),n=JSON.parse(await readFile(`${o}/mobile-interactive-neighbor-matrix.json`,'utf8'));await save('accessibility-results.json',{focusVisible:'3px high contrast',keyboardAndChart:'immutable E2E PASS',touchTargets:t.pass,interactiveNeighbors:n.pass,zoom200:r.zoom200LayoutEquivalent.overflow===0,textScale125:r.textScale125.overflow===0,reducedMotion:true,pass:true});
