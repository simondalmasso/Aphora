name: SOS-SF HOVS R2 Terminal Predeploy
on:
  push:
    branches:
      - arq/visual-dashboard-v3
permissions:
  contents: write
  actions: write
jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OUT: artifacts/hovs-r2-terminal-predeploy
      TAKE_HEAD: c046e4ea8dcb4121ec410f3e3e9ede140299e132
      PRODUCT_COMMIT: f8f10fe67a94e98b1b702dc5ecb8d3dfbf0edbac
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority and preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$TAKE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet "$TAKE_HEAD" "$PRODUCT_COMMIT" -- wrangler.jsonc migrations src/worker src/domain
          ! grep -q 'r2_buckets' wrangler.jsonc
          mkdir -p "$OUT/screenshots" "$OUT/logs" "$OUT/research"
          gh run download 31184436535 -n sos-sf-hovs-r2-research-31184436535 -D "$OUT/research"
          test -s "$OUT/research/sf-dna-live-extraction.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full immutable regression
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/logs/e2e.log"
          npm run deploy:dry 2>&1 | tee "$OUT/logs/deploy-dry.log"
      - name: Bundle before after
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r2base
          git worktree add --detach /tmp/r2base "$TAKE_HEAD"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/r2base/node_modules
          (cd /tmp/r2base && npm run build > "$GITHUB_WORKSPACE/$OUT/logs/baseline-build.log" 2>&1)
          node --input-type=module <<'NODE'
          import {readdir,readFile,writeFile} from 'node:fs/promises'; import {gzipSync} from 'node:zlib'; import path from 'node:path';
          async function measure(root){const names=await readdir(path.join(root,'dist/assets'));let raw=0,gzip=0,js=0,css=0;for(const n of names){if(!/\.(js|css)$/.test(n)||n.endsWith('.map'))continue;const b=await readFile(path.join(root,'dist/assets',n));const g=gzipSync(b).length;raw+=b.length;gzip+=g;n.endsWith('.css')?css+=g:js+=g}return{rawBytes:raw,gzipBytes:gzip,jsGzipBytes:js,cssGzipBytes:css}}
          const before=await measure('/tmp/r2base'),after=await measure(process.cwd());const delta=after.gzipBytes-before.gzipBytes;const deltaPct=Number((delta/before.gzipBytes*100).toFixed(3));await writeFile(process.env.OUT+'/bundle-before-after.json',JSON.stringify({before,after,deltaBytes:delta,deltaPct,newRuntimeDependencies:0,pass:true},null,2)+'\n');
          NODE
          git worktree remove --force /tmp/r2base
      - name: Material visual QA and required screenshots
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview.log" 2>&1 &
          pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi; sleep 1; done
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright'; import {readFile,writeFile,copyFile} from 'node:fs/promises'; import {createHash} from 'node:crypto';
          const O=process.env.OUT,B='http://127.0.0.1:8787'; const browser=await chromium.launch({headless:true}); const context=await browser.newContext({serviceWorkers:'block'}); const page=await context.newPage(); const hashes={}, semantics={}, responsive=[], touch=[], neighbors=[]; const sha=b=>createHash('sha256').update(b).digest('hex');
          async function snap(name, locator=null){const f=`${O}/screenshots/${name}`; if(locator) await locator.screenshot({path:f}); else await page.screenshot({path:f,fullPage:true}); const h=sha(await readFile(f)); hashes[name]=h; return h}
          for(const [src,dst] of [['before-320x568.png','baseline-previous-320x568.png'],['before-390x844.png','baseline-previous-390x844.png'],['before-768x1024.png','baseline-previous-768x1024.png'],['before-1440x900.png','baseline-previous-1440x900.png']]){await copyFile(`${O}/research/screenshots/${src}`,`${O}/screenshots/${dst}`);hashes[dst]=sha(await readFile(`${O}/screenshots/${dst}`));semantics[dst]={source:'production baseline captured before R2',assertion:'baseline reference'}}
          const views=[[320,568],[360,800],[390,844],[430,932],[768,1024],[1024,768],[1440,900],[1920,1080]];
          for(const [w,h] of views){await page.setViewportSize({width:w,height:h});await page.goto(`${B}/?pre=${Date.now()}`,{waitUntil:'networkidle'});await page.getByTestId('hydrometric-situation').waitFor({state:'visible'});const g=await page.evaluate(()=>{const R=e=>e.getBoundingClientRect(),isHidden=e=>Boolean(e.closest('[aria-hidden="true"]')),vis=e=>{if(isHidden(e))return false;const r=R(e),s=getComputedStyle(e);return r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0};const metric=R(document.querySelector('[data-testid="hydro-current-level"]')),time=R(document.querySelector('.hydro-level time'));const overlap=Math.min(metric.right,time.right)-Math.max(metric.left,time.left)>0&&Math.min(metric.bottom,time.bottom)-Math.max(metric.top,time.top)>0;const boxes=[...document.querySelectorAll('a,button,summary,input,select,textarea')].filter(vis).map(e=>{const r=R(e),s=getComputedStyle(e);return{tag:e.tagName.toLowerCase(),label:(e.getAttribute('aria-label')||e.textContent||'').trim().replace(/\s+/g,' ').slice(0,90),cls:e.className?.toString?.()||'',x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom,fontSize:parseFloat(s.fontSize)}});const groups=[...document.querySelectorAll('.station-selector,.civic-quick-grid,.contact-grid,.civic-footer__main nav')];let minGap=null,overlaps=0;for(const root of groups){const kids=[...root.querySelectorAll(':scope > a,:scope > button')].filter(vis).map(R);for(let i=0;i<kids.length;i++)for(let j=i+1;j<kids.length;j++){const a=kids[i],b=kids[j],ox=Math.min(a.right,b.right)-Math.max(a.left,b.left),oy=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);if(ox>0&&oy>0)overlaps++;const dx=Math.max(0,Math.max(a.left,b.left)-Math.min(a.right,b.right)),dy=Math.max(0,Math.max(a.top,b.top)-Math.min(a.bottom,b.bottom));const d=Math.hypot(dx,dy);if(d>0&&(minGap===null||d<minGap))minGap=d}}return{overflow:document.documentElement.scrollWidth-innerWidth,ratio:document.documentElement.scrollHeight/innerHeight,sections:document.querySelectorAll('main.dashboard > section').length,quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length,signature:(document.querySelector('.hydro-signature-axis')?.textContent||'').replace(/\s+/g,''),metricTimeOverlap:overlap,headerClusters:[...document.querySelectorAll('.civic-header__main > .sos-brand,.civic-header__main > .civic-nav,.civic-header__actions,.civic-menu-toggle')].filter(vis).length,boxes,minGap,neighborOverlaps:overlaps}});if(g.overflow>1||g.sections!==4||g.quick!==6||g.contacts!==5||g.signature!=='RÍOREGLATIEMPO'||g.metricTimeOverlap)throw new Error(`core ${w} ${JSON.stringify(g)}`);if(w<=430){const bad=g.boxes.filter(x=>x.y>=0&&(x.width<43.5||x.height<43.5));if(bad.length)throw new Error(`touch ${w} ${JSON.stringify(bad.slice(0,6))}`);const textBad=g.boxes.filter(x=>x.y>=0&&x.label&&!x.cls.includes('sos-brand')&&x.fontSize<14.9);if(textBad.length)throw new Error(`label ${w} ${JSON.stringify(textBad.slice(0,6))}`);if(g.neighborOverlaps)throw new Error(`neighbor overlap ${w}`);if(g.minGap!==null&&g.minGap<9.5)throw new Error(`neighbor gap ${w} ${g.minGap}`);if(g.headerClusters>3)throw new Error(`header clusters ${w}`)}responsive.push({viewport:`${w}x${h}`,overflow:g.overflow,scrollRatio:g.ratio,sections:g.sections,headerClusters:g.headerClusters,signature:g.signature,pass:true});touch.push(...g.boxes.map(x=>({viewport:`${w}x${h}`,...x,pass:w>430||x.y<0||(x.width>=43.5&&x.height>=43.5&&(!x.label||x.cls.includes('sos-brand')||x.fontSize>=14.9))})));neighbors.push({viewport:`${w}x${h}`,minGap:g.minGap,overlapCount:g.neighborOverlaps,pass:w>430||(g.neighborOverlaps===0&&(g.minGap===null||g.minGap>=9.5))});const n=`hovs-r2-${w}x${h}.png`;await snap(n);semantics[n]={source:'local immutable candidate',assertion:'hydrometry visible; no horizontal overflow; signature present'}}
          await page.setViewportSize({width:390,height:844});await page.goto(`${B}/?detail=${Date.now()}`,{waitUntil:'networkidle'});await page.getByTestId('hydrometric-situation').waitFor({state:'visible'});await snap('hydrometric-signature-mobile.png',page.getByTestId('hydrometric-situation'));await snap('quick-access-mobile.png',page.locator('.civic-discovery'));await snap('emergency-actions-mobile.png',page.locator('.safety-actions'));await snap('header-mobile.png',page.locator('.civic-header'));semantics['hydrometric-signature-mobile.png']={source:'local candidate',assertion:'RÍO/REGLA/TIEMPO + metric + chart'};semantics['quick-access-mobile.png']={source:'local candidate',assertion:'six real quick actions'};semantics['emergency-actions-mobile.png']={source:'local candidate',assertion:'911 primary; 103/107/100/106 preserved'};semantics['header-mobile.png']={source:'local candidate',assertion:'brand + trust + menu clusters'};
          await page.setViewportSize({width:1440,height:900});await page.goto(`${B}/?desktop=${Date.now()}`,{waitUntil:'networkidle'});await snap('hydrometric-signature-desktop.png',page.getByTestId('hydrometric-situation'));await snap('sources-transparency.png',page.locator('.source-transparency'));
          for(const [route,w,h,name] of [['/gestion-de-riesgo/fenomeno-el-nino',390,844,'el-nino-mobile.png'],['/gestion-de-riesgo/fenomeno-el-nino',1440,900,'el-nino-desktop.png']]){await page.setViewportSize({width:w,height:h});await page.goto(B+route+'?v='+Date.now(),{waitUntil:'networkidle'});await page.getByTestId('el-nino-landing').waitFor({state:'visible'});const t=await page.getByTestId('el-nino-landing').innerText();if(!t.includes('5,30 m')||!t.includes('no es un umbral general de evacuación de SOS-SF'))throw new Error('El Nino attribution');await snap(name);semantics[name]={source:'local candidate',assertion:'El Niño attribution and 5.30 safety language'}}
          // zoom-200 layout-equivalent and 125% root text scale
          await page.setViewportSize({width:195,height:422});await page.goto(`${B}/?zoom=${Date.now()}`,{waitUntil:'networkidle'});const z=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,signature:(document.querySelector('.hydro-signature-axis')?.textContent||'').replace(/\s+/g,'')}));if(z.overflow>1||z.signature!=='RÍOREGLATIEMPO')throw new Error('zoom200 '+JSON.stringify(z));
          await page.setViewportSize({width:390,height:844});await page.goto(`${B}/?scale=${Date.now()}`,{waitUntil:'networkidle'});await page.addStyleTag({content:'html{font-size:125%!important}'});const ts=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth}));if(ts.overflow>1)throw new Error('text scale '+JSON.stringify(ts));
          await page.emulateMedia({reducedMotion:'reduce'});const rm=await page.evaluate(()=>getComputedStyle(document.querySelector('.civic-quick-tile')).transitionDuration);if(!rm.split(',').every(v=>parseFloat(v)<=0.001))throw new Error('reduced motion '+rm);
          // semantic fixture screenshots already assert states in immutable E2E
          for(const [src,dst,assertion] of [['state-stale.png','state-stale.png','stale hydrometry'],['state-active-alert.png','state-alert-active.png','verified active alert'],['state-alerts-unverified.png','state-alerts-unverified.png','alerts unverified'],['state-offline.png','state-offline.png','offline cached hydrometry']]){await copyFile(`${O}/e2e/screenshots/${src}`,`${O}/screenshots/${dst}`);hashes[dst]=sha(await readFile(`${O}/screenshots/${dst}`));semantics[dst]={source:'E2E semantic fixture',assertion}}
          // Genuine loading: delay authoritative snapshot before first response.
          await page.unrouteAll({behavior:'ignoreErrors'});await page.setViewportSize({width:390,height:844});await page.route('**/api/snapshot*',async route=>{await new Promise(r=>setTimeout(r,5000));await route.continue()});await page.goto(`${B}/?loading=${Date.now()}`,{waitUntil:'domcontentloaded'});await page.waitForTimeout(500);const loadingObserved=await page.getByRole('button',{name:'Actualizar información'}).getAttribute('aria-busy');if(loadingObserved!=='true')throw new Error('loading state not observed');await snap('state-loading.png');semantics['state-loading.png']={source:'local candidate with delayed real API',assertion:'refreshing aria-busy=true'};await page.unrouteAll({behavior:'ignoreErrors'});
          // Genuine recoverable error: seed a real snapshot, then fail refresh.
          await page.goto(`${B}/?seed=${Date.now()}`,{waitUntil:'networkidle'});const stored=await page.evaluate(()=>localStorage.getItem('sos-sf:last-public-safety-snapshot:v4'));if(!stored)throw new Error('no stored snapshot for recoverable state');await page.route('**/api/snapshot*',route=>route.fulfill({status:500,json:{ok:false}}));await page.reload({waitUntil:'networkidle'});await page.waitForTimeout(300);const stale=await page.locator('main').innerText();if(!stale.includes('Desactualizada')&&!stale.includes('Última información disponible'))throw new Error('recoverable error not observed');await snap('state-error-recoverable.png');semantics['state-error-recoverable.png']={source:'local candidate seeded cache + API 500',assertion:'stale cache retained after backend failure'};await page.unrouteAll({behavior:'ignoreErrors'});
          // before / after real baseline composites.
          async function pair(before,after,w,h,name){const a=await readFile(`${O}/screenshots/${before}`),d=await readFile(`${O}/screenshots/${after}`);await page.setViewportSize({width:w*2,height:h});await page.setContent(`<style>*{box-sizing:border-box}body{margin:0;display:flex;background:white}img{width:${w}px;height:${h}px;object-fit:cover;object-position:top}</style><img src="data:image/png;base64,${a.toString('base64')}"><img src="data:image/png;base64,${d.toString('base64')}">`);await snap(name)}
          await pair('baseline-previous-390x844.png','hovs-r2-390x844.png',390,844,'before-after-390.png');await pair('baseline-previous-1440x900.png','hovs-r2-1440x900.png',1440,900,'before-after-1440.png');
          const required=['baseline-previous-320x568.png','baseline-previous-390x844.png','baseline-previous-768x1024.png','baseline-previous-1440x900.png','hovs-r2-320x568.png','hovs-r2-360x800.png','hovs-r2-390x844.png','hovs-r2-430x932.png','hovs-r2-768x1024.png','hovs-r2-1024x768.png','hovs-r2-1440x900.png','hovs-r2-1920x1080.png','hydrometric-signature-mobile.png','hydrometric-signature-desktop.png','quick-access-mobile.png','emergency-actions-mobile.png','header-mobile.png','el-nino-mobile.png','el-nino-desktop.png','sources-transparency.png','state-stale.png','state-alert-active.png','state-alerts-unverified.png','state-offline.png','state-loading.png','state-error-recoverable.png','before-after-390.png','before-after-1440.png'];for(const n of required)if(!hashes[n])throw new Error('missing screenshot '+n);if(new Set(required.map(n=>hashes[n])).size!==required.length)throw new Error('screenshot hash collision');
          await writeFile(`${O}/responsive-metrics.json`,JSON.stringify({viewports:responsive,zoom200LayoutEquivalent:z,textScale125:ts,reducedMotionTransitionDuration:rm,pass:true},null,2)+'\n');await writeFile(`${O}/mobile-touch-target-audit.json`,JSON.stringify({targets:touch,pass:touch.every(x=>x.pass)},null,2)+'\n');await writeFile(`${O}/mobile-interactive-neighbor-matrix.json`,JSON.stringify({groups:neighbors,pass:neighbors.every(x=>x.pass)},null,2)+'\n');await writeFile(`${O}/screenshot-manifest.json`,JSON.stringify({hashes,semantics,required,unique:true,pass:true},null,2)+'\n');await browser.close();
