name: Terminal KV Free V3

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/terminal-kv-free-v3-trigger]

permissions:
  contents: read
  issues: write

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/v3-terminal-kv-free
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  EXPECTED_PRODUCT_TREE_SHA256: 29142bec100ff0fe3f09f9ba2fdc09b5d01c7d01842050c127f90c1be3ad35f4
  EXPECTED_INCLUDED_FILE_COUNT: '127'
  EXPECTED_DEPLOYMENT_RUN_ID: '30995181228'
  EXPECTED_DEPLOYMENT_VERSION_ID: de19ac00-44d7-48be-9bfe-0fdfc001af4b

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact terminal source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert terminal mode and zero mutation surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          grep -q '^MODE=TERMINAL_V3_FULL_014$' .github/arq-v3-deploy-trigger
          grep -q '^OWNER_VISUAL_CONFIRMATION=WORKERS_FREE_CONFIRMED$' .github/arq-v3-deploy-trigger
          grep -q '^BUDGET_MAX_USD=0$' .github/arq-v3-deploy-trigger
          test -z "$(git status --porcelain --untracked-files=no)"
          test -f migrations/0005_report_photo_kv_storage.sql
          grep -q 'REPORTS_KV' src/worker/reports.ts
          grep -q 'WORKERS_KV_FREE' scripts/provision-cloudflare.mjs
          test ! -e .github/v3-full-014-kv-free.patch.gz.b64
          test ! -e .github/v3-full-014-owner-free.patch.gz.b64
          test ! -e .github/v3-full-014-kv-probe-fix.patch.gz.b64
          test ! -e .github/v3-full-014-provision-fix.patch.b64
          if grep -RInE 'REPORTS_BUCKET|r2_buckets|/r2/' src scripts/provision-cloudflare.mjs wrangler.jsonc wrangler.test.jsonc; then
            echo 'R2_OPERATIONAL_DEPENDENCY_PRESENT' >&2
            exit 1
          fi
          printf 'MODE=TERMINAL_V3_FULL_014\nMUTATING_REQUESTS=0\nPROVISIONING=SKIPPED\nMIGRATIONS=SKIPPED\nKV_WRITES=SKIPPED\nDEPLOY=SKIPPED\nSYNC=SKIPPED\nBILLING_ENDPOINTS=0\nR2_ENDPOINTS=0\n' > "$EVIDENCE_DIR/mutation-proof.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production GET-only matrix
        env:
          EXPECT_PRIVATE_FEATURES: 'true'
          WRITE_PROOF: '1'
        run: npm run verify:remote -- "$DEPLOYMENT_URL"

      - name: Verify private GET-only negative paths
        shell: bash
        run: |
          set -euo pipefail
          origin="$DEPLOYMENT_URL"
          session_status="$(curl -fsS -o /tmp/session.json -w '%{http_code}' "$origin/api/session?terminal=$GITHUB_RUN_ID")"
          test "$session_status" = 200
          node -e "const x=require('/tmp/session.json');const d=x.data||x;if(d.enabled!==true||d.authenticated!==false)process.exit(1)"
          private_status="$(curl -sS -o /tmp/private.json -w '%{http_code}' "$origin/api/private/reports?terminal=$GITHUB_RUN_ID")"
          test "$private_status" = 401
          node -e "const x=require('/tmp/private.json');if((x.data?.error?.code||x.error?.code||x.code)!=='AUTHENTICATION_REQUIRED')process.exit(1)"
          printf 'session_anonymous=200\nprivate_unauthenticated=401\ninvalid_google_credential_remote_post=SKIPPED_TO_PRESERVE_NON_MUTATING_TERMINAL\ninvalid_google_credential_contract=LOCAL_UNIT_AND_SOURCE_VERIFIED_400_CONTENT_REJECTED\n' > "$EVIDENCE_DIR/private-negative-get-only.txt"

      - name: Verify exact GitHub and Cloudflare product provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          excluded = ('.github/', 'artifacts/', 'dist/')
          marker = 'public/source-provenance.json'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          digest = hashlib.sha256()
          included = 0
          for raw in sorted(item for item in paths if item):
              path = raw.decode()
              if path == marker or path.startswith(excluded):
                  continue
              data = Path(path).read_bytes()
              digest.update(path.encode())
              digest.update(b'\0')
              digest.update(len(data).to_bytes(8, 'big'))
              digest.update(data)
              included += 1
          local = {
              'productTreeSha256': digest.hexdigest(),
              'includedFileCount': included,
          }
          if local['productTreeSha256'] != os.environ['EXPECTED_PRODUCT_TREE_SHA256']:
              raise SystemExit(f'GITHUB_PRODUCT_TREE_MISMATCH:{local["productTreeSha256"]}')
          if local['includedFileCount'] != int(os.environ['EXPECTED_INCLUDED_FILE_COUNT']):
              raise SystemExit(f'GITHUB_FILE_COUNT_MISMATCH:{local["includedFileCount"]}')
          Path('/tmp/local-product-tree.json').write_text(json.dumps(local, sort_keys=True))
          PY
          curl -fsS "$DEPLOYMENT_URL/source-provenance.json?terminal=$GITHUB_RUN_ID" > /tmp/remote-source-provenance.json
          node <<'NODE'
          const fs = require('node:fs');
          const local = JSON.parse(fs.readFileSync('/tmp/local-product-tree.json', 'utf8'));
          const committed = JSON.parse(fs.readFileSync('public/source-provenance.json', 'utf8'));
          const remote = JSON.parse(fs.readFileSync('/tmp/remote-source-provenance.json', 'utf8'));
          for (const candidate of [committed, remote]) {
            if (candidate.orderId !== 'SOS-SF-OWNER-V3-FULL-COMPLETION-014') throw new Error('SOURCE_PROVENANCE_ORDER_MISMATCH');
            if (candidate.productTreeSha256 !== local.productTreeSha256) throw new Error('SOURCE_PROVENANCE_DIGEST_MISMATCH');
            if (candidate.includedFileCount !== local.includedFileCount) throw new Error('SOURCE_PROVENANCE_FILE_COUNT_MISMATCH');
            if (String(candidate.deploymentRunId) !== process.env.EXPECTED_DEPLOYMENT_RUN_ID) throw new Error('SOURCE_PROVENANCE_RUN_MISMATCH');
          }
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/cloudflare-github-drift.txt`, [
            `github_product_tree_sha256=${local.productTreeSha256}`,
            `cloudflare_product_tree_sha256=${remote.productTreeSha256}`,
            `included_file_count=${local.includedFileCount}`,
            `deployment_run_id=${remote.deploymentRunId}`,
            `deployment_version_id=${process.env.EXPECTED_DEPLOYMENT_VERSION_ID}`,
            'CLOUDFLARE_GITHUB_DRIFT=false',
            '',
          ].join('\n'));
          NODE

      - name: Record terminal success
        shell: bash
        run: |
          set -euo pipefail
          printf 'STATUS=VERIFIED_NOT_ACCEPTED\nMODE=TERMINAL_V3_FULL_014\nDEPLOY_COMMANDS_THIS_RUN=0\nCLOUDFLARE_MUTATIONS_THIS_RUN=0\nCLOUDFLARE_GITHUB_DRIFT=false\nMAIN_TOUCHED=false\nISSUE_CLOSED=false\nAUD_HOLD=ACTIVE\n' > "$EVIDENCE_DIR/result.txt"

      - name: Publish non-closing terminal checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 8 --repo "$GITHUB_REPOSITORY" --body "## SOS-SF V3-014 — non-mutating TERMINAL verified\n\n- Run: \`$GITHUB_RUN_ID\`\n- Source SHA: \`$GITHUB_SHA\`\n- Deployment run: \`$EXPECTED_DEPLOYMENT_RUN_ID\`\n- Deployment version: \`$EXPECTED_DEPLOYMENT_VERSION_ID\`\n- Product tree: \`$EXPECTED_PRODUCT_TREE_SHA256\`\n- \`CLOUDFLARE_GITHUB_DRIFT=false\`\n- Provisioning, migrations, KV writes, deploy and sync: skipped\n- Billing and R2 endpoints: unused\n- \`main\`: untouched; issue remains open; \`AUD_HOLD=ACTIVE\`\n- Status: \`VERIFIED_NOT_ACCEPTED\`" || true

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-v3-terminal-kv-free-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
