name: SOS-SF MUNI 021 Preflight v2

on:
  push:
    branches: [arq/visual-dashboard-v3]

permissions:
  contents: write
  actions: write

concurrency:
  group: sos-sf-muni-021-preflight-v2
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: artifacts/muni-021-preflight2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "45047d1c1e16941ea37967d67307d0ab17e85fad"
          git merge-base --is-ancestor 810fdc47901adf7aa7108d39f4d4047ae56b3295 HEAD
          mkdir -p "$OUT/screenshots" "$OUT/logs"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Full local gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/logs/e2e.log"
      - name: MUNI local geometry and route proof
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const base='http://127.0.0.1:8787';
          const sizes=[{w:320,h:700},{w:360,h:800},{w:390,h:844},{w:768,h:1024},{w:1024,h:768},{w:1366,h:768},{w:1440,h:900},{w:1920,h:1080}];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const results=[];
          for(const s of sizes){
            await page.setViewportSize({width:s.w,height:s.h});
            await page.goto(base+'/',{waitUntil:'networkidle'});
            await page.getByTestId('hydrometric-situation').waitFor({state:'visible'});
            const m=await page.evaluate(()=>{const h=document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect();const chart=document.querySelector('[data-testid="main-hydro-chart"]')?.getBoundingClientRect();return{overflow:document.documentElement.scrollWidth-innerWidth,ratio:document.documentElement.scrollHeight/innerHeight,hydroWidth:h?.width??0,hydroY:h?.y??9999,chart:chart?{y:chart.y,height:chart.height}:null,sections:document.querySelectorAll('main.dashboard > section').length,quick:document.querySelectorAll('.civic-quick-tile').length,brand:(document.querySelector('.sos-brand__wordmark strong')?.textContent||document.querySelector('.sos-brand__mark b')?.textContent||'').trim()}});
            if(m.overflow>1) throw new Error(`overflow ${s.w}: ${m.overflow}`);
            if(s.w<=430 && m.hydroWidth/s.w<.94) throw new Error(`hydro width ${s.w}: ${m.hydroWidth}`);
            if(s.w===390 && m.hydroY>120) throw new Error(`hydro y ${m.hydroY}`);
            if(m.sections!==4) throw new Error(`home sections ${m.sections}`);
            if(m.quick!==6) throw new Error(`quick tiles ${m.quick}`);
            if(!m.brand.includes('SOS')) throw new Error('independent SOS brand missing');
            if(s.w===390&&m.chart){const visible=Math.max(0,Math.min(s.h,m.chart.y+m.chart.height)-Math.max(0,m.chart.y));if(visible/m.chart.height<.4)throw new Error(`chart visibility ${visible/m.chart.height}`)}
            if([390,768,1440].includes(s.w))await page.screenshot({path:`${process.env.OUT}/screenshots/SOS_HOME_${s.w}x${s.h}.png`,fullPage:true});
            results.push({...s,...m});
          }
          for(const s of [{w:390,h:844},{w:1440,h:900}]){
            await page.setViewportSize({width:s.w,height:s.h});
            await page.goto(base+'/gestion-de-riesgo/fenomeno-el-nino',{waitUntil:'networkidle'});
            await page.getByTestId('el-nino-landing').waitFor({state:'visible'});
            const text=await page.getByTestId('el-nino-landing').innerText();
            for(const required of ['Fenómeno El Niño','Qué puede implicar en Santa Fe','Agenda vigente','Plan de contingencia','5,30 m','no es un umbral general de evacuación de SOS-SF'])if(!text.includes(required))throw new Error(`El Nino missing ${required}`);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);if(overflow>1)throw new Error(`El Nino overflow ${s.w}: ${overflow}`);
            await page.screenshot({path:`${process.env.OUT}/screenshots/SOS_EL_NINO_${s.w}x${s.h}.png`,fullPage:true});
          }
          await page.setViewportSize({width:390,height:844});
          await page.goto(base+'/',{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'Abrir menú'}).click();
          await page.getByRole('navigation',{name:'Navegación móvil'}).waitFor({state:'visible'});
          await page.screenshot({path:`${process.env.OUT}/screenshots/SOS_NAV_OPEN_MOBILE.png`,fullPage:true});
          await writeFile(process.env.OUT+'/geometry.json',JSON.stringify(results,null,2)+'\n');
          await browser.close();
          NODE
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-preflight2-${{ github.run_id }}
          path: artifacts/muni-021-preflight2/
          if-no-files-found: warn
          retention-days: 30
      - name: Disarm preflight mechanisms
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in .github/workflows/muni-021-preflight.yml .github/workflows/muni-021-preflight2.yml; do
            workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq ".workflows[]|select(.path==\"$path\")|.id" | head -n1 || true)
            if [ -n "$workflow_id" ]; then gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable" || true; fi
          done
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/muni-021-preflight.yml .github/workflows/muni-021-preflight2.yml
          git commit -m 'ci: disarm MUNI 021 preflight mechanisms'
          git push origin HEAD:arq/visual-dashboard-v3
