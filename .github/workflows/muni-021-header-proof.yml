name: SOS-SF MUNI 021 Header Proof
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUT: artifacts/muni-021-header-proof
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "45047d1c1e16941ea37967d67307d0ab17e85fad"
          git merge-base --is-ancestor 810fdc47901adf7aa7108d39f4d4047ae56b3295 HEAD
          mkdir -p "$OUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and browser
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
      - name: Prove header and mobile width
        run: |
          npm run preview >/tmp/preview.log 2>&1 & pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'; import { writeFile } from 'node:fs/promises';
          const b=await chromium.launch({headless:true}),p=await b.newPage(),out=[];
          for(const s of [{w:320,h:700},{w:360,h:800},{w:390,h:844},{w:430,h:932}]){await p.setViewportSize({width:s.w,height:s.h});await p.goto('http://127.0.0.1:8787/',{waitUntil:'networkidle'});const m=await p.evaluate(()=>{const c=document.querySelector('.connection-chip')?.getBoundingClientRect(),h=document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect();return{overflow:document.documentElement.scrollWidth-innerWidth,connectionText:(document.querySelector('.connection-chip')?.textContent||'').trim(),connectionWidth:c?.width??0,hydroWidth:h?.width??0}});if(m.overflow>1)throw Error(`overflow ${s.w}`);if(m.hydroWidth/s.w<.94)throw Error(`hydro width ${s.w}`);if(s.w>=360&&(m.connectionText!=='En línea'||m.connectionWidth<55))throw Error(`connection ${s.w}: ${JSON.stringify(m)}`);if(s.w===390)await p.screenshot({path:`${process.env.OUT}/SOS_HEADER_HOME_390x844.png`,fullPage:true});out.push({...s,...m})}await writeFile(process.env.OUT+'/header-proof.json',JSON.stringify(out,null,2)+'\n');await b.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-header-proof-${{ github.run_id }}
          path: artifacts/muni-021-header-proof/
          retention-days: 30
      - name: Disarm
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[]|select(.path==".github/workflows/muni-021-header-proof.yml")|.id'|head -n1||true); [ -z "$id" ] || gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" || true
          git config user.name sos-sf-automation; git config user.email sos-sf-automation@users.noreply.github.com
          git rm .github/workflows/muni-021-header-proof.yml; git commit -m 'ci: disarm MUNI 021 header proof'; git push origin HEAD:arq/visual-dashboard-v3
