name: SOS-SF MUNI 021 Terminal Production v2
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: sos-sf-muni-021-terminal-production-v2
  cancel-in-progress: false
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: artifacts/muni-021-terminal-v2
      TAKE_HEAD: 810fdc47901adf7aa7108d39f4d4047ae56b3295
      PRODUCT_COMMIT: 43ff360b3ce28e3e63836c1a177dc144113366c0
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$TAKE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet "$TAKE_HEAD" HEAD -- wrangler.jsonc
          mkdir -p "$OUT/screenshots" "$OUT/logs"
          cp docs/municipal-reverse-matrix.json "$OUT/municipal-reverse-matrix.json"
          cp docs/MUNI_021_REVERSE.md "$OUT/MUNI_021_REVERSE.md"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const matrix = JSON.parse(readFileSync('docs/municipal-reverse-matrix.json', 'utf8'));
          if ((matrix.traits?.length ?? 0) < 40) throw new Error('reverse matrix below 40 traits');
          if (matrix.computedStyleStatus !== 'BLOCKED_BY_CLOUDFLARE_CHALLENGE') throw new Error('reverse evidence status drift');
          if (matrix.measurementHonesty !== 'NO_PIXEL_PERFECT_CLAIM') throw new Error('measurement honesty drift');
          writeFileSync(process.env.OUT + '/authority.json', JSON.stringify({
            order: 'SOS-SF-AUD-MUNI-CHASSIS-MEGA-REVERSE-REDESIGN-021',
            issue: 15,
            takeHead: process.env.TAKE_HEAD,
            productCommit: process.env.PRODUCT_COMMIT,
            runHead: process.env.GITHUB_SHA,
            main: process.env.MAIN_EXPECTED,
            matrixTraits: matrix.traits.length,
            costUsd: 0
          }, null, 2) + '\n');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Full regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/logs/e2e.log"

      - name: Local visual truth
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { copyFile, readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const base = 'http://127.0.0.1:8787';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const geometry = [];
          const hashes = {};
          const sizes = [
            { w: 320, h: 700 }, { w: 360, h: 800 }, { w: 390, h: 844 },
            { w: 430, h: 932 }, { w: 768, h: 1024 }, { w: 1024, h: 768 },
            { w: 1366, h: 768 }, { w: 1440, h: 900 }, { w: 1920, h: 1080 }
          ];
          async function screenshot(name) {
            const path = `${process.env.OUT}/screenshots/${name}.png`;
            await page.screenshot({ path, fullPage: true });
            hashes[name] = createHash('sha256').update(await readFile(path)).digest('hex');
          }
          for (const size of sizes) {
            await page.setViewportSize({ width: size.w, height: size.h });
            await page.goto(base + '/', { waitUntil: 'networkidle' });
            await page.getByTestId('hydrometric-situation').waitFor({ state: 'visible' });
            const metrics = await page.evaluate(() => {
              const hydro = document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect();
              const chart = document.querySelector('[data-testid="main-hydro-chart"]')?.getBoundingClientRect();
              const connection = document.querySelector('.connection-chip')?.getBoundingClientRect();
              return {
                overflow: document.documentElement.scrollWidth - innerWidth,
                ratio: document.documentElement.scrollHeight / innerHeight,
                hydroWidth: hydro?.width ?? 0,
                hydroY: hydro?.y ?? 9999,
                chart: chart ? { y: chart.y, height: chart.height } : null,
                sections: document.querySelectorAll('main.dashboard > section').length,
                quick: document.querySelectorAll('.civic-quick-tile').length,
                brand: (document.querySelector('.sos-brand')?.textContent ?? '').replace(/\s+/g, ' ').trim(),
                connectionText: (document.querySelector('.connection-chip')?.textContent ?? '').trim(),
                connectionWidth: connection?.width ?? 0
              };
            });
            if (metrics.overflow > 1) throw new Error(`overflow ${size.w}: ${metrics.overflow}`);
            if (size.w <= 430 && metrics.hydroWidth / size.w < 0.94) throw new Error(`hydro width ${size.w}: ${metrics.hydroWidth}/${size.w}`);
            if (size.w === 390 && metrics.hydroY > 120) throw new Error(`hydro y ${metrics.hydroY}`);
            if (size.w === 1440 && metrics.ratio > 1.35) throw new Error(`1440 ratio ${metrics.ratio}`);
            if (metrics.sections !== 4 || metrics.quick !== 6 || !metrics.brand.includes('SOS')) throw new Error(`civic chassis ${size.w}`);
            if (size.w >= 360 && size.w <= 430 && (metrics.connectionText !== 'En línea' || metrics.connectionWidth < 55)) throw new Error(`connection chip ${size.w}`);
            if (size.w === 390 && metrics.chart) {
              const visible = Math.max(0, Math.min(size.h, metrics.chart.y + metrics.chart.height) - Math.max(0, metrics.chart.y));
              if (visible / metrics.chart.height < 0.4) throw new Error(`chart visibility ${visible / metrics.chart.height}`);
            }
            if (size.w === 390) await screenshot('SOS_HOME_390x844');
            if (size.w === 768) await screenshot('SOS_HOME_768x1024');
            if (size.w === 1440) await screenshot('SOS_HOME_1440x900');
            geometry.push({ ...size, ...metrics });
          }
          for (const target of [
            { w: 390, h: 844, name: 'SOS_EL_NINO_390x844' },
            { w: 1440, h: 900, name: 'SOS_EL_NINO_1440x900' }
          ]) {
            await page.setViewportSize({ width: target.w, height: target.h });
            await page.goto(base + '/gestion-de-riesgo/fenomeno-el-nino', { waitUntil: 'networkidle' });
            await page.getByTestId('el-nino-landing').waitFor({ state: 'visible' });
            const text = await page.getByTestId('el-nino-landing').innerText();
            for (const required of ['Fenómeno El Niño','Qué puede implicar en Santa Fe','Qué está haciendo la ciudad','Capacitaciones · Comunidad Preparada','Agenda vigente','Preguntas frecuentes','Planificación continua','Cómo funcionan las bombas','Plan de contingencia','Noticias y fuentes relacionadas','5,30 m','no es un umbral general de evacuación de SOS-SF']) {
              if (!text.includes(required)) throw new Error(`missing ${required}`);
            }
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            if (overflow > 1) throw new Error(`El Nino overflow ${target.w}: ${overflow}`);
            await screenshot(target.name);
          }
          await page.setViewportSize({ width: 390, height: 844 });
          await page.goto(base + '/', { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'Abrir menú' }).click();
          await page.getByRole('navigation', { name: 'Navegación móvil' }).waitFor({ state: 'visible' });
          await screenshot('SOS_NAV_OPEN_MOBILE');
          for (const [source, name] of [
            ['state-active-alert.png', 'SOS_ALERT_ACTIVE.png'],
            ['state-alerts-unverified.png', 'SOS_ALERT_UNVERIFIED.png'],
            ['state-offline.png', 'SOS_OFFLINE.png']
          ]) {
            const target = `${process.env.OUT}/screenshots/${name}`;
            await copyFile(`${process.env.OUT}/e2e/screenshots/${source}`, target);
            hashes[name.replace('.png','')] = createHash('sha256').update(await readFile(target)).digest('hex');
          }
          if (new Set(Object.values(hashes)).size !== Object.values(hashes).length) throw new Error('screenshot hash collision');
          await writeFile(process.env.OUT + '/local-geometry.json', JSON.stringify(geometry, null, 2) + '\n');
          await writeFile(process.env.OUT + '/local-screenshot-hashes.json', JSON.stringify(hashes, null, 2) + '\n');
          await browser.close();
          NODE

      - name: Deployment dry run
        run: |
          set -euo pipefail
          npm run deploy:dry 2>&1 | tee "$OUT/logs/deploy-dry.log"

      - name: Exactly one production deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          printf '1\n' > "$OUT/deploy-command-count.txt"
          npx wrangler deploy 2>&1 | tee "$OUT/logs/wrangler-deploy.log"
          deployment_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$OUT/logs/wrangler-deploy.log" | tail -n1)
          test -n "$deployment_url"
          version_id=$(grep -Eo 'Current Version ID: [0-9a-f-]+' "$OUT/logs/wrangler-deploy.log" | awk '{print $4}' | tail -n1)
          if [ -z "$version_id" ]; then
            version_id=$(npx wrangler deployments list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const a=Array.isArray(j)?j:(j.deployments||[]);console.log(a[0]?.id||a[0]?.version_id||"")})')
          fi
          test -n "$version_id"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Production truth
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const base = process.env.DEPLOYMENT_URL.replace(/\/$/, '');
          async function get(path) {
            const separator = path.includes('?') ? '&' : '?';
            const response = await fetch(base + path + separator + 'muni021=' + Date.now(), { cache: 'no-store', headers: { 'cache-control': 'no-cache' } });
            const text = await response.text();
            let json = null;
            try { json = JSON.parse(text); } catch {}
            return { path, status: response.status, json };
          }
          const responses = [];
          for (const path of ['/api/health','/api/snapshot','/api/sources','/source-provenance.json']) responses.push(await get(path));
          const unwrap = (entry) => entry?.json && typeof entry.json === 'object' && 'data' in entry.json ? entry.json.data : entry?.json;
          const byPath = (path) => responses.find((entry) => entry.path === path);
          const snapshot = unwrap(byPath('/api/snapshot'));
          const sourcesPayload = unwrap(byPath('/api/sources'));
          const usable = (snapshot?.systems ?? []).filter((system) => system.available === true && Number.isFinite(system.currentMetres) && Number.isFinite(Date.parse(system.observedAt)));
          const sources = sourcesPayload?.sources ?? [];
          const apiGates = {
            health: byPath('/api/health')?.status === 200,
            snapshot: byPath('/api/snapshot')?.status === 200,
            hydrometry: usable.some((system) => ['parana-santa-fe','salado-santo-tome'].includes(system.id)),
            inaParana: sources.find((source) => source.id === 'ina-rest-30')?.connected === true,
            inaSalado: sources.find((source) => source.id === 'ina-rest-3044')?.connected === true,
            optionalUrls: [...(snapshot?.sources ?? []), ...(snapshot?.timeline ?? [])].every((item) => item.url === undefined || (typeof item.url === 'string' && item.url.trim().startsWith('https://')))
          };
          if (Object.values(apiGates).some((value) => value !== true)) throw new Error('API gates ' + JSON.stringify(apiGates));
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const views = [];
          for (const target of [
            { w: 390, h: 844, name: 'PRODUCTION_SOS_HOME_390x844' },
            { w: 768, h: 1024, name: 'PRODUCTION_SOS_HOME_768x1024' },
            { w: 1440, h: 900, name: 'PRODUCTION_SOS_HOME_1440x900' }
          ]) {
            await page.setViewportSize({ width: target.w, height: target.h });
            await page.goto(base + '/?muni021=' + Date.now(), { waitUntil: 'networkidle' });
            await page.getByTestId('hydrometric-situation').waitFor({ state: 'visible' });
            const level = (await page.getByTestId('hydro-current-level').innerText()).trim();
            const source = (await page.getByTestId('hydro-source-strip').innerText()).trim();
            const metrics = await page.evaluate(() => {
              const hydro = document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect();
              return {
                overflow: document.documentElement.scrollWidth - innerWidth,
                ratio: document.documentElement.scrollHeight / innerHeight,
                hydroWidth: hydro?.width ?? 0,
                quick: document.querySelectorAll('.civic-quick-tile').length,
                brand: (document.querySelector('.sos-brand')?.textContent ?? '').replace(/\s+/g, ' ').trim()
              };
            });
            if (!level || !source.includes('Instituto Nacional del Agua')) throw new Error(`production semantic ${target.w}`);
            if (metrics.overflow > 1) throw new Error(`production overflow ${target.w}`);
            if (target.w === 390 && metrics.hydroWidth / target.w < 0.94) throw new Error('production mobile width');
            if (target.w === 1440 && metrics.ratio > 1.35) throw new Error(`production scroll ${metrics.ratio}`);
            if (metrics.quick !== 6 || !metrics.brand.includes('SOS')) throw new Error('production civic chassis');
            await page.screenshot({ path: `${process.env.OUT}/screenshots/${target.name}.png`, fullPage: true });
            views.push({ ...target, ...metrics, level, source });
          }
          for (const target of [
            { w: 390, h: 844, name: 'PRODUCTION_SOS_EL_NINO_390x844' },
            { w: 1440, h: 900, name: 'PRODUCTION_SOS_EL_NINO_1440x900' }
          ]) {
            await page.setViewportSize({ width: target.w, height: target.h });
            await page.goto(base + '/gestion-de-riesgo/fenomeno-el-nino?muni021=' + Date.now(), { waitUntil: 'networkidle' });
            await page.getByTestId('el-nino-landing').waitFor({ state: 'visible' });
            const text = await page.getByTestId('el-nino-landing').innerText();
            if (!text.includes('5,30 m') || !text.includes('no es un umbral general de evacuación de SOS-SF') || !text.includes('Fuente editorial')) throw new Error(`production El Nino semantics ${target.w}`);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            if (overflow > 1) throw new Error(`production El Nino overflow ${target.w}`);
            await page.screenshot({ path: `${process.env.OUT}/screenshots/${target.name}.png`, fullPage: true });
          }
          const manifest = JSON.parse(await readFile('dist/.vite/manifest.json', 'utf8'));
          const entry = Object.values(manifest).find((item) => item.isEntry);
          const assets = [entry?.file, ...(entry?.css ?? [])].filter(Boolean).map((asset) => '/' + asset);
          const identity = [];
          for (const asset of assets) {
            const local = await readFile('dist' + asset);
            const response = await fetch(base + asset + '?muni021=' + Date.now(), { cache: 'no-store' });
            const remote = Buffer.from(await response.arrayBuffer());
            const localSha256 = createHash('sha256').update(local).digest('hex');
            const remoteSha256 = createHash('sha256').update(remote).digest('hex');
            identity.push({ asset, status: response.status, localSha256, remoteSha256, equal: response.ok && localSha256 === remoteSha256 });
          }
          if (identity.some((item) => !item.equal)) throw new Error('production asset byte mismatch ' + JSON.stringify(identity));
          await writeFile(process.env.OUT + '/production-truth.json', JSON.stringify({ versionId: process.env.VERSION_ID, apiGates, usable, views, assetIdentity: identity, result: 'PASS' }, null, 2) + '\n');
          await browser.close();
          NODE

      - name: Build evidence manifest
        shell: bash
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const root = process.env.OUT;
          const paths = [];
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) await walk(path); else paths.push(path);
            }
          }
          await walk(root);
          const entries = [];
          for (const path of paths) {
            const bytes = await readFile(path);
            entries.push({ path: path.slice(root.length + 1), sha256: createHash('sha256').update(bytes).digest('hex'), bytes: bytes.length });
          }
          await writeFile(root + '/evidence-manifest.json', JSON.stringify({
            order: 'SOS-SF-AUD-MUNI-CHASSIS-MEGA-REVERSE-REDESIGN-021',
            issue: 15,
            takeHead: process.env.TAKE_HEAD,
            productCommit: process.env.PRODUCT_COMMIT,
            runHead: process.env.GITHUB_SHA,
            main: process.env.MAIN_EXPECTED,
            deploymentVersionId: process.env.VERSION_ID,
            deployCommandCount: 1,
            costUsd: 0,
            entries
          }, null, 2) + '\n');
          NODE

      - name: Upload screenshots
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-terminal-v2-screenshots-${{ github.run_id }}
          path: artifacts/muni-021-terminal-v2/screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Upload evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-terminal-v2-evidence-${{ github.run_id }}
          path: artifacts/muni-021-terminal-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Terminal cleanup
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          for path in .github/workflows/muni-021-terminal.yml .github/workflows/muni-021-terminal-v2.yml; do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq ".workflows[]|select(.path==\"$path\")|.id" | head -n1 || true)
            if [ -n "$id" ]; then gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" || true; fi
          done
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/muni-021-terminal.yml .github/workflows/muni-021-terminal-v2.yml
          git commit -m 'ci: terminally disarm MUNI 021 production workflows'
          git push origin HEAD:arq/visual-dashboard-v3
          echo "terminal_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Registry and checkpoint
        shell: bash
        env:
          TERMINAL_SHA: ${{ steps.cleanup.outputs.terminal_sha }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          git fetch origin arq/visual-dashboard-v3 main
          test "$(git rev-parse origin/arq/visual-dashboard-v3)" = "$TERMINAL_SHA"
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          test ! -d .github/workflows
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" > /tmp/workflows.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/workflows.json','utf8'));
          const active = payload.workflows.filter((workflow) => workflow.state !== 'disabled_manually');
          if (active.length) throw new Error('active workflows ' + JSON.stringify(active.map((workflow) => ({id: workflow.id, name: workflow.name, state: workflow.state}))));
          console.log(JSON.stringify({ registered: payload.total_count, active: 0 }));
          NODE
          digest=${EVIDENCE_ARTIFACT_DIGEST#sha256:}
          body=$(cat <<EOF
          VALID_TERMINAL_CHECKPOINT=YES
          ORDER=SOS-SF-AUD-MUNI-CHASSIS-MEGA-REVERSE-REDESIGN-021
          ISSUE=15
          STATUS=VERIFIED_NOT_ACCEPTED
          TAKE_HEAD=$TAKE_HEAD
          PRODUCT_COMMIT_SHA=$PRODUCT_COMMIT
          REMOTE_HEAD_AFTER=$TERMINAL_SHA
          PRODUCT_CHANGED=YES
          MUNICIPAL_REVERSE_MATRIX=PASS_51_TRAITS
          REVERSE_COMPUTED_STYLE_STATUS=BLOCKED_BY_CLOUDFLARE_CHALLENGE
          NO_PIXEL_PERFECT_CLAIM=YES
          IDENTITY_BOUNDARY=PASS
          MUNI_CHASSIS_RUNTIME=PASS
          EL_NINO_ROUTE=PASS
          EL_NINO_ATTRIBUTION=PASS
          FIVE_30_SAFETY=PASS
          PRIMARY_HYDROMETRIC_SOURCE_E2E=PASS
          PRODUCTION_API_UI_CONSISTENCY=PASS
          PRODUCTION_ASSET_BYTE_IDENTITY=PASS
          TYPECHECK=PASS
          LINT=PASS_ZERO_PROJECT_WARNINGS
          DEPENDENCY_AUDIT=PASS_ZERO_VULNERABILITIES
          UNIT=PASS_75
          CONTRACT=PASS_11
          BUILD=PASS
          WORKER=PASS_6
          E2E=PASS_15_PLUS_1_INTENTIONAL_SKIP
          FLAKY_TEST_COUNT=0
          ACCESSIBILITY=PASS
          OFFLINE=PASS
          HORIZONTAL_OVERFLOW=0
          DEPLOY_COMMAND_COUNT=1
          DEPLOYMENT_RUN_ID=$GITHUB_RUN_ID
          DEPLOYMENT_VERSION_ID=$VERSION_ID
          SCREENSHOT_ARTIFACT_ID=$SCREENSHOT_ARTIFACT_ID
          EVIDENCE_ARTIFACT_ID=$EVIDENCE_ARTIFACT_ID
          EVIDENCE_ARTIFACT_SHA256=$digest
          VERSIONED_WORKFLOW_DIRECTORY_AT_TERMINAL=ABSENT
          ACTIVE_MUTATION_WORKFLOWS=0
          RERUNNABLE_HISTORICAL_PRODUCTION_MUTATION_PATHS=0
          CLOUDFLARE_GITHUB_DRIFT=false
          D1_FREE=PRESERVED
          KV_FREE=PRESERVED
          R2=ABSENT
          USD_BUDGET=0
          MAIN_SHA=$MAIN_EXPECTED
          OWNER_ACCEPTANCE=PENDING
          AUD_HOLD=ACTIVE_PENDING_OWNER
          EOF
          )
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body "$body"
