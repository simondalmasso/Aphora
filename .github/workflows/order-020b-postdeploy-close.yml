name: SOS-SF 020-B GET-only Terminal Close

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/order-020b-postdeploy-trigger]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-order-020b-postdeploy-close
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/order-020b-terminal
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout synchronized canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute GET-only terminal verification and global disarm
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/order020b/postdeploy-execute.sh

      - name: Upload complete terminal screenshots
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020b-terminal-screenshots
          path: artifacts/order-020b-terminal/screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete terminal evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020b-terminal-evidence
          path: artifacts/order-020b-terminal
          if-no-files-found: error
          retention-days: 30

      - name: Publish the only ARQ 020-B checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
        run: node node_modules/.tmp/order020b-checkpoint.mjs

      - name: Remove local generated material
        if: always()
        run: rm -f node_modules/.tmp/order020b-terminal.mjs node_modules/.tmp/order020b-checkpoint.mjs
