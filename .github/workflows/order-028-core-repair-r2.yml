name: order-028-core-repair-r2
on:
  push:
    paths:
      - '.github/workflows/order-028-core-repair-r2.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Rebuild repaired core working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          def extract(path,start_name,end_name,out):
              s=Path(path).read_text(); start=s.index(f'      - name: {start_name}'); run=s.index('        run: |\n',start)+len('        run: |\n'); end=s.index(f'      - name: {end_name}',run); body=s[run:end]
              lines=[line[10:] if line.startswith('          ') else line for line in body.splitlines()]
              Path(out).write_text('\n'.join(lines)+'\n')
          extract('.github/workflows/order-028-core-repair.yml','Reapply core transformation deterministically','Repair compile defects without weakening truth gates','/tmp/reapply.sh')
          extract('.github/workflows/order-028-core-repair.yml','Repair compile defects without weakening truth gates','Validate repaired core tranche','/tmp/fix.sh')
          PY
          bash /tmp/reapply.sh
          bash /tmp/fix.sh
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/domain/temporal-series.ts'); s=p.read_text()
          old="return Object.freeze({ value: latest.metres - reference.metres, status: 'OK', latestAt: latest.at, referenceAt: reference.at, typicalIntervalMs });"
          new="return Object.freeze({ value: latest.metres - reference.metres, status: futureRejected ? 'FUTURE_DATA_REJECTED' : 'OK', latestAt: latest.at, referenceAt: reference.at, typicalIntervalMs });"
          if old not in s: raise SystemExit('temporal final marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate exact core
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm run test:unit
          npm run test:contract
          npm run build
          npm run test:worker
      - name: Commit exact core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sos-sf-arq
          git config user.email actions@users.noreply.github.com
          git add src tests/unit
          git commit -m 'feat(028): harden temporal truth and add flood situation engine [skip ci]'
          git push origin HEAD:refs/heads/arq/visual-dashboard-v3
