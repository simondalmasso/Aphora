name: Export Canonical KV Free Deploy Workflow

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/install-deploy-workers-kv-free-trigger]

permissions:
  contents: read

concurrency:
  group: sos-sf-install-kv-free-deploy-workflow
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and export canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical-kv-free-workflow
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          encoded = Path('.github/deploy-workers-kv-free.yml.gz.b64').read_text().strip()
          actual_transport = hashlib.sha256(encoded.encode()).hexdigest()
          expected_transport = '04393202d6e7f8d5ad40aeb23c46c97467c154242d9041e890eb74198ce4e763'
          if actual_transport != expected_transport:
              raise SystemExit(f'DEPLOY_WORKFLOW_TRANSPORT_HASH_MISMATCH:{actual_transport}')
          content = gzip.decompress(base64.b64decode(encoded, validate=True))
          actual_content = hashlib.sha256(content).hexdigest()
          expected_content = 'b51e0bd37fea1d0304165657e3170eb4384c66e26cd75fd48f6b852bee7c104b'
          if actual_content != expected_content:
              raise SystemExit(f'DEPLOY_WORKFLOW_CONTENT_HASH_MISMATCH:{actual_content}')
          Path('/tmp/canonical-kv-free-workflow/deploy-workers.yml').write_bytes(content)
          Path('/tmp/canonical-kv-free-workflow/sha256.txt').write_text(
              f'transport_sha256={actual_transport}\ncontent_sha256={actual_content}\n',
              encoding='utf-8',
          )
          PY
          grep -q 'Prove Workers Free and D1/KV authority before any mutation' /tmp/canonical-kv-free-workflow/deploy-workers.yml
          grep -q 'Deploy exact Worker once with D1 KV and protected secrets' /tmp/canonical-kv-free-workflow/deploy-workers.yml
          if grep -nE 'Configure and verify R2|r2 bucket|r2 object|Provision or verify D1 and R2' /tmp/canonical-kv-free-workflow/deploy-workers.yml; then
            echo 'R2_DEPLOY_STEP_PRESENT' >&2
            exit 1
          fi

      - name: Upload canonical workflow
        uses: actions/upload-artifact@v4
        with:
          name: canonical-kv-free-deploy-workflow-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/canonical-kv-free-workflow/
          if-no-files-found: error
          retention-days: 7
