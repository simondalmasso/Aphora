name: order-028-core-repair
on:
  push:
    paths:
      - '.github/workflows/order-028-core-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Reapply core transformation deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/order-028-core-apply.yml').read_text()
          start=s.index('      - name: Apply P0 temporal truth and flood situation domain')
          run=s.index('        run: |\n',start)+len('        run: |\n')
          end=s.index('      - name: Install and validate core tranche',run)
          body=s[run:end]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reapply-core.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/reapply-core.sh
      - name: Repair compile defects without weakening truth gates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/domain/validation.ts'); s=p.read_text()
          # The first transform inserted the future check in every identical timestamp block.
          # Keep it for observed points; forecasts have their own future semantics and no maximumAt parameter.
          fs=s.index('function forecasts('); fe=s.index('function thresholds(',fs)
          seg=s[fs:fe]
          seg=seg.replace("    if (maximumAt && time > Date.parse(maximumAt) + CLOCK_SKEW_TOLERANCE_MS) throw new TypeError(`${label}[${index}].at está significativamente en el futuro`);\n",'')
          s=s[:fs]+seg+s[fe:]
          p.write_text(s)

          p=Path('src/worker/live-data.ts'); s=p.read_text(); s=s.replace('  RiverPoint,\n',''); p.write_text(s)

          p=Path('tests/unit/flood-situation-028.test.ts'); s=p.read_text()
          s=s.replace("const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); snap.alertStatus='ALERTA_OFICIAL_ACTIVA'; snap.alerts=[officialAlert()]; const d=deriveFloodSituation(snap);", "const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); const withAlert: Snapshot={...snap,alertStatus:'ALERTA_OFICIAL_ACTIVA',alerts:[officialAlert()]}; const d=deriveFloodSituation(withAlert);")
          s=s.replace("const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); snap.sources=[...snap.sources,{id:'model'", "const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); const withModel: Snapshot={...snap,sources:[...snap.sources,{id:'model'")
          s=s.replace("determinesPrimaryState:false}]; const d=deriveFloodSituation(snap); expect(d.state).toBe('ROUTINE'); expect(d.officialWarningActive).toBe(false); expect(d.officialEmergencyDeclared).toBe(false); });", "determinesPrimaryState:false}]}; const d=deriveFloodSituation(withModel); expect(d.state).toBe('ROUTINE'); expect(d.officialWarningActive).toBe(false); expect(d.officialEmergencyDeclared).toBe(false); });",1)
          s=s.replace("const snap=base([stale,system('salado-santo-tome',3.4,4.7)]); snap.sources=[source(stale),source(snap.systems![1]!),alertSource()]; const d=deriveFloodSituation(snap);", "const snap=base([stale,system('salado-santo-tome',3.4,4.7)]); const degraded: Snapshot={...snap,sources:[source(stale),source(snap.systems![1]!),alertSource()]}; const d=deriveFloodSituation(degraded);")
          s=s.replace("const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); snap.alertStatus='FUENTES_DE_ALERTAS_NO_DISPONIBLES'; snap.sources=[...snap.sources.filter(s=>s.id!=='smn-alerts'),alertSource('UNAVAILABLE')]; const d=deriveFloodSituation(snap);", "const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); const degraded: Snapshot={...snap,alertStatus:'FUENTES_DE_ALERTAS_NO_DISPONIBLES',sources:[...snap.sources.filter(s=>s.id!=='smn-alerts'),alertSource('UNAVAILABLE')]}; const d=deriveFloodSituation(degraded);")
          s=s.replace("const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); snap.sources=[...snap.sources,{id:'community'", "const snap=base([system('parana-santa-fe',3.2,5.3),system('salado-santo-tome',3.4,4.7)]); const withCommunity: Snapshot={...snap,sources:[...snap.sources,{id:'community'")
          # replace final community suffix only
          target="determinesPrimaryState:false}]; const d=deriveFloodSituation(snap); expect(d.state).toBe('ROUTINE'); expect(d.officialEmergencyDeclared).toBe(false); });"
          repl="determinesPrimaryState:false}]}; const d=deriveFloodSituation(withCommunity); expect(d.state).toBe('ROUTINE'); expect(d.officialEmergencyDeclared).toBe(false); });"
          if target not in s: raise SystemExit('community test suffix missing')
          s=s.replace(target,repl,1)
          p.write_text(s)
          PY
      - name: Validate repaired core tranche
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm run test:unit
          npm run test:contract
          npm run build
          npm run test:worker
      - name: Commit repaired core tranche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sos-sf-arq
          git config user.email actions@users.noreply.github.com
          git add src tests/unit
          git commit -m 'feat(028): harden temporal truth and add flood situation engine [skip ci]'
          git push origin HEAD:refs/heads/arq/visual-dashboard-v3
