              await page.screenshot({path:`${out}/screenshots/owner-final-communications-open-mobile.png`,fullPage:true});
            }
            await page.keyboard.press('Escape');
            if(await dialog.isVisible()) throw new Error('escape close failed '+label);
            if(!(await comm.evaluate(el=>document.activeElement===el))) throw new Error('focus return failed '+label);
            await assertHydroUiAgainstApi(label);
            messaging.push({viewport:label,reachable:true,touchTargetHeight:box.height,escapeClose:true,focusReturn:true});
          }

          await page.setViewportSize({width:390,height:844});
          await page.goto(`${base}/?menu-shot=${Date.now()}`,{waitUntil:'networkidle'});
          await page.getByRole('button',{name:'Abrir menú'}).click();
          await page.screenshot({path:`${out}/screenshots/owner-final-mobile-menu-communications.png`,fullPage:true});
          await page.getByRole('button',{name:/Comunicaciones/}).click();
          await page.screenshot({path:`${out}/screenshots/owner-final-communications-open-mobile.png`,fullPage:true});

          await page.setViewportSize({width:1440,height:900});
          await page.goto(`${base}/?owner003desktop=${Date.now()}`,{waitUntil:'networkidle'});
          const desktopButton=page.getByRole('button',{name:'Abrir comunicaciones'});
          if(!await desktopButton.isVisible()) throw new Error('desktop communications absent');
          await page.screenshot({path:`${out}/screenshots/owner-final-home-1440.png`,fullPage:true});
          await desktopButton.click();
          const desktopDialog=page.locator('dialog.messages-panel');
          if(!await desktopDialog.isVisible()) throw new Error('desktop communications open failed');
          await page.screenshot({path:`${out}/screenshots/owner-final-communications-open-desktop.png`,fullPage:true});
          await page.keyboard.press('Escape');
          if(!(await desktopButton.evaluate(el=>document.activeElement===el))) throw new Error('desktop focus return failed');
          await assertHydroUiAgainstApi('desktop');

          await page.setViewportSize({width:390,height:844});
          await page.goto(`${base}/?title-shot=${Date.now()}`,{waitUntil:'networkidle'});
          await page.locator('.hydrometric-hero__header').screenshot({path:`${out}/screenshots/owner-final-hydrometric-title.png`});

          await page.setViewportSize({width:195,height:422});
          await page.goto(`${base}/?zoom200=${Date.now()}`,{waitUntil:'networkidle'});
          const zoom=await page.evaluate(()=>{const t=document.querySelector('#hydrometric-title')?.getBoundingClientRect();const c=document.querySelector('.hydrometric-section')?.getBoundingClientRect();return {contained:!!t&&!!c&&t.left>=c.left-.5&&t.right<=c.right+.5,overflow:document.documentElement.scrollWidth-innerWidth};});
          if(!zoom.contained||zoom.overflow>1) throw new Error('H1 200 zoom equivalent failed '+JSON.stringify(zoom));
          maxOverflow=Math.max(maxOverflow,zoom.overflow);

          await page.goto(`${base}/gestion-de-riesgo/fenomeno-el-nino?owner003=${Date.now()}`,{waitUntil:'networkidle'});
          const el=await page.getByTestId('el-nino-landing').innerText();
          for(const s of ['Fenómeno El Niño','5,30 m','no es un umbral general de evacuación de SOS-SF']) if(!el.includes(s)) throw new Error('El Nino preservation '+s);
          await browser.close();

          const result={
            suborder:'021-HOVS-OWNER-FINAL-CORRECTIVE-003',status:'POSTDEPLOY_TERMINAL_VERIFIED',productCommit:process.env.PRODUCT_COMMIT,
            deploymentVersionId:process.env.VERSION_ID,deployCommandCount:1,postdeployRedeployCount:0,assetIdentity:identity,
            apiStatus:api.map(x=>({route:x.route,status:x.status})),messagingSurfaceRestored:true,publicCommunicationsMobile:true,publicCommunicationsDesktop:true,
            privateMessagingContractPreserved:Boolean(authConfig&&typeof authConfig.enabled==='boolean'),oldH1Absent:true,h1:'Pulso hídrico de Santa Fe',
            leftInsetPass:minInset>=19.5,ruleGapPass:minRuleGap>=15.5,edgeCollisionCount,textBorderTouchCount,zoom200H1:true,
            apiUiConsistency:true,inaTruth:true,elNinoPreserved:true,horizontalOverflow:maxOverflow,messaging,
          };
          await writeFile(out+'/terminal-summary.json',JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Terminal invariants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main arq/visual-dashboard-v3
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          test "$(cat "$OUT/deploy-command-count.txt")" = "1"
          ! grep -q 'r2_buckets' wrangler.jsonc
          echo 0 > "$OUT/postdeploy-redeploy-count.txt"

      - name: Upload terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-owner-final-corrective-003-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 90

      - name: Terminally disarm corrective workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh workflow disable owner-final-corrective-003.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/owner-final-corrective-003.yml
          git commit -m "ci: terminally disarm owner final corrective 003"
          git push origin HEAD:arq/visual-dashboard-v3
