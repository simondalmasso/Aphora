name: SOS-SF Owner Final Corrective 003

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/owner-final-corrective-003.yml']

permissions:
  contents: write
  actions: write

env:
  TAKE_HEAD: e27df8fb664c2a0b37920d0ce61539bd3886a381
  MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
  PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev
  OUT: artifacts/owner-final-corrective-003

jobs:
  correct-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority and clean take-head gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main arq/visual-dashboard-v3
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$TAKE_HEAD" HEAD
          git diff --quiet "$TAKE_HEAD" HEAD -- . ':(exclude).github/workflows/owner-final-corrective-003.yml'
          ! grep -q 'r2_buckets' wrangler.jsonc
          mkdir -p "$OUT/logs" "$OUT/screenshots"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply owner corrective atomically
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one match, got {text.count(old)}')
              p.write_text(text.replace(old,new))

          replace_once('src/client/App.tsx',
          "import './styles/owner-left-inset-002.css';\n",
          "import './styles/owner-left-inset-002.css';\nimport './styles/owner-final-corrective-003.css';\n")
          replace_once('src/client/App.tsx',
          "  const openMessages = () => {\n    setMessagesSeen(true);\n    setMessagesOpen(true);\n  };",
          "  const openMessages = (opener?: HTMLButtonElement | null) => {\n    if (opener) messagesButtonRef.current = opener;\n    setMessagesSeen(true);\n    setMessagesOpen(true);\n  };")

          replace_once('src/client/app/AppShell.tsx',
          "  readonly onMessages: () => void;",
          "  readonly onMessages: (opener?: HTMLButtonElement | null) => void;")
          replace_once('src/client/app/AppShell.tsx',
          "    <IconButton className=\"header-messages-button\" ref={messagesButtonRef} label=\"Abrir comunicaciones\" badge={unread} onClick={onMessages} aria-haspopup=\"dialog\" icon={<svg viewBox=\"0 0 24 24\"><path d=\"M5 5h14v11H9l-4 3V5Z\"/><path d=\"M8 9h8M8 12h5\"/></svg>}/>",
          "    <IconButton className=\"header-messages-button\" ref={messagesButtonRef} label=\"Abrir comunicaciones\" badge={unread} onClick={(event) => onMessages(event.currentTarget)} aria-haspopup=\"dialog\" icon={<svg viewBox=\"0 0 24 24\"><path d=\"M5 5h14v11H9l-4 3V5Z\"/><path d=\"M8 9h8M8 12h5\"/></svg>}/>")
          replace_once('src/client/app/AppShell.tsx',
          "    <MuniCivicHeader currentPath={currentPath} actions={actions}/>",
          "    <MuniCivicHeader currentPath={currentPath} actions={actions} communications={{ unread, onOpen: onMessages }}/>")

          Path('src/client/components/civic/MuniShell.tsx').write_text('''import { useState, type ReactNode } from 'react';
import { CIVIC_PRIMARY_NAV, CIVIC_SECONDARY_NAV, SOSBrand } from './CivicSystem.tsx';

function isActive(currentPath: string, href: string): boolean {
  if (href === '/') return currentPath === '/';
  if (href.startsWith('/#')) return false;
  return currentPath === href || currentPath.startsWith(`${href}/`);
}

interface CommunicationsAction {
  readonly unread: number;
  readonly onOpen: (opener?: HTMLButtonElement | null) => void;
}

export function MuniCivicHeader({ currentPath, actions, communications }: {
  readonly currentPath: string;
  readonly actions: ReactNode;
  readonly communications: CommunicationsAction;
}) {
  const [menuOpen, setMenuOpen] = useState(false);
  return <header className="civic-header app-header">
    <div className="civic-header__utility">
      <span>Santa Fe · monitoreo público</span>
      <span>Producto independiente · fuentes oficiales atribuidas</span>
    </div>
    <div className="civic-header__main header-inner">
      <SOSBrand/>
      <nav className="civic-nav" aria-label="Navegación principal">
        {CIVIC_PRIMARY_NAV.map((item) => <a key={item.label} href={item.href} aria-current={isActive(currentPath, item.href) ? 'page' : undefined}>{item.label}</a>)}
      </nav>
      <div className="civic-header__actions header-actions">{actions}</div>
      <button
        type="button"
        className="civic-menu-toggle"
        aria-expanded={menuOpen}
        aria-controls="civic-mobile-menu"
        aria-label={menuOpen ? 'Cerrar menú' : 'Abrir menú'}
        onClick={() => setMenuOpen((value) => !value)}
      ><span/><span/><span/></button>
    </div>
    <div id="civic-mobile-menu" className={`civic-mobile-menu${menuOpen ? ' civic-mobile-menu--open' : ''}`} aria-hidden={!menuOpen}>
      <nav aria-label="Navegación móvil">
        <button
          type="button"
          className="civic-mobile-communications"
          aria-haspopup="dialog"
          onClick={(event) => communications.onOpen(event.currentTarget)}
        >
          <span>Comunicaciones</span>
          {communications.unread > 0 && <span className="civic-mobile-communications__badge" aria-hidden="true">{Math.min(communications.unread, 9)}</span>}
          {communications.unread > 0 && <span className="sr-only">{communications.unread} {communications.unread === 1 ? 'mensaje sin leer' : 'mensajes sin leer'}</span>}
        </button>
        {CIVIC_PRIMARY_NAV.map((item) => <a key={item.label} href={item.href} aria-current={isActive(currentPath, item.href) ? 'page' : undefined} onClick={() => setMenuOpen(false)}>{item.label}</a>)}
        <div className="civic-mobile-menu__secondary">
          {CIVIC_SECONDARY_NAV.map((item) => <a key={item.label} href={item.href} onClick={() => setMenuOpen(false)}>{item.label}</a>)}
        </div>
      </nav>
    </div>
  </header>;
}
''')

