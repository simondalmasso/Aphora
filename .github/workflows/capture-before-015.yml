name: Capture Before 015

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/capture-before-015-trigger]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture current production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-safety-015/before
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const sizes = [
              ['mobile-360x800', 360, 800],
              ['mobile-390x844', 390, 844],
              ['tablet-768x1024', 768, 1024],
              ['landscape-1024x768', 1024, 768],
              ['desktop-1440x900', 1440, 900],
            ];
            for (const [name, width, height] of sizes) {
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
              await page.goto('https://sos-sf.simondalmasso44.workers.dev', { waitUntil: 'networkidle', timeout: 60000 });
              await page.screenshot({ path: `artifacts/public-safety-015/before/${name}.png`, fullPage: true });
              await page.close();
            }
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: public-safety-015-before-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/public-safety-015/before/
          if-no-files-found: error
          retention-days: 30
