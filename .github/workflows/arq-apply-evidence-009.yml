name: ARQ Apply Evidence 009

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - .github/arq-apply-trigger

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish apply start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/8/comments" --method POST -f body="ARQ_EVIDENCE_009_VALID_PATCH_START\nRUN_ID=${GITHUB_RUN_ID}\nSHA=${GITHUB_SHA}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and apply validated patch
        run: |
          cat .github/arq-valid-patch/*.b64 | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/arq-evidence-009.patch
          printf '%s  %s\n' 'baa4f2e1a08968bd6da5768ee9ee3ff18026c00e336cb42df547202f78cb10f7' '/tmp/arq-evidence-009.patch' | sha256sum --check
          git apply --check /tmp/arq-evidence-009.patch
          git apply /tmp/arq-evidence-009.patch
          rm -rf \
            .github/arq-valid-patch \
            .github/arq-patch-chunks \
            .github/arq-evidence-009.patch \
            .github/arq-apply-trigger \
            .github/workflows/arq-apply-evidence-009.yml
          git config user.name "ARQ Evidence 009"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close AUD evidence and mobile visual hold"
          git push origin HEAD:arq/visual-dashboard-v3
          echo "RESULT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish corrective SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf 'ARQ_EVIDENCE_009_VALID_PATCH_APPLIED\nSHA=%s\nRUN_ID=%s\nAUD_HOLD=ACTIVE\nDEPLOY_PIPELINE=TRIGGERED\n' "$RESULT_SHA" "$GITHUB_RUN_ID")
          gh api "repos/${GITHUB_REPOSITORY}/issues/8/comments" --method POST -f body="$body"
      - name: Publish apply failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/8/comments" --method POST -f body="ARQ_EVIDENCE_009_VALID_PATCH_FAILURE\nRUN_ID=${GITHUB_RUN_ID}\nSHA=${GITHUB_SHA}"
