name: SOS-SF MUNI 021 Read Only Final Truth
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: artifacts/muni-021-readonly-final
      BASE_URL: https://sos-sf.simondalmasso44.workers.dev
      DEPLOYED_VERSION: 493b7f20-093f-48ba-bdf0-67372f2fa2d4
      TAKE_HEAD: 810fdc47901adf7aa7108d39f4d4047ae56b3295
      PRODUCT_COMMIT: 43ff360b3ce28e3e63836c1a177dc144113366c0
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$TAKE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          test ! -f .github/workflows/muni-021-terminal.yml
          test ! -f .github/workflows/muni-021-terminal-v2.yml
          mkdir -p "$OUT/screenshots" "$OUT/logs"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebuild and regress
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          npx playwright install --with-deps chromium
      - name: Verify deployed version
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --json > "$OUT/cloudflare-deployments.json"
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.env.OUT+'/cloudflare-deployments.json','utf8'));
          const a=Array.isArray(j)?j:(j.deployments||[]);
          const current=a[0]?.id||a[0]?.version_id||'';
          fs.writeFileSync(process.env.OUT+'/version-truth.json',JSON.stringify({expected:process.env.DEPLOYED_VERSION,current,pass:current===process.env.DEPLOYED_VERSION},null,2)+'\n');
          if(current!==process.env.DEPLOYED_VERSION) process.exit(1);
          NODE
      - name: Production server truth
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFile,writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const base=process.env.BASE_URL;
          const checks=[];
          async function api(path){const r=await fetch(base+path+'?truth='+Date.now(),{cache:'no-store',headers:{'cache-control':'no-cache'}});const text=await r.text();let json=null;try{json=JSON.parse(text)}catch{};return{path,status:r.status,json}}
          const apis=[];for(const path of ['/api/health','/api/snapshot','/api/sources','/source-provenance.json'])apis.push(await api(path));
          const unwrap=(x)=>x?.json&&typeof x.json==='object'&&'data'in x.json?x.json.data:x?.json;
          const snapshot=unwrap(apis.find(x=>x.path==='/api/snapshot'));
          const usable=(snapshot?.systems??[]).filter(x=>x.available===true&&Number.isFinite(x.currentMetres));
          checks.push({name:'health',pass:apis.find(x=>x.path==='/api/health')?.status===200});
          checks.push({name:'snapshot',pass:apis.find(x=>x.path==='/api/snapshot')?.status===200});
          checks.push({name:'usable-hydrometry',pass:usable.length>0,detail:usable.map(x=>({id:x.id,currentMetres:x.currentMetres,observedAt:x.observedAt,freshness:x.freshness}))});
          const browser=await chromium.launch({headless:true});
          const screens=[];const hashes={};
          for(const target of [{w:390,h:844,name:'PRODUCTION_SOS_HOME_390x844'},{w:768,h:1024,name:'PRODUCTION_SOS_HOME_768x1024'},{w:1440,h:900,name:'PRODUCTION_SOS_HOME_1440x900'}]){
            const context=await browser.newContext({serviceWorkers:'block'});const page=await context.newPage();await page.setViewportSize({width:target.w,height:target.h});await page.goto(base+'/?truth='+Date.now(),{waitUntil:'networkidle'});await page.getByTestId('hydrometric-situation').waitFor({state:'visible'});
            const m=await page.evaluate(()=>{const hydro=document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect();return{overflow:document.documentElement.scrollWidth-innerWidth,ratio:document.documentElement.scrollHeight/innerHeight,hydroWidth:hydro?.width??0,quick:document.querySelectorAll('.civic-quick-tile').length,brand:(document.querySelector('.sos-brand')?.textContent??'').replace(/\s+/g,' ').trim(),body:document.body.innerText??'',scripts:[...document.scripts].map(s=>s.src).filter(Boolean),styles:[...document.querySelectorAll('link[rel="stylesheet"]')].map(l=>l.href)}});
            const expectedText=['Ríos de Santa Fe','Paraná','Salado','Gestión de riesgo','Fuentes','Emergencias'];
            const pass=expectedText.every(t=>m.body.includes(t))&&m.quick===6&&m.brand.includes('SOS')&&m.overflow<=1&&(target.w!==390||m.hydroWidth/target.w>=.94)&&(target.w!==1440||m.ratio<=1.35);
            screens.push({target,pass,metrics:{overflow:m.overflow,ratio:m.ratio,hydroWidth:m.hydroWidth,quick:m.quick,brand:m.brand,scripts:m.scripts,styles:m.styles},missingText:expectedText.filter(t=>!m.body.includes(t))});
            const path=`${process.env.OUT}/screenshots/${target.name}.png`;await page.screenshot({path,fullPage:true});hashes[target.name]=createHash('sha256').update(await readFile(path)).digest('hex');await context.close();
          }
          checks.push({name:'home-runtime',pass:screens.every(x=>x.pass),detail:screens});
          for(const target of [{w:390,h:844,name:'PRODUCTION_SOS_EL_NINO_390x844'},{w:1440,h:900,name:'PRODUCTION_SOS_EL_NINO_1440x900'}]){
            const context=await browser.newContext({serviceWorkers:'block'});const page=await context.newPage();await page.setViewportSize({width:target.w,height:target.h});await page.goto(base+'/gestion-de-riesgo/fenomeno-el-nino?truth='+Date.now(),{waitUntil:'networkidle'});let pass=false;let text='';try{await page.getByTestId('el-nino-landing').waitFor({state:'visible',timeout:15000});text=await page.getByTestId('el-nino-landing').innerText();pass=['Fenómeno El Niño','Qué está haciendo la ciudad','Agenda vigente','Plan de contingencia','5,30 m','no es un umbral general de evacuación de SOS-SF','Fuente editorial'].every(t=>text.includes(t))&&(await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth))<=1}catch{}const path=`${process.env.OUT}/screenshots/${target.name}.png`;await page.screenshot({path,fullPage:true});hashes[target.name]=createHash('sha256').update(await readFile(path)).digest('hex');checks.push({name:'el-nino-'+target.w,pass});await context.close();
          }
          const manifest=JSON.parse(await readFile('dist/.vite/manifest.json','utf8'));const entry=Object.values(manifest).find(x=>x.isEntry);const assets=[entry?.file,...(entry?.css??[])].filter(Boolean).map(x=>'/'+x);const identity=[];
          for(const asset of assets){const local=await readFile('dist'+asset);const r=await fetch(base+asset+'?truth='+Date.now(),{cache:'no-store'});const remote=Buffer.from(await r.arrayBuffer());const localSha256=createHash('sha256').update(local).digest('hex'),remoteSha256=createHash('sha256').update(remote).digest('hex');identity.push({asset,status:r.status,localSha256,remoteSha256,equal:r.ok&&localSha256===remoteSha256})}
          checks.push({name:'asset-byte-identity',pass:identity.every(x=>x.equal),detail:identity});
          const pass=checks.every(x=>x.pass);await writeFile(process.env.OUT+'/production-truth.json',JSON.stringify({version:process.env.DEPLOYED_VERSION,deployCommandCount:1,postdeployRedeployCount:0,apis,checks,screenshotHashes:hashes,pass},null,2)+'\n');await browser.close();if(!pass)process.exit(1);
          NODE
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-readonly-final-screenshots-${{ github.run_id }}
          path: artifacts/muni-021-readonly-final/screenshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-readonly-final-evidence-${{ github.run_id }}
          path: artifacts/muni-021-readonly-final/
          if-no-files-found: error
          retention-days: 30
      - name: Terminal cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" --jq '.workflows[].id' | while read id; do gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" || true; done
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/muni-021-postdeploy-final.yml
          git commit -m 'ci: terminally disarm MUNI 021 read-only verifier'
          git push origin HEAD:arq/visual-dashboard-v3
