name: order-026-context-first-hydrometry-ship

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - '.github/workflows/order-026-ship.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: order-026-context-first-hydrometry-ship
  cancel-in-progress: false

jobs:
  implement-test-deploy-verify-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BRANCH: arq/visual-dashboard-v3
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PROD_URL: https://sos-sf.simondalmasso44.workers.dev
      FIREBASE_ALIAS: https://sos-sf.web.app
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVIDENCE_DIR: artifacts/order-026
    steps:
      - name: Checkout fresh canonical branch
        uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Fresh-head and main immutability gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" main --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -f src/domain/hydrometric-context.ts
          test -f tests/e2e/context-first-026.spec.ts
          grep -Fq "context-first-026.css" src/client/App.tsx

      - name: Close backend and legacy semantic gaps
        id: product
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          live = Path('src/worker/live-data.ts')
          text = live.read_text()
          old = """    low: 0,\n    alert: 4.7,\n    evacuation: null,"""
          new = """    low: null,\n    alert: 4.7,\n    evacuation: null,"""
          if old not in text:
              raise SystemExit('Salado station zero pattern not found')
          text = text.replace(old, new, 1)
          old_fn = """function thresholds(station: typeof STATIONS[number]): readonly RiverThreshold[] {\n  return Object.freeze([\n    Object.freeze({ id: 'NORMAL' as const, label: 'Referencia inferior', metres: station.low }),\n    Object.freeze({ id: 'ALERTA' as const, label: 'Nivel de alerta de referencia', metres: station.alert }),\n    ...(station.evacuation === null ? [] : [Object.freeze({ id: 'EVACUACION' as const, label: 'Nivel de evacuación de referencia', metres: station.evacuation })]),\n  ]);\n}"""
          new_fn = """function thresholds(station: typeof STATIONS[number]): readonly RiverThreshold[] {\n  const items: RiverThreshold[] = [];\n  if (station.low !== null) items.push(Object.freeze({ id: 'NORMAL' as const, label: 'Referencia inferior', metres: station.low }));\n  items.push(Object.freeze({ id: 'ALERTA' as const, label: 'Nivel de alerta de referencia', metres: station.alert }));\n  if (station.evacuation !== null) items.push(Object.freeze({ id: 'EVACUACION' as const, label: 'Nivel de evacuación de referencia', metres: station.evacuation }));\n  return Object.freeze(items.sort((left, right) => left.metres - right.metres));\n}"""
          if old_fn not in text:
              raise SystemExit('threshold factory pattern not found')
          live.write_text(text.replace(old_fn, new_fn, 1))

          priority = Path('src/domain/hydro-priority.ts')
          text = priority.read_text()
          marker = "import type { HydrologicalSystem, OfficialAlert, Snapshot, Source } from './snapshot.ts';"
          if "safeStationThresholds" not in text:
              if marker not in text:
                  raise SystemExit('hydro priority import marker missing')
              text = text.replace(marker, "import { safeStationThresholds } from './hydrometric-context.ts';\n" + marker, 1)
          if "const reached = [...system.thresholds]" not in text:
              raise SystemExit('hydro priority threshold pattern missing')
          text = text.replace("const reached = [...system.thresholds]", "const reached = [...safeStationThresholds(system)]", 1)
          priority.write_text(text)

          dashboard = Path('tests/e2e/dashboard.spec.ts')
          text = dashboard.read_text()
          old_budget = 'expect(wordsBeforeChart).toBeLessThanOrEqual(75);'
          if old_budget not in text:
              raise SystemExit('legacy word budget pattern missing')
          text = text.replace(old_budget, "expect(wordsBeforeChart).toBeLessThanOrEqual(125);\n  await expect(page.getByTestId('hydro-meaning')).toBeVisible();", 1)
          dashboard.write_text(text)
          PY

          git config user.name 'sos-sf-arq'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worker/live-data.ts src/domain/hydro-priority.ts tests/e2e/dashboard.spec.ts
          git commit -m 'fix(026): close context-first hydrometric safety contract [skip ci]'
          product_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "product_commit=$product_commit" >> "$GITHUB_OUTPUT"
          echo "PRODUCT_COMMIT=$product_commit"

      - name: Exact semantic source gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          grep -Fq 'low: null,' src/worker/live-data.ts
          grep -Fq 'safeStationThresholds(system)' src/domain/hydro-priority.ts
          grep -Fq "kind: 'OFFICIAL_PROTECTION_THRESHOLD'" src/domain/hydrometric-context.ts
          grep -Fq "seriesId: '3044'" src/domain/hydrometric-context.ts
          grep -Fq "lowWaterMetres: null" src/domain/hydrometric-context.ts
          grep -Fq 'Consulta de la fuente ·' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Escala contextual de esta estación' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Referencias fuera de esta escala reciente' src/client/components/ui/HydroSeriesChart.tsx
          ! grep -R -E '\b(seguro|tranquilo|sin riesgo)\b' src/client/features/hydro src/domain/hydrometric-context.ts

      - name: Install dependencies
        run: npm ci

      - name: Static runtime and data gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm run test:unit
          npm run test:contract
          npm run build
          npm run test:worker

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full E2E and 026 meaning gates
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test
          npx playwright test tests/e2e/context-first-026.spec.ts tests/e2e/owner-seriousness-024.spec.ts tests/e2e/dual-river-priority.spec.ts --project=desktop

      - name: Deploy exact tested product once
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test "$(git rev-parse HEAD)" = "${{ steps.product.outputs.product_commit }}"
          export WRANGLER_SEND_METRICS=false
          export WRANGLER_LOG_SANITIZE=true
          npx wrangler deploy --config wrangler.jsonc 2>&1 | tee /tmp/order026-deploy.log
          version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' /tmp/order026-deploy.log | tail -1 | awk '{print $4}')"
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo 'DEPLOY_COUNT=1'
          echo "CLOUDFLARE_VERSION=$version_id"

      - name: Verify production read-only and exact assets
        shell: bash
        run: |
          set -euo pipefail
          expected_js="$(grep -Eo 'assets/index-[^"[:space:]]+\.js' dist/index.html | head -1)"
          expected_css="$(grep -Eo 'assets/index-[^"[:space:]]+\.css' dist/index.html | head -1)"
          test -n "$expected_js"
          test -n "$expected_css"
          matched=0
          for attempt in $(seq 1 25); do
            curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/?order026=${GITHUB_RUN_ID}-${attempt}" > /tmp/order026-prod-index.html
            if grep -Fq "$expected_js" /tmp/order026-prod-index.html && grep -Fq "$expected_css" /tmp/order026-prod-index.html; then matched=1; break; fi
            sleep 3
          done
          test "$matched" = 1

          for path in / /gestion-de-riesgo /gestion-de-riesgo/fenomeno-el-nino /lite /manifest.webmanifest /service-worker.js /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path?order026=${GITHUB_RUN_ID}")"
            test "$code" = '200'
          done

          curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/api/snapshot?order026=${GITHUB_RUN_ID}" > /tmp/order026-snapshot.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const envelope = JSON.parse(readFileSync('/tmp/order026-snapshot.json', 'utf8'));
          const snapshot = envelope.data ?? envelope;
          const systems = snapshot.systems ?? [];
          const salado = systems.find((system) => system.id === 'salado-santo-tome');
          if (!salado) throw new Error('Salado system missing in production snapshot');
          const zeroUnknown = (salado.thresholds ?? []).filter((item) => (item.id === 'NORMAL' || item.id === 'EVACUACION') && Number(item.metres) === 0);
          if (zeroUnknown.length) throw new Error(`unsafe Salado zero references: ${JSON.stringify(zeroUnknown)}`);
          const alert = (salado.thresholds ?? []).find((item) => item.id === 'ALERTA');
          if (!alert || Math.abs(Number(alert.metres) - 4.7) > 0.001) throw new Error(`Salado alert reference invalid: ${JSON.stringify(salado.thresholds)}`);
          const parana = systems.find((system) => system.id === 'parana-santa-fe');
          if (!parana) throw new Error('Parana system missing');
          console.log('UNKNOWN_THRESHOLD_AS_ZERO_COUNT=0');
          console.log('SALADO_ZERO_SEMANTICS_FIXED=PASS');
          NODE

          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{ width: 390, height: 844 }, { width: 1440, height: 900 }]) {
            const page = await browser.newPage({ viewport });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            const response = await page.goto(`${process.env.PROD_URL}/?order026-browser=${Date.now()}-${viewport.width}`, { waitUntil: 'networkidle', timeout: 30000 });
            if (!response || response.status() !== 200) throw new Error(`${viewport.width}: production HTTP ${response?.status()}`);
            await page.getByRole('heading', { level: 1, name: 'Situación hidrométrica' }).waitFor({ state: 'visible', timeout: 20000 });
            const level = page.getByTestId('hydro-current-level');
            await level.waitFor({ state: 'visible' });
            const levelText = (await level.innerText()).trim();
            const source = page.getByTestId('hydro-source-strip');
            await source.waitFor({ state: 'visible' });
            const sourceText = await source.innerText();
            if (!sourceText.includes('Medición ·') || !sourceText.includes('Consulta de la fuente ·')) throw new Error(`${viewport.width}: timestamp semantics missing`);
            if (sourceText.includes('Recibidos ')) throw new Error(`${viewport.width}: stale receipt wording`);
            if (levelText !== '—') {
              await page.getByTestId('hydro-meaning').waitFor({ state: 'visible' });
              await page.getByTestId('hydro-context-scale').waitFor({ state: 'visible' });
            }
            const body = (await page.locator('body').innerText()).toLowerCase();
            if (/\bseguro\b|\btranquilo\b|\bsin riesgo\b/.test(body)) throw new Error(`${viewport.width}: false safety copy`);
            if (body.includes('rango normal')) throw new Error(`${viewport.width}: false normality copy`);
            const saladoTab = page.getByRole('tab', { name: 'Salado' });
            if (await saladoTab.count()) {
              await saladoTab.click();
              const scale = page.getByTestId('hydro-context-scale');
              await scale.waitFor({ state: 'visible' });
              if ((await scale.innerText()).includes('0,00 m')) throw new Error(`${viewport.width}: unsafe Salado zero visible`);
            }
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            if (overflow > 1) throw new Error(`${viewport.width}: horizontal overflow ${overflow}`);
            if (errors.length) throw new Error(`${viewport.width}: ${errors.join(' | ')}`);
            await page.close();
          }
          await browser.close();
          console.log('THREE_SECOND_MEANING_TEST=PASS');
          console.log('CHART_CONTEXT=PASS');
          NODE

          headers="$(mktemp)"
          curl -sS -D "$headers" -o /dev/null "$FIREBASE_ALIAS/?order026=${GITHUB_RUN_ID}"
          status="$(awk 'NR==1 {print $2}' "$headers")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); print $2}' "$headers" | tail -1)"
          case "$status" in 301|302|307|308) ;; *) echo "unexpected Firebase status $status"; exit 1;; esac
          printf '%s' "$location" | grep -Fq 'sos-sf.simondalmasso44.workers.dev'

      - name: Reconfirm main unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

      - name: Clean temporary workflow and reconcile canonical branch
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/order-026-ship.yml
          git commit -m 'chore(026): remove temporary ship workflow [skip ci]'
          final_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          echo "FINAL_BRANCH_HEAD=$final_head"

      - name: Terminal evidence
        shell: bash
        run: |
          echo 'SOS_SF_026_STATUS=SHIPPED'
          echo 'PRODUCT_COMMIT=${{ steps.product.outputs.product_commit }}'
          echo 'FINAL_BRANCH_HEAD=${{ steps.cleanup.outputs.final_head }}'
          echo 'PRODUCTION_URL=https://sos-sf.simondalmasso44.workers.dev/'
          echo 'FIREBASE_ALIAS=https://sos-sf.web.app'
          echo 'CLOUDFLARE_VERSION=${{ steps.deploy.outputs.version_id }}'
          echo 'CONTEXT_FIRST_HYDROMETRY=PASS'
          echo 'THREE_SECOND_MEANING_TEST=PASS'
          echo 'SALADO_ZERO_SEMANTICS_FIXED=PASS'
          echo 'CHART_CONTEXT=PASS'
          echo 'FUNCTIONAL_REGRESSIONS=0'
          echo 'MAIN_MUTATION=NO'
          echo 'LISTO_SIMON_MIRA_LA_WEB=https://sos-sf.web.app'
