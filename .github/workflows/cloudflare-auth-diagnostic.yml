name: Cloudflare D1 KV Read Only Gate

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/cloudflare-auth-diagnostic-trigger]

permissions:
  contents: read

concurrency:
  group: sos-sf-cloudflare-d1-kv-read-only
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  OWNER_VISUAL_CONFIRMATION: WORKERS_FREE_CONFIRMED
  BUDGET_MAX_USD: '0'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify token account D1 and KV with GET only
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloudflare-d1-kv-read-only
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const api = 'https://api.cloudflare.com/client/v4';
          const token = String(process.env.CLOUDFLARE_API_TOKEN ?? '').trim();
          const account = String(process.env.CLOUDFLARE_ACCOUNT_ID ?? '').trim();
          const owner = String(process.env.OWNER_VISUAL_CONFIRMATION ?? '');
          const hash = (value) => value
            ? crypto.createHash('sha256').update(value).digest('hex').slice(0, 12)
            : null;

          async function get(name, path) {
            try {
              const response = await fetch(`${api}${path}`, {
                method: 'GET',
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/json',
                },
              });
              const payload = await response.json().catch(() => ({}));
              return {
                name,
                method: 'GET',
                path,
                httpStatus: response.status,
                success: payload.success === true,
                result: payload.result ?? null,
                errors: Array.isArray(payload.errors)
                  ? payload.errors.map((entry) => ({
                      code: entry?.code ?? null,
                      message: String(entry?.message ?? '').slice(0, 240),
                    }))
                  : [],
              };
            } catch (error) {
              return {
                name,
                method: 'GET',
                path,
                httpStatus: null,
                success: false,
                result: null,
                errors: [{
                  code: null,
                  message: error instanceof Error ? error.message : String(error),
                }],
              };
            }
          }

          (async () => {
            const encoded = encodeURIComponent(account);
            const probes = {
              token: await get('token_verify', '/user/tokens/verify'),
              account: await get('account_details', `/accounts/${encoded}`),
              d1: await get('d1_list', `/accounts/${encoded}/d1/database?per_page=100`),
              kv: await get('kv_namespaces', `/accounts/${encoded}/storage/kv/namespaces?per_page=100`),
              workersReference: await get(
                'workers_settings_reference_only',
                `/accounts/${encoded}/workers/account-settings`,
              ),
            };

            const d1Rows = Array.isArray(probes.d1.result) ? probes.d1.result : [];
            const kvRows = Array.isArray(probes.kv.result) ? probes.kv.result : [];
            const directReady = owner === 'WORKERS_FREE_CONFIRMED'
              && probes.token.httpStatus === 200 && probes.token.success
              && probes.account.httpStatus === 200 && probes.account.success
              && probes.d1.httpStatus === 200 && probes.d1.success
              && probes.kv.httpStatus === 200 && probes.kv.success;

            const report = {
              schemaVersion: 1,
              generatedAt: new Date().toISOString(),
              classification: directReady ? 'D1_KV_REMOTE_GATE_PASS' : 'D1_KV_REMOTE_GATE_FAIL',
              ownerVisualConfirmation: owner,
              budgetMaxUsd: 0,
              accountFingerprint: hash(account),
              readOnlyProof: {
                methodsUsed: ['GET'],
                mutatingRequests: 0,
                billingEndpointsQueried: 0,
                r2EndpointsQueried: 0,
                provisioningActions: 0,
                deployActions: 0,
              },
              authority: {
                tokenActive: probes.token.httpStatus === 200 && probes.token.success,
                accountReachable: probes.account.httpStatus === 200 && probes.account.success,
                d1ListReadable: probes.d1.httpStatus === 200 && probes.d1.success,
                kvListReadable: probes.kv.httpStatus === 200 && probes.kv.success,
                d1Count: d1Rows.length,
                kvNamespaceCount: kvRows.length,
                privateD1Present: d1Rows.some((entry) => entry?.name === 'sos-sf-private'),
                privateReportsKvPresent: kvRows.some((entry) => entry?.title === 'sos-sf-private-reports'),
              },
              referenceOnly: {
                defaultUsageModel: probes.workersReference.success
                  ? probes.workersReference.result?.default_usage_model ?? null
                  : null,
                usedForAuthorization: false,
              },
              endpoints: Object.fromEntries(Object.entries(probes).map(([key, probe]) => [key, {
                method: probe.method,
                path: probe.path,
                httpStatus: probe.httpStatus,
                success: probe.success,
                errors: probe.errors,
              }])),
            };

            fs.writeFileSync(
              'artifacts/cloudflare-d1-kv-read-only/gate.json',
              `${JSON.stringify(report, null, 2)}\n`,
            );
            fs.writeFileSync(
              'artifacts/cloudflare-d1-kv-read-only/read-only-proof.txt',
              [
                `CLASSIFICATION=${report.classification}`,
                'HTTP_METHODS=GET_ONLY',
                'MUTATING_REQUESTS=0',
                'BILLING_ENDPOINTS=0',
                'R2_ENDPOINTS=0',
                'PROVISIONING=0',
                'DEPLOY=0',
                'DEFAULT_USAGE_MODEL_USED_FOR_AUTHORIZATION=false',
                '',
              ].join('\n'),
            );
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `direct_ready=${directReady}\n`);
            console.log(JSON.stringify({
              classification: report.classification,
              authority: report.authority,
              referenceOnly: report.referenceOnly,
              readOnlyProof: report.readOnlyProof,
            }));
            if (!directReady) process.exitCode = 1;
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify Wrangler read-only authority
        id: wrangler
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloudflare-d1-kv-read-only
          d1=FAIL
          kv=FAIL
          d1_exit=0
          kv_exit=0
          if npx wrangler d1 list --json >/tmp/d1-list.json 2>/tmp/d1-list.stderr; then
            d1=PASS
          else
            d1_exit=$?
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/d1-list.stderr \
              > artifacts/cloudflare-d1-kv-read-only/wrangler-d1.stderr.txt
          fi
          if npx wrangler kv namespace list >/tmp/kv-list.json 2>/tmp/kv-list.stderr; then
            kv=PASS
          else
            kv_exit=$?
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/kv-list.stderr \
              > artifacts/cloudflare-d1-kv-read-only/wrangler-kv.stderr.txt
          fi
          printf '{"d1":"%s","d1Exit":%s,"kv":"%s","kvExit":%s}\n' \
            "$d1" "$d1_exit" "$kv" "$kv_exit" \
            > artifacts/cloudflare-d1-kv-read-only/wrangler.json
          if [ "$d1" = PASS ] && [ "$kv" = PASS ]; then
            echo 'wrangler_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'wrangler_ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require owner-confirmed zero-cost D1 KV gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_VISUAL_CONFIRMATION" = WORKERS_FREE_CONFIRMED
          test "$BUDGET_MAX_USD" = 0
          test '${{ steps.direct.outputs.direct_ready }}' = true
          test '${{ steps.wrangler.outputs.wrangler_ready }}' = true
          printf 'REMOTE_GATE=PASS\nOWNER_VISUAL_CONFIRMATION=WORKERS_FREE_CONFIRMED\nBUDGET_MAX_USD=0\nD1_AUTHORITY=PASS\nKV_AUTHORITY=PASS\nMUTATIONS=NONE\n' \
            > artifacts/cloudflare-d1-kv-read-only/result.txt

      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-d1-kv-read-only-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/cloudflare-d1-kv-read-only/
          if-no-files-found: error
          retention-days: 30
