name: Cloudflare Free KV Diagnostic

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/cloudflare-auth-diagnostic-trigger]

permissions:
  contents: read

concurrency:
  group: sos-sf-cloudflare-free-kv-diagnostic
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify token, account, D1, KV and zero-cost Workers model
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloudflare-auth-diagnostic
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          (async () => {
            const rawToken = String(process.env.CLOUDFLARE_API_TOKEN ?? '');
            const rawAccount = String(process.env.CLOUDFLARE_ACCOUNT_ID ?? '');
            const token = rawToken.trim();
            const account = rawAccount.trim();
            const api = 'https://api.cloudflare.com/client/v4';
            const fingerprint = (value) => crypto.createHash('sha256').update(value).digest('hex').slice(0, 12);

            async function probe(name, path) {
              try {
                const response = await fetch(`${api}${path}`, {
                  method: 'GET',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/json',
                  },
                });
                const payload = await response.json().catch(() => ({}));
                return {
                  name,
                  httpStatus: response.status,
                  success: payload.success === true,
                  result: payload.result ?? null,
                  errorCodes: Array.isArray(payload.errors) ? payload.errors.map((item) => item?.code).filter(Boolean) : [],
                  errorMessages: Array.isArray(payload.errors) ? payload.errors.map((item) => item?.message).filter(Boolean) : [],
                };
              } catch (error) {
                return { name, transportError: error instanceof Error ? error.message : String(error) };
              }
            }

            const report = {
              schemaVersion: 3,
              generatedAt: new Date().toISOString(),
              tokenPresent: token.length > 0,
              tokenTrimChanged: token !== rawToken,
              tokenLength: token.length,
              tokenFingerprint: token ? fingerprint(token) : null,
              accountPresent: account.length > 0,
              accountTrimChanged: account !== rawAccount,
              accountLength: account.length,
              accountFormatValid: /^[0-9a-f]{32}$/i.test(account),
              accountFingerprint: account ? fingerprint(account) : null,
              probes: [],
            };

            report.probes.push(await probe('token_verify', '/user/tokens/verify'));
            report.probes.push(await probe('account_details', `/accounts/${encodeURIComponent(account)}`));
            report.probes.push(await probe('d1_list', `/accounts/${encodeURIComponent(account)}/d1/database?per_page=1`));
            report.probes.push(await probe('kv_namespaces', `/accounts/${encodeURIComponent(account)}/storage/kv/namespaces?per_page=1`));
            report.probes.push(await probe('workers_account_settings', `/accounts/${encodeURIComponent(account)}/workers/account-settings`));
            report.probes.push(await probe('worker_script_settings', `/accounts/${encodeURIComponent(account)}/workers/scripts/sos-sf/settings`));
            report.probes.push(await probe('subscriptions', `/accounts/${encodeURIComponent(account)}/subscriptions`));

            const byName = Object.fromEntries(report.probes.map((entry) => [entry.name, entry]));
            const usageModel = String(byName.workers_account_settings?.result?.default_usage_model ?? '').toLowerCase();
            const scriptUsageModel = String(byName.worker_script_settings?.result?.usage_model ?? '').toLowerCase();
            const subscriptions = Array.isArray(byName.subscriptions?.result) ? byName.subscriptions.result : null;
            const activePaidWorkers = subscriptions?.filter((entry) => {
              const state = String(entry?.state ?? entry?.status ?? '').toLowerCase();
              const name = JSON.stringify(entry ?? {}).toLowerCase();
              return !['cancelled', 'canceled', 'expired', 'inactive'].includes(state) && /workers/.test(name) && /paid|standard|subscription/.test(name);
            }).length ?? null;

            report.evaluation = {
              d1Ready: byName.d1_list?.httpStatus === 200 && byName.d1_list?.success === true,
              kvReady: byName.kv_namespaces?.httpStatus === 200 && byName.kv_namespaces?.success === true,
              workersAccountSettingsReady: byName.workers_account_settings?.httpStatus === 200 && byName.workers_account_settings?.success === true,
              usageModel,
              scriptUsageModel,
              freeUsageModel: Boolean(usageModel) && usageModel !== 'standard' && scriptUsageModel !== 'standard',
              subscriptionsReadable: byName.subscriptions?.httpStatus === 200 && byName.subscriptions?.success === true,
              activePaidWorkers,
              noPaidWorkersSubscription: activePaidWorkers === null ? null : activePaidWorkers === 0,
            };
            report.evaluation.directReady = report.evaluation.d1Ready
              && report.evaluation.kvReady
              && report.evaluation.workersAccountSettingsReady
              && report.evaluation.freeUsageModel
              && report.evaluation.noPaidWorkersSubscription !== false;

            for (const probe of report.probes) {
              if (probe.name === 'subscriptions' && Array.isArray(probe.result)) {
                probe.result = { count: probe.result.length };
              } else if (probe.name === 'kv_namespaces' && Array.isArray(probe.result)) {
                probe.result = { count: probe.result.length };
              } else if (probe.name === 'account_details') {
                probe.result = probe.success ? { reachable: true } : null;
              } else if (probe.name === 'worker_script_settings' && probe.result) {
                probe.result = { usage_model: probe.result.usage_model ?? null };
              }
            }

            fs.writeFileSync(
              'artifacts/cloudflare-auth-diagnostic/direct-api.json',
              `${JSON.stringify(report, null, 2)}\n`,
            );
            console.log(JSON.stringify(report));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `direct_ready=${report.evaluation.directReady}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `usage_model=${usageModel}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `subscriptions_readable=${report.evaluation.subscriptionsReadable}\n`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify Wrangler D1 and KV authority
        id: wrangler
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloudflare-auth-diagnostic
          d1_status=FAIL
          kv_status=FAIL
          d1_exit=0
          kv_exit=0

          if npx wrangler d1 list --json >/tmp/wrangler-d1-list.json 2>/tmp/wrangler-d1-list.stderr; then
            d1_status=PASS
          else
            d1_exit=$?
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/wrangler-d1-list.stderr > artifacts/cloudflare-auth-diagnostic/wrangler-d1-list.stderr.txt
          fi

          if npx wrangler kv namespace list >/tmp/wrangler-kv-list.json 2>/tmp/wrangler-kv-list.stderr; then
            kv_status=PASS
          else
            kv_exit=$?
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/wrangler-kv-list.stderr > artifacts/cloudflare-auth-diagnostic/wrangler-kv-list.stderr.txt
          fi

          printf '{"wranglerD1List":"%s","wranglerD1ListExitCode":%s,"wranglerKVNamespaceList":"%s","wranglerKVNamespaceListExitCode":%s}\n' \
            "$d1_status" "$d1_exit" "$kv_status" "$kv_exit" \
            > artifacts/cloudflare-auth-diagnostic/wrangler.json
          cat artifacts/cloudflare-auth-diagnostic/wrangler.json
          if [ "$d1_status" = PASS ] && [ "$kv_status" = PASS ]; then
            echo 'wrangler_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'wrangler_ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require D1, KV and zero-cost Workers model
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.direct.outputs.direct_ready }}' = 'true'
          test '${{ steps.wrangler.outputs.wrangler_ready }}' = 'true'
          test '${{ steps.direct.outputs.usage_model }}' != 'standard'
          printf 'D1_AUTHORITY=PASS\nKV_AUTHORITY=PASS\nWORKERS_USAGE_MODEL=%s\nZERO_COST_GATE=PASS\n' \
            '${{ steps.direct.outputs.usage_model }}' \
            > artifacts/cloudflare-auth-diagnostic/gate.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-free-kv-diagnostic-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/cloudflare-auth-diagnostic/
          if-no-files-found: error
          retention-days: 30
