name: Cloudflare Auth Diagnostic

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/cloudflare-auth-diagnostic-trigger]

permissions:
  contents: read

concurrency:
  group: sos-sf-cloudflare-auth-diagnostic
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify token, account, D1 and R2 without mutation
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloudflare-auth-diagnostic
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          (async () => {
            const rawToken = String(process.env.CLOUDFLARE_API_TOKEN ?? '');
            const rawAccount = String(process.env.CLOUDFLARE_ACCOUNT_ID ?? '');
            const token = rawToken.trim();
            const account = rawAccount.trim();
            const api = 'https://api.cloudflare.com/client/v4';
            const fingerprint = (value) => crypto.createHash('sha256').update(value).digest('hex').slice(0, 12);

            async function probe(name, url) {
              try {
                const response = await fetch(url, {
                  method: 'GET',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/json',
                  },
                });
                const payload = await response.json().catch(() => ({}));
                return {
                  name,
                  httpStatus: response.status,
                  success: payload.success === true,
                  resultStatus: payload.result?.status ?? null,
                  errorCodes: Array.isArray(payload.errors) ? payload.errors.map((item) => item?.code).filter(Boolean) : [],
                  errorMessages: Array.isArray(payload.errors) ? payload.errors.map((item) => item?.message).filter(Boolean) : [],
                };
              } catch (error) {
                return { name, transportError: error instanceof Error ? error.message : String(error) };
              }
            }

            const report = {
              schemaVersion: 2,
              generatedAt: new Date().toISOString(),
              tokenPresent: token.length > 0,
              tokenTrimChanged: token !== rawToken,
              tokenLength: token.length,
              tokenFingerprint: token ? fingerprint(token) : null,
              accountPresent: account.length > 0,
              accountTrimChanged: account !== rawAccount,
              accountLength: account.length,
              accountFormatValid: /^[0-9a-f]{32}$/i.test(account),
              accountFingerprint: account ? fingerprint(account) : null,
              probes: [],
            };

            report.probes.push(await probe('token_verify', `${api}/user/tokens/verify`));
            report.probes.push(await probe('account_details', `${api}/accounts/${encodeURIComponent(account)}`));
            report.probes.push(await probe('d1_list', `${api}/accounts/${encodeURIComponent(account)}/d1/database?per_page=1`));
            report.probes.push(await probe('r2_bucket_list', `${api}/accounts/${encodeURIComponent(account)}/r2/buckets?per_page=1`));

            const byName = Object.fromEntries(report.probes.map((entry) => [entry.name, entry]));
            report.directD1Ready = byName.d1_list?.httpStatus === 200 && byName.d1_list?.success === true;
            report.directR2Ready = byName.r2_bucket_list?.httpStatus === 200 && byName.r2_bucket_list?.success === true;
            report.directReady = report.directD1Ready && report.directR2Ready;

            fs.writeFileSync(
              'artifacts/cloudflare-auth-diagnostic/direct-api.json',
              `${JSON.stringify(report, null, 2)}\n`,
            );
            console.log(JSON.stringify(report));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `direct_ready=${report.directReady}\n`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify Wrangler D1 and R2 authority
        id: wrangler
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cloudflare-auth-diagnostic
          secret_status=FAIL
          d1_status=FAIL
          r2_status=FAIL
          secret_exit=0
          d1_exit=0
          r2_exit=0

          if npx wrangler secret list --config wrangler.jsonc >/tmp/wrangler-secret-list.json 2>/tmp/wrangler-secret-list.stderr; then
            secret_status=PASS
          else
            secret_exit=$?
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/wrangler-secret-list.stderr > artifacts/cloudflare-auth-diagnostic/wrangler-secret-list.stderr.txt
          fi

          if npx wrangler d1 list --json >/tmp/wrangler-d1-list.json 2>/tmp/wrangler-d1-list.stderr; then
            d1_status=PASS
          else
            d1_exit=$?
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/wrangler-d1-list.stderr > artifacts/cloudflare-auth-diagnostic/wrangler-d1-list.stderr.txt
          fi

          if npx wrangler r2 bucket list --json >/tmp/wrangler-r2-list.json 2>/tmp/wrangler-r2-list.stderr; then
            r2_status=PASS
          else
            r2_exit=$?
            sed -E 's/[A-Za-z0-9_-]{20,}/[REDACTED]/g' /tmp/wrangler-r2-list.stderr > artifacts/cloudflare-auth-diagnostic/wrangler-r2-list.stderr.txt
          fi

          printf '{"wranglerSecretList":"%s","wranglerSecretListExitCode":%s,"wranglerD1List":"%s","wranglerD1ListExitCode":%s,"wranglerR2List":"%s","wranglerR2ListExitCode":%s}\n' \
            "$secret_status" "$secret_exit" "$d1_status" "$d1_exit" "$r2_status" "$r2_exit" \
            > artifacts/cloudflare-auth-diagnostic/wrangler.json
          cat artifacts/cloudflare-auth-diagnostic/wrangler.json
          if [ "$d1_status" = PASS ] && [ "$r2_status" = PASS ]; then
            echo 'wrangler_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'wrangler_ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require D1 and R2 authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.direct.outputs.direct_ready }}' = 'true'
          test '${{ steps.wrangler.outputs.wrangler_ready }}' = 'true'
          printf 'D1_AUTHORITY=PASS\nR2_AUTHORITY=PASS\n' > artifacts/cloudflare-auth-diagnostic/gate.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-auth-diagnostic-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/cloudflare-auth-diagnostic/
          if-no-files-found: error
          retention-days: 30
