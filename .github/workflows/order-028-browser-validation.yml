name: order-028-browser-validation
on:
  push:
    paths:
      - '.github/workflows/order-028-browser-validation.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Guard main and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "45047d1c1e16941ea37967d67307d0ab17e85fad"
          git merge-base --is-ancestor f11fa0f HEAD
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Full browser regression
        run: |
          set -euo pipefail
          npx playwright test
          echo 'BROWSER_REGRESSION=PASS'
          echo 'FUNCTIONAL_REGRESSIONS=0'
