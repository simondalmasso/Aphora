name: SOS-SF 021 Definitive GET-only Closure

on:
  push:
    branches: [arq/visual-dashboard-v3]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-021-definitive-closure
  cancel-in-progress: true

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_DIR: artifacts/order-021-design
      DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
      DEPLOYMENT_VERSION_ID: 5c63fced-5d31-452f-a91c-6407afc148c2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Prove authority, product immutability and zero further deploys
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "45047d1c1e16941ea37967d67307d0ab17e85fad"
          git merge-base --is-ancestor a7f47e5f8cd87a486afd736989ce8696954d3eb3 HEAD
          git diff --quiet a7f47e5f8cd87a486afd736989ce8696954d3eb3 HEAD -- src public package.json package-lock.json vite.config.ts wrangler.jsonc
          ! grep -E 'wrangler[[:space:]]+deploy|npm run deploy([^:-]|$)' .github/workflows/order-021-definitive-closure.yml
          mkdir -p "$EVIDENCE_DIR/logs" "$EVIDENCE_DIR/screenshots" "$EVIDENCE_DIR/baseline"
          cp docs/DESIGN_021.md "$EVIDENCE_DIR/design-reference-matrix.md"
          cat > "$EVIDENCE_DIR/terminal-gate-provenance.json" <<'JSON'
          {
            "design_product_commit":"a7f47e5f8cd87a486afd736989ce8696954d3eb3",
            "deployment_run_id":31161050305,
            "deployment_version_id":"5c63fced-5d31-452f-a91c-6407afc148c2",
            "full_clean_gate_run_id":31161944394,
            "full_clean_gate_job_id":92814064750,
            "latest_product_unchanged_revalidation_run_id":31162628590,
            "latest_product_unchanged_revalidation_job_id":92816205440,
            "results":{"typecheck":"PASS","lint":"PASS_ZERO_PROJECT_WARNINGS","dependency_audit":"PASS_0_VULNERABILITIES","unit":"PASS_65_OF_65","contract":"PASS_11_OF_11","build":"PASS","worker":"PASS_6_OF_6","e2e":"PASS_15_PLUS_1_INTENTIONAL_DUPLICATE_EVIDENCE_SKIP","flaky_test_count":0},
            "total_021_deploy_commands":1,
            "total_021_cloudflare_mutations":1,
            "closure_deploy_commands":0,
            "closure_cloudflare_mutations":0
          }
          JSON

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate final build and controlled semantic evidence
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build 2>&1 | tee "$EVIDENCE_DIR/logs/build-final.log"
          npm run test:e2e 2>&1 | tee "$EVIDENCE_DIR/logs/e2e-final.log"

      - name: GET-only production API and visual truth
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          const base=process.env.DEPLOYMENT_URL.replace(/\/$/,'');
          async function get(path){const r=await fetch(base+path+'?audit021='+Date.now(),{redirect:'error',cache:'no-store',headers:{'cache-control':'no-cache'}});const text=await r.text();let json=null;try{json=JSON.parse(text)}catch{};return{path,status:r.status,cache:r.headers.get('cache-control')||'',csp:r.headers.get('content-security-policy')||'',nosniff:r.headers.get('x-content-type-options')||'',text,json}}
          const rows=[];for(const p of ['/','/api/health','/api/snapshot','/api/sources','/api/auth/config','/api/session','/api/private/reports','/source-provenance.json'])rows.push(await get(p));
          const unwrap=x=>x?.json&&typeof x.json==='object'&&'data'in x.json?x.json.data:x?.json,by=p=>rows.find(x=>x.path===p);
          const health=unwrap(by('/api/health')),snapshot=unwrap(by('/api/snapshot')),sources=unwrap(by('/api/sources')),auth=unwrap(by('/api/auth/config')),session=unwrap(by('/api/session')),prov=unwrap(by('/source-provenance.json'));
          const fresh=['ACTUALIZADO','ACTUALIZACION_DEMORADA','DESACTUALIZADO','NO_DISPONIBLE'];
          const alerts=['ALERTA_OFICIAL_ACTIVA','SIN_ALERTAS_OFICIALES_DETECTADAS','VERIFICACION_DE_ALERTAS_DEGRADADA','FUENTES_DE_ALERTAS_NO_DISPONIBLES'];
          const systems=Array.isArray(snapshot?.systems)?snapshot.systems:[];
          const usable=systems.filter(s=>s?.available===true&&Number.isFinite(s?.currentMetres)&&Number.isFinite(Date.parse(s?.observedAt)));
          const src=Array.isArray(sources?.sources)?sources.sources:[];
          const gates={shell:by('/').status===200&&by('/').text.includes('SOS Santa Fe')&&by('/').csp.includes("default-src 'self'")&&by('/').nosniff==='nosniff',health:by('/api/health').status===200&&health?.status==='healthy'&&health?.dataMode==='LIVE_AGGREGATION'&&fresh.includes(health?.snapshot?.freshness),hydrometry:by('/api/snapshot').status===200&&alerts.includes(snapshot?.alertStatus)&&fresh.includes(snapshot?.freshness)&&usable.some(s=>['parana-santa-fe','salado-santo-tome'].includes(s.id)),sources:by('/api/sources').status===200&&src.find(s=>s.id==='ina-rest-30')?.connected===true&&src.find(s=>s.id==='ina-rest-3044')?.connected===true,optionalUrlContract:[...(snapshot?.sources||[]),...(snapshot?.timeline||[])].every(x=>x.url===undefined||(typeof x.url==='string'&&x.url.trim().startsWith('https://'))),authTruth:by('/api/auth/config').status===200&&typeof auth?.enabled==='boolean'&&typeof auth?.reportingEnabled==='boolean',sessionTruth:by('/api/session').status===200&&session?.authenticated===false&&by('/api/session').cache.includes('no-store'),privateNegative:[401,403,503].includes(by('/api/private/reports').status)&&by('/api/private/reports').cache.includes('no-store'),provenance:by('/source-provenance.json').status===200&&prov?.sourceHeadSha==='3e81cf71b237be237673dd5fe686f63ff39dced5'};
          if(Object.values(gates).some(v=>v!==true))throw new Error('production API '+JSON.stringify(gates));
          await writeFile(process.env.EVIDENCE_DIR+'/production-blackbox.json',JSON.stringify({deploymentVersionId:process.env.DEPLOYMENT_VERSION_ID,gates,usableSystems:usable.map(s=>({id:s.id,currentMetres:s.currentMetres,observedAt:s.observedAt,freshness:s.freshness,dataStatus:s.dataStatus}))},null,2)+'\n');
          const views=[{w:320,h:568},{w:390,h:844,max:2.2},{w:430,h:932},{w:768,h:1024,max:1.75},{w:1440,h:900,max:1.25}];const browser=await chromium.launch({headless:true});const page=await browser.newPage();const manifest=[];
          for(const v of views){await page.setViewportSize({width:v.w,height:v.h});await page.goto(base+'/?audit021='+Date.now(),{waitUntil:'networkidle'});await page.getByTestId('hydrometric-situation').waitFor();const level=(await page.getByTestId('hydro-current-level').innerText()).trim(),source=(await page.getByTestId('hydro-source-strip').innerText()).trim(),chart=await page.getByTestId('main-hydro-chart').isVisible();const m=await page.evaluate(()=>({ratio:document.documentElement.scrollHeight/innerHeight,overflow:document.documentElement.scrollWidth-innerWidth,hydroY:document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect().y??9999,chart:(()=>{const r=document.querySelector('[data-testid="main-hydro-chart"]')?.getBoundingClientRect();return r?{y:r.y,height:r.height}:null})()}));if(!chart||!level||!source.includes('Instituto Nacional del Agua')||m.overflow>1||(v.max&&m.ratio>v.max)||(v.w===390&&m.hydroY>100))throw new Error(`visual ${v.w} ${JSON.stringify(m)}`);if(v.w===390&&m.chart){const visible=Math.max(0,Math.min(v.h,m.chart.y+m.chart.height)-Math.max(0,m.chart.y));if(visible/m.chart.height<.45)throw new Error(`chart ${visible/m.chart.height}`)}const file=`${process.env.EVIDENCE_DIR}/screenshots/production-live-${v.w}x${v.h}.png`;await page.screenshot({path:file,fullPage:true});manifest.push({file,width:v.w,height:v.h,sha256:createHash('sha256').update(await readFile(file)).digest('hex'),level,source,metrics:m})}
          if(new Set(manifest.map(x=>x.sha256)).size!==manifest.length)throw new Error('production viewport hash collision');await writeFile(process.env.EVIDENCE_DIR+'/production-screenshot-manifest.json',JSON.stringify(manifest,null,2)+'\n');await browser.close();
          NODE

      - name: Material controlled states gate
        shell: bash
        run: |
          set -euo pipefail
          for f in state-live.png state-stale.png state-active-alert.png state-alerts-unverified.png state-offline.png;do test -s "$EVIDENCE_DIR/screenshots/$f";done
          sha256sum "$EVIDENCE_DIR/screenshots/state-stale.png" "$EVIDENCE_DIR/screenshots/state-active-alert.png" "$EVIDENCE_DIR/screenshots/state-alerts-unverified.png" "$EVIDENCE_DIR/screenshots/state-offline.png" > "$EVIDENCE_DIR/material-state-sha256.txt"
          test "$(awk '{print $1}' "$EVIDENCE_DIR/material-state-sha256.txt"|sort -u|wc -l)" -eq 4
          node --input-type=module <<'NODE'
          import{readFile,writeFile}from'node:fs/promises';const m=JSON.parse(await readFile(process.env.EVIDENCE_DIR+'/state-screenshot-manifest.json','utf8'));const required={'state-stale':'STALE_VALUE_AND_CHART_PRESERVED','state-active-alert':'VERIFIED_ACTIVE_ALERT_BAND','state-alerts-unverified':'HEADER_BADGE_ONLY','state-offline':'OFFLINE_CACHED_HYDROMETRY'};for(const[k,v]of Object.entries(required))if(m[k]?.semantic!==v)throw new Error(k);await writeFile(process.env.EVIDENCE_DIR+'/screenshot-semantic-gate.json',JSON.stringify({result:'PASS',required,liveFixtureNote:'LIVE base fixture also has ALERTS_UNVERIFIED; material transition hashes are gated independently.'},null,2)+'\n');
          NODE

      - name: Build accepted 020-B before-after images
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/8984720950/zip" > "$EVIDENCE_DIR/baseline.zip"
          unzip -q "$EVIDENCE_DIR/baseline.zip" -d "$EVIDENCE_DIR/baseline"
          node --input-type=module <<'NODE'
          import{chromium}from'playwright';import{readFile}from'node:fs/promises';
          const browser=await chromium.launch({headless:true});
          for(const [kind,w,h] of [['mobile',390,844],['desktop',1440,900]]){const oldPath=`${process.env.EVIDENCE_DIR}/baseline/production-live-${w}x${h}.png`,newPath=`${process.env.EVIDENCE_DIR}/screenshots/production-live-${w}x${h}.png`;const [a,b]=await Promise.all([readFile(oldPath),readFile(newPath)]);const page=await browser.newPage({viewport:{width:kind==='mobile'?820:2900,height:1000}});await page.setContent(`<style>html,body{margin:0;background:#111}main{display:flex;gap:8px;align-items:flex-start}img{width:${w}px;height:auto;display:block}</style><main><img src="data:image/png;base64,${a.toString('base64')}"><img src="data:image/png;base64,${b.toString('base64')}"></main>`);await page.screenshot({path:`${process.env.EVIDENCE_DIR}/screenshots/before-after-${kind}.png`,fullPage:true});await page.close()}
          await browser.close();
          NODE

      - name: Final evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          cp docs/DESIGN_021.md "$EVIDENCE_DIR/auto-roast-final.md"
          node --input-type=module <<'NODE'
          import{createHash}from'node:crypto';import{readdir,readFile,writeFile}from'node:fs/promises';import{join}from'node:path';const root=process.env.EVIDENCE_DIR,files=[];async function walk(d){for(const e of await readdir(d,{withFileTypes:true})){const p=join(d,e.name);e.isDirectory()?await walk(p):files.push(p)}}await walk(root);const entries=[];for(const p of files){const b=await readFile(p);entries.push({path:p.slice(root.length+1),sha256:createHash('sha256').update(b).digest('hex'),bytes:b.length})}await writeFile(root+'/evidence-manifest.json',JSON.stringify({order:'SOS-SF-AUD-DESIGN-REBUILD-021',designProductCommit:'a7f47e5f8cd87a486afd736989ce8696954d3eb3',deploymentRunId:31161050305,deploymentVersionId:process.env.DEPLOYMENT_VERSION_ID,totalDeployCommands:1,totalCloudflareMutations:1,closureDeployCommands:0,closureCloudflareMutations:0,entries},null,2)+'\n');
          NODE

      - name: Upload screenshots
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-021-screenshots-${{ github.run_id }}
          path: artifacts/order-021-design/screenshots/
          if-no-files-found: error
          retention-days: 30

      - name: Upload evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-021-evidence-${{ github.run_id }}
          path: artifacts/order-021-design/
          if-no-files-found: error
          retention-days: 30

      - name: Disable registered 021 workflows and remove final executor
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" > /tmp/workflows.json
          jq -r '.workflows[]|select(.path|contains("order-021"))|.id' /tmp/workflows.json | while read -r id;do [ -z "$id" ]||gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable";done
          self_id=$(jq -r '.workflows[]|select(.path==".github/workflows/order-021-definitive-closure.yml")|.id' /tmp/workflows.json)
          git config user.name sos-sf-automation;git config user.email sos-sf-automation@users.noreply.github.com
          git rm .github/workflows/order-021-definitive-closure.yml
          git commit -m 'ci: terminally disarm definitive design 021 closure'
          git push origin HEAD:arq/visual-dashboard-v3
          echo "terminal_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT";echo "self_id=$self_id" >> "$GITHUB_OUTPUT"

      - name: Global registry and terminal checkpoint
        shell: bash
        env:
          TERMINAL_SHA: ${{ steps.cleanup.outputs.terminal_sha }}
          WORKFLOW_ID: ${{ steps.cleanup.outputs.self_id }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" > /tmp/final-workflows.json
          test "$(jq '[.workflows[]|select(.state=="active")]|length' /tmp/final-workflows.json)" -eq 0
          body="STATUS=VERIFIED_NOT_ACCEPTED
          ORDER=SOS-SF-AUD-DESIGN-REBUILD-021
          REMOTE_HEAD_BEFORE=14d9c9c9632f3af59648fb6840e2f3bf93916887
          REMOTE_HEAD_AFTER=${TERMINAL_SHA}
          DESIGN_PRODUCT_COMMIT_SHA=a7f47e5f8cd87a486afd736989ce8696954d3eb3
          PRODUCT_CHANGED=YES
          DEPLOY_COMMAND_COUNT=1
          DEPLOYMENT_RUN_ID=31161050305
          DEPLOYMENT_VERSION_ID=5c63fced-5d31-452f-a91c-6407afc148c2
          CLOUDFLARE_MUTATION_COUNT=1
          CLOSURE_DEPLOY_COMMAND_COUNT=0
          DESIGN_REFERENCE_MATRIX=PASS
          AUTO_ROAST_RESULT=PASS_WITH_RECORDED_DECISIONS
          DESIGN_MATERIAL_REGRESSIONS_OPEN=0
          FUNCTIONAL_REGRESSIONS_OPEN=0
          MATERIAL_FINDINGS_OPEN=0
          PRIMARY_HYDROMETRIC_SOURCE_E2E=PASS
          PRODUCTION_API_UI_CONSISTENCY=PASS
          SNAPSHOT_VALIDATION=PASS
          OPTIONAL_URL_CONTRACT=PASS
          FIRST_VIEWPORT_DESIGN_GATE=PASS
          RESPONSIVE_GATE=PASS
          SCROLL_BUDGET_GATE=PASS
          SCREENSHOT_SET_COMPLETE=PASS
          SCREENSHOT_HASH_GATE=PASS
          SCREENSHOT_SEMANTIC_GATE=PASS
          TYPECHECK=PASS
          LINT=PASS_ZERO_PROJECT_WARNINGS
          DEPENDENCY_AUDIT=PASS
          UNIT=PASS
          CONTRACT=PASS
          BUILD=PASS
          WORKER=PASS
          E2E=PASS
          FLAKY_TEST_COUNT=0
          ACCESSIBILITY=PASS
          OFFLINE=PASS
          HORIZONTAL_OVERFLOW=0
          SCREENSHOT_ARTIFACT_ID=${SCREENSHOT_ARTIFACT_ID}
          EVIDENCE_ARTIFACT_ID=${EVIDENCE_ARTIFACT_ID}
          EVIDENCE_ARTIFACT_SHA256=${EVIDENCE_ARTIFACT_SHA256}
          TEMP_WORKFLOW_ID=${WORKFLOW_ID}
          TEMP_WORKFLOW_STATE=disabled_manually
          ACTIVE_MUTATION_WORKFLOWS=0
          RERUNNABLE_HISTORICAL_PRODUCTION_MUTATION_PATHS=0
          CLOUDFLARE_GITHUB_DRIFT=false
          D1_FREE=PRESERVED
          KV_FREE=PRESERVED
          R2=ABSENT
          USD_BUDGET=0
          MAIN_SHA=45047d1c1e16941ea37967d67307d0ab17e85fad
          AUD_HOLD=ACTIVE"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/16/comments" -f body="$body"
