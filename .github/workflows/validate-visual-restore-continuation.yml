name: Validate Visual Restore Continuation

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/validate-visual-restore-continuation-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: sos-sf-015-visual-restore-continuation-validation
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/visual-restore-continuation
  ORDER_ID: SOS-SF-015-VISUAL-PRODUCT-RESTORE-A-CONTINUATION-01
  BASELINE_RUN: '31016898078'
  BASELINE_ARTIFACT: visual-product-restore-a-8025647b774bc5f6a28e7319099492d4720e726b-31016898078

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact recovery scope and zero-cost boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/comparison/previous-with-graph" "$EVIDENCE_DIR/comparison/current-015" "$EVIDENCE_DIR/comparison/corrected"
          git merge-base --is-ancestor 024475b2f31211f1abace43cedea0037a95c1a32 HEAD
          grep -q 'No se pueden verificar alertas ni vigencia' src/client/app/AppShell.tsx
          grep -q "snapshot.alertStatus === 'ALERTA_OFICIAL_ACTIVA'" src/client/features/alerts/OfficialAlertPanel.tsx
          grep -q 'Seguí la instrucción completa de la alerta oficial vigente' src/client/features/situation/SituationSummary.tsx
          grep -q 'Consultá la alerta oficial vigente' src/client/features/actions/SafetyActions.tsx
          grep -q 'body { margin: 0; min-width: 0;' src/client/styles/app.css
          grep -q 'SOS-SF-015-A-CONTINUATION-01' src/client/styles/app.css
          grep -q 'main-hydro-chart' src/client/components/ui/HydroSeriesChart.tsx
          grep -q 'Ver tabla de mediciones' src/client/components/ui/HydroSeriesChart.tsx
          grep -q 'onPointerDown' src/client/components/ui/HydroSeriesChart.tsx
          grep -q 'onKeyDown' src/client/components/ui/HydroSeriesChart.tsx
          ! grep -RInE 'REPORTS_BUCKET|r2_buckets|/r2/' src scripts/provision-cloudflare.mjs wrangler.jsonc wrangler.test.jsonc
          ! grep -Eqi 'wrangler[[:space:]]+deploy|d1.*--remote|kv namespace create|cloudflare.*(create|update|delete)' .github/workflows/validate-visual-restore-continuation.yml
          printf 'ORDER=%s\nBUDGET_MAX_USD=0\nDEPLOY_COMMAND_COUNT=0\nCLOUDFLARE_MUTATIONS=0\nR2=ABSENT\nD1=FREE_PRESERVED\nKV=FREE_PRESERVED\n' "$ORDER_ID" > "$EVIDENCE_DIR/no-mutation-contract.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Recover visual baselines from failed gate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/visual-baseline
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name "$BASELINE_ARTIFACT" --dir /tmp/visual-baseline
          cp /tmp/visual-baseline/comparison/previous-with-graph/mobile-390x844.png "$EVIDENCE_DIR/comparison/previous-with-graph/mobile-390x844.png"
          cp /tmp/visual-baseline/comparison/previous-with-graph/desktop-1440x900.png "$EVIDENCE_DIR/comparison/previous-with-graph/desktop-1440x900.png"
          cp /tmp/visual-baseline/comparison/current-015/mobile-390x844.png "$EVIDENCE_DIR/comparison/current-015/mobile-390x844.png"
          cp /tmp/visual-baseline/comparison/current-015/desktop-1440x900.png "$EVIDENCE_DIR/comparison/current-015/desktop-1440x900.png"

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint -- --max-warnings=0 2>&1 | tee "$EVIDENCE_DIR/lint.log"
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee "$EVIDENCE_DIR/unit.log"
      - name: Contract tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:contract 2>&1 | tee "$EVIDENCE_DIR/contract.log"
      - name: Build and budgets
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
      - name: Worker local D1 and KV
        shell: bash
        run: |
          set -o pipefail
          npm run test:worker 2>&1 | tee "$EVIDENCE_DIR/worker.log"

      - name: Full E2E with retries disabled
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --retries=0 2>&1 | tee "$EVIDENCE_DIR/e2e-full.log"

      - name: Repeat formerly failing cases three times
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/e2e/dashboard.spec.ts --grep 'first viewport answers|200 percent zoom equivalent|offline state never claims|required viewports have no clipping' --repeat-each=3 --retries=0 2>&1 | tee "$EVIDENCE_DIR/e2e-repeat-3x.log"

      - name: Enforce zero flaky tests and canonical screenshots
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq '(^|[^0-9])[1-9][0-9]* flaky' "$EVIDENCE_DIR/e2e-full.log" "$EVIDENCE_DIR/e2e-repeat-3x.log"
          for size in 320x800 390x844 768x1024 1024x768 1440x900; do
            test -s "$EVIDENCE_DIR/screenshots/public-safety-$size.png"
          done
          cp "$EVIDENCE_DIR/screenshots/public-safety-390x844.png" "$EVIDENCE_DIR/comparison/corrected/mobile-390x844.png"
          cp "$EVIDENCE_DIR/screenshots/public-safety-1440x900.png" "$EVIDENCE_DIR/comparison/corrected/desktop-1440x900.png"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          function dimensions(file) {
            const data = fs.readFileSync(file);
            if (data.toString('ascii', 1, 4) !== 'PNG') throw new Error(`NOT_PNG:${file}`);
            return { width: data.readUInt32BE(16), height: data.readUInt32BE(20) };
          }
          const root = process.env.EVIDENCE_DIR;
          const expected = new Map([['320x800',320],['390x844',390],['768x1024',768],['1024x768',1024],['1440x900',1440]]);
          const manifest = {};
          for (const [name,width] of expected) {
            const file = path.join(root,'screenshots',`public-safety-${name}.png`);
            const value = dimensions(file);
            if (value.width !== width || value.height < Number(name.split('x')[1])) throw new Error(`SCREENSHOT_DIMENSIONS:${name}:${value.width}x${value.height}`);
            manifest[name] = value;
          }
          fs.writeFileSync(path.join(root,'visual-dimensions.json'), JSON.stringify(manifest,null,2)+'\n');
          NODE
          sha256sum "$EVIDENCE_DIR"/screenshots/*.png "$EVIDENCE_DIR"/comparison/*/*.png > "$EVIDENCE_DIR/visual-sha256.txt"
          cat > "$EVIDENCE_DIR/visual-gate.txt" <<'TXT'
          GRAPH_RESTORED=true
          MOBILE_320_OVERFLOW=false
          OFFLINE_BANNER_VISIBLE=true
          OFFLINE_ALERT_VERIFICATION_FAIL_CLOSED=true
          DUPLICATE_OFFICIAL_INSTRUCTION=false
          DESKTOP_VISUAL_EVIDENCE=AVAILABLE
          MOBILE_VISUAL_EVIDENCE=AVAILABLE
          TXT
          printf 'STATUS=PASS\nORDER=%s\nFLAKY_TEST_COUNT=0\nDEPLOY_COMMAND_COUNT=0\nGRAPH_RESTORED=true\nMOBILE_320_OVERFLOW=false\nOFFLINE_SEMANTICS=PASS\n' "$ORDER_ID" > "$EVIDENCE_DIR/result.txt"

      - name: Upload continuation validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-restore-continuation-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
