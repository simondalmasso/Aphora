name: SOS-SF HOVS R2 One Deploy
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUT: artifacts/hovs-r2-deploy
      PRODUCT_COMMIT: a996a5142e4a27f0766910660851ee9e7120c9b8
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet c046e4ea8dcb4121ec410f3e3e9ede140299e132 "$PRODUCT_COMMIT" -- wrangler.jsonc migrations src/worker src/domain
          ! grep -q 'r2_buckets' wrangler.jsonc
          mkdir -p "$OUT/screenshots" "$OUT/logs"
          printf '0\n' > "$OUT/deploy-command-count.txt"
          printf '0\n' > "$OUT/postdeploy-redeploy-count.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build immutable product
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          find dist/assets -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' \) -printf '%f\n' | sort > "$OUT/local-assets.txt"
          sha256sum dist/assets/*.js dist/assets/*.css > "$OUT/local-assets-sha256.txt"
      - name: Exactly one production deployment command
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$OUT/deploy-command-count.txt")" = 0
          printf '1\n' > "$OUT/deploy-command-count.txt"
          npx wrangler deploy 2>&1 | tee "$OUT/logs/deploy.log"
          test "$(cat "$OUT/deploy-command-count.txt")" = 1
          VERSION=$(grep -Eo 'Current Version ID: [0-9a-f-]+' "$OUT/logs/deploy.log" | awk '{print $4}' | tail -n1)
          test -n "$VERSION"
          printf '%s\n' "$VERSION" > "$OUT/deployment-version-id.txt"
          npx wrangler deployments list --json > "$OUT/cloudflare-deployments.json"
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const rows=JSON.parse(await readFile(process.env.OUT+'/cloudflare-deployments.json','utf8'));
          const expected=(await readFile(process.env.OUT+'/deployment-version-id.txt','utf8')).trim();
          if(!Array.isArray(rows)||!rows.length) throw Error('no deployments');
          const latest=[...rows].sort((a,b)=>Date.parse(a.created_on??a.createdAt??0)-Date.parse(b.created_on??b.createdAt??0)).at(-1);
          const versions=latest?.versions??[];
          const hit=versions.find(v=>v.version_id===expected);
          if(!hit||Number(hit.percentage)!==100) throw Error('expected version not routed 100% '+JSON.stringify({expected,latest}));
          await writeFile(process.env.OUT+'/deployment-provenance.json',JSON.stringify({expectedVersion:expected,latestDeploymentId:latest.id??null,latestCreatedOn:latest.created_on??latest.createdAt??null,latestVersions:versions,deployCommandCount:1,postdeployRedeployCount:0,pass:true},null,2)+'\n');
          NODE
      - name: Wait for production asset propagation without redeploy
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_JS=$(basename "$(find dist/assets -maxdepth 1 -type f -name '*.js' ! -name '*.map' | head -n1)")
          LOCAL_CSS=$(basename "$(find dist/assets -maxdepth 1 -type f -name '*.css' | head -n1)")
          ok=0
          for i in $(seq 1 30); do
            curl -fsS -H 'Cache-Control: no-cache' "$PRODUCTION_URL/?r2prop=$RANDOM-$i" -o "$OUT/production-index.html" || true
            if grep -q "$LOCAL_JS" "$OUT/production-index.html" && grep -q "$LOCAL_CSS" "$OUT/production-index.html"; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          test "$(cat "$OUT/deploy-command-count.txt")" = 1
          test "$(cat "$OUT/postdeploy-redeploy-count.txt")" = 0
      - name: Production black-box and byte identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const O=process.env.OUT,B=process.env.PRODUCTION_URL;
          const localFiles=(await readFile(O+'/local-assets.txt','utf8')).trim().split('\n').filter(Boolean);
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const assetIdentity=[];
          for(const name of localFiles){const local=await readFile('dist/assets/'+name);const res=await fetch(`${B}/assets/${name}?identity=${Date.now()}`,{headers:{'Cache-Control':'no-cache'}});if(!res.ok)throw Error(`asset ${name} ${res.status}`);const remote=Buffer.from(await res.arrayBuffer());const a=hash(local),b=hash(remote);if(a!==b)throw Error(`asset mismatch ${name}`);assetIdentity.push({path:`/assets/${name}`,localSha256:a,remoteSha256:b,bytes:remote.length,pass:true})}
          async function getJson(path){const r=await fetch(B+path+(path.includes('?')?'&':'?')+'r2='+Date.now(),{headers:{Accept:'application/json','Cache-Control':'no-cache'}});if(!r.ok)throw Error(`${path} ${r.status}`);return r.json()}
          const health=await getJson('/api/health');const snapEnv=await getJson('/api/snapshot');const srcEnv=await getJson('/api/sources');const provenance=await getJson('/source-provenance.json');
          const snapshot=snapEnv.data??snapEnv;const sources=srcEnv.data?.sources??srcEnv.sources??snapshot.sources??[];const systems=snapshot.systems??[];
          const parana=systems.find(x=>x.id==='parana-santa-fe'),salado=systems.find(x=>x.id==='salado-santo-tome');if(!parana?.available||!Number.isFinite(parana.currentMetres))throw Error('Parana unavailable');if(!salado?.available||!Number.isFinite(salado.currentMetres))throw Error('Salado unavailable');if(!sources.some(x=>String(x.organizationName??x.name??'').includes('Instituto Nacional del Agua')))throw Error('INA source absent');
          const browser=await chromium.launch({headless:true});const context=await browser.newContext({serviceWorkers:'block'});const page=await context.newPage();const viewports=[[320,568],[390,844],[430,932],[768,1024],[1440,900],[1920,1080]],screens=[];
          for(const [w,h] of viewports){await page.setViewportSize({width:w,height:h});await page.goto(`${B}/?prod=${Date.now()}`,{waitUntil:'networkidle',timeout:60000});await page.getByTestId('hydrometric-situation').waitFor({state:'visible'});const x=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,signature:(document.querySelector('.hydro-signature-axis')?.textContent||'').replace(/\s+/g,''),quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length,level:(document.querySelector('[data-testid="hydro-current-level"]')?.textContent||'').trim()}));if(x.overflow>1||x.signature!=='RÍOREGLATIEMPO'||x.quick!==6||x.contacts!==5)throw Error(`prod ui ${w} ${JSON.stringify(x)}`);const f=`${O}/screenshots/production-home-${w}x${h}.png`;await page.screenshot({path:f,fullPage:true});screens.push({viewport:`${w}x${h}`,sha256:hash(await readFile(f)),...x})}
          await page.setViewportSize({width:390,height:844});await page.goto(`${B}/?parity=${Date.now()}`,{waitUntil:'networkidle'});const pText=await page.getByTestId('hydro-current-level').innerText();if(!pText.includes(parana.currentMetres.toFixed(2).replace('.',',')))throw Error(`Parana parity ${pText}/${parana.currentMetres}`);await page.getByRole('tab',{name:'Salado'}).click();const sText=await page.getByTestId('hydro-current-level').innerText();if(!sText.includes(salado.currentMetres.toFixed(2).replace('.',',')))throw Error(`Salado parity ${sText}/${salado.currentMetres}`);
          await page.goto(`${B}/gestion-de-riesgo/fenomeno-el-nino?prod=${Date.now()}`,{waitUntil:'networkidle'});const el=await page.locator('main').innerText();if(!el.includes('Fenómeno El Niño')||!el.includes('5,30 m')||!el.includes('no es un umbral general de evacuación de SOS-SF'))throw Error('El Nino production safety fail');await page.screenshot({path:`${O}/screenshots/production-el-nino-390x844.png`,fullPage:true});
          await page.goto(`${B}/lite?prod=${Date.now()}`,{waitUntil:'domcontentloaded'});const lite=(await page.locator('body').innerText()).trim();if(lite.length<40)throw Error('lite empty');
          await context.close();
          const offlineContext=await browser.newContext();const op=await offlineContext.newPage();await op.goto(`${B}/?seed=${Date.now()}`,{waitUntil:'networkidle'});await offlineContext.setOffline(true);await op.reload({waitUntil:'domcontentloaded'}).catch(()=>{});await op.waitForTimeout(500);const offlineText=await op.locator('body').innerText();if(!/Sin conexión|No es información actual|sin conexión/i.test(offlineText))throw Error('offline signal absent');if(!(await op.getByTestId('hydrometric-situation').isVisible().catch(()=>false)))throw Error('offline hydro absent');await op.screenshot({path:`${O}/screenshots/production-offline-390x844.png`,fullPage:true});await offlineContext.close();await browser.close();
          const version=(await readFile(O+'/deployment-version-id.txt','utf8')).trim();
          await writeFile(O+'/production-black-box.json',JSON.stringify({deploymentVersionId:version,health,snapshotId:snapshot.id??null,hydrometry:{parana:{currentMetres:parana.currentMetres,observedAt:parana.observedAt,freshness:parana.freshness},salado:{currentMetres:salado.currentMetres,observedAt:salado.observedAt,freshness:salado.freshness}},inaSource:true,apiUiParity:true,signature:'RÍO / REGLA / TIEMPO',viewports:screens,elNinoSafety:true,lite:true,offline:true,assetIdentity,sourceProvenanceAvailable:Boolean(provenance),deployCommandCount:1,postdeployRedeployCount:0,pass:true},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-r2-deploy-${{ github.run_id }}
          path: artifacts/hovs-r2-deploy
          if-no-files-found: error
      - name: Disarm deployment path
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-r2-one-deploy.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-one-deploy.yml
          git commit -m "ci: terminally disarm HOVS R2 deploy path"
          git push origin HEAD:arq/visual-dashboard-v3
