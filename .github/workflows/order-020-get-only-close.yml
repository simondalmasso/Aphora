name: SOS-SF Order 020 GET-only Close

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths:
      - .github/order-020-get-only-trigger

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-order-020-get-only-close
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/order-020-final
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p node_modules/.tmp
          cp .github/order020-get-only-close.mjs node_modules/.tmp/order020-get-only-close.mjs

      - name: Verify deployed product with GET only
        id: verify
        run: node node_modules/.tmp/order020-get-only-close.mjs verify

      - name: Upload terminal production screenshots
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020-terminal-screenshots
          path: artifacts/order-020-final/screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Globally disarm and remove historical mutation paths
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/order020-get-only-cleanup.sh

      - name: Upload complete terminal evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020-final-evidence
          path: artifacts/order-020-final
          if-no-files-found: error
          retention-days: 30

      - name: Publish unique AUD checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
        run: node node_modules/.tmp/order020-get-only-close.mjs checkpoint

      - name: Remove temporary local verifier
        if: always()
        run: rm -f node_modules/.tmp/order020-get-only-close.mjs
