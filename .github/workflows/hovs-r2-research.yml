name: SOS-SF HOVS R2 Research
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT: artifacts/hovs-r2-research
      TAKE_HEAD: c046e4ea8dcb4121ec410f3e3e9ede140299e132
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$TAKE_HEAD" HEAD
          mkdir -p "$OUT/screenshots"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Live design extraction and baseline
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const out=process.env.OUT;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({serviceWorkers:'block'});
          const page=await context.newPage();
          async function extract(url,name){
            let status='OK', error=null;
            try { await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000}); await page.waitForTimeout(3500); } catch(e){status='NAV_ERROR';error=String(e)}
            const data=await page.evaluate(()=>{
              const els=[...document.querySelectorAll('body *')].filter(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'}).slice(0,5000);
              const freq=(values)=>Object.entries(values.reduce((a,v)=>(a[v]=(a[v]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,24).map(([value,count])=>({value,count}));
              const clean=(v)=>String(v||'').trim();
              const styles=els.map(el=>{const s=getComputedStyle(el);const r=el.getBoundingClientRect();return {tag:el.tagName.toLowerCase(),cls:el.className?.toString?.().slice(0,160)||'',fontFamily:clean(s.fontFamily),fontSize:clean(s.fontSize),fontWeight:clean(s.fontWeight),lineHeight:clean(s.lineHeight),color:clean(s.color),backgroundColor:clean(s.backgroundColor),borderRadius:clean(s.borderRadius),padding:clean(s.padding),gap:clean(s.gap),height:Math.round(r.height),width:Math.round(r.width)}});
              const buttons=styles.filter(x=>x.tag==='button'||x.tag==='a').slice(0,120);
              const headings=[...document.querySelectorAll('h1,h2,h3')].filter(el=>el.getBoundingClientRect().height>0).slice(0,40).map(el=>{const s=getComputedStyle(el);return {tag:el.tagName.toLowerCase(),text:(el.textContent||'').trim().slice(0,100),fontFamily:s.fontFamily,fontSize:s.fontSize,fontWeight:s.fontWeight,lineHeight:s.lineHeight,letterSpacing:s.letterSpacing,color:s.color}});
              const nav=[...document.querySelectorAll('header,nav')].filter(el=>el.getBoundingClientRect().height>0).slice(0,20).map(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return {tag:el.tagName.toLowerCase(),cls:el.className?.toString?.().slice(0,160)||'',height:Math.round(r.height),background:s.backgroundColor,color:s.color,padding:s.padding,gap:s.gap,borderRadius:s.borderRadius}});
              return {title:document.title,url:location.href,bodyText:(document.body.innerText||'').slice(0,1200),counts:{elements:els.length,links:document.querySelectorAll('a').length,buttons:document.querySelectorAll('button').length,images:document.querySelectorAll('img').length},frequencies:{fontFamilies:freq(styles.map(x=>x.fontFamily)),fontSizes:freq(styles.map(x=>x.fontSize)),fontWeights:freq(styles.map(x=>x.fontWeight)),colors:freq(styles.map(x=>x.color)),backgroundColors:freq(styles.map(x=>x.backgroundColor)),borderRadius:freq(styles.map(x=>x.borderRadius)),padding:freq(styles.map(x=>x.padding)),gaps:freq(styles.map(x=>x.gap))},headings,nav,controls:buttons};
            });
            const shot=`${out}/screenshots/${name}.png`; await page.screenshot({path:shot,fullPage:true});
            return {status,error,...data};
          }
          await page.setViewportSize({width:1440,height:900});
          const muni=await extract('https://santafeciudad.gov.ar/','municipal-live-1440');
          const risk=await extract('https://santafeciudad.gov.ar/direccion-de-gestion-de-riesgo/fenomeno-el-nino/','municipal-risk-live-1440');
          const hovs=await extract('https://vanschneider.com/','hovs-live-1440');
          const prod='https://sos-sf.simondalmasso44.workers.dev';
          const baseline={};
          for(const [w,h] of [[320,568],[390,844],[768,1024],[1440,900]]){
            await page.setViewportSize({width:w,height:h});
            await page.goto(`${prod}/?r2baseline=${Date.now()}`,{waitUntil:'networkidle'});
            const key=`${w}x${h}`;
            baseline[key]=await page.evaluate(()=>({width:innerWidth,height:innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight,sections:document.querySelectorAll('main.dashboard > section').length,cards:document.querySelectorAll('article').length,quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length,mainText:(document.querySelector('main')?.innerText||'').slice(0,1200)}));
            await page.screenshot({path:`${out}/screenshots/before-${key}.png`,fullPage:true});
          }
          const result={capturedAt:new Date().toISOString(),municipal:muni,municipalRisk:risk,hovs,baseline,measurementHonesty:'LIVE_COMPUTED_STYLE_OR_EXPLICIT_STATUS',referenceIntent:'EXTRACT_DNA_NOT_COPY_ASSETS'};
          await writeFile(`${out}/sf-dna-live-extraction.json`,JSON.stringify(result,null,2)+'\n');
          await writeFile(`${out}/research-summary.md`,`# HOVS R2 research\n\nMunicipal live: ${muni.status}\nRisk live: ${risk.status}\nHOVS live: ${hovs.status}\n\nThe extraction records computed style frequencies, headings, nav and controls. Protected municipal identity assets are not copied.\n`);
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-r2-research-${{ github.run_id }}
          path: artifacts/hovs-r2-research
          if-no-files-found: error
      - name: Disarm research workflow
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-r2-research.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-research.yml
          git commit -m "ci: disarm HOVS R2 research"
          git push origin HEAD:arq/visual-dashboard-v3
