name: Deploy Workers
# V3-014 source export mode; same canonical workflow, no production action.

on:
  workflow_dispatch:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/arq-v3-deploy-trigger]

permissions:
  contents: read

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: false

jobs:
  source-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
      - name: Assert export mode
        run: grep -q '^MODE=EXPORT_V3_FULL_014$' .github/arq-v3-deploy-trigger
      - name: Package exact source
        run: |
          printf '%s\n' "$GITHUB_SHA" > SOURCE_SHA.txt
          tar --exclude=.git --exclude=node_modules --exclude=artifacts/current-run -czf sos-sf-v3-full-014-source.tgz .
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-v3-full-014-source-${{ github.sha }}
          path: sos-sf-v3-full-014-source.tgz
          if-no-files-found: error
          retention-days: 3
