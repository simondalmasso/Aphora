name: Deploy Workers
# verification-revision: 15

on:
  workflow_dispatch:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/arq-v3-deploy-trigger]

permissions:
  contents: read
  issues: write

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: true

jobs:
  quality-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EVIDENCE_DIR: artifacts/current-run
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
      SOS_SF_OPERATOR_EMAILS: ${{ secrets.SOS_SF_OPERATOR_EMAILS }}
      MESSAGE_BLOCKLIST: ${{ secrets.MESSAGE_BLOCKLIST }}
      REPORT_RETENTION_DAYS: ${{ vars.REPORT_RETENTION_DAYS }}
      INA_WATERML_PARANA_URL: ${{ vars.INA_WATERML_PARANA_URL }}
      INA_WATERML_SALADO_URL: ${{ vars.INA_WATERML_SALADO_URL }}
      PORTS_HYDROMETER_JSON_URL: ${{ vars.PORTS_HYDROMETER_JSON_URL }}
      SMN_OBSERVATIONS_JSON_URL: ${{ vars.SMN_OBSERVATIONS_JSON_URL }}
      SMN_ALERTS_JSON_URL: ${{ vars.SMN_ALERTS_JSON_URL }}
      CHECKPOINT_COMMENT_ID: "5172387484"
      EXPECTED_DEPLOYMENT_URL: "https://sos-sf.simondalmasso44.workers.dev"
    steps:
      - name: Publish run start
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          body=$(printf 'ARQ_V3_GATE_STATUS=RUNNING\nAUD_HOLD=ACTIVE\nRUN_ID=%s\nSHA=%s\nREF=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF")
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${CHECKPOINT_COMMENT_ID}" --method PATCH -f body="$body"

      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Initialize clean evidence
        run: |
          rm -rf "$EVIDENCE_DIR" playwright-report test-results
          mkdir -p "$EVIDENCE_DIR/screenshots"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/source-sha.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Lint clean
        run: npm run lint -- --max-warnings=0
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:contract
      - name: Build and budgets
        run: npm run build
      - name: Worker integration tests
        run: npm run test:worker
      - name: E2E and deterministic screenshots
        run: npm run test:e2e

      - name: Prepare bounded deployment configuration
        id: provision
        run: node scripts/provision-cloudflare.mjs

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc 2>&1 | tee "$EVIDENCE_DIR/wrangler-dry-run.log"

      - name: Apply D1 migrations
        if: steps.provision.outputs.resources_ready == 'true'
        run: npx wrangler d1 migrations apply sos-sf-private --remote --config wrangler.generated.jsonc 2>&1 | tee "$EVIDENCE_DIR/d1-migrations.log"

      - name: Verify D1 schema
        if: steps.provision.outputs.resources_ready == 'true'
        run: |
          npx wrangler d1 execute sos-sf-private --remote --config wrangler.generated.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_sessions','conversations','messages','reports','report_photos','report_events','rate_windows') ORDER BY name" --json > "$EVIDENCE_DIR/d1-schema.json"
          node -e 'const fs=require("node:fs"),p=require("node:path");const x=JSON.parse(fs.readFileSync(p.join(process.env.EVIDENCE_DIR,"d1-schema.json"),"utf8"));const rows=(Array.isArray(x)?x:[x]).flatMap(v=>v.results||v.result?.[0]?.results||[]);const names=new Set(rows.map(v=>v.name));for(const n of ["auth_sessions","conversations","messages","reports","report_photos","report_events","rate_windows"])if(!names.has(n))throw new Error(`D1_TABLE_MISSING:${n}`)'

      - name: Verify R2 lifecycle
        if: steps.provision.outputs.resources_ready == 'true'
        run: |
          probe="__ci_probe/${GITHUB_RUN_ID}.txt"
          printf 'sos-sf-r2-probe' > /tmp/probe.txt
          npx wrangler r2 object put "sos-sf-private-reports/${probe}" --file /tmp/probe.txt --config wrangler.generated.jsonc
          npx wrangler r2 object get "sos-sf-private-reports/${probe}" --file /tmp/read.txt --config wrangler.generated.jsonc
          cmp /tmp/probe.txt /tmp/read.txt
          npx wrangler r2 object delete "sos-sf-private-reports/${probe}" --config wrangler.generated.jsonc

      - name: Configure private Worker secrets
        if: steps.provision.outputs.private_ready == 'true'
        run: npx wrangler secret bulk .worker-secrets.json --config wrangler.generated.jsonc

      - name: Deploy Worker and assets
        id: deploy
        run: |
          npx wrangler deploy --config wrangler.generated.jsonc 2>&1 | tee "$EVIDENCE_DIR/wrangler-deploy.log"
          deployment_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$EVIDENCE_DIR/wrangler-deploy.log" | tail -n 1 || true)
          deployment_url=${deployment_url:-$EXPECTED_DEPLOYMENT_URL}
          test "$deployment_url" = "$EXPECTED_DEPLOYMENT_URL"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify remote deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          WRITE_PROOF: "1"
          EXPECT_PRIVATE_FEATURES: ${{ steps.provision.outputs.private_ready }}
        run: npm run verify:remote -- "$DEPLOYMENT_URL"

      - name: Write verification summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          PRIVATE_READY: ${{ steps.provision.outputs.private_ready }}
          RESOURCES_READY: ${{ steps.provision.outputs.resources_ready }}
        run: |
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.mkdirSync(process.env.EVIDENCE_DIR,{recursive:true});fs.writeFileSync(p.join(process.env.EVIDENCE_DIR,"verification.json"),JSON.stringify({schemaVersion:"1.0",decisionId:"SOS-SF-OWNER-FINAL-DEPLOY-010",audHold:"ACTIVE",runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA,conclusion:process.env.JOB_STATUS,deploymentUrl:process.env.DEPLOYMENT_URL||null,privateRuntime:process.env.PRIVATE_READY==="true"?"ACTIVE":"FAIL_CLOSED",storageResources:process.env.RESOURCES_READY==="true"?"VERIFIED":"MANAGEMENT_API_UNAUTHORIZED",generatedAt:new Date().toISOString()},null,2)+"\n")'

      - name: Finalize evidence
        if: always()
        run: node scripts/finalize-evidence.mjs
      - name: Remove generated sensitive material
        if: always()
        run: rm -f .worker-secrets.json wrangler.generated.jsonc /tmp/probe.txt /tmp/read.txt

      - name: Upload evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-v3-evidence-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30

      - name: Publish terminal state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          body=$(printf 'ARQ_V3_GATE_STATUS=%s\nAUD_HOLD=ACTIVE\nRUN_ID=%s\nSHA=%s\nARTIFACT_ID=%s\nARTIFACT_DIGEST=%s\nDEPLOYMENT_URL=%s\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$GITHUB_SHA" "${ARTIFACT_ID:-NONE}" "${ARTIFACT_DIGEST:-NONE}" "${DEPLOYMENT_URL:-NOT_DEPLOYED}")
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${CHECKPOINT_COMMENT_ID}" --method PATCH -f body="$body"
