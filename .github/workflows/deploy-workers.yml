name: Deploy Workers
# verification-revision: 3

on:
  workflow_dispatch:
  push:
    branches:
      - arq/visual-dashboard-v3

permissions:
  contents: read
  issues: write

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: true

jobs:
  quality-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
      SOS_SF_OPERATOR_EMAILS: ${{ secrets.SOS_SF_OPERATOR_EMAILS }}
      MESSAGE_BLOCKLIST: ${{ secrets.MESSAGE_BLOCKLIST }}
      REPORT_RETENTION_DAYS: ${{ vars.REPORT_RETENTION_DAYS }}
      INA_WATERML_PARANA_URL: ${{ vars.INA_WATERML_PARANA_URL }}
      INA_WATERML_SALADO_URL: ${{ vars.INA_WATERML_SALADO_URL }}
      PORTS_HYDROMETER_JSON_URL: ${{ vars.PORTS_HYDROMETER_JSON_URL }}
      SMN_OBSERVATIONS_JSON_URL: ${{ vars.SMN_OBSERVATIONS_JSON_URL }}
      SMN_ALERTS_JSON_URL: ${{ vars.SMN_ALERTS_JSON_URL }}
      CHECKPOINT_COMMENT_ID: "5172387484"
      EXPECTED_DEPLOYMENT_URL: "https://sos-sf.simondalmasso44.workers.dev"
    steps:
      - name: Publish run start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf 'ARQ_V3_GATE_STATUS=RUNNING\nRUN_ID=%s\nSHA=%s\nREF=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF")
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${CHECKPOINT_COMMENT_ID}" --method PATCH -f body="$body"

      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract

      - name: Build and performance budgets
        run: npm run build

      - name: Worker integration with local D1 and R2
        run: npm run test:worker

      - name: End-to-end tests and screenshots
        run: npm run test:e2e

      - name: Provision bounded Cloudflare resources
        id: provision
        run: |
          node scripts/provision-cloudflare.mjs
          node -e 'const fs=require("node:fs");fs.mkdirSync("artifacts/v1",{recursive:true});fs.writeFileSync("artifacts/v1/cloudflare-resources.json",JSON.stringify({schemaVersion:"1.0",worker:"sos-sf",d1Database:"sos-sf-private",r2Bucket:"sos-sf-private-reports",generatedAt:new Date().toISOString()},null,2)+"\n")'

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --config wrangler.generated.jsonc 2>&1 | tee wrangler-dry-run.log

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sos-sf-private --remote --config wrangler.generated.jsonc 2>&1 | tee d1-migrations.log

      - name: Verify D1 schema
        run: |
          npx wrangler d1 execute sos-sf-private --remote --config wrangler.generated.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('auth_sessions','conversations','messages','reports','report_photos','report_events','rate_windows') ORDER BY name" --json > d1-schema.json
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync("d1-schema.json","utf8"));const rows=(Array.isArray(p)?p:[p]).flatMap(x=>x.results||x.result?.[0]?.results||[]);const names=new Set(rows.map(x=>x.name));for(const n of ["auth_sessions","conversations","messages","reports","report_photos","report_events","rate_windows"])if(!names.has(n))throw new Error(`D1_TABLE_MISSING:${n}`)'

      - name: Verify private R2 lifecycle
        run: |
          probe="__ci_probe/${GITHUB_RUN_ID}.txt"
          printf 'sos-sf-r2-probe' > /tmp/sos-sf-r2-probe.txt
          npx wrangler r2 object put "sos-sf-private-reports/${probe}" --file /tmp/sos-sf-r2-probe.txt --content-type text/plain --config wrangler.generated.jsonc
          npx wrangler r2 object get "sos-sf-private-reports/${probe}" --file /tmp/sos-sf-r2-read.txt --config wrangler.generated.jsonc
          cmp /tmp/sos-sf-r2-probe.txt /tmp/sos-sf-r2-read.txt
          npx wrangler r2 object delete "sos-sf-private-reports/${probe}" --config wrangler.generated.jsonc

      - name: Configure protected Worker secrets
        run: npx wrangler secret bulk .worker-secrets.json --config wrangler.generated.jsonc

      - name: Deploy Worker and Static Assets
        id: deploy
        run: |
          npx wrangler deploy --config wrangler.generated.jsonc 2>&1 | tee wrangler-deploy.log
          deployment_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-deploy.log | tail -n 1 || true)
          deployment_url=${deployment_url:-$EXPECTED_DEPLOYMENT_URL}
          test "$deployment_url" = "$EXPECTED_DEPLOYMENT_URL"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify remote deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          WRITE_PROOF: "1"
        run: npm run verify:remote -- "$DEPLOYMENT_URL"

      - name: Write verification summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          node -e 'const fs=require("node:fs");fs.mkdirSync("artifacts/v1",{recursive:true});fs.writeFileSync("artifacts/v1/verification.json",JSON.stringify({schemaVersion:"1.0",decisionId:"SOS-SF-AUD-V3-CODE-REVIEW-006",runId:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA,ref:process.env.GITHUB_REF,conclusion:process.env.JOB_STATUS,deploymentUrl:process.env.DEPLOYMENT_URL||null,generatedAt:new Date().toISOString()},null,2)+"\n")'

      - name: Remove generated secret material
        if: always()
        run: rm -f .worker-secrets.json wrangler.generated.jsonc /tmp/sos-sf-r2-probe.txt /tmp/sos-sf-r2-read.txt

      - name: Upload V3 evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-v3-integrated-${{ github.sha }}
          path: |
            artifacts/v1/
            playwright-report/
            wrangler-dry-run.log
            wrangler-deploy.log
            d1-migrations.log
            d1-schema.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish terminal run state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          body=$(printf 'ARQ_V3_GATE_STATUS=%s\nRUN_ID=%s\nSHA=%s\nREF=%s\nARTIFACT_ID=%s\nARTIFACT_DIGEST=%s\nDEPLOYMENT_URL=%s\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_REF" "${ARTIFACT_ID:-NONE}" "${ARTIFACT_DIGEST:-NONE}" "${DEPLOYMENT_URL:-NOT_DEPLOYED}")
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${CHECKPOINT_COMMENT_ID}" --method PATCH -f body="$body"
