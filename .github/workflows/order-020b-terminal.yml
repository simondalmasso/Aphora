name: SOS-SF 020-B Master Terminal Execution

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/order-020b-terminal-trigger]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-order-020b-terminal
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/order-020b-terminal
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  REPORT_RETENTION_DAYS: ${{ vars.REPORT_RETENTION_DAYS }}
  INA_WATERML_PARANA_URL: ${{ vars.INA_WATERML_PARANA_URL }}
  INA_WATERML_SALADO_URL: ${{ vars.INA_WATERML_SALADO_URL }}
  PORTS_HYDROMETER_JSON_URL: ${{ vars.PORTS_HYDROMETER_JSON_URL }}
  SMN_OBSERVATIONS_JSON_URL: ${{ vars.SMN_OBSERVATIONS_JSON_URL }}
  SMN_ALERTS_JSON_URL: ${{ vars.SMN_ALERTS_JSON_URL }}

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify take point and immutable main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = arq/visual-dashboard-v3
          git merge-base --is-ancestor 4ef8b79f40f7c275db35aeb4f07eca74cf5245aa HEAD
          git merge-base --is-ancestor 0d214c590bb99d02017188ae51513a58ba293749 HEAD
          test "$(git rev-parse origin/main)" = 45047d1c1e16941ea37967d67307d0ab17e85fad
          test "$(git ls-remote origin refs/heads/arq/visual-dashboard-v3 | cut -f1)" = "$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          mkdir -p "$EVIDENCE_DIR/screenshots" node_modules/.tmp
          cp .github/order020b/terminal.mjs node_modules/.tmp/order020b-terminal.mjs
          cp .github/order020b/checkpoint.mjs node_modules/.tmp/order020b-checkpoint.mjs
          python .github/order020b/harden-terminal.py
          node --check node_modules/.tmp/order020b-terminal.mjs
          node --check node_modules/.tmp/order020b-checkpoint.mjs

      - name: Resolve production truth before any deploy
        id: truth
        run: |
          node .github/order020b/predeploy.mjs
          cp "$EVIDENCE_DIR/screenshots/predeploy-production-390x844.png" "$EVIDENCE_DIR/screenshots/before-owner-rejected-390x844.png"
          test "${{ steps.truth.outputs.product_bug }}" = true
          test "${{ steps.truth.outputs.api_has_usable }}" = true
          test "${{ steps.truth.outputs.ui_matched }}" = false

      - name: Review every tracked file
        run: node node_modules/.tmp/order020b-terminal.mjs review

      - name: Repository secret and static safety gate
        run: |
          bash .github/order020b/run-gate.sh repo-security node --input-type=module -e "import{readFile}from'node:fs/promises';const m=JSON.parse(await readFile(process.env.EVIDENCE_DIR+'/code-review-manifest.json'));const bad=m.flatMap(e=>['HISTORICAL_ARTIFACT','DOCUMENTATION'].includes(e.category)?[]:e.review_evidence.staticFlags.filter(f=>['HARDCODED_PRIVATE_KEY','AWS_KEY_SHAPE','EVAL','NEW_FUNCTION','EXTENSIONLESS_RELATIVE_IMPORT'].includes(f.id)).map(f=>({path:e.path,...f})));if(bad.length){console.error(JSON.stringify(bad,null,2));process.exit(1)}console.log('executable static security flags: 0')"

      - name: Dependency audit
        run: |
          bash .github/order020b/run-gate.sh dependency-audit npm audit --audit-level=high
          cp "$EVIDENCE_DIR/logs/dependency-audit.log" "$EVIDENCE_DIR/dependency-audit.txt"

      - name: Typecheck
        run: bash .github/order020b/run-gate.sh typecheck npm run typecheck

      - name: Lint with zero project warnings
        run: bash .github/order020b/run-gate.sh lint npx eslint . --max-warnings=0 --ignore-pattern '.github/order020b/**'

      - name: Unit suite
        run: bash .github/order020b/run-gate.sh unit npm run test:unit

      - name: Contract suite
        run: bash .github/order020b/run-gate.sh contract npm run test:contract

      - name: Build suite
        run: bash .github/order020b/run-gate.sh build npm run build

      - name: Worker suite
        run: bash .github/order020b/run-gate.sh worker npm run test:worker

      - name: Full E2E and controlled semantic evidence
        env:
          EVIDENCE_DIR: artifacts/order-020b-terminal
        run: bash .github/order020b/run-gate.sh e2e npm run test:e2e

      - name: Accessibility keyboard and focus gate
        env:
          EVIDENCE_DIR: artifacts/order-020b-terminal
        run: bash .github/order020b/run-gate.sh accessibility npx playwright test -g "chart supports keyboard reading|skip link is hidden|alert feed failure"

      - name: Offline and service worker gate
        env:
          EVIDENCE_DIR: artifacts/order-020b-terminal
        run: bash .github/order020b/run-gate.sh offline npx playwright test -g "offline keeps the cached hydrometric surface"

      - name: Source freshness and fallback gate
        run: bash .github/order020b/run-gate.sh source-freshness-fallback bash -lc "npm run test:unit && node scripts/revalidate-public-sources.mjs"

      - name: Performance and bundle gate
        run: bash .github/order020b/run-gate.sh performance node scripts/verify-build.mjs

      - name: Prepare one Workers-first deployment
        run: node node_modules/.tmp/order020b-terminal.mjs prepare-deploy

      - name: Rebuild exact served bytes with terminal provenance
        run: npm run build

      - name: Final remote-head guard before mutation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/arq/visual-dashboard-v3 | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = 45047d1c1e16941ea37967d67307d0ab17e85fad

      - name: Deploy product exactly once
        id: deploy
        run: bash .github/order020b/run-gate.sh deployment npx wrangler deploy --config wrangler.generated.jsonc

      - name: Synchronize deployed provenance to GitHub
        run: |
          set -euo pipefail
          git add public/source-provenance.json
          git diff --cached --check
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git commit -m 'chore: synchronize 020-B deployed provenance'
          git push origin HEAD:arq/visual-dashboard-v3

      - name: Verify production API/UI consistency and source truth
        id: production
        run: node node_modules/.tmp/order020b-terminal.mjs production

      - name: Production security headers and endpoints gate
        run: bash .github/order020b/run-gate.sh security-endpoints node .github/order020b/security-gate.mjs

      - name: Re-review synchronized effective HEAD
        run: node node_modules/.tmp/order020b-terminal.mjs review

      - name: Terminal global desarm
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/order020b/cleanup.sh

      - name: Prove tested product bytes equal terminal product bytes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$GITHUB_SHA" HEAD -- . ':(exclude).github/**' ':(exclude)public/source-provenance.json')"
          test -z "$changed"
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile(process.env.EVIDENCE_DIR + '/head-equivalence.json', JSON.stringify({ testedHeadSha: process.env.GITHUB_SHA, terminalHeadSha: process.env.TERMINAL_SHA, operationalDifferencesExcludingProvenance: [], result: 'PASS' }, null, 2) + '\n');
          NODE
        env:
          TERMINAL_SHA: ${{ steps.cleanup.outputs.terminal_sha }}

      - name: Finalize evidence-derived matrices and screenshot gates
        run: node node_modules/.tmp/order020b-terminal.mjs finalize

      - name: Upload complete terminal screenshots
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020b-terminal-screenshots
          path: artifacts/order-020b-terminal/screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete terminal evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-order-020b-terminal-evidence
          path: artifacts/order-020b-terminal
          if-no-files-found: error
          retention-days: 30

      - name: Publish the only ARQ 020-B checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RUN_ID: ${{ github.run_id }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_SHA256: ${{ steps.evidence.outputs.artifact-digest }}
        run: node node_modules/.tmp/order020b-checkpoint.mjs

      - name: Remove local generated deployment material
        if: always()
        run: rm -f wrangler.generated.jsonc node_modules/.tmp/order020b-terminal.mjs node_modules/.tmp/order020b-checkpoint.mjs
