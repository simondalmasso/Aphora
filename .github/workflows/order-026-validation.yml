name: order-026-context-first-validation

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/order-026-validation.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BRANCH: arq/visual-dashboard-v3
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      EVIDENCE_DIR: artifacts/order-026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Repair QA lint and lock current product
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/context-first-026.spec.ts')
          s = p.read_text()
          old = r"/\d[,\.]\d+\s*m/"
          new = r"/\d[,.]\d+\s*m/"
          if old not in s:
              raise SystemExit('lint regex marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'sos-sf-arq'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/context-first-026.spec.ts
          git commit -m 'test(026): repair semantic selector regex [skip ci]'
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "product_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Static runtime and data gates
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm run test:unit
          npm run test:contract
          npm run build
          npm run test:worker
      - run: npx playwright install --with-deps chromium
      - name: Full E2E
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test
          npx playwright test tests/e2e/context-first-026.spec.ts tests/e2e/owner-seriousness-024.spec.ts tests/e2e/dual-river-priority.spec.ts --project=desktop
      - name: Validation evidence
        run: |
          echo 'ORDER_026_PREDEPLOY_VALIDATION=PASS'
          echo 'PRODUCT_COMMIT=${{ steps.fix.outputs.product_commit }}'
          echo 'DEPLOY_COUNT=0'
