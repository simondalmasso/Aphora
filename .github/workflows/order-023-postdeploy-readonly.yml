name: order-023-postdeploy-readonly

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - '.github/workflows/order-023-postdeploy-readonly.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_DIR: artifacts/order-023-postdeploy
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      EXPECTED_VERSION: e8fd3b53-4028-43a6-90fb-120d95ffc439
      PROD_URL: https://sos-sf.simondalmasso44.workers.dev
      FIREBASE_URL: https://sos-sf.web.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Prove read-only scope and main immutability
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          if grep -R "wrangler deploy --config" -n .github/workflows 2>/dev/null; then
            echo 'Mutating deploy workflow still present' >&2
            exit 1
          fi
          echo READ_ONLY=YES

      - name: Install browser runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture production browser diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/screenshots"
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const base = process.env.PROD_URL;
          const out = process.env.EVIDENCE_DIR;
          const browser = await chromium.launch({ headless: true });
          const records = [];
          for (const viewport of [{width:390,height:844,name:'390'},{width:1440,height:900,name:'1440'}]) {
            const page = await browser.newPage({ viewport });
            const consoleLines = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', msg => consoleLines.push(`${msg.type()}: ${msg.text()}`));
            page.on('pageerror', err => pageErrors.push(err.stack || err.message));
            page.on('requestfailed', req => failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText}`));
            const response = await page.goto(`${base}/?order023-readonly=${Date.now()}-${viewport.name}`, { waitUntil:'domcontentloaded', timeout:30000 });
            await page.waitForTimeout(6000);
            const record = await page.evaluate(() => ({
              title: document.title,
              bodyText: document.body.innerText.slice(0,10000),
              bodyHtml: document.body.innerHTML.slice(0,30000),
              h1s: [...document.querySelectorAll('h1')].map(x => x.textContent),
              roots: [...document.querySelectorAll('#root')].map(x => x.innerHTML.slice(0,5000)),
              scripts: [...document.scripts].map(s => s.src || '[inline]'),
              overflow: document.documentElement.scrollWidth - innerWidth,
            }));
            records.push({ viewport, status: response?.status(), url: page.url(), ...record, consoleLines, pageErrors, failedRequests });
            await page.screenshot({ path:`${out}/screenshots/diagnostic-${viewport.name}.png`, fullPage:true });
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(`${out}/browser-diagnostics.json`, JSON.stringify(records,null,2)+'\n');
          NODE

      - name: Capture APIs and alias read-only
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/health /api/snapshot /api/sources /api/auth/config /lite; do
            curl -fsS "$PROD_URL$path?order023-readonly=${GITHUB_RUN_ID}" > "$EVIDENCE_DIR/$(echo "$path" | tr '/' '_' | sed 's/^_//').txt"
          done
          curl -sS -D "$EVIDENCE_DIR/firebase-headers.txt" -o /dev/null "$FIREBASE_URL/?order023-readonly=${GITHUB_RUN_ID}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-023-postdeploy-diagnostic-${{ github.run_id }}
          path: artifacts/order-023-postdeploy
          if-no-files-found: error
          retention-days: 7
