name: order-023-deploy-once

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - '.github/workflows/order-023-deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: sos-sf-order-023-production
  cancel-in-progress: false

jobs:
  verify-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EVIDENCE_DIR: artifacts/order-023-ship
      PRODUCT_COMMIT: 1c58defef2570bb1041573f9c4c48383dcc6a22b
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PROD_URL: https://sos-sf.simondalmasso44.workers.dev
      FIREBASE_URL: https://sos-sf.web.app
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority and immutable product gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "arq/visual-dashboard-v3"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git cat-file -e "$PRODUCT_COMMIT^{commit}"
          git diff --quiet "$PRODUCT_COMMIT" HEAD -- src tests package.json package-lock.json playwright.config.ts vite.config.ts wrangler.jsonc public
          echo "PRODUCT_COMMIT=$PRODUCT_COMMIT"
          echo "DEPLOY_WORKFLOW_HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"

      - name: Cloudflare auth gate before mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler whoami >/dev/null
          echo "CLOUDFLARE_AUTH=PASS"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm run test:unit

      - name: Contract tests
        run: npm run test:contract

      - name: Build and budgets
        run: npm run build

      - name: Worker tests
        run: npm run test:worker

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Final Product 023 exact E2E
        env:
          EVIDENCE_DIR: artifacts/order-023-ship/predeploy
        run: npx playwright test tests/e2e/final-product-023.spec.ts

      - name: Cloudflare dry run
        run: npm run deploy:dry

      - name: Predeploy production health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          for path in / /lite /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path")"
            test "$code" = "200"
            printf '%s %s\n' "$path" "$code" | tee -a "$EVIDENCE_DIR/predeploy-http.txt"
          done

      - name: Deploy product exactly once
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '1\n' > "$EVIDENCE_DIR/deploy-command-invocations.txt"
          export WRANGLER_OUTPUT_FILE_PATH="$EVIDENCE_DIR/wrangler-output.ndjson"
          export WRANGLER_SEND_METRICS=false
          export WRANGLER_LOG_SANITIZE=true
          npx wrangler deploy --config wrangler.jsonc 2>&1 | tee "$EVIDENCE_DIR/wrangler-deploy.log"
          version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' "$EVIDENCE_DIR/wrangler-deploy.log" | tail -1 | awk '{print $4}')"
          if [ -z "$version_id" ] && [ -s "$EVIDENCE_DIR/wrangler-output.ndjson" ]; then
            version_id="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = process.env.WRANGLER_OUTPUT_FILE_PATH;
          const rows = fs.readFileSync(p, 'utf8').split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
          const d = [...rows].reverse().find((row) => row.type === 'deploy');
          process.stdout.write(d?.version_id ?? '');
          NODE
          )"
          fi
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$PROD_URL" >> "$GITHUB_OUTPUT"
          printf '{"productCommit":"%s","versionId":"%s","url":"%s"}\n' "$PRODUCT_COMMIT" "$version_id" "$PROD_URL" > "$EVIDENCE_DIR/deployment-meta.json"

      - name: Read-only deployment metadata
        run: |
          npx wrangler versions list --name sos-sf --json > "$EVIDENCE_DIR/versions.json"
          npx wrangler deployments list --name sos-sf --json > "$EVIDENCE_DIR/deployments.json"

      - name: Verify exact production bytes after propagation
        shell: bash
        run: |
          set -euo pipefail
          expected_js="$(grep -Eo 'assets/index-[^"[:space:]]+\.js' dist/index.html | head -1)"
          test -n "$expected_js"
          : > "$EVIDENCE_DIR/propagation-attempts.txt"
          matched=0
          for attempt in $(seq 1 15); do
            bust="?order023=${GITHUB_RUN_ID}-${attempt}"
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$PROD_URL/$bust" > "$EVIDENCE_DIR/prod-index.html"
            printf 'attempt=%s expected=%s\n' "$attempt" "$expected_js" >> "$EVIDENCE_DIR/propagation-attempts.txt"
            if grep -Fq "$expected_js" "$EVIDENCE_DIR/prod-index.html"; then matched=1; break; fi
            sleep 3
          done
          test "$matched" = "1"
          printf 'REMOTE_ASSET=%s\n' "$expected_js" | tee "$EVIDENCE_DIR/served-byte-proof.txt"

      - name: Verify production routes and APIs
        shell: bash
        run: |
          set -euo pipefail
          for path in / /gestion-de-riesgo /gestion-de-riesgo/fenomeno-el-nino /lite /manifest.webmanifest /service-worker.js /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path")"
            test "$code" = "200"
            printf '%s %s\n' "$path" "$code" | tee -a "$EVIDENCE_DIR/postdeploy-http.txt"
          done

      - name: Verify production browser mobile desktop editorial and lite
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const base = process.env.PROD_URL;
          const out = process.env.EVIDENCE_DIR;
          fs.mkdirSync(`${out}/screenshots`, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const checks = [];
          async function verifyHome(width, height, name) {
            const page = await browser.newPage({ viewport: { width, height } });
            const response = await page.goto(`${base}/?order023-browser=${Date.now()}`, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`${name}: home HTTP ${response?.status()}`);
            await page.getByRole('heading', { level: 1, name: 'Así están el Paraná y el Salado' }).waitFor({ state: 'visible' });
            if (width <= 720) await page.locator('.mobile-dock').waitFor({ state: 'visible' });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            if (overflow > 1) throw new Error(`${name}: horizontal overflow ${overflow}`);
            await page.screenshot({ path: `${out}/screenshots/${name}.png`, fullPage: true });
            checks.push({ name, status: 200, overflow, url: page.url() });
            await page.close();
          }
          await verifyHome(390, 844, 'production-home-390');
          await verifyHome(1440, 900, 'production-home-1440');
          {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const response = await page.goto(`${base}/gestion-de-riesgo/fenomeno-el-nino?order023=${Date.now()}`, { waitUntil: 'networkidle' });
            if (!response || response.status() !== 200) throw new Error(`El Niño HTTP ${response?.status()}`);
            await page.getByRole('heading', { level: 1, name: 'Qué significa El Niño para Santa Fe' }).waitFor({ state: 'visible' });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            if (overflow > 1) throw new Error(`El Niño overflow ${overflow}`);
            await page.screenshot({ path: `${out}/screenshots/production-el-nino-390.png`, fullPage: true });
            checks.push({ name: 'el-nino-390', status: 200, overflow, url: page.url() });
            await page.close();
          }
          {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, javaScriptEnabled: false });
            const response = await page.goto(`${base}/lite?order023=${Date.now()}`, { waitUntil: 'load' });
            if (!response || response.status() !== 200) throw new Error(`lite HTTP ${response?.status()}`);
            await page.getByRole('heading', { level: 1, name: 'Ríos y alertas, en modo liviano' }).waitFor({ state: 'visible' });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - innerWidth);
            if (overflow > 1) throw new Error(`lite overflow ${overflow}`);
            await page.screenshot({ path: `${out}/screenshots/production-lite-390.png`, fullPage: true });
            checks.push({ name: 'lite-390-no-js', status: 200, overflow, url: page.url() });
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(`${out}/production-browser.json`, `${JSON.stringify(checks, null, 2)}\n`);
          NODE

      - name: Verify Firebase alias still targets canonical Worker
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          code="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' "$FIREBASE_URL/?order023=${GITHUB_RUN_ID}")"
          test "$code" = "302"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {$1=""; sub(/^ /,""); gsub(/\r/,""); print; exit}' "$headers")"
          test -n "$location"
          case "$location" in
            "$PROD_URL"/*) ;;
            *) echo "Unexpected Firebase redirect: $location" >&2; exit 1;;
          esac
          printf 'FIREBASE_STATUS=%s\nFIREBASE_LOCATION=%s\n' "$code" "$location" > "$EVIDENCE_DIR/firebase-alias.txt"

      - name: Final main immutability gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          final_main="$(git rev-parse origin/main)"
          test "$final_main" = "$EXPECTED_MAIN"
          printf 'MAIN_SHA=%s\nMAIN_MUTATION=NO\n' "$final_main" > "$EVIDENCE_DIR/main-proof.txt"

      - name: Write terminal ship evidence
        if: always()
        shell: bash
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/terminal.txt" <<EOF
          ORDER=SOS-SF-023-FINAL-PRODUCT-REDESIGN-SHIP
          PRODUCT_COMMIT=$PRODUCT_COMMIT
          WORKFLOW_HEAD=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/main 2>/dev/null || echo unknown)
          DEPLOY_COMMAND_INVOKED=$(test -f "$EVIDENCE_DIR/deploy-command-invocations.txt" && cat "$EVIDENCE_DIR/deploy-command-invocations.txt" || echo 0)
          VERSION_ID=${VERSION_ID:-UNKNOWN}
          PRODUCTION=$PROD_URL
          FIREBASE_ALIAS=$FIREBASE_URL
          EOF

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-023-ship-${{ github.run_id }}
          path: artifacts/order-023-ship
          if-no-files-found: error
          retention-days: 30
