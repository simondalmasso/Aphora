name: Workers First Live Data 012 Sync

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/workers-first-live-data-012.yml]

permissions:
  contents: write

concurrency:
  group: sos-sf-live-data-source-sync
  cancel-in-progress: false

jobs:
  github-second-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Reconfirm Worker-first live gate
        run: |
          node <<'NODE'
          const base = 'https://sos-sf.simondalmasso44.workers.dev';
          async function read(path) {
            const response = await fetch(`${base}${path}?source_sync=${Date.now()}-${Math.random()}`, { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`${path}:HTTP_${response.status}`);
            return response.headers.get('content-type')?.includes('json') ? response.json() : response.text();
          }
          (async () => {
            const [health, snapshot, sources, lite] = await Promise.all([read('/api/health'), read('/api/snapshot'), read('/api/sources'), read('/lite')]);
            const santaFe = snapshot?.data?.systems?.find((item) => item.id === 'parana-santa-fe' && item.stationCode === '30');
            const ina = health?.data?.providers?.find((item) => item.id === 'ina-rest-30');
            const source = sources?.data?.sources?.find((item) => item.id === 'ina:30');
            if (snapshot?.data?.mode !== 'LIVE' || santaFe?.available !== true || !Number.isFinite(santaFe?.currentMetres)) throw new Error('WORKER_FIRST_LIVE_GATE_MISSING');
            if (Date.now() - Date.parse(santaFe.observedAt) > 36 * 60 * 60 * 1000) throw new Error('WORKER_FIRST_OBSERVATION_STALE');
            if (!ina?.lastSuccessAt || !ina?.lastObservedAt || ina.errorClass !== null || ina.circuitOpenUntil !== null) throw new Error('WORKER_FIRST_HEALTH_INVALID');
            if (!source?.connected || !String(source.url || '').startsWith('https://alerta.ina.gob.ar/a5/getObservaciones?')) throw new Error('WORKER_FIRST_SOURCE_INVALID');
            if (String(lite).includes('1970-01-01') || !String(lite).includes(santaFe.currentMetres.toFixed(2))) throw new Error('WORKER_FIRST_LITE_INVALID');
            console.log(JSON.stringify({ value: santaFe.currentMetres, observedAt: santaFe.observedAt, source: source.url }));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Synchronize effective live runtime source
        run: |
          python .github/scripts/workers_first_live_data_012.py
          python .github/scripts/finalize_live_data_012.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run build
      - run: npm run test:worker

      - name: Commit synchronized source and trigger terminal pipeline
        run: |
          printf 'live-data-012-source-sync-%s\n' "$(date -u +%Y%m%dT%H%M%SZ)" > .github/arq-v3-deploy-trigger
          git rm .github/workflows/workers-first-live-data-012.yml
          git rm .github/scripts/workers_first_live_data_012.py
          git rm .github/scripts/finalize_live_data_012.py
          git config user.name 'SOS-SF ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worker/providers/ina.ts src/worker/providers/core.ts src/worker/live-data.ts src/worker/lite.ts tests/unit/live-data.test.ts scripts/verify-deployment.mjs .github/arq-v3-deploy-trigger
          git commit -m 'fix: publish current INA Santa Fe hydrological data'
          git push origin HEAD:arq/visual-dashboard-v3
