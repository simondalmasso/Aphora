name: SOS-SF HOVS R2 Density Verify v3
on:
  push:
    branches:
      - arq/visual-dashboard-v3
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT: artifacts/hovs-r2-density-verify
      PRODUCT_COMMIT: 56af09da7644f6cda8ab7fcdcc1558c2ffb056b6
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          mkdir -p "$OUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Immutable E2E density contracts
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/e2e.log"
      - name: Geometry summary
        shell: bash
        run: |
          set -euo pipefail
          npm run preview >/tmp/r2preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage();
          const out=[];
          for(const [w,h] of [[320,568],[360,800],[390,844],[430,932],[768,1024],[1440,900],[1920,1080]]){
            await p.setViewportSize({width:w,height:h});
            await p.goto('http://127.0.0.1:8787/',{waitUntil:'networkidle'});
            const x=await p.evaluate(()=>{
              const c=document.querySelector('[data-testid="main-hydro-chart"]')?.getBoundingClientRect();
              return {ratio:document.documentElement.scrollHeight/innerHeight,overflow:document.documentElement.scrollWidth-innerWidth,chartY:c?.y??null,chartH:c?.height??null,chartVisible:c?Math.max(0,Math.min(innerHeight,c.bottom)-Math.max(0,c.top))/c.height:null,sections:document.querySelectorAll('main>section').length};
            });
            out.push({w,h,...x});
            await p.screenshot({path:`${process.env.OUT}/${w}x${h}.png`,fullPage:true});
          }
          await writeFile(process.env.OUT+'/geometry.json',JSON.stringify(out,null,2)+'\n');
          await b.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sos-sf-hovs-r2-density-verify-${{ github.run_id }}
          path: artifacts/hovs-r2-density-verify
          if-no-files-found: warn
      - name: Disarm
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-r2-density-verify-v3.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-r2-density-verify-v3.yml
          git commit -m "ci: disarm HOVS R2 density verifier v3"
          git push origin HEAD:arq/visual-dashboard-v3
