name: order-027-repair-r3
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/order-027-repair-r3.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Add compact accessible fact labels
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/client/features/hydro/HydrometricMonitoring.tsx')
          s=p.read_text()
          old='''  return <article className="river-priority__river river-priority__river--product" data-river-system={system.id}>\n    <header className="river-priority__river-header">'''
          new='''  return <article className="river-priority__river river-priority__river--product" data-river-system={system.id}>\n    <span className="sr-only">Estación {system.stationName}. Nivel {formatLevel(system)}. Movimiento {trendLabel(system)}. Últimas 24 h {compactMovement(system)}. Vigencia {freshnessLabel(system)}. Por qué se prioriza: condición verificada y trazable a fuente oficial.</span>\n    <header className="river-priority__river-header">'''
          if old not in s: raise SystemExit('priority panel marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name sos-sf-arq
          git config user.email actions@users.noreply.github.com
          git add src/client/features/hydro/HydrometricMonitoring.tsx
          git commit -m 'fix(027): retain accessible priority facts without visual clutter [skip ci]'
          git push origin HEAD:refs/heads/arq/visual-dashboard-v3
      - run: npm ci
      - run: |
          npm run typecheck
          npm run lint -- --max-warnings=0
      - run: npx playwright install --with-deps chromium
      - name: Targeted priority and 027 gates
        run: npx playwright test tests/e2e/dual-river-priority.spec.ts tests/e2e/smooth-civic-027.spec.ts --project=desktop
