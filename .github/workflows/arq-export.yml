name: ARQ Source Export

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - .github/arq-export-trigger

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create exact source archive
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=artifacts --exclude=playwright-report --exclude=test-results -czf /tmp/sos-sf-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: sos-sf-source-${{ github.sha }}
          path: /tmp/sos-sf-source.tgz
          if-no-files-found: error
          retention-days: 1
