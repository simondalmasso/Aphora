name: SOS-SF MUNI 021 Predeploy Final Truth
on:
  push:
    branches: [arq/visual-dashboard-v3]
permissions:
  contents: write
  actions: write
jobs:
  truth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUT: artifacts/muni-021-predeploy-final
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "45047d1c1e16941ea37967d67307d0ab17e85fad"
          git merge-base --is-ancestor 810fdc47901adf7aa7108d39f4d4047ae56b3295 HEAD
          mkdir -p "$OUT/screenshots" "$OUT/logs"
          printf '{"order":"SOS-SF-AUD-MUNI-CHASSIS-MEGA-REVERSE-REDESIGN-021","takeHead":"810fdc47901adf7aa7108d39f4d4047ae56b3295","productCommit":"720c359e65dbf47ae4a22d8ab421bb7ddb596469","main":"%s"}\n' "$(git rev-parse origin/main)" > "$OUT/authority.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full gates
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/logs/e2e.log"
      - name: Exact MUNI responsive and route evidence
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview.log" 2>&1 & pid=$!; trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile, readFile, mkdir, copyFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const base='http://127.0.0.1:8787';
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage();
          const sizes=[{w:320,h:700},{w:360,h:800},{w:390,h:844},{w:430,h:932},{w:768,h:1024},{w:1024,h:768},{w:1366,h:768},{w:1440,h:900},{w:1920,h:1080}];
          const geometry=[]; const hashes={};
          async function shot(name){const path=`${process.env.OUT}/screenshots/${name}.png`;await page.screenshot({path,fullPage:true});hashes[name]=createHash('sha256').update(await readFile(path)).digest('hex')}
          for(const s of sizes){
            await page.setViewportSize({width:s.w,height:s.h}); await page.goto(base+'/',{waitUntil:'networkidle'}); await page.getByTestId('hydrometric-situation').waitFor();
            const m=await page.evaluate(()=>{const h=document.querySelector('[data-testid="hydrometric-situation"]')?.getBoundingClientRect();const c=document.querySelector('[data-testid="main-hydro-chart"]')?.getBoundingClientRect();return{overflow:document.documentElement.scrollWidth-innerWidth,ratio:document.documentElement.scrollHeight/innerHeight,hydroWidth:h?.width??0,hydroY:h?.y??9999,chart:c?{y:c.y,height:c.height}:null,sections:document.querySelectorAll('main.dashboard > section').length,quick:document.querySelectorAll('.civic-quick-tile').length,brand:(document.querySelector('.sos-brand')?.textContent||'').replace(/\s+/g,' ').trim(),connection:(document.querySelector('.connection-chip')?.textContent||'').trim()}});
            if(m.overflow>1) throw Error(`overflow ${s.w}: ${m.overflow}`);
            if(s.w<=430&&m.hydroWidth/s.w<.94) throw Error(`hydro width ${s.w}: ${m.hydroWidth}/${s.w}`);
            if(s.w===390&&m.hydroY>120) throw Error(`hydro y ${m.hydroY}`);
            if(s.w===1440&&m.ratio>1.35) throw Error(`1440 ratio ${m.ratio}`);
            if(m.sections!==4||m.quick!==6||!m.brand.includes('SOS')) throw Error(`chassis ${s.w}`);
            if(!m.connection) throw Error(`connection missing ${s.w}`);
            if(s.w===390&&m.chart){const visible=Math.max(0,Math.min(s.h,m.chart.y+m.chart.height)-Math.max(0,m.chart.y));if(visible/m.chart.height<.4)throw Error(`chart visibility ${visible/m.chart.height}`)}
            if(s.w===390) await shot('SOS_HOME_390x844'); if(s.w===768) await shot('SOS_HOME_768x1024'); if(s.w===1440) await shot('SOS_HOME_1440x900');
            geometry.push({...s,...m});
          }
          for(const s of [{w:390,h:844,name:'SOS_EL_NINO_390x844'},{w:1440,h:900,name:'SOS_EL_NINO_1440x900'}]){
            await page.setViewportSize({width:s.w,height:s.h}); await page.goto(base+'/gestion-de-riesgo/fenomeno-el-nino',{waitUntil:'networkidle'}); await page.getByTestId('el-nino-landing').waitFor();
            const text=await page.getByTestId('el-nino-landing').innerText();
            for(const q of ['Fenómeno El Niño','Qué puede implicar en Santa Fe','Qué está haciendo la ciudad','Capacitaciones · Comunidad Preparada','Agenda vigente','Preguntas frecuentes','Planificación continua','Cómo funcionan las bombas','Plan de contingencia','Noticias y fuentes relacionadas','5,30 m','no es un umbral general de evacuación de SOS-SF']) if(!text.includes(q)) throw Error(`missing ${q}`);
            if(await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth)>1) throw Error(`El Nino overflow ${s.w}`); await shot(s.name);
          }
          await page.setViewportSize({width:390,height:844}); await page.goto(base+'/',{waitUntil:'networkidle'}); await page.getByRole('button',{name:'Abrir menú'}).click(); await page.getByRole('navigation',{name:'Navegación móvil'}).waitFor(); await shot('SOS_NAV_OPEN_MOBILE');
          for(const [src,name] of [['state-active-alert.png','SOS_ALERT_ACTIVE.png'],['state-alerts-unverified.png','SOS_ALERT_UNVERIFIED.png'],['state-offline.png','SOS_OFFLINE.png']]){await copyFile(`${process.env.OUT}/e2e/screenshots/${src}`,`${process.env.OUT}/screenshots/${name}`);hashes[name.replace('.png','')]=createHash('sha256').update(await readFile(`${process.env.OUT}/screenshots/${name}`)).digest('hex')}
          if(new Set(Object.values(hashes)).size!==Object.values(hashes).length) throw Error('screenshot hash collision');
          await writeFile(process.env.OUT+'/geometry.json',JSON.stringify(geometry,null,2)+'\n'); await writeFile(process.env.OUT+'/screenshot-hashes.json',JSON.stringify(hashes,null,2)+'\n'); await browser.close();
          NODE
      - name: Upload
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-predeploy-final-${{ github.run_id }}
          path: artifacts/muni-021-predeploy-final/
          if-no-files-found: error
          retention-days: 30
      - name: Disarm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[]|select(.path==".github/workflows/muni-021-predeploy-final.yml")|.id'|head -n1||true); [ -z "$id" ] || gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" || true
          git config user.name sos-sf-automation; git config user.email sos-sf-automation@users.noreply.github.com
          git rm .github/workflows/muni-021-predeploy-final.yml; git commit -m 'ci: disarm terminal MUNI 021 predeploy truth'; git push origin HEAD:arq/visual-dashboard-v3
