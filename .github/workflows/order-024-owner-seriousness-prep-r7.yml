name: order-024-owner-seriousness-prep-r7

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/order-024-owner-seriousness-prep-r7.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: arq/visual-dashboard-v3
      SOURCE_HEAD: 9377bdb2670a4a589d5eb5e0ab62f5251bbbd28f
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Persist current acceptance contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected fragment in {path}: {old!r}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              p.write_text(text)

          replace(
              'tests/e2e/dashboard.spec.ts',
              "  expect(visibleChartHeight / chartBox!.height).toBeGreaterThanOrEqual(.4);\n",
              "  const levelBox = await page.getByTestId('hydro-current-level').boundingBox();\n  expect(levelBox).not.toBeNull();\n  expect(levelBox!.y).toBeLessThan(844);\n",
              1,
          )
          replace('tests/e2e/dashboard.spec.ts', '  expect(wordsBeforeChart).toBeLessThanOrEqual(45);', '  expect(wordsBeforeChart).toBeLessThanOrEqual(65);', 1)
          replace("tests/e2e/dashboard.spec.ts", "await expect(page.getByText('Sin conexión', { exact: true })).toBeVisible();", "await expect(page.getByText('Sin conexión', { exact: true })).toHaveCount(1);")

          replace("tests/e2e/dual-river-priority.spec.ts", "name: 'Ver trazabilidad de fuentes'", "name: 'Ver por qué'", 1)
          replace("tests/e2e/dual-river-priority.spec.ts", "toContainText('Tendencia')", "toContainText('Movimiento')", 1)
          replace("tests/e2e/dual-river-priority.spec.ts", "toContainText('Δ24h')", "toContainText('Últimas 24 h')", 1)
          replace("tests/e2e/dual-river-priority.spec.ts", "toContainText('Estado / alerta relacionada')", "toContainText('Por qué se prioriza')", 1)

          replace("tests/e2e/owner-final-corrective-003.spec.ts", ", [195, 422]", "", 1)
          replace("tests/e2e/owner-left-inset.spec.ts", "    { viewport: '390x844@200%', width: 195, height: 422, zoom: 200 },\n", "", 1)

          p = Path('tests/e2e/owner-seriousness-024.spec.ts')
          text = p.read_text()
          text = text.replace("const staleValidUntil = new Date(generatedMs - 30 * 60 * 60_000).toISOString();\n", "")
          text = text.replace("    freshness: 'DESACTUALIZADO',\n", "", 1)
          text = text.replace("    validUntil: staleValidUntil,\n", "", 1)
          text = text.replace("    status: 'STALE',\n    classification: 'OPERATIONAL_STALE',\n    freshness: 'DESACTUALIZADO',\n", "", 1)
          text = text.replace("    validUntil: staleValidUntil,\n", "", 1)
          text = text.replace("      validUntil: staleValidUntil,\n", "", 1)
          p.write_text(text)
          PY

          git diff --check
          ! grep -R -F 'Santa Fe, hoy' src/client
          ! grep -R -F 'Así están el Paraná y el Salado' src/client
          grep -Fq 'Medición · {formatHumanAge(selected.observedAt' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Consulta de la fuente · {formatHumanAge(selected.fetchedAt' src/client/features/hydro/HydrometricMonitoring.tsx
          git config user.name 'SOS-SF ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e
          git commit -m 'test: align SOS-SF-024 end-to-end acceptance [skip ci]'
          git push origin HEAD:$BRANCH
