name: Sync Blocked Public Safety 015

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/sync-blocked-public-safety-015-trigger]

permissions:
  contents: write
  issues: write

concurrency:
  group: sos-sf-workers-production
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/public-safety-015-blocked-sync
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  DEPLOYMENT_RUN_ID: '31007849789'
  DEPLOYMENT_VERSION_ID: c4338cb1-e0ba-476f-a67c-edefcb163490

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact deployed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, os
          remote_hashes=['c5f0db4501ca4f5922392b9ea4ef0e046155f5bdf3680fa4135cb130c9583ca0','6d6b7518c6efb425b690e04e2231cca76d47af065be86b708a63ccc8a9ce8d35','0afa9f51d6f640c9ca6e5fb7380c893a708fb9d38323573c3fe8f9c1955fc844','4df4f3652103016704f9ac9a02de1e523c68d4f2e1114fa6d182c237ed5bbd8b','1601a8e733ffdc43edd57208a2561c1d67ea4953a3f24755490b16c77a2e8069','de0c865b7ec0409c548acb4340533b6567b90db903b226cf01ddc300bb3bae04','8d5f7036caee699ff8e5e5447146535781d7b546b0045c772e6c0efa429b7294','d99e8d235d2406db9eebf279a02a7e84bace64e127f7b7cbd6dfbe15a535b9b5']
          chunks=[]; report=[]
          for i, expected in enumerate(remote_hashes):
            value=Path(f'.github/public-safety-015-parts/part{i:02d}').read_text().strip()
            actual=hashlib.sha256(value.encode()).hexdigest()
            if actual != expected: raise SystemExit(f'PART_HASH_MISMATCH:{i}:{actual}')
            if i == 6:
              if len(value) != 15000 or value[5352] != 'w': raise SystemExit('PART06_PRECONDITION')
              value=value[:5352]+'p'+value[5353:]
              if hashlib.sha256(value.encode()).hexdigest() != '3247f45d9c18d02acba3e57e221f95c429db7f7f8d928c676ca4b0df7c4eae07': raise SystemExit('PART06_REPAIR_HASH')
            chunks.append(value); report.append(f'part{i:02d}_remote_sha256={actual}')
          encoded=''.join(chunks)
          if hashlib.sha256(encoded.encode()).hexdigest() != '5e44a6a727bbdebf32d721f6da9fdeb1a13921c5fa539ef8eb63111d8e2a70c5': raise SystemExit('BASE_TRANSPORT_HASH')
          patch=gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '155636e689a8d8edc4449e9340c568dec900ae0de16eb11508efa01f24d97c76': raise SystemExit('BASE_CONTENT_HASH')
          Path('/tmp/order015-base.patch').write_bytes(patch)
          manifest=json.loads(Path('.github/public-safety-015-fixes.json').read_text())
          for index,name in enumerate(sorted(manifest)):
            spec=manifest[name]; value=Path('.github',name).read_text().strip()
            transport=hashlib.sha256(value.encode()).hexdigest()
            if transport != spec['transportSha256']: raise SystemExit(f'FIX_TRANSPORT:{name}:{transport}')
            content=gzip.decompress(base64.b64decode(value,validate=True)); digest=hashlib.sha256(content).hexdigest()
            if digest != spec['contentSha256']: raise SystemExit(f'FIX_CONTENT:{name}:{digest}')
            Path(f'/tmp/order015-fix-{index:02d}.patch').write_bytes(content)
            report.extend([f'{name}:transport={transport}',f'{name}:content={digest}'])
          Path(os.environ['EVIDENCE_DIR'],'patch-hashes.txt').write_text('\n'.join(report)+'\n')
          PY
          git apply --index /tmp/order015-base.patch
          for patch in /tmp/order015-fix-*.patch; do git apply --index "$patch"; done
          git diff --cached --check

      - name: Regenerate exact deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess
          excluded=('.github/','artifacts/','dist/'); marker='public/source-provenance.json'
          paths=subprocess.check_output(['git','ls-files','-z']).split(b'\0'); digest=hashlib.sha256(); included=0
          for raw in sorted(p for p in paths if p):
            path=raw.decode()
            if path==marker or path.startswith(excluded): continue
            data=Path(path).read_bytes(); digest.update(path.encode()); digest.update(b'\0'); digest.update(len(data).to_bytes(8,'big')); digest.update(data); included+=1
          payload={'schemaVersion':1,'orderId':'SOS-SF-OWNER-GLOBAL-PUBLIC-SAFETY-REFOUNDATION-015','productTreeSha256':digest.hexdigest(),'includedFileCount':included,'deploymentRunId':os.environ['DEPLOYMENT_RUN_ID']}
          Path(marker).write_text(json.dumps(payload,sort_keys=True,separators=(',',':'))+'\n')
          Path(os.environ['EVIDENCE_DIR'],'local-provenance.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY
          git add public/source-provenance.json

      - name: Verify production provenance GET only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$DEPLOYMENT_URL/source-provenance.json?blocked_sync=$GITHUB_RUN_ID" > /tmp/remote-provenance.json
          node <<'NODE'
          const fs=require('node:fs');
          const local=JSON.parse(fs.readFileSync('public/source-provenance.json','utf8'));
          const remote=JSON.parse(fs.readFileSync('/tmp/remote-provenance.json','utf8'));
          for(const field of ['schemaVersion','orderId','productTreeSha256','includedFileCount','deploymentRunId']) if(String(local[field])!==String(remote[field])) throw new Error(`PROVENANCE_MISMATCH:${field}`);
          fs.writeFileSync(`${process.env.EVIDENCE_DIR}/cloudflare-github-drift.txt`,[
            `github_candidate_product_tree_sha256=${local.productTreeSha256}`,
            `cloudflare_product_tree_sha256=${remote.productTreeSha256}`,
            `included_file_count=${local.includedFileCount}`,
            `deployment_run_id=${remote.deploymentRunId}`,
            `deployment_version_id=${process.env.DEPLOYMENT_VERSION_ID}`,
            'CLOUDFLARE_GITHUB_DRIFT=false',''].join('\n'));
          NODE

      - name: Synchronize deployed source and hold material state
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf --ignore-unmatch .github/public-safety-015-parts
          git rm -f --ignore-unmatch .github/public-safety-015-fix1.patch.gz.b64 .github/public-safety-015-fix2.patch.gz.b64 .github/public-safety-015-fix3.patch.gz.b64 .github/public-safety-015-fixes.json .github/export-public-safety-parts-015-trigger .github/export-source-015-trigger .github/validate-public-safety-015-trigger .github/validate-public-safety-015-v2-trigger
          printf 'MODE=BLOCKED_MATERIAL_GLOBAL_PUBLIC_SAFETY_015\nORDER=SOS-SF-OWNER-GLOBAL-PUBLIC-SAFETY-REFOUNDATION-015\nDEPLOY_COMMAND_COUNT=1\nDEPLOY=PROHIBITED\nCLOUDFLARE_MUTATION=PROHIBITED\nBUDGET_MAX_USD=0\n' > .github/deploy-public-safety-015-trigger
          git add .github/deploy-public-safety-015-trigger public/source-provenance.json
          git diff --cached --check
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git commit -m 'feat: synchronize deployed public safety 015 source'
          git push origin HEAD:arq/visual-dashboard-v3
          git rev-parse HEAD | tee "$EVIDENCE_DIR/synchronized-product-sha.txt"

      - name: Record blocked state
        shell: bash
        run: |
          set -euo pipefail
          printf 'STATUS=BLOCKED_MATERIAL\nORDER=SOS-SF-OWNER-GLOBAL-PUBLIC-SAFETY-REFOUNDATION-015\nDEPLOY_COMMAND_COUNT=1\nSECOND_DEPLOY_ATTEMPTED=false\nCLOUDFLARE_MUTATIONS_THIS_RUN=0\nCLOUDFLARE_GITHUB_DRIFT=false\nAUD_HOLD=ACTIVE\n' > "$EVIDENCE_DIR/result.txt"

      - name: Publish non-closing blocked checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cat "$EVIDENCE_DIR/synchronized-product-sha.txt")"
          gh issue comment 8 --repo "$GITHUB_REPOSITORY" --body "## Public Safety 015 — deployed source synchronized, material hold\n\n- Source sync run: \`$GITHUB_RUN_ID\`\n- Synchronized SHA: \`$sha\`\n- Deployment run: \`$DEPLOYMENT_RUN_ID\`\n- Deployment version: \`$DEPLOYMENT_VERSION_ID\`\n- Exactly one deploy command; no second deploy attempted\n- \`CLOUDFLARE_GITHUB_DRIFT=false\`\n- Status: \`BLOCKED_MATERIAL\` due failed contract, E2E/mobile/accessibility/offline and remote semantic gates\n- main untouched; issue open; AUD_HOLD=ACTIVE; no acceptance declared." || true

      - name: Upload sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-safety-015-blocked-sync-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
