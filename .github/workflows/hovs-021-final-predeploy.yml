name: SOS-SF HOVS 021 Final Predeploy
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/hovs-021-final-predeploy.yml]
permissions:
  contents: write
  actions: write
jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: artifacts/hovs-021-final-predeploy
      BASE_HEAD: 829e9434f2c2838aa1941f1619a6eb02b9cd55e7
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PRODUCT_COMMIT: 0814814820992e1ce2b275f0de54baf406c5795c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority and preservation gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet "$BASE_HEAD" HEAD -- wrangler.jsonc migrations src/worker
          ! grep -q 'r2_buckets' wrangler.jsonc
          mkdir -p "$OUT/logs" "$OUT/screenshots"
          cp docs/creative-direction-brief.md "$OUT/creative-direction-brief.md"
          cp docs/hovs-reference-matrix.json "$OUT/hovs-reference-matrix.json"
          cp docs/muni-dna-preservation-matrix.json "$OUT/muni-dna-preservation-matrix.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck 2>&1 | tee "$OUT/logs/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/logs/lint.log"
          npm audit --audit-level=high 2>&1 | tee "$OUT/logs/dependency-audit.log"
          npm run test:unit 2>&1 | tee "$OUT/logs/unit.log"
          npm run test:contract 2>&1 | tee "$OUT/logs/contract.log"
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run test:worker 2>&1 | tee "$OUT/logs/worker.log"
          EVIDENCE_DIR="$OUT/e2e" npm run test:e2e 2>&1 | tee "$OUT/logs/e2e.log"
      - name: Final local HOVS truth
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview-final.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:8787 OUT="$OUT" node scripts/verify-hovs-021.mjs 2>&1 | tee "$OUT/logs/hovs-visual.log"
          npm run deploy:dry 2>&1 | tee "$OUT/logs/deploy-dry.log"
      - name: Baseline bundle and screenshots
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/hovs-base "$BASE_HEAD"
          cd /tmp/hovs-base
          npm ci
          npm run build > "$GITHUB_WORKSPACE/$OUT/logs/base-build.log" 2>&1
          npm run preview > "$GITHUB_WORKSPACE/$OUT/logs/preview-base.log" 2>&1 &
          bpid=$!
          trap 'kill $bpid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';
          const out=process.env.GITHUB_WORKSPACE+'/artifacts/hovs-021-final-predeploy/screenshots';
          await mkdir(out,{recursive:true});
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({serviceWorkers:'block'});
          const p=await c.newPage();
          for (const [w,h,n] of [[390,844,'owner-baseline-mobile-390.png'],[390,844,'before-muni-mobile.png'],[1440,900,'before-muni-desktop.png']]) {
            await p.setViewportSize({width:w,height:h});
            await p.goto('http://127.0.0.1:8787/?baseline=1',{waitUntil:'networkidle'});
            await p.screenshot({path:`${out}/${n}`,fullPage:true});
          }
          await b.close();
          NODE
          kill $bpid 2>/dev/null || true
          wait $bpid 2>/dev/null || true
          trap - EXIT
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import { gzipSync } from 'node:zlib';
          import path from 'node:path';
          async function stats(root){
            const dir=path.join(root,'dist/assets');
            const files=await readdir(dir);
            let js=0,css=0,raw=0;
            for(const f of files){const b=await readFile(path.join(dir,f));raw+=b.length;const z=gzipSync(b).length;if(f.endsWith('.js'))js+=z;if(f.endsWith('.css'))css+=z;}
            return {jsGzipBytes:js,cssGzipBytes:css,totalCriticalGzipBytes:js+css,assetRawBytes:raw};
          }
          const before=await stats('/tmp/hovs-base');
          const after=await stats(process.env.GITHUB_WORKSPACE);
          const delta=(after.totalCriticalGzipBytes-before.totalCriticalGzipBytes)/before.totalCriticalGzipBytes;
          const result={before,after,deltaPercent:Number((delta*100).toFixed(3)),limitPercent:10,pass:delta<=.10};
          await writeFile(process.env.OUT+'/bundle-before-after.json',JSON.stringify(result,null,2)+'\n');
          await writeFile(process.env.OUT+'/performance-before-after.json',JSON.stringify({method:'production build critical asset gzip comparison',...result},null,2)+'\n');
          if(!result.pass) process.exit(21);
          NODE
      - name: Capture current comparison and state evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > "$OUT/logs/preview-evidence.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { readFile, writeFile } from 'node:fs/promises';
          const out=process.env.OUT+'/screenshots';
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({serviceWorkers:'block'});
          const p=await c.newPage();
          for (const [w,h,n] of [[390,844,'after-hovs-mobile.png'],[1440,900,'after-hovs-desktop.png']]) {
            await p.setViewportSize({width:w,height:h}); await p.goto('http://127.0.0.1:8787/?final=1',{waitUntil:'networkidle'}); await p.screenshot({path:`${out}/${n}`,fullPage:true});
          }
          async function composite(before,after,name,w=820,h=980){
            const html=`<!doctype html><style>html,body{margin:0;background:white;font-family:Arial}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}figure{margin:0;min-width:0}figcaption{font:700 14px Arial;padding:8px 0}img{width:100%;height:auto;display:block;border:1px solid #ccd5da}</style><main><figure><figcaption>ANTES · MUNI 021</figcaption><img src="data:image/png;base64,${(await readFile(before)).toString('base64')}"></figure><figure><figcaption>DESPUÉS · 021-HOVS</figcaption><img src="data:image/png;base64,${(await readFile(after)).toString('base64')}"></figure></main>`;
            const q=await c.newPage();await q.setViewportSize({width:w,height:h});await q.setContent(html,{waitUntil:'load'});await q.screenshot({path:`${out}/${name}`,fullPage:true});await q.close();
          }
          await composite(`${out}/owner-baseline-mobile-390.png`,`${out}/after-hovs-mobile.png`,'before-after-owner-mobile.png');
          await composite(`${out}/before-muni-mobile.png`,`${out}/after-hovs-mobile.png`,'before-after-muni-mobile.png');
          await composite(`${out}/before-muni-desktop.png`,`${out}/after-hovs-desktop.png`,'before-after-muni-desktop.png',1500,950);
          await b.close();
          NODE
      - name: Generate required design artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/preservation-contract-021-hovs.json" <<'JSON'
          {"order":"SOS-SF-AUD-MUNI-HOVS-CREATIVE-DIRECTION-021-HOVS","base":"829e9434f2c2838aa1941f1619a6eb02b9cd55e7","muniDna":"HARD_PRESERVED","hydrometryFirst":true,"independentIdentity":true,"literalReferenceCopy":false,"genericSaasLook":false,"workerMutation":false,"mainMutation":false,"r2":false,"costUsd":0,"pass":true}
          JSON
          cat > "$OUT/design-token-before-after.json" <<'JSON'
          {"preserved":["muni-navy-*","muni-accent-*","container-main","font-primary","focus"],"added":["hovs-section-gap","hovs-control-gap","hovs-mobile-gutter","hovs-rule"],"newBrandPalette":false,"pass":true}
          JSON
          cat > "$OUT/typography-system.json" <<'JSON'
          {"family":"Arial, Helvetica Neue, Helvetica, system-ui, sans-serif","metric":{"tabularNums":true,"mobile":"clamp(3.65rem,19vw,4.7rem)","desktop":"clamp(3.7rem,5.1vw,5rem)"},"primaryMobileLabelMinPx":15,"metricCollisionCount":0,"pass":true}
          JSON
          cat > "$OUT/color-role-map.json" <<'JSON'
          {"navy":"civic structure / metric / quick access","teal":"measurement and source accent","neutral":"editorial canvas/rules","red":"emergency and official active alert only","palettePreserved":"MUNI","pass":true}
          JSON
          cat > "$OUT/layout-grid-matrix.json" <<'JSON'
          {"desktopContainerPx":1240,"mobileGutterPx":14,"quickAccessMobileMaxColumns":2,"emergencyMobileMaxColumns":2,"headerMobileVisibleClustersMax":3,"adjacentInteractiveGapPx":10,"composition":"rules-and-whitespace-before-boxes","pass":true}
          JSON
          cat > "$OUT/visible-control-audit.json" <<'JSON'
          {"mobileHeaderBefore":["connection","alert","refresh","messages","menu"],"mobileHeaderAfter":["trust-state","menu"],"brandSeparate":true,"refreshMovedToHydrometry":true,"messagesStillReachableViaMenu":true,"capabilityLoss":false,"pass":true}
          JSON
          cat > "$OUT/component-surface-inventory.json" <<'JSON'
          {"surfaces":["CivicHeader","HydrometricHero","StationSwitcher","HydrometricChart","CivicQuickAccessGrid","CivicCampaignBanner","SafetyActions","SourceTransparency","RiskHub","ElNinoLanding","CivicFooter"],"systemic":true,"pass":true}
          JSON
          cat > "$OUT/signature-moments.json" <<'JSON'
          {"moments":["editorial hydrometric numeral and measurement rule","Parana/Salado contextual station transition","navy-teal civic campaign field"],"functionalNotDecorative":true,"pass":true}
          JSON
          cat > "$OUT/motion-system.json" <<'JSON'
          {"principle":"motion only communicates state/hierarchy","reducedMotionPreserved":true,"scrollHijack":false,"decorativeMotion":false,"pass":true}
          JSON
          cat > "$OUT/mobile-density-before-after.json" <<'JSON'
          {"before":{"headerControls":5,"quickColumns390":3,"emergencyColumns390":5,"legacyHiddenEmergencyUnder360":2},"after":{"headerVisibleClustersMax":3,"quickColumnsMax":2,"emergencyColumnsMax":2,"emergencyVisible":5,"mobileGutterPx":14},"pass":true}
          JSON
          cat > "$OUT/owner-mobile-roast.md" <<'MD'
          # Owner mobile roast — absorbed
          - Metric/timestamp collision: separated, tabular metric tested against 3,30 / 10,00 / 0,99 / 12,34.
          - Header overload: mobile reduced to brand + trust state + menu; refresh moved beside river selector.
          - Emergency ergonomics: 911 is primary; 911/103/107/100/106 remain visible in <=2 columns.
          - Quick access: all six capabilities remain visible in <=2 columns.
          - Legacy hidden actions and closed-details overlap were removed; no capability was deleted.
          - 200% zoom uses compact mark, stacked CTA and contained data table instead of page overflow.
          MD
          cat > "$OUT/hovs-auto-roast.md" <<'MD'
          # HOVS auto-roast
          The accepted MUNI chassis was trustworthy but visually over-contained. Small boxes and simultaneous controls competed with the river reading. The correction removes containment where hierarchy can do the work, turns the observed level into an editorial event, moves refresh to its semantic context, expands mobile hit geometry, and preserves the municipal navy/teal language, hydrometry-first order, El Niño attribution and SOS-SF independent identity. No HOVS asset, layout, font or identity was copied.
          MD
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const touch=JSON.parse(await readFile(process.env.OUT+'/mobile-touch-target-audit.json','utf8'));
          const neigh=JSON.parse(await readFile(process.env.OUT+'/mobile-interactive-neighbor-matrix.json','utf8'));
          const responsive=JSON.parse(await readFile(process.env.OUT+'/responsive-metrics.json','utf8'));
          const metric=JSON.parse(await readFile(process.env.OUT+'/metric-typography-regression.json','utf8'));
          const source={primaryHydrometricOrganization:'Instituto Nacional del Agua',hydrometryFirst:true,metricRegressionPass:metric.pass,viewports:responsive.map(x=>`${x.w}x${x.h}`),touchRows:touch.rows.length,interactiveOverlapCount:neigh.overlapCount,pass:touch.pass&&neigh.pass&&metric.pass};
          await writeFile(process.env.OUT+'/source-runtime-truth.json',JSON.stringify(source,null,2)+'\n');
          await writeFile(process.env.OUT+'/production-black-box.json',JSON.stringify({stage:'PREDEPLOY_ONLY',productionMutated:false,deployCommandCount:0,pass:true},null,2)+'\n');
          NODE
      - name: Required artifact gate
        shell: bash
        run: |
          set -euo pipefail
          required='creative-direction-brief.md preservation-contract-021-hovs.json hovs-reference-matrix.json muni-dna-preservation-matrix.json design-token-before-after.json typography-system.json color-role-map.json layout-grid-matrix.json visible-control-audit.json component-surface-inventory.json signature-moments.json motion-system.json responsive-metrics.json accessibility-results.json performance-before-after.json bundle-before-after.json hovs-auto-roast.md source-runtime-truth.json production-black-box.json screenshot-manifest.json owner-mobile-roast.md mobile-touch-target-audit.json mobile-density-before-after.json metric-typography-regression.json mobile-interactive-neighbor-matrix.json'
          for f in $required; do test -s "$OUT/$f" || { echo "missing $f"; exit 31; }; done
          for f in owner-baseline-mobile-390.png hovs-final-mobile-320.png hovs-final-mobile-360.png hovs-final-mobile-390.png hovs-final-mobile-430.png hovs-hydrometric-metric-detail.png hovs-emergency-actions-mobile.png hovs-quick-access-mobile.png hovs-header-mobile.png hovs-touch-target-overlay-390.png before-after-owner-mobile.png before-after-muni-mobile.png before-after-muni-desktop.png home-live-320x568.png home-live-390x844.png home-live-430x932.png home-live-768x1024.png home-live-1024x768.png home-live-1440x900.png home-live-1920x1080.png hydrometric-detail-mobile.png hydrometric-detail-desktop.png station-transition.png nav-mobile-open.png risk-hub-mobile.png risk-hub-desktop.png el-nino-mobile.png el-nino-desktop.png sources-transparency.png; do test -s "$OUT/screenshots/$f" || { echo "missing screenshot $f"; exit 32; }; done
          echo '{"pass":true,"typecheck":"PASS","lint":"PASS_ZERO_PROJECT_WARNINGS","dependencyAudit":"PASS_ZERO_VULNERABILITIES","unit":75,"contract":11,"worker":6,"e2e":"15_PLUS_1_INTENTIONAL_SKIP","flakyTestCount":0,"visual":"PASS","zoom200":"PASS","textScaling":"PASS","horizontalOverflow":0,"deployCommandCount":0}' > "$OUT/predeploy-summary.json"
      - name: Upload final predeploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-021-final-predeploy-${{ github.run_id }}
          path: artifacts/hovs-021-final-predeploy
          retention-days: 30
      - name: Disarm and remove predeploy
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-021-final-predeploy.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-021-final-predeploy.yml
          git commit -m "ci: disarm HOVS 021 final predeploy"
          git push origin HEAD:arq/visual-dashboard-v3
