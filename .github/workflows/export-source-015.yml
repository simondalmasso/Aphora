name: Export Source 015

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/export-source-015-trigger]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-015
          git rev-parse HEAD > /tmp/source-015/head.txt
          git ls-files -z | tar --null -T - -cf /tmp/source-015/source.tar
          sha256sum /tmp/source-015/source.tar > /tmp/source-015/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-015-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/source-015/
          if-no-files-found: error
          retention-days: 7
