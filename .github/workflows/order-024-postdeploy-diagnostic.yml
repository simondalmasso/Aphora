name: order-024-postdeploy-diagnostic

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: ['.github/workflows/order-024-postdeploy-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_URL: https://sos-sf.simondalmasso44.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read-only production diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "$PROD_URL/?order024-diag=${GITHUB_RUN_ID}" > /tmp/index.html
          grep -Eo 'assets/index-[^"[:space:]]+\.js' /tmp/index.html | head -1
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          page.on('console', (m) => console.log('BROWSER_CONSOLE', m.type(), m.text()));
          const r = await page.goto(`${process.env.PROD_URL}/?order024-diag=${Date.now()}`, { waitUntil: 'networkidle', timeout: 30000 });
          console.log('HTTP', r?.status());
          const h1 = await page.locator('#hydrometric-title').innerText().catch(() => '<missing>');
          const source = await page.getByTestId('hydro-source-strip').innerText().catch(() => '<missing>');
          const main = await page.locator('main').getAttribute('data-snapshot-id').catch(() => '<missing>');
          console.log('H1_JSON', JSON.stringify(h1));
          console.log('SOURCE_JSON', JSON.stringify(source));
          console.log('SNAPSHOT_ID', main);
          console.log('HAS_MEDICION', source.includes('Medición ·'));
          console.log('HAS_CONSULTA', source.includes('Consulta de la fuente ·'));
          console.log('HAS_RECIBIDOS', source.includes('Recibidos '));
          console.log('OVERFLOW', await page.evaluate(() => document.documentElement.scrollWidth - innerWidth));
          await browser.close();
          NODE
