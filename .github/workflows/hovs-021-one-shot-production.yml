name: SOS-SF HOVS 021 One Shot Production
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/hovs-021-one-shot-production.yml]
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OUT: artifacts/hovs-021-production
      BASE_HEAD: 829e9434f2c2838aa1941f1619a6eb02b9cd55e7
      PRODUCT_COMMIT: 0814814820992e1ce2b275f0de54baf406c5795c
      MAIN_EXPECTED: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: One-shot authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          git merge-base --is-ancestor "$PRODUCT_COMMIT" HEAD
          git diff --quiet "$BASE_HEAD" HEAD -- wrangler.jsonc migrations src/worker
          ! grep -q 'r2_buckets' wrangler.jsonc
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p "$OUT/logs" "$OUT/screenshots"
          echo 0 > "$OUT/deploy-command-count-before.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run build 2>&1 | tee "$OUT/logs/build.log"
          npm run deploy:dry 2>&1 | tee "$OUT/logs/deploy-dry.log"
      - name: Capture production baseline before mutation
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deployments list --json > "$OUT/cloudflare-before.json"
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const base=process.env.PRODUCTION_URL;
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({serviceWorkers:'block'});
          const p=await c.newPage();
          const hashes={};
          for(const [w,h,n] of [[390,844,'production-before-mobile-390.png'],[1440,900,'production-before-desktop-1440.png']]){
            await p.setViewportSize({width:w,height:h});await p.goto(`${base}/?before=${Date.now()}`,{waitUntil:'networkidle'});const path=`${process.env.OUT}/screenshots/${n}`;await p.screenshot({path,fullPage:true});hashes[n]=createHash('sha256').update(await readFile(path)).digest('hex');
          }
          await writeFile(process.env.OUT+'/production-before-screenshot-hashes.json',JSON.stringify(hashes,null,2)+'\n');
          await b.close();
          NODE
      - name: Exactly one production deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo 1 > "$OUT/deploy-command-count.txt"
          npx wrangler deploy 2>&1 | tee "$OUT/logs/wrangler-deploy.log"
          version_id=$(grep -Eo 'Current Version ID: [0-9a-f-]+' "$OUT/logs/wrangler-deploy.log" | awk '{print $4}' | tail -n1)
          test -n "$version_id"
          echo "$version_id" > "$OUT/deployment-version-id.txt"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Verify Cloudflare deployment provenance
        shell: bash
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          sleep 4
          npx wrangler deployments list --json > "$OUT/cloudflare-after.json"
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const raw=JSON.parse(await readFile(process.env.OUT+'/cloudflare-after.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.deployments||[]);
          if(!rows.length) throw new Error('no deployments');
          const sorted=[...rows].sort((a,b)=>Date.parse(a.created_on||a.createdAt||0)-Date.parse(b.created_on||b.createdAt||0));
          const latest=sorted.at(-1);
          const versions=latest.versions||[];
          const version=versions.find(v=>(v.version_id||v.id)===process.env.VERSION_ID);
          const pct=Number(version?.percentage ?? version?.traffic_percentage ?? 0);
          const pass=Boolean(version)&&pct===100;
          const result={expectedVersion:process.env.VERSION_ID,latestDeploymentId:latest.id||null,latestCreatedOn:latest.created_on||latest.createdAt||null,latestVersions:versions,percentage:pct,deployCommandCount:1,postdeployRedeployCount:0,pass};
          await writeFile(process.env.OUT+'/deployment-provenance.json',JSON.stringify(result,null,2)+'\n');
          if(!pass) throw new Error('deployment provenance mismatch '+JSON.stringify(result));
          NODE
      - name: Production API UI and asset byte identity
        shell: bash
        env:
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          import path from 'node:path';
          const base=process.env.PRODUCTION_URL.replace(/\/$/,'');
          const sha=(b)=>createHash('sha256').update(b).digest('hex');
          async function fetchJson(route){const r=await fetch(`${base}${route}${route.includes('?')?'&':'?'}hovs=${Date.now()}`,{cache:'no-store',headers:{'cache-control':'no-cache'}});const text=await r.text();let json=null;try{json=JSON.parse(text)}catch{};return {route,status:r.status,json};}
          const api=[];for(const r of ['/api/health','/api/snapshot','/api/sources','/source-provenance.json']) api.push(await fetchJson(r));
          const unwrap=(x)=>x?.json&&typeof x.json==='object'&&'data' in x.json?x.json.data:x?.json;
          const snapshot=unwrap(api.find(x=>x.route==='/api/snapshot'));
          if(api.some(x=>x.status!==200)) throw new Error('production API status '+JSON.stringify(api.map(x=>[x.route,x.status])));
          const systems=snapshot?.systems||[];
          const parana=systems.find(x=>x.id==='parana-santa-fe'); const salado=systems.find(x=>x.id==='salado-santo-tome');
          if(!parana?.available||!salado?.available||!Number.isFinite(parana.currentMetres)||!Number.isFinite(salado.currentMetres)) throw new Error('hydrometry unusable');
          const allSources=snapshot?.sources||[];
          const ina=allSources.filter(x=>(x.organizationName||x.name||x.sourceName||'').toLowerCase().includes('instituto nacional del agua'));
          if(!ina.length) throw new Error('INA primary source missing');
          const optionalUrls=[...allSources,...(snapshot?.timeline||[])].filter(x=>x.url!==undefined);
          if(optionalUrls.some(x=>typeof x.url!=='string'||!x.url.trim().startsWith('https://'))) throw new Error('optional source URL invalid');

          const localAssets=await readdir('dist/assets');
          const localJs=localAssets.find(x=>x.endsWith('.js')&&!x.endsWith('.js.map')); const localCss=localAssets.find(x=>x.endsWith('.css'));
          const localHtml=await readFile('dist/index.html','utf8');
          const remoteHtml=await (await fetch(`${base}/?asset=${Date.now()}`,{cache:'no-store'})).text();
          const remotePaths=[...remoteHtml.matchAll(/(?:src|href)="(\/assets\/[^"]+\.(?:js|css))"/g)].map(m=>m[1]);
          const identity=[];
          for(const localName of [localJs,localCss]){
            const remotePath=remotePaths.find(x=>x.endsWith(localName));
            if(!remotePath) throw new Error(`remote asset path missing ${localName}`);
            const lb=await readFile(path.join('dist/assets',localName));const rb=Buffer.from(await (await fetch(base+remotePath+'?b='+Date.now(),{cache:'no-store'})).arrayBuffer());
            const row={path:remotePath,localSha256:sha(lb),remoteSha256:sha(rb),pass:sha(lb)===sha(rb)};identity.push(row);if(!row.pass) throw new Error('asset byte identity failure '+localName);
          }

          const b=await chromium.launch({headless:true});const c=await b.newContext({serviceWorkers:'block'});const p=await c.newPage();const views=[];const hashes={};
          async function screen(name){const fp=`${process.env.OUT}/screenshots/${name}`;await p.screenshot({path:fp,fullPage:true});hashes[name]=sha(await readFile(fp));}
          for(const [w,h,n] of [[390,844,'production-home-390x844.png'],[768,1024,'production-home-768x1024.png'],[1440,900,'production-home-1440x900.png'],[1920,1080,'production-home-1920x1080.png']]){
            await p.setViewportSize({width:w,height:h});await p.goto(`${base}/?prod=${Date.now()}`,{waitUntil:'networkidle'});await p.getByTestId('hydrometric-situation').waitFor({state:'visible'});
            const level=(await p.getByTestId('hydro-current-level').innerText()).trim().replace(',', '.');const num=parseFloat(level);if(Math.abs(num-parana.currentMetres)>.005) throw new Error(`API/UI Paraná mismatch ${num}/${parana.currentMetres}`);
            const source=(await p.getByTestId('hydro-source-strip').innerText()).toLowerCase();if(!source.includes('instituto nacional del agua')) throw new Error('production source strip not INA');
            const geo=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-innerWidth,quick:document.querySelectorAll('.civic-quick-tile').length,contacts:document.querySelectorAll('.contact-grid a').length,clusters:[...document.querySelectorAll('.civic-header__main > .sos-brand,.civic-header__main > .civic-nav,.civic-header__actions,.civic-menu-toggle')].filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&r.width>0&&r.height>0}).length}));if(geo.overflow>1||geo.quick!==6||geo.contacts!==5||(w<=430&&geo.clusters>3)) throw new Error('production geometry '+JSON.stringify({w,geo}));
            views.push({w,h,level:num,sourceIncludesIna:true,...geo});await screen(n);
          }
          await p.setViewportSize({width:390,height:844});await p.goto(`${base}/?salado=${Date.now()}`,{waitUntil:'networkidle'});await p.getByRole('tab',{name:/Salado/i}).click();const saladoUi=parseFloat((await p.getByTestId('hydro-current-level').innerText()).replace(',','.'));if(Math.abs(saladoUi-salado.currentMetres)>.005) throw new Error(`API/UI Salado mismatch ${saladoUi}/${salado.currentMetres}`);await screen('production-station-transition.png');
          await p.goto(`${base}/gestion-de-riesgo/fenomeno-el-nino?prod=${Date.now()}`,{waitUntil:'networkidle'});const el=await p.getByTestId('el-nino-landing').innerText();for(const s of ['Fenómeno El Niño','5,30 m','no es un umbral general de evacuación de SOS-SF'])if(!el.includes(s))throw new Error('El Nino preservation '+s);await screen('production-el-nino-mobile.png');
          await b.close();
          const result={deploymentVersion:process.env.VERSION_ID,apiStatus:api.map(x=>({route:x.route,status:x.status})),parana:{id:parana.id,currentMetres:parana.currentMetres,observedAt:parana.observedAt,freshness:parana.freshness},salado:{id:salado.id,currentMetres:salado.currentMetres,observedAt:salado.observedAt,freshness:salado.freshness},inaSourceCount:ina.length,assetIdentity:identity,views,screenshotHashes:hashes,result:'PASS'};
          await writeFile(process.env.OUT+'/production-black-box.json',JSON.stringify(result,null,2)+'\n');await writeFile(process.env.OUT+'/source-runtime-truth.json',JSON.stringify({primaryOrganization:'Instituto Nacional del Agua',parana:result.parana,salado:result.salado,apiUiConsistency:true,pass:true},null,2)+'\n');await writeFile(process.env.OUT+'/production-screenshot-manifest.json',JSON.stringify({pass:true,hashes},null,2)+'\n');
          NODE
      - name: Production HOVS responsive and accessibility truth
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$PRODUCTION_URL" OUT="$OUT/production-hovs" SCREENSHOT_PREFIX="production-" node scripts/verify-hovs-021.mjs 2>&1 | tee "$OUT/logs/production-hovs.log"
      - name: Capture production loading and recoverable-error states
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});const c=await b.newContext({serviceWorkers:'block'});const p=await c.newPage({viewport:{width:390,height:844}});const base=process.env.PRODUCTION_URL;
          await p.goto(`${base}/?states=${Date.now()}`,{waitUntil:'networkidle'});
          let delay=true;
          await p.route('**/api/snapshot**',async route=>{if(delay){delay=false;await new Promise(r=>setTimeout(r,1800));}await route.continue();});
          await p.getByRole('button',{name:'Actualizar información'}).click();await p.waitForTimeout(150);await p.screenshot({path:`${process.env.OUT}/screenshots/state-loading.png`,fullPage:true});await p.waitForTimeout(1900);
          await p.unroute('**/api/snapshot**');
          await p.route('**/api/snapshot**',route=>route.fulfill({status:503,contentType:'application/json',body:'{"error":"temporary"}'}));
          await p.getByRole('button',{name:'Actualizar información'}).click();await p.waitForTimeout(500);await p.screenshot({path:`${process.env.OUT}/screenshots/state-error-recoverable.png`,fullPage:true});
          await b.close();
          NODE
          # Existing deterministic E2E state evidence from the final code.
          EVIDENCE_DIR="$OUT/state-e2e" npm run test:e2e > "$OUT/logs/state-e2e.log" 2>&1
          cp "$OUT/state-e2e/screenshots/state-stale.png" "$OUT/screenshots/state-stale.png"
          cp "$OUT/state-e2e/screenshots/state-active-alert.png" "$OUT/screenshots/state-alert-active.png"
          cp "$OUT/state-e2e/screenshots/state-alerts-unverified.png" "$OUT/screenshots/state-alerts-unverified.png"
          cp "$OUT/state-e2e/screenshots/state-offline.png" "$OUT/screenshots/state-offline.png"
      - name: One-shot terminal evidence gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$OUT/deploy-command-count.txt")" = 1
          echo 0 > "$OUT/postdeploy-redeploy-count.txt"
          test "$(git rev-parse origin/main)" = "$MAIN_EXPECTED"
          test -s "$OUT/deployment-provenance.json"
          test -s "$OUT/production-black-box.json"
          test -s "$OUT/source-runtime-truth.json"
          for f in production-before-mobile-390.png production-before-desktop-1440.png production-home-390x844.png production-home-768x1024.png production-home-1440x900.png production-home-1920x1080.png production-station-transition.png production-el-nino-mobile.png state-loading.png state-error-recoverable.png state-stale.png state-alert-active.png state-alerts-unverified.png state-offline.png; do test -s "$OUT/screenshots/$f" || { echo "missing $f"; exit 41; }; done
          node --input-type=module <<'NODE'
          import { readFile,writeFile } from 'node:fs/promises';
          const dep=JSON.parse(await readFile(process.env.OUT+'/deployment-provenance.json','utf8'));const prod=JSON.parse(await readFile(process.env.OUT+'/production-black-box.json','utf8'));if(!dep.pass||prod.result!=='PASS')process.exit(42);
          await writeFile(process.env.OUT+'/production-summary.json',JSON.stringify({pass:true,deployCommandCount:1,postdeployRedeployCount:0,deploymentVersion:dep.expectedVersion,assetByteIdentity:true,apiUiConsistency:true,hydrometryPrimarySource:'INA',responsive:true,zoom200:true,textScaling:true,horizontalOverflow:0,main:process.env.MAIN_EXPECTED,costUsd:0},null,2)+'\n');
          NODE
      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-hovs-021-production-${{ github.run_id }}
          path: artifacts/hovs-021-production
          retention-days: 30
      - name: Disarm and remove one-shot deploy workflow
        if: always()
        shell: bash
        run: |
          set +e
          gh workflow disable hovs-021-one-shot-production.yml
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm -f .github/workflows/hovs-021-one-shot-production.yml
          git commit -m "ci: terminally disarm HOVS 021 production deploy"
          git push origin HEAD:arq/visual-dashboard-v3
