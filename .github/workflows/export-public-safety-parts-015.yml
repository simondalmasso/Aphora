name: Export Public Safety Parts 015

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/export-public-safety-parts-015-trigger]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package exact remote parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/public-safety-parts-015
          cp .github/public-safety-015-parts/part* /tmp/public-safety-parts-015/
          sha256sum /tmp/public-safety-parts-015/part* > /tmp/public-safety-parts-015/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: public-safety-parts-015-${{ github.sha }}-${{ github.run_id }}
          path: /tmp/public-safety-parts-015/
          if-no-files-found: error
          retention-days: 7
