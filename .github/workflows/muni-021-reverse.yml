name: SOS-SF MUNI 021 Reverse Measurement

on:
  push:
    branches: [arq/visual-dashboard-v3]

permissions:
  contents: write
  actions: write

concurrency:
  group: sos-sf-muni-021-reverse
  cancel-in-progress: false

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OUT: artifacts/muni-021-reverse
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "45047d1c1e16941ea37967d67307d0ab17e85fad"
          git merge-base --is-ancestor 810fdc47901adf7aa7108d39f4d4047ae56b3295 HEAD
          mkdir -p "$OUT/screenshots"
          printf '{"order":"SOS-SF-AUD-MUNI-CHASSIS-MEGA-REVERSE-REDESIGN-021","takeHead":"810fdc47901adf7aa7108d39f4d4047ae56b3295","runHead":"%s","main":"%s"}\n' "$(git rev-parse HEAD)" "$(git rev-parse origin/main)" > "$OUT/authority.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Reverse current municipal chassis
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const base='https://santafeciudad.gov.ar';
          const primary=[
            {key:'home',url:base+'/'},
            {key:'el-nino',url:base+'/direccion-de-gestion-de-riesgo/fenomeno-el-nino/'},
          ];
          const viewports=[{width:320,height:700},{width:360,height:800},{width:390,height:844},{width:768,height:1024},{width:1024,height:768},{width:1366,height:768},{width:1440,height:900},{width:1920,height:1080}];
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({ignoreHTTPSErrors:true});
          const page=await context.newPage();
          const normalize=(href)=>{try{const u=new URL(href,base);return u.origin===base?u.href:null}catch{return null}};
          await page.setViewportSize({width:1440,height:900});
          await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(2500);
          const discovered=await page.locator('a[href]').evaluateAll((els)=>els.map(a=>({text:(a.textContent||'').replace(/\s+/g,' ').trim(),href:a.href})).filter(x=>x.text));
          const wanted=[
            ['gobierno',/gobierno/i],['servicios',/servicios|tr[aá]mites/i],['transparencia',/transparencia/i],['riesgo',/gesti[oó]n de riesgo/i]
          ];
          const pages=[...primary];
          for(const [key,re] of wanted){const hit=discovered.find(x=>re.test(x.text)&&normalize(x.href));if(hit)pages.push({key,url:normalize(hit.href)});}
          for(const x of discovered){if(pages.length>=8)break;const u=normalize(x.href);if(!u||pages.some(p=>p.url===u)||/wp-content|\.(pdf|jpg|png|zip)(\?|$)/i.test(u))continue;if(u.split('/').filter(Boolean).length>=3)pages.push({key:'internal-'+pages.length,url:u});}
          const seen=new Set();const unique=pages.filter(p=>p.url&&!seen.has(p.url)&&seen.add(p.url));
          const results=[];
          for(const target of unique){
            for(const vp of viewports){
              await page.setViewportSize(vp);
              let status='OK',error=null;
              try{await page.goto(target.url,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(2200);}catch(e){status='LOAD_ERROR';error=String(e)}
              const data=await page.evaluate(({target,vp,status,error})=>{
                const props=['display','position','width','maxWidth','height','margin','padding','gap','fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','textTransform','color','backgroundColor','border','borderRadius','boxShadow','alignItems','justifyContent','gridTemplateColumns','flexDirection'];
                const visible=(el)=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'};
                const path=(el)=>{const parts=[];let n=el;while(n&&n.nodeType===1&&parts.length<6){let p=n.tagName.toLowerCase();if(n.id)p+='#'+n.id;else if(n.classList.length)p+='.'+[...n.classList].slice(0,2).join('.');parts.unshift(p);n=n.parentElement;}return parts.join(' > ')};
                const interesting=[...document.querySelectorAll('header,nav,main,footer,section,article,h1,h2,h3,a,button,[role="navigation"],[role="banner"],[class*="hero"],[class*="banner"],[class*="card"],[class*="acceso"],[class*="menu"]')].filter(visible).slice(0,180);
                const elements=interesting.map(el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect(),styles={};for(const p of props)styles[p]=cs[p];return{tag:el.tagName.toLowerCase(),role:el.getAttribute('role'),text:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,180),domPath:path(el),box:{x:r.x,y:r.y,width:r.width,height:r.height},styles};});
                const all=[...document.querySelectorAll('body *')].filter(visible).slice(0,900);const freq=(key)=>{const m=new Map();for(const el of all){const v=getComputedStyle(el)[key];if(v)m.set(v,(m.get(v)||0)+1)}return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,20).map(([value,count])=>({value,count}))};
                const root=getComputedStyle(document.documentElement);const vars={};for(const name of [...root])if(name.startsWith('--'))vars[name]=root.getPropertyValue(name).trim();
                return{target,vp,status,error,title:document.title,url:location.href,body:{scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight},fonts:freq('fontFamily'),fontSizes:freq('fontSize'),colors:freq('color'),backgrounds:freq('backgroundColor'),radii:freq('borderRadius'),rootVars:vars,elements};
              },{target,vp,status,error});
              results.push(data);
              if((vp.width===390||vp.width===1440)&&status==='OK')await page.screenshot({path:`${process.env.OUT}/screenshots/reference-${target.key}-${vp.width}x${vp.height}.png`,fullPage:true});
            }
          }
          await writeFile(process.env.OUT+'/municipal-computed-reverse.json',JSON.stringify({capturedAt:new Date().toISOString(),pages:unique,results},null,2)+'\n');
          await writeFile(process.env.OUT+'/pages-inspected.json',JSON.stringify(unique,null,2)+'\n');
          await browser.close();
          NODE
      - name: Upload reverse evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-muni-021-reverse-${{ github.run_id }}
          path: artifacts/muni-021-reverse/
          if-no-files-found: error
          retention-days: 30
      - name: Disarm reverse mechanism
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --jq '.workflows[]|select(.path==".github/workflows/muni-021-reverse.yml")|.id' | head -n1)
          test -n "$workflow_id"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/disable"
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git rm .github/workflows/muni-021-reverse.yml
          git commit -m 'ci: disarm MUNI 021 reverse measurement'
          git push origin HEAD:arq/visual-dashboard-v3
