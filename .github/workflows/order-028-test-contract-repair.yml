name: order-028-test-contract-repair
on:
  push:
    paths:
      - '.github/workflows/order-028-test-contract-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Align inherited 026 expectation to 028 authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/context-first-026.spec.ts')
          s=p.read_text()
          old="await expect(page.getByTestId('hydro-meaning')).toContainText('por debajo del nivel de alerta de referencia');"
          new="await expect(page.getByTestId('hydro-meaning')).toContainText('por encima de la referencia de aguas bajas');"
          if s.count(old) != 1: raise SystemExit(f'expected exactly one inherited expectation, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Full browser suite with first-failure stop
        run: npx playwright test --max-failures=1 --workers=1
      - name: Commit repaired inherited test contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name sos-sf-arq
          git config user.email actions@users.noreply.github.com
          git add tests/e2e/context-first-026.spec.ts
          git commit -m 'test(028): align Paraná context assertion with statistical reference [skip ci]'
          git push origin HEAD:refs/heads/arq/visual-dashboard-v3
