name: order-027-repair-r2
on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/order-027-repair-r2.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0
      - name: Repair source semantics and superseded assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'{label} marker missing')
              p.write_text(s.replace(old,new,1))

          replace(
            'src/client/features/hydro/HydrometricMonitoring.tsx',
            "<div><p>{priority.mode === 'DUAL_EMERGENCY' ? 'Atención compartida' : 'Atención prioritaria'}</p><h2 id=\"river-priority-title\">{priority.mode === 'DUAL_EMERGENCY' ? 'Paraná + Salado' : prioritySystems[0]?.watercourse}</h2></div>",
            "<div><p>{priority.mode === 'DUAL_EMERGENCY' ? 'Atención compartida' : 'Atención prioritaria'}</p><h2 id=\"river-priority-title\">{priority.mode === 'DUAL_EMERGENCY' ? 'Paraná y Salado requieren el mismo peso ahora' : `${prioritySystems[0]?.watercourse} requiere atención primero`}</h2></div>",
            'priority explanatory heading')

          replace(
            'src/client/components/ui/HydroSeriesChart.tsx',
            "<div className=\"hydro-chart__meta hydro-chart__meta--quiet\">\n      <span>Medición · {formatHumanAge(system.observedAt, generatedAt)}</span>\n      <span>{freshnessLabel(system)}</span>\n    </div>",
            "<div className=\"hydro-chart__meta hydro-chart__meta--quiet\">\n      <span>Medición · {formatHumanAge(system.observedAt, generatedAt)}</span>\n    </div>",
            'duplicate chart freshness')

          replace(
            'src/client/components/ui/HydroSeriesChart.tsx',
            "<span key={threshold.id}><b>{threshold.label}</b>{threshold.metres.toFixed(2).replace('.', ',')} m · fuera de escala</span>",
            "<span key={threshold.id}><b>{threshold.label} </b>{threshold.metres.toFixed(2).replace('.', ',')} m · fuera de escala</span>",
            'external threshold textual spacing')

          replace(
            'src/client/styles/smooth-civic-027.css',
            "padding: 14px 0 4px;",
            "padding: 14px 15px 4px;",
            'HOVS product inset')

          replace(
            'src/client/styles/smooth-civic-027.css',
            "min-height: 38px;",
            "min-height: 44px;",
            'chart touch target')

          replace(
            'tests/e2e/context-first-026.spec.ts',
            "await expect(page.getByText(/Medición de hace/)).toBeVisible();",
            "await expect(page.locator('.station-identification')).toContainText(/Medición · hace/);",
            '026 measurement wording')

          replace(
            'tests/e2e/final-product-023.spec.ts',
            "await expect(page.getByText(/Última medición/)).toBeVisible();",
            "await expect(page.locator('.station-identification')).toContainText(/Medición ·/);",
            '023 measurement wording')

          replace(
            'tests/e2e/owner-left-inset.spec.ts',
            "['observation-time', '.hydro-level time'],",
            "['observation-time', '.station-identification > div > small'],",
            'owner observation selector')
          PY
          git config user.name sos-sf-arq
          git config user.email actions@users.noreply.github.com
          git add src/client tests/e2e
          git commit -m 'fix(027): preserve priority clarity, touch geometry and inherited truth gates [skip ci]'
          git push origin HEAD:refs/heads/arq/visual-dashboard-v3
