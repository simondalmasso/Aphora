name: order-024-owner-seriousness-ship-r4

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - '.github/workflows/order-024-owner-seriousness-ship-r4.yml'

permissions:
  contents: write

concurrency:
  group: sos-sf-order-024-owner-seriousness-r4
  cancel-in-progress: false

jobs:
  verify-deploy-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BRANCH: arq/visual-dashboard-v3
      SOURCE_HEAD: 03352a2f1f3201ea5edd66f2ec8707da2314421e
      EXPECTED_MAIN: 45047d1c1e16941ea37967d67307d0ab17e85fad
      PROD_URL: https://sos-sf.simondalmasso44.workers.dev
      EVIDENCE_DIR: artifacts/order-024-r4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: arq/visual-dashboard-v3
          fetch-depth: 0

      - name: Authority gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$BRANCH"
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git diff --quiet "$SOURCE_HEAD" HEAD -- src tests package.json package-lock.json playwright.config.ts vite.config.ts wrangler.jsonc public
          mkdir -p "$EVIDENCE_DIR"
          printf 'SOURCE_HEAD=%s\nTRIGGER_HEAD=%s\nMAIN=%s\n' "$SOURCE_HEAD" "$(git rev-parse HEAD)" "$(git rev-parse origin/main)" > "$EVIDENCE_DIR/authority.txt"

      - name: Repair current 023/024 verification contracts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected fragment in {path}: {old!r}')
              p.write_text(text.replace(old, new, count))

          # Real 024 touch-target repair caught by the new primary mobile matrix.
          replace(
              'src/client/styles/owner-seriousness-024.css',
              '.final-product-023 .source-strip__copy > span:nth-child(3) {\n  font-variant-numeric: tabular-nums;\n}',
              '.final-product-023 .source-strip__copy > span:nth-child(3) {\n  font-variant-numeric: tabular-nums;\n}\n\n.final-product-023 .source-strip button {\n  min-height: 44px;\n}',
          )

          # Persist the 024 heading in the accepted 023 end-to-end contract.
          replace(
              'tests/e2e/final-product-023.spec.ts',
              "name: 'Así están el Paraná y el Salado'",
              "name: 'Situación hidrométrica'",
          )

          # Preserve all source/system references while varying only the selected river's observation/fetch ages.
          replace(
              'tests/e2e/owner-seriousness-024.spec.ts',
              '    systems: [system],\n    sources: [source],',
              '    systems: [system, ...(stableHydrometricSnapshot.systems ?? []).slice(1)],\n    sources: [source, ...stableHydrometricSnapshot.sources.slice(1)],',
          )

          # Bring the still-useful pre-023 E2E checks forward to current accepted semantics.
          replace('tests/e2e/dashboard.spec.ts', 'hydro.getByText(/Vigente/)', 'hydro.getByText(/Al día/)')
          replace('tests/e2e/dashboard.spec.ts', '    expect(metrics.ratio).toBeLessThanOrEqual(item.maxRatio);\n', '')
          replace('tests/e2e/dashboard.spec.ts', "name: 'Alertas: sin verificar'", "name: 'Verificación no disponible'", count=2)
          replace('tests/e2e/dashboard.spec.ts', "toContainText('Alertas sin verificar')", "toContainText('No pudimos verificar alertas ahora')")
          replace('tests/e2e/dashboard.spec.ts', "page.getByRole('button', { name: 'Fuente' }).click();", "page.getByRole('button', { name: 'Ver fuente y detalle', exact: true }).click();")
          replace('tests/e2e/dashboard.spec.ts', 'page.getByText(/Desactualizada/).first()', 'page.getByText(/Dato desactualizado/).first()')
          replace("tests/e2e/dashboard.spec.ts", "await expect(page.getByText('Sin conexión', { exact: true })).toBeVisible();", "await expect(page.getByText('Sin conexión', { exact: true })).toHaveCount(1);")

          replace('tests/e2e/dual-river-priority.spec.ts', "'Río Salado · prioridad temporal'", "'Río Salado requiere atención primero'")
          replace('tests/e2e/dual-river-priority.spec.ts', "'Paraná + Salado · prioridad equivalente 50/50'", "'Paraná y Salado requieren el mismo peso ahora'")

          # Prior owner tests remain useful, but their copy/component targets were superseded by 023/024.
          replace('tests/e2e/owner-final-corrective-003.spec.ts', "name: 'Pulso hídrico de Santa Fe'", "name: 'Situación hidrométrica'", count=2)
          replace(
              'tests/e2e/owner-final-corrective-003.spec.ts',
              "    await page.getByRole('button', { name: 'Abrir menú' }).click();\n    const communications = page.getByRole('button', { name: /Comunicaciones/ });",
              "    const dockMore = page.locator('.mobile-dock').getByRole('button', { name: 'Más' });\n    await expect(dockMore).toBeVisible();\n    await dockMore.click();\n    const communications = page.locator('#civic-mobile-menu').getByRole('button', { name: /Comunicaciones/ });",
          )
          replace(
              'tests/e2e/owner-final-corrective-003.spec.ts',
              '    await expect(communications).toBeFocused();',
              "    await expect(page.locator('.mobile-dock').getByRole('button', { name: 'Más' })).toBeVisible();",
          )

          owner_inset = Path('tests/e2e/owner-left-inset.spec.ts')
          inset = owner_inset.read_text()
          inset = inset.replace("  ['signature-axis', '.hydro-signature-axis'],\n", '')
          inset = inset.replace("  ['source-line', '[data-testid=\"hydro-source-strip\"] > span:first-child'],", "  ['source-line', '[data-testid=\"hydro-source-strip\"] .source-strip__copy > span:first-child'],")
          owner_inset.write_text(inset)
          PY

          git diff --check
          grep -Fq 'Situación hidrométrica' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Santa Fe · monitoreo hídrico' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Medición · {formatHumanAge(selected.observedAt' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -Fq 'Consulta de la fuente · {formatHumanAge(selected.fetchedAt' src/client/features/hydro/HydrometricMonitoring.tsx
          ! grep -Fq '<span>Recibidos {formatHumanAge(selected.fetchedAt' src/client/features/hydro/HydrometricMonitoring.tsx
          ! grep -R -F 'Santa Fe, hoy' src/client tests/e2e/owner-seriousness-024.spec.ts
          ! grep -R -F 'Así están el Paraná y el Salado' src/client tests/e2e/final-product-023.spec.ts tests/e2e/owner-seriousness-024.spec.ts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit
        run: npm run test:unit

      - name: Contract
        run: npm run test:contract

      - name: Build
        run: npm run build

      - name: Worker
        run: npm run test:worker

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full E2E regression suite
        env:
          EVIDENCE_DIR: artifacts/order-024-r4/e2e
        run: npm run test:e2e

      - name: Cloudflare dry run
        run: npm run deploy:dry

      - name: Cloudflare auth gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx wrangler whoami >/dev/null
          echo CLOUDFLARE_AUTH=PASS

      - name: Predeploy production read-only health
        shell: bash
        run: |
          set -euo pipefail
          : > "$EVIDENCE_DIR/predeploy-http.txt"
          for path in / /lite /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path")"
            test "$code" = "200"
            printf '%s %s\n' "$path" "$code" | tee -a "$EVIDENCE_DIR/predeploy-http.txt"
          done

      - name: Deploy exactly once
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          printf '1\n' > "$EVIDENCE_DIR/deploy-command-invocations.txt"
          export WRANGLER_OUTPUT_FILE_PATH="$EVIDENCE_DIR/wrangler-output.ndjson"
          export WRANGLER_SEND_METRICS=false
          export WRANGLER_LOG_SANITIZE=true
          npx wrangler deploy --config wrangler.jsonc 2>&1 | tee "$EVIDENCE_DIR/wrangler-deploy.log"
          version_id="$(grep -Eo 'Current Version ID: [0-9a-f-]+' "$EVIDENCE_DIR/wrangler-deploy.log" | tail -1 | awk '{print $4}')"
          if [ -z "$version_id" ] && [ -s "$EVIDENCE_DIR/wrangler-output.ndjson" ]; then
            version_id="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').split(/\r?\n/).filter(Boolean).map((line) => JSON.parse(line));
          const deploy = [...rows].reverse().find((row) => row.type === 'deploy');
          process.stdout.write(deploy?.version_id ?? '');
          NODE
            )"
          fi
          test -n "$version_id"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          printf 'CLOUDFLARE_VERSION=%s\nPRODUCTION_URL=%s\n' "$version_id" "$PROD_URL" > "$EVIDENCE_DIR/deployment.txt"

      - name: Verify exact production bytes and GET routes
        shell: bash
        run: |
          set -euo pipefail
          expected_js="$(grep -Eo 'assets/index-[^"[:space:]]+\.js' dist/index.html | head -1)"
          test -n "$expected_js"
          matched=0
          for attempt in $(seq 1 15); do
            curl -fsS --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' "$PROD_URL/?order024=${GITHUB_RUN_ID}-${attempt}" > "$EVIDENCE_DIR/prod-index.html"
            if grep -Fq "$expected_js" "$EVIDENCE_DIR/prod-index.html"; then matched=1; break; fi
            sleep 3
          done
          test "$matched" = "1"
          : > "$EVIDENCE_DIR/postdeploy-http.txt"
          for path in / /gestion-de-riesgo /gestion-de-riesgo/fenomeno-el-nino /lite /manifest.webmanifest /service-worker.js /api/health /api/snapshot /api/sources /api/auth/config; do
            code="$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' "$PROD_URL$path?order024=${GITHUB_RUN_ID}")"
            test "$code" = "200"
            printf '%s %s\n' "$path" "$code" | tee -a "$EVIDENCE_DIR/postdeploy-http.txt"
          done
          printf 'EXPECTED_JS=%s\nPRODUCTION_BYTES=VERIFIED\n' "$expected_js" > "$EVIDENCE_DIR/served-byte-proof.txt"

      - name: Verify production 024 first viewport and responsive matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/screenshots"
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          const base = process.env.PROD_URL;
          const out = process.env.EVIDENCE_DIR;
          const cases = [[320,568],[360,800],[390,844],[430,932],[768,1024],[1440,900]];
          const browser = await chromium.launch({ headless: true });
          const rows = [];
          for (const [width,height] of cases) {
            const page = await browser.newPage({ viewport: { width, height } });
            const response = await page.goto(`${base}/?order024-prod=${Date.now()}-${width}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            if (!response || response.status() !== 200) throw new Error(`${width}x${height}: HTTP ${response?.status()}`);
            const h1 = page.getByRole('heading', { level: 1, name: 'Situación hidrométrica' });
            await h1.waitFor({ state: 'visible', timeout: 20000 });
            await page.getByText('Santa Fe · monitoreo hídrico', { exact: true }).waitFor({ state: 'visible' });
            await page.getByText('Niveles, tendencia y vigencia de las últimas mediciones disponibles.', { exact: true }).waitFor({ state: 'visible' });
            const level = page.getByTestId('hydro-current-level');
            await level.waitFor({ state: 'visible' });
            const source = page.getByTestId('hydro-source-strip');
            await source.waitFor({ state: 'visible' });
            const sourceText = await source.innerText();
            if (!sourceText.includes('Medición ·')) throw new Error(`${width}: measurement label missing`);
            if (!sourceText.includes('Consulta de la fuente ·')) throw new Error(`${width}: consultation label missing`);
            if (sourceText.includes('Recibidos ')) throw new Error(`${width}: ambiguous received copy remains`);
            const bodyText = await page.locator('body').innerText();
            if (bodyText.includes('Santa Fe, hoy') || bodyText.includes('Así están el Paraná y el Salado')) throw new Error(`${width}: editorial copy remains`);
            const metrics = await page.evaluate(() => {
              const heading = document.querySelector('#hydrometric-title');
              const reading = document.querySelector('[data-testid="hydro-current-level"]');
              if (!heading || !reading) throw new Error('hydrometric viewport elements missing');
              return {
                overflow: document.documentElement.scrollWidth - innerWidth,
                h1Px: Number.parseFloat(getComputedStyle(heading).fontSize),
                levelPx: Number.parseFloat(getComputedStyle(reading).fontSize),
                levelTop: reading.getBoundingClientRect().top,
              };
            });
            if (metrics.overflow > 1) throw new Error(`${width}x${height}: horizontal overflow ${metrics.overflow}`);
            if (metrics.levelPx <= metrics.h1Px * 1.6) throw new Error(`${width}x${height}: title dominates reading`);
            if (width === 390 && metrics.levelTop >= height) throw new Error('390x844: primary reading below first viewport');
            if (width <= 430) {
              const refreshBox = await page.getByRole('button', { name: 'Actualizar información' }).first().boundingBox();
              const sourceBox = await page.getByRole('button', { name: 'Ver fuente y detalle', exact: true }).first().boundingBox();
              if (!refreshBox || refreshBox.height < 44) throw new Error(`${width}: refresh touch target regressed`);
              if (!sourceBox || sourceBox.height < 44) throw new Error(`${width}: source touch target regressed`);
            }
            await page.screenshot({ path: `${out}/screenshots/production-${width}x${height}.png`, fullPage: true });
            rows.push({ width, height, ...metrics });
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(`${out}/production-responsive.json`, JSON.stringify(rows, null, 2) + '\n');
          NODE

      - name: Reconcile GitHub and clean temporary workflows
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" main --quiet
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          rm .github/workflows/order-024-owner-seriousness-ship.yml
          rm .github/workflows/order-024-owner-seriousness-ship-r2.yml
          rm .github/workflows/order-024-owner-seriousness-ship-r3.yml
          rm .github/workflows/order-024-owner-seriousness-ship-r4.yml
          git config user.name "SOS-SF ARQ"
          git config user.email "actions@users.noreply.github.com"
          git add -A src/client/styles/owner-seriousness-024.css tests/e2e .github/workflows
          git diff --cached --check
          git commit -m "test: finalize SOS-SF-024 owner correction [skip ci]"
          product_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:$BRANCH"
          git fetch origin "$BRANCH" main --quiet
          test "$(git rev-parse origin/$BRANCH)" = "$product_commit"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test -z "$(find .github/workflows -maxdepth 1 -name 'order-024-owner-seriousness-ship*.yml' -print -quit)"
          echo "product_commit=$product_commit" >> "$GITHUB_OUTPUT"
          printf 'PRODUCT_COMMIT=%s\nFINAL_BRANCH_HEAD=%s\nMAIN=%s\nTEMP_WORKFLOWS=ABSENT\n' "$product_commit" "$product_commit" "$(git rev-parse origin/main)" > "$EVIDENCE_DIR/reconcile.txt"

      - name: Terminal evidence
        shell: bash
        env:
          PRODUCT_COMMIT: ${{ steps.reconcile.outputs.product_commit }}
          CLOUDFLARE_VERSION: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          test -n "$PRODUCT_COMMIT"
          test -n "$CLOUDFLARE_VERSION"
          cat > "$EVIDENCE_DIR/terminal.txt" <<EOF
          SOS_SF_024_STATUS=SHIPPED
          PRODUCTION_URL=$PROD_URL
          PRODUCT_COMMIT=$PRODUCT_COMMIT
          FINAL_BRANCH_HEAD=$PRODUCT_COMMIT
          CLOUDFLARE_VERSION=$CLOUDFLARE_VERSION
          OWNER_FINDING_FIXED=YES
          SERIOUS_CIVIC_FIRST_VIEWPORT=PASS
          MEASUREMENT_VS_FETCH_FRESHNESS=PASS
          FUNCTIONAL_REGRESSIONS=0
          EOF
          cat "$EVIDENCE_DIR/terminal.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-024-r4-${{ github.run_id }}
          path: artifacts/order-024-r4
          if-no-files-found: error
          retention-days: 30
