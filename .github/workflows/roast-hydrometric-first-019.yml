name: ROAST Hydrometric First 019

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths:
      - .github/roast-019-trigger

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-roast-hydrometric-first-019
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/roast-019-final
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  DEPLOYMENT_VERSION_ID: a74bcb40-13c4-4d36-bd11-5dc6957d7c0b
  DEPLOYMENT_RUN_ID: '31075457731'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  get-only-finalize-disarm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert immutable deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = arq/visual-dashboard-v3
          git merge-base --is-ancestor b5f0e4fdaef742ef8d4799f297ff72c0c35450f9 HEAD
          test "$(git rev-parse origin/main)" = 45047d1c1e16941ea37967d67307d0ab17e85fad
          test "$(node -p "require('./public/source-provenance.json').deploymentRunId")" = "$DEPLOYMENT_RUN_ID"
          test "$(node -p "require('./public/source-provenance.json').orderId")" = SOS-SF-AUD-ROAST-HYDROMETRIC-FIRST-019
          mkdir -p "$EVIDENCE_DIR/screenshots"
          printf '1\n' > "$EVIDENCE_DIR/deploy-command-count.txt"
          printf '1\n' > "$EVIDENCE_DIR/cloudflare-mutation-count.txt"
          printf '%s\n' "$DEPLOYMENT_VERSION_ID" > "$EVIDENCE_DIR/deployment-version-id.txt"
          printf '%s\n' "$DEPLOYMENT_RUN_ID" > "$EVIDENCE_DIR/deployment-run-id.txt"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Reverify full matrix without deployment
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm run test:unit
          npm run test:contract
          npm run build
          npm run test:worker
          EVIDENCE_DIR="$EVIDENCE_DIR" npx playwright test --retries=0

      - name: Verify Cloudflare and production GET-only
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"

          curl -fsS -H "$auth" "$base/workers/scripts/sos-sf/versions" > "$EVIDENCE_DIR/cloudflare-worker-versions.json"
          node - "$EVIDENCE_DIR/cloudflare-worker-versions.json" "$DEPLOYMENT_VERSION_ID" <<'NODE'
          const fs = require('node:fs');
          const [file, expected] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file));
          if (payload.success === false) throw new Error('CLOUDFLARE_VERSION_GET_FAILED');
          const values = Array.isArray(payload.result) ? payload.result : payload.result?.items ?? [];
          if (!values.some((item) => item.id === expected || item.version_id === expected)) throw new Error('DEPLOYED_VERSION_NOT_FOUND');
          NODE

          curl -fsS -H "$auth" "$base/d1/database?per_page=100" > "$EVIDENCE_DIR/cloudflare-d1.json"
          curl -fsS -H "$auth" "$base/storage/kv/namespaces?per_page=100" > "$EVIDENCE_DIR/cloudflare-kv.json"
          node - "$EVIDENCE_DIR/cloudflare-d1.json" "$EVIDENCE_DIR/cloudflare-kv.json" <<'NODE'
          const fs = require('node:fs');
          const [d1File, kvFile] = process.argv.slice(2);
          const d1 = JSON.parse(fs.readFileSync(d1File)).result ?? [];
          const kv = JSON.parse(fs.readFileSync(kvFile)).result ?? [];
          if (!d1.some((item) => item.name === 'sos-sf-private')) throw new Error('D1_FREE_RESOURCE_MISSING');
          if (!kv.some((item) => item.title === 'sos-sf-private-reports')) throw new Error('KV_FREE_RESOURCE_MISSING');
          NODE
          printf 'PROHIBITED_NOT_QUERIED\n' > "$EVIDENCE_DIR/r2-state.txt"

          expected_order="$(node -p "require('./public/source-provenance.json').orderId")"
          expected_hash="$(node -p "require('./public/source-provenance.json').productTreeSha256")"
          matched=0
          for attempt in $(seq 1 18); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            curl -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$DEPLOYMENT_URL/source-provenance.json?verify=$nonce" > "$EVIDENCE_DIR/production-source-provenance.json"
            if node - "$EVIDENCE_DIR/production-source-provenance.json" "$expected_order" "$expected_hash" <<'NODE'
          const fs = require('node:fs');
          const [file, order, hash] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(file));
          process.exit(value.orderId === order && value.productTreeSha256 === hash ? 0 : 1);
          NODE
            then
              matched=1
              break
            fi
            sleep 5
          done
          test "$matched" = 1

          nonce="${GITHUB_RUN_ID}-final-$(date +%s)"
          curl -fsS -H 'Cache-Control: no-cache' "$DEPLOYMENT_URL/api/health?verify=$nonce" > "$EVIDENCE_DIR/production-health.json"
          curl -fsS -H 'Cache-Control: no-cache' "$DEPLOYMENT_URL/api/snapshot?verify=$nonce" > "$EVIDENCE_DIR/production-snapshot.json"
          curl -fsS -H 'Cache-Control: no-cache' "$DEPLOYMENT_URL/lite?verify=$nonce" > "$EVIDENCE_DIR/production-lite.html"
          node - "$EVIDENCE_DIR/production-health.json" <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.argv[2]));
          if (value.ok !== true) throw new Error('PRODUCTION_HEALTH_NOT_OK');
          NODE

          DEPLOYMENT_URL="$DEPLOYMENT_URL" EVIDENCE_DIR="$EVIDENCE_DIR" node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const viewport of [
              { width: 390, height: 844, name: 'production-390x844' },
              { width: 1440, height: 900, name: 'production-1440x900' },
            ]) {
              const page = await browser.newPage({ viewport });
              await page.goto(`${process.env.DEPLOYMENT_URL}?verify=${process.env.GITHUB_RUN_ID}-${viewport.width}`, { waitUntil: 'networkidle' });
              await page.locator('[data-testid="hydrometric-situation"]').waitFor();
              const first = await page.locator('main > section').first().getAttribute('data-testid');
              if (first !== 'hydrometric-situation') throw new Error('PRODUCTION_FIRST_BLOCK_NOT_HYDROMETRIC');
              await page.screenshot({ path: path.join(process.env.EVIDENCE_DIR, 'screenshots', `${viewport.name}.png`), fullPage: true });
              await page.close();
            }
            await browser.close();
          })();
          NODE

          printf 'false\n' > "$EVIDENCE_DIR/cloudflare-github-drift.txt"
          tar --exclude='playwright-report' --exclude='test-results' -czf /tmp/sos-sf-roast-019-final-evidence.tar.gz "$EVIDENCE_DIR" docs/ROAST_019_REFERENCE_MATRIX.md docs/ROAST_019_IMPLEMENTATION.md public/source-provenance.json
          archive_hash="$(sha256sum /tmp/sos-sf-roast-019-final-evidence.tar.gz | cut -d' ' -f1)"
          echo "archive_sha256=$archive_hash" >> "$GITHUB_OUTPUT"
          echo "product_tree_sha256=$expected_hash" >> "$GITHUB_OUTPUT"
          echo "product_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload screenshot evidence
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-final-screenshots
          path: ${{ env.EVIDENCE_DIR }}/screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-final-evidence
          path: /tmp/sos-sf-roast-019-final-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Self-disarm and publish checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT_SHA: ${{ steps.verify.outputs.product_commit_sha }}
          PRODUCT_TREE_SHA256: ${{ steps.verify.outputs.product_tree_sha256 }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.verify.outputs.archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/roast-hydrometric-first-019.yml" --jq .id)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/disable"
          git pull --ff-only origin arq/visual-dashboard-v3
          git rm -f .github/workflows/roast-hydrometric-first-019.yml .github/roast-019-trigger .github/roast-019-run.sh
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git commit -m 'ci: self-disarm roast hydrometric-first 019'
          git push origin HEAD:arq/visual-dashboard-v3
          final_head="$(git rev-parse HEAD)"
          workflow_state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" --jq .state)"
          test "$workflow_state" = disabled_manually
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$main_sha" = 45047d1c1e16941ea37967d67307d0ab17e85fad

          words="$(node -p "require('./$EVIDENCE_DIR/first-viewport-metrics.json').wordsBeforeChart")"
          mobile="$(node -e "const x=require('./$EVIDENCE_DIR/density-metrics.json');process.stdout.write(String(x.find(v=>v.width===390).ratio.toFixed(3)))")"
          tablet="$(node -e "const x=require('./$EVIDENCE_DIR/density-metrics.json');process.stdout.write(String(x.find(v=>v.width===768).ratio.toFixed(3)))")"
          desktop="$(node -e "const x=require('./$EVIDENCE_DIR/density-metrics.json');process.stdout.write(String(x.find(v=>v.width===1440).ratio.toFixed(3)))")"

          cat > /tmp/checkpoint-019.md <<CHECKPOINT
STATUS=VERIFIED_NOT_ACCEPTED
ORDER=SOS-SF-AUD-ROAST-HYDROMETRIC-FIRST-019
REMOTE_HEAD_BEFORE=b5f0e4fdaef742ef8d4799f297ff72c0c35450f9
REMOTE_HEAD_AFTER=$final_head
PRODUCT_COMMIT_SHA=$PRODUCT_COMMIT_SHA
DEPLOYMENT_RUN_ID=$DEPLOYMENT_RUN_ID
FINALIZE_RUN_ID=$GITHUB_RUN_ID
DEPLOYMENT_VERSION_ID=$DEPLOYMENT_VERSION_ID
DEPLOY_COMMAND_COUNT=1
CLOUDFLARE_MUTATION_COUNT=1
PRODUCT_TREE_SHA256=$PRODUCT_TREE_SHA256
FIRST_BLOCK=HYDROMETRIC_SITUATION
FIRST_VIEWPORT_RESULT=PASS
WORDS_BEFORE_CHART=$words
MOBILE_SCROLL_RATIO=$mobile
TABLET_SCROLL_RATIO=$tablet
DESKTOP_SCROLL_RATIO=$desktop
PRIMARY_SECTION_COUNT=4
SOURCE_FAMILIES_VERIFIED=INA_REST,INA_WATERML,SMN_ALERTS,PROTECCION_CIVIL,NASA_GPM_SUPPLEMENTARY
SOURCE_HEALTH_RESULT=PASS_TRACEABLE
ALERT_FAILURE_PLACEMENT=HEADER_BADGE_AND_DIALOG_ONLY
SKIP_LINK_RESULT=PASS_HIDDEN_UNTIL_FOCUS
OFFLINE_RESULT=PASS
TYPECHECK_RESULT=PASS
LINT_RESULT=PASS_ZERO_WARNINGS
UNIT_RESULT=57_PASS
CONTRACT_RESULT=11_PASS
WORKER_RESULT=6_PASS
E2E_RESULT=15_PASS_1_INTENTIONAL_PROJECT_SKIP_RETRIES_0
FLAKY_TEST_COUNT=0
D1_FREE_STATE=PRESERVED
KV_FREE_STATE=PRESERVED
R2_STATE=ABSENT_NOT_QUERIED
USD_BUDGET=0
SCREENSHOT_ARTIFACT_ID=$SCREENSHOT_ARTIFACT_ID
ARTIFACT_ID=$ARTIFACT_ID
ARTIFACT_SHA256=$ARTIFACT_SHA256
TEMP_WORKFLOW_ID=$workflow_id
TEMP_WORKFLOW_STATE=$workflow_state
CLOUDFLARE_GITHUB_DRIFT=false
MAIN_SHA=$main_sha
AUD_HOLD=ACTIVE
CHECKPOINT
          gh issue comment 13 --repo "$GITHUB_REPOSITORY" --body-file /tmp/checkpoint-019.md

      - name: Remove generated sensitive material
        if: always()
        run: rm -f /tmp/worker-secret-names.json
