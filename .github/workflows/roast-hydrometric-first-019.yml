name: ROAST Hydrometric First 019

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths:
      - .github/roast-019-trigger

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-roast-hydrometric-first-019
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/roast-019
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
  SOS_SF_OPERATOR_EMAILS: ${{ secrets.SOS_SF_OPERATOR_EMAILS }}
  MESSAGE_BLOCKLIST: ${{ secrets.MESSAGE_BLOCKLIST }}
  REPORT_RETENTION_DAYS: ${{ vars.REPORT_RETENTION_DAYS }}
  INA_WATERML_PARANA_URL: ${{ vars.INA_WATERML_PARANA_URL }}
  INA_WATERML_SALADO_URL: ${{ vars.INA_WATERML_SALADO_URL }}
  PORTS_HYDROMETER_JSON_URL: ${{ vars.PORTS_HYDROMETER_JSON_URL }}
  SMN_OBSERVATIONS_JSON_URL: ${{ vars.SMN_OBSERVATIONS_JSON_URL }}
  SMN_ALERTS_JSON_URL: ${{ vars.SMN_ALERTS_JSON_URL }}

jobs:
  verify-deploy-disarm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record corrected product provenance
        id: product
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = arq/visual-dashboard-v3
          git merge-base --is-ancestor b5f0e4fdaef742ef8d4799f297ff72c0c35450f9 HEAD
          test "$(git rev-parse origin/main)" = 45047d1c1e16941ea37967d67307d0ab17e85fad
          read -r tree_hash file_count < <(python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          excluded = ('.github/', 'artifacts/', 'dist/')
          marker = 'public/source-provenance.json'
          paths = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          digest = hashlib.sha256(); count = 0
          for raw in sorted(p for p in paths if p):
              path = raw.decode()
              if path == marker or path.startswith(excluded): continue
              data = Path(path).read_bytes()
              digest.update(path.encode()); digest.update(b'\0'); digest.update(len(data).to_bytes(8,'big')); digest.update(data); count += 1
          print(digest.hexdigest(), count)
          PY
          )
          node - "$tree_hash" "$file_count" <<'NODE'
          const fs = require('node:fs');
          const [hash,count] = process.argv.slice(2);
          fs.writeFileSync('public/source-provenance.json', JSON.stringify({schemaVersion:1,orderId:'SOS-SF-AUD-ROAST-HYDROMETRIC-FIRST-019',productTreeSha256:hash,includedFileCount:Number(count),deploymentRunId:process.env.GITHUB_RUN_ID})+'\n');
          NODE
          git add public/source-provenance.json
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh roast 019 product provenance'
            git push origin HEAD:arq/visual-dashboard-v3
          fi
          final_sha="$(git rev-parse HEAD)"
          mkdir -p "$EVIDENCE_DIR"
          printf '{"productCommitSha":"%s","productTreeSha256":"%s","includedFileCount":%s}\n' "$final_sha" "$tree_hash" "$file_count" > "$EVIDENCE_DIR/product-provenance.json"
          echo "product_commit_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "product_tree_sha256=$tree_hash" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify and deploy once
        id: verify
        run: .github/roast-019-run.sh verify

      - name: Upload screenshot evidence
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-screenshots
          path: ${{ env.EVIDENCE_DIR }}/screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-evidence
          path: /tmp/sos-sf-roast-019-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Self-disarm and publish checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT_SHA: ${{ steps.product.outputs.product_commit_sha }}
          PRODUCT_TREE_SHA256: ${{ steps.product.outputs.product_tree_sha256 }}
          DEPLOYMENT_VERSION_ID: ${{ steps.verify.outputs.deployment_version_id }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.verify.outputs.archive_sha256 }}
        run: .github/roast-019-run.sh cleanup

      - name: Remove generated sensitive material
        if: always()
        run: rm -f .worker-secrets.json wrangler.generated.jsonc /tmp/worker-secret-names.json
