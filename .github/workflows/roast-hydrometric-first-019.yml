name: ROAST Hydrometric First 019

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths:
      - .github/roast-019-trigger

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-roast-hydrometric-first-019
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/roast-019
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
  SOS_SF_OPERATOR_EMAILS: ${{ secrets.SOS_SF_OPERATOR_EMAILS }}
  MESSAGE_BLOCKLIST: ${{ secrets.MESSAGE_BLOCKLIST }}
  REPORT_RETENTION_DAYS: ${{ vars.REPORT_RETENTION_DAYS }}
  INA_WATERML_PARANA_URL: ${{ vars.INA_WATERML_PARANA_URL }}
  INA_WATERML_SALADO_URL: ${{ vars.INA_WATERML_SALADO_URL }}
  PORTS_HYDROMETER_JSON_URL: ${{ vars.PORTS_HYDROMETER_JSON_URL }}
  SMN_OBSERVATIONS_JSON_URL: ${{ vars.SMN_OBSERVATIONS_JSON_URL }}
  SMN_ALERTS_JSON_URL: ${{ vars.SMN_ALERTS_JSON_URL }}

jobs:
  verify-deploy-disarm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          echo '9b49211c63a0d4be7ea59d8ff83e1c0f268b0c1807ef427b7ee4f08597cb0933  .github/roast-019-product.tar.gz.b64' | sha256sum -c -
          base64 --decode .github/roast-019-product.tar.gz.b64 > /tmp/roast-019-product.tar.gz
          echo 'f005a02d293ad077b27bcc2848034959bcc89dd188721a42c7b7c0b3ff3a87fc  /tmp/roast-019-product.tar.gz' | sha256sum -c -
          tar -xzf /tmp/roast-019-product.tar.gz
          chmod 700 .github/roast-019-run.sh

      - name: Apply product and record provenance
        id: product
        run: .github/roast-019-run.sh apply

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify and deploy once
        id: verify
        run: .github/roast-019-run.sh verify

      - name: Upload screenshot evidence
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-screenshots
          path: ${{ env.EVIDENCE_DIR }}/screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-evidence
          path: /tmp/sos-sf-roast-019-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Self-disarm and publish checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_COMMIT_SHA: ${{ steps.product.outputs.product_commit_sha }}
          PRODUCT_TREE_SHA256: ${{ steps.product.outputs.product_tree_sha256 }}
          DEPLOYMENT_VERSION_ID: ${{ steps.verify.outputs.deployment_version_id }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.verify.outputs.archive_sha256 }}
        run: .github/roast-019-run.sh cleanup

      - name: Remove generated sensitive material
        if: always()
        run: rm -f .worker-secrets.json wrangler.generated.jsonc /tmp/worker-secret-names.json
