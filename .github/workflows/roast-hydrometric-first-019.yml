name: ROAST Hydrometric First 019

on:
  push:
    branches:
      - arq/visual-dashboard-v3
    paths:
      - .github/roast-019-trigger

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sos-sf-roast-hydrometric-first-019
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/roast-019-final
  DEPLOYMENT_URL: https://sos-sf.simondalmasso44.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Reverify and collect GET-only evidence
        id: verify
        run: bash .github/roast-019-finalize.sh verify

      - name: Upload screenshot evidence
        id: screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-final-screenshots
          path: artifacts/roast-019-final/screenshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-roast-019-final-evidence
          path: /tmp/sos-sf-roast-019-final-evidence.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Self-disarm and publish checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_TREE_SHA256: ${{ steps.verify.outputs.product_tree_sha256 }}
          SCREENSHOT_ARTIFACT_ID: ${{ steps.screenshots.outputs.artifact-id }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.verify.outputs.archive_sha256 }}
        run: bash .github/roast-019-finalize.sh cleanup

      - name: Remove temporary API material
        if: always()
        run: rm -f /tmp/worker-secret-names.json
