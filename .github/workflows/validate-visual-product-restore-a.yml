name: Validate Visual Product Restore A

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/validate-visual-product-restore-a-trigger]

permissions:
  contents: read
  actions: read

concurrency:
  group: sos-sf-015-visual-product-restore-a
  cancel-in-progress: false

env:
  EVIDENCE_DIR: artifacts/visual-product-restore-a
  ORDER_ID: SOS-SF-015-VISUAL-PRODUCT-RESTORE-A
  PREVIOUS_VISUAL_RUN: '30999031747'
  PREVIOUS_VISUAL_ARTIFACT: public-safety-015-before-18e916e17cd9c9b9f8a0e3f22924fbf35676172d-30999031747
  PRODUCTION_URL: https://sos-sf.simondalmasso44.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert correction scope and no-mutation contract
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/comparison/previous-with-graph" "$EVIDENCE_DIR/comparison/current-015" "$EVIDENCE_DIR/comparison/corrected"
          test -f OWNER_CORRECTION_SOS_SF_015_VISUAL_PRODUCT_RESTORE_A.md
          grep -q 'SOS-SF-015-VISUAL-PRODUCT-RESTORE-A' AGENTS.md
          grep -q 'aria-label="Elegir estación hidrométrica"' src/client/features/hydro/HydrometricMonitoring.tsx
          grep -q 'Río Paraná — Santa Fe' tests/e2e/dashboard.spec.ts
          grep -q 'Río Salado — Santo Tomé' tests/e2e/dashboard.spec.ts
          grep -q 'Sin datos' src/client/components/ui/HydroSeriesChart.tsx
          grep -q 'Ver tabla de mediciones' src/client/components/ui/HydroSeriesChart.tsx
          grep -q 'onPointerDown' src/client/components/ui/HydroSeriesChart.tsx
          grep -q 'onKeyDown' src/client/components/ui/HydroSeriesChart.tsx
          ! grep -q 'LevelRuler' src/client/features/hydro/HydrometricMonitoring.tsx
          ! grep -q 'TerritoryTimeline\|EmergencyLifecycle\|ServiceStatus' src/client/app/DashboardPage.tsx
          ! grep -q 'Con conexión' src/client/app/AppShell.tsx
          ! grep -q 'Estado del integrador' src/client/app/DashboardPage.tsx
          ! grep -q 'sources.length.*operativ' src/client/features/situation/SituationSummary.tsx
          ! grep -RInE 'REPORTS_BUCKET|r2_buckets|/r2/' src scripts/provision-cloudflare.mjs wrangler.jsonc wrangler.test.jsonc
          ! grep -Eqi 'wrangler[[:space:]]+deploy|cloudflare.*(create|update|delete)|d1.*execute.*--remote' .github/workflows/validate-visual-product-restore-a.yml
          printf 'ORDER=%s\nDEPLOY=PROHIBITED\nCLOUDFLARE_MUTATIONS=0\nBUDGET_MAX_USD=0\nR2=ABSENT\n' "$ORDER_ID" > "$EVIDENCE_DIR/no-mutation-contract.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Download previous product screenshots with main graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$PREVIOUS_VISUAL_RUN" --repo "$GITHUB_REPOSITORY" --name "$PREVIOUS_VISUAL_ARTIFACT" --dir "$EVIDENCE_DIR/comparison/previous-with-graph"
          test -f "$EVIDENCE_DIR/comparison/previous-with-graph/mobile-390x844.png"
          test -f "$EVIDENCE_DIR/comparison/previous-with-graph/desktop-1440x900.png"

      - name: Capture current deployed 015 before correction deploy
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('node:path');
          const fs = require('node:fs');
          const output = path.join(process.env.EVIDENCE_DIR, 'comparison', 'current-015');
          fs.mkdirSync(output, { recursive: true });
          (async () => {
            const browser = await chromium.launch({ headless: true });
            for (const [name, width, height] of [['mobile-390x844', 390, 844], ['desktop-1440x900', 1440, 900]]) {
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
              await page.goto(process.env.PRODUCTION_URL, { waitUntil: 'networkidle', timeout: 60000 });
              await page.screenshot({ path: path.join(output, `${name}.png`), fullPage: true });
              await page.close();
            }
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$EVIDENCE_DIR/typecheck.log"
      - name: Lint
        run: |
          set -o pipefail
          npm run lint -- --max-warnings=0 2>&1 | tee "$EVIDENCE_DIR/lint.log"
      - name: Unit
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee "$EVIDENCE_DIR/unit.log"
      - name: Contract
        run: |
          set -o pipefail
          npm run test:contract 2>&1 | tee "$EVIDENCE_DIR/contract.log"
      - name: Build and budgets
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$EVIDENCE_DIR/build.log"
      - name: Worker local D1 and KV
        run: |
          set -o pipefail
          npm run test:worker 2>&1 | tee "$EVIDENCE_DIR/worker.log"
      - name: E2E product visual accessibility mobile offline
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee "$EVIDENCE_DIR/e2e.log"

      - name: Assemble and verify visual comparison evidence
        run: |
          set -euo pipefail
          cp "$EVIDENCE_DIR/screenshots/public-safety-390x844.png" "$EVIDENCE_DIR/comparison/corrected/mobile-390x844.png"
          cp "$EVIDENCE_DIR/screenshots/public-safety-1440x900.png" "$EVIDENCE_DIR/comparison/corrected/desktop-1440x900.png"
          node <<'NODE'
          const fs = require('node:fs');
          function pngDimensions(file) {
            const value = fs.readFileSync(file);
            if (value.toString('ascii', 1, 4) !== 'PNG') throw new Error(`NOT_PNG:${file}`);
            return { width: value.readUInt32BE(16), height: value.readUInt32BE(20) };
          }
          const root = process.env.EVIDENCE_DIR;
          const expected = [
            [`${root}/comparison/corrected/mobile-390x844.png`, 390],
            [`${root}/comparison/corrected/desktop-1440x900.png`, 1440],
          ];
          for (const [file, width] of expected) {
            const dimensions = pngDimensions(file);
            if (dimensions.width !== width || dimensions.height < 844) throw new Error(`SCREENSHOT_DIMENSIONS:${file}:${dimensions.width}x${dimensions.height}`);
          }
          NODE
          cat > "$EVIDENCE_DIR/comparison/README.md" <<TXT
          # Visual comparison — $ORDER_ID

          ## Previous product with main graph
          - previous-with-graph/mobile-390x844.png
          - previous-with-graph/desktop-1440x900.png

          ## Current deployed 015 before correction
          - current-015/mobile-390x844.png
          - current-015/desktop-1440x900.png

          ## Corrected proposal, not deployed
          - corrected/mobile-390x844.png
          - corrected/desktop-1440x900.png

          Gate: preserve 015 transparency, restore the useful main chart, avoid technical-document appearance, walls of text, raw enums and invalid dates. No deployment or Cloudflare mutation occurred in this run.
          TXT
          sha256sum "$EVIDENCE_DIR"/comparison/*/*.png > "$EVIDENCE_DIR/comparison/sha256.txt"
          git diff --check
          git status --short > "$EVIDENCE_DIR/git-status.txt"
          printf 'ORDER=%s\nVALIDATION=PASS\nVISUAL_EVIDENCE=AVAILABLE\nDEPLOY_COMMAND_COUNT=0\nCLOUDFLARE_MUTATIONS=0\nSTATUS=READY_FOR_INTERNAL_VISUAL_GATE\n' "$ORDER_ID" > "$EVIDENCE_DIR/result.txt"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-product-restore-a-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 30
