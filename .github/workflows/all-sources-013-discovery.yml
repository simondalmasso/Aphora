name: All Sources 013 Discovery

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/workflows/all-sources-013-discovery.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deep probe official provider surfaces
        run: |
          mkdir -p artifacts/all-sources-013-discovery
          cat > /tmp/discover.mjs <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const out={generatedAt:new Date().toISOString(),probes:{},findings:{}};
          async function get(name,url,accept='*/*',timeout=20000){const t=Date.now();try{const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(timeout),headers:{Accept:accept,'User-Agent':'SOS-SF/013 reproducible official endpoint discovery'}});const b=await r.text();out.probes[name]={url,finalUrl:r.url,status:r.status,contentType:r.headers.get('content-type'),bytes:Buffer.byteLength(b),elapsedMs:Date.now()-t,body:b};return {r,b};}catch(e){out.probes[name]={url,error:String(e),elapsedMs:Date.now()-t};return null}}
          const start=new Date(Date.now()-180*86400000).toISOString().slice(0,10),end=new Date(Date.now()+86400000).toISOString().slice(0,10);
          for(const id of ['30','3044','29911']){await get(`ina_rest_${id}`,`https://alerta.ina.gob.ar/a5/getObservaciones?tipo=puntual&series_id=${id}&timestart=${start}&timeend=${end}`,'application/json');await get(`ina_waterml2_${id}`,`https://alerta.ina.gob.ar/a5/obs/puntual/series/${id}?timestart=${start}&timeend=${end}&format=waterml2`,'application/xml,text/xml');}
          const sites=await get('ina_wml_sites','https://alerta.ina.gob.ar/wml/GetSites','application/xml,text/xml');
          if(sites){const chunks=[...sites.b.matchAll(/<(?:\w+:)?siteInfo\b[\s\S]*?<\/(?:\w+:)?siteInfo>/gi)].map(m=>m[0]);out.findings.waterMlSites=chunks.filter(x=>/Santa\s*Fe|Santo\s*Tom[eé]/i.test(x));}
          for(const url of [
            `https://alerta.ina.gob.ar/wml/GetValues?location=30&variable=2&startDate=${start}&endDate=${end}`,
            `https://alerta.ina.gob.ar/wml/GetValues?location=1679&variable=2&startDate=${start}&endDate=${end}`,
            `https://alerta.ina.gob.ar/wml/GetValues?location=1679&variable=39&startDate=${start}&endDate=${end}`,
            `https://alerta.ina.gob.ar/wml/GetValues?location=alturas_bdhi:30&variable=INA:2&startDate=${start}&endDate=${end}`,
            `https://alerta.ina.gob.ar/wml/GetValues?location=alturas_bdhi:1679&variable=INA:2&startDate=${start}&endDate=${end}`
          ]) await get(`wml_values_${Object.keys(out.probes).length}`,url,'application/xml,text/xml');
          const officialPorts=await get('ports_official_page','https://www.argentina.gob.ar/economia/agencia-nacional-de-puertos-y-navegacion/navegacion/navegable-troncal/hidrometros','text/html');
          if(officialPorts){out.findings.portsIframes=[...officialPorts.b.matchAll(/<iframe[^>]+src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],officialPorts.r.url).toString());out.findings.portsLinks=[...officialPorts.b.matchAll(/(?:href|src)=["']([^"']+)["']/gi)].map(m=>new URL(m[1],officialPorts.r.url).toString()).filter(u=>/hidro|santa|agp|json|api/i.test(u));for(const [i,u] of out.findings.portsIframes.entries())await get(`ports_iframe_${i}`,u,'text/html,application/json');}
          for(const page of ['https://ws2.smn.gob.ar/','https://ws2.smn.gob.ar/observaciones','https://ws2.smn.gob.ar/alertas']){const key='smn_page_'+page.split('/').filter(Boolean).at(-1);const p=await get(key,page,'text/html');if(p){const scripts=[...p.b.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],p.r.url).toString());out.findings[key+'_scripts']=scripts;for(const [i,u] of scripts.entries()){if(out.probes['smn_script_'+encodeURIComponent(u)])continue;await get('smn_script_'+encodeURIComponent(u),u,'application/javascript,text/javascript,*/*');}}}
          const smnText=Object.entries(out.probes).filter(([k])=>k.startsWith('smn_')).map(([,v])=>v.body||'').join('\n');out.findings.smnEndpointCandidates=[...new Set([...smnText.matchAll(/(?:https?:\\?\/\\?\/[^"'\s)]+|["'](\/(?:api|map_items|alertas|observaciones|pronostico|ajax)[^"']*))["']/gi)].map(m=>(m[1]||m[0]).replaceAll('\\/','/')))].slice(0,1000);
          for(const u of ['https://maps.disasters.nasa.gov/ags03/rest/services?f=json','https://maps.disasters.nasa.gov/ags03/rest/services/NRT?f=json','https://maps.disasters.nasa.gov/ags03/rest/services/NRT_Latest?f=json'])await get('nasa_directory_'+encodeURIComponent(u),u,'application/json');
          const nasaText=Object.entries(out.probes).filter(([k])=>k.startsWith('nasa_')).map(([,v])=>v.body||'').join('\n');out.findings.nasaGpmServices=[...new Set([...nasaText.matchAll(/"name"\s*:\s*"([^"]*(?:GPM|IMERG)[^"]*)"/gi)].map(m=>m[1]))];
          const compact={...out,probes:Object.fromEntries(Object.entries(out.probes).map(([k,v])=>[k,{...v,bodyHead:(v.body||'').slice(0,20000),body:undefined}]))};
          await writeFile('artifacts/all-sources-013-discovery/report.json',JSON.stringify(out,null,2));await writeFile('artifacts/all-sources-013-discovery/compact.json',JSON.stringify(compact,null,2));console.log(JSON.stringify({findings:out.findings,summary:Object.fromEntries(Object.entries(out.probes).map(([k,v])=>[k,{status:v.status,contentType:v.contentType,bytes:v.bytes,error:v.error}]))},null,2));
          NODE
          node /tmp/discover.mjs | tee artifacts/all-sources-013-discovery/summary.log
      - uses: actions/upload-artifact@v4
        with:
          name: all-sources-013-discovery-${{ github.run_id }}
          path: artifacts/all-sources-013-discovery
          retention-days: 30
