name: Export Branch Source

on:
  push:
    branches:
      - arq/visual-dashboard-v3

permissions:
  contents: read
  issues: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4

      - name: Package source checkout
        run: tar --exclude=.git --exclude=node_modules -czf sos-sf-source-${GITHUB_SHA}.tar.gz .

      - name: Upload source archive
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: sos-sf-source-${{ github.sha }}
          path: sos-sf-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish export locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          body=$(printf 'SOURCE_EXPORT_STATUS=READY\nSOURCE_EXPORT_SHA=%s\nSOURCE_EXPORT_RUN_ID=%s\nSOURCE_EXPORT_ARTIFACT_ID=%s\nSOURCE_EXPORT_ARTIFACT_DIGEST=%s\n' "$SHA" "$RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_DIGEST")
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5172387484" --method PATCH -f body="$body"
