name: Fix Postdeploy Alert Source Gate

on:
  push:
    branches: [arq/visual-dashboard-v3]
    paths: [.github/fix-postdeploy-alert-source-gate-trigger]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align gate with fail-closed alert semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/complete-postdeploy-visual-restore-continuation.yml')
          text=path.read_text()
          old="""          const ina=sources.filter(source=>source.organizationId==='ina');
          if(!ina.some(source=>source.connected===true)||!sources.some(source=>source.id==='smn-alerts'&&source.connected===true)) throw new Error('PRIMARY_SOURCE_AVAILABILITY');
"""
          new="""          const ina=sources.filter(source=>source.organizationId==='ina');
          if(!ina.some(source=>source.connected===true)) throw new Error('HYDROMETRIC_PRIMARY_SOURCE_AVAILABILITY');
          const smnAlerts=sources.find(source=>source.id==='smn-alerts');
          if(!smnAlerts) throw new Error('SMN_ALERT_SOURCE_MISSING');
          if(smnAlerts.connected!==true&&!['FUENTES_DE_ALERTAS_NO_DISPONIBLES','VERIFICACION_DE_ALERTAS_DEGRADADA'].includes(snapshot.alertStatus)) throw new Error('ALERT_SOURCE_NOT_FAIL_CLOSED');
"""
          if text.count(old)!=1:
              raise SystemExit(f'POSTDEPLOY_GATE_PRECONDITION:{text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          git rm .github/fix-postdeploy-alert-source-gate-trigger
          git add .github/workflows/complete-postdeploy-visual-restore-continuation.yml
          git diff --cached --check
          git config user.name sos-sf-automation
          git config user.email sos-sf-automation@users.noreply.github.com
          git commit -m 'fix: accept honest fail-closed alert source state'
          git push origin HEAD:arq/visual-dashboard-v3
